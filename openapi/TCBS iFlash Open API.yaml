openapi: 3.1.0
info:
  title: iFlash Open API
  description: >
    Chào mừng bạn đến với tài liệu kỹ thuật iFlash Open API. Nếu có bất kỳ câu
    hỏi nào, vui lòng liên hệ qua email.


    Ngôn ngữ: <button id="btn-vi" type="button">Tiếng Việt</button> <button
    id="btn-en" type="button">English</button>
  version: 1.0.0
  contact:
    email: cskh@tcbs.com.vn
    url: https://developers.tcbs.com.vn
  x-logo:
    url: /image/logo.png
    altText: Tcbs logo
servers:
  - url: https://openapi.tcbs.com.vn
    description: Production
  - url: https://openapisit.tcbs.com.vn
    description: SIT
paths:
  /gaia/v1/oauth2/openapi/token:
    post:
      security: []
      operationId: get_token
      tags:
        - authen
      summary: 2.1.1. Trao đổi API Key để lấy JWT Token
      description: ""
      x-hideTryItPanel: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequestDto"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponseDto"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponseErrorDto"
