"get":
  operationId: getAnankeSecurities
  tags:
    - Dữ liệu thị trường
  "summary": "Tra cứu thông tin chứng khoán"
  "description": "Tra cứu thông tin chi tiết của mã chứng khoán: thông tin niêm yết, giá trần/sàn, sàn giao dịch, loại chứng khoán, hạn mức giao dịch, v.v."
  "parameters":
    - "name": "fields"
      "in": "query"
      "required": false
      "description": "Các trường cần trả về. Mặc định: all."
      "schema":
        "type": "string"
    - "name": "filter"
      "in": "query"
      "required": false
      "description": "Bộ lọc theo cú pháp trường=giá trị, ví dụ: symbol=TCB."
      "schema":
        "type": "string"
  responses:
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/SecuritiesResponse.yaml
          example:
            content:
