"get":
  operationId: getTartarusPutThroughSnaps
  tags:
    - Dữ liệu thị trường
  "summary": "Thông tin thỏa thuận"
  "description": "Lấy thông tin giao dịch thỏa thuận."
  "parameters":
    - "name": "floor"
      "in": "query"
      "required": false
      "description": "Rổ chứng khoán: 1 = HOSE, 2 = HNX, 3 = Upcom."
      "schema":
        "$ref": "../../components/schemas/enums/MarketFloor.yaml"
  responses:
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              buyAdv:
                type: array
                items:
                  type: object
                  properties:
                    symbol:
                      type: string
                      description: "Mã cổ phiếu."
                    price:
                      type: number
                      format: double
                      description: "Giá."
                    vol:
                      type: number
                      format: double
                      description: "Khối lượng."
                    time:
                      type: string
                      description: "Thời gian."
                    status:
                      type: integer
                      description: "Trạng thái."
                    color:
                      type: integer
                      description: "Màu."
                    orderId:
                      type: string
                      description: "Mã lệnh."
                    side:
                      type: string
                      description: "Chiều (B = Mua)."
              sellAdv:
                type: array
                items:
                  type: object
                  properties:
                    symbol:
                      type: string
                      description: "Mã cổ phiếu."
                    price:
                      type: number
                      format: double
                      description: "Giá."
                    vol:
                      type: number
                      format: double
                      description: "Khối lượng."
                    time:
                      type: string
                      description: "Thời gian."
                    status:
                      type: integer
                      description: "Trạng thái."
                    color:
                      type: integer
                      description: "Màu."
                    orderId:
                      type: string
                      description: "Mã lệnh."
                    side:
                      type: string
                      description: "Chiều (S = Bán)."
              match:
                type: array
                items:
                  type: object
                  properties:
                    symbol:
                      type: string
                      description: "Mã cổ phiếu."
                    price:
                      type: number
                      format: double
                      description: "Giá khớp."
                    vol:
                      type: number
                      format: double
                      description: "Khối lượng khớp."
                    val:
                      type: number
                      format: double
                      description: "Giá trị."
                    time:
                      type: string
                      description: "Thời gian khớp."
                    color:
                      type: integer
                      description: "Màu."
                    accumulatedValue:
                      type: number
                      format: double
                      description: "Giá trị tích lũy."
          example:
            buyAdv:
              - symbol: DHT
                price: 24300
                vol: 50
                time: 20231220-02:16:13.588
                status: 1
                color: 3
                orderId: DHT00000000000036
                side: B
            sellAdv:
              - symbol: TCB
                price: 24300
                vol: 50
                time: 20231220-02:16:13.588
                status: 1
                color: 3
                orderId: TCB00000000000036
                side: S
            match:
              - symbol: TCB
                price: 23455.5
                vol: 5000
                val: 117275000
                time: 20:00:03
                color: 5
                accumulatedValue: 254440000
