"get":
  "summary": "Cung cầu trong phiên (15 phút)"
  "description": "Lấy dữ liệu cung cầu trong phiên theo khoảng thời gian 15 phút."
  "parameters":
    -
      "name": "ticker"
      "in": "path"
      "required": true
      "description": "Mã cổ phiếu, ví dụ TCB."
      "schema":
        "type": "string"
    -
      "name": "timeWindow"
      "in": "query"
      "required": true
      "description": "Khung thời gian tính bằng phút: 15 hoặc 60."
      "schema":
        "$ref": "../../components/schemas/enums/IntradayTimeWindow.yaml"
    -
      "name": "tWindow"
      "in": "query"
      "required": true
      "description": "Khung thời gian: 15 phút."
      "schema":
        "$ref": "../../components/schemas/enums/IntradayTWindow.yaml"
    -
      "name": "type"
      "in": "query"
      "required": false
      "description": "Loại nhà đầu tư: sheep (small retail), wolf (medium institutional), shark (large institutional), all (mặc định)."
      "schema":
        "$ref": "../../components/schemas/enums/InvestorType.yaml"
  responses:
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              ticker:
                type: string
                description: "Mã cổ phiếu."
              data:
                type: array
                items:
                  type: object
                  properties:
                    bu:
                      type: number
                      format: double
                      description: "Khối lượng mua tích cực."
                    bms:
                      type: number
                      format: double
                      description: "Tổng tích lũy mua."
                    bup:
                      type: number
                      format: double
                      description: "Tỷ lệ % mua tích cực."
                    sd:
                      type: number
                      format: double
                      description: "Khối lượng bán tiêu cực."
                    sms:
                      type: number
                      format: double
                      description: "Tổng tích lũy bán."
                    sdp:
                      type: number
                      format: double
                      description: "Tỷ lệ % bán tiêu cực."
                    bsr:
                      type: number
                      format: double
                      description: "Tỷ lệ mua/bán."
                    t:
                      type: string
                      description: "Thời gian (HH:mm:ss)."
                    s:
                      type: number
                      format: double
                      description: "Thời gian (timestamp)."
