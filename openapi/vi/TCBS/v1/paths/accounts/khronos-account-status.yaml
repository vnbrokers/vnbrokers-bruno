"get":
  operationId: getKhronosAccountStatus
  tags:
    - Tài khoản
  "summary": "Tổng quan tiền, ký quỹ"
  "description": "Tổng quan tiền và ký quỹ phái sinh."
  "parameters":
    - "name": "accountId"
      "in": "query"
      "required": true
      "description": "Số tài khoản lưu ký."
      "schema":
        "type": "string"
    - "name": "subAccountId"
      "in": "query"
      "required": true
      "description": "Tiểu khoản phái sinh."
      "schema":
        "type": "string"
    - "name": "getType"
      "in": "query"
      "required": true
      "description": "0 = Lấy all, 1 = money only."
      "schema":
        "$ref": "../../components/schemas/enums/DerivativeGetType.yaml"
  responses:
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              cmd:
                type: string
                description: "Tên lệnh phản hồi."
              rc:
                type: string
                description: "Mã kết quả, 1 = thành công."
              data:
                type: object
                description: "Dữ liệu tổng quan tiền và ký quỹ."
