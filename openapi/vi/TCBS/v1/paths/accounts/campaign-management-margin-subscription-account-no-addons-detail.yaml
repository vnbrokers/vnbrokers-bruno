"get":
  "summary": "Gói vay bổ trợ"
  "description": "Lấy chi tiết gói vay bổ trợ của tài khoản margin."
  "parameters":
    -
      "name": "accountNo"
      "in": "path"
      "required": true
      "description": "Số tiểu khoản margin."
      "schema":
        "type": "string"
  responses:
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              marginSureViews:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: number
                      format: double
                      description: "Id gói marginsure."
                    name:
                      type: string
                      description: "Tên gói marginsure."
                    code:
                      type: string
                      description: "Mã gói marginsure."
                    subscriptionFee:
                      type: number
                      format: double
                      description: "Phí tham gia."
                    status:
                      type: string
                      description: "Trạng thái đăng ký gói."
              tplus:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          format: double
                          description: "ID gói T+."
                        name:
                          type: string
                          description: "Tên gói T+."
                        firstRate:
                          type: number
                          format: double
                          description: "Lãi suất bậc 1 của gói T+."
                        status:
                          type: string
                          description: "Trạng thái gói T+."
