"get":
  operationId: getHydrosAccountAccountNoRisk
  tags:
    - Tài khoản
  "summary": "Tỷ lệ margin và rủi ro"
  "description": "Lấy dư nợ gốc, dư nợ lãi, Rtt và các tỷ lệ margin của tài khoản margin."
  "parameters":
    - "name": "accountNo"
      "in": "path"
      "required": true
      "description": "Số tiểu khoản margin."
      "schema":
        "type": "string"
  responses:
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                accountNo:
                  type: string
                  description: "Số tiểu khoản."
                rtt:
                  type: number
                  format: double
                  description: "Rtt thực tế."
                outstanding:
                  type: number
                  format: double
                  description: "Tổng nợ gốc."
                accruedInterest:
                  type: number
                  format: double
                  description: "Tổng nợ lãi."
                dueAmount:
                  type: number
                  format: double
                  description: "Nợ đến hạn."
                overdueAmount:
                  type: number
                  format: double
                  description: "Nợ quá hạn."
                totalFeeDebt:
                  type: number
                  format: double
                  description: "Tổng nợ phí (Phí marginsure)."
                riskPolicy:
                  type: object
                  properties:
                    initialMargin:
                      type: number
                      format: double
                      description: "Tỷ lệ ký quỹ ban đầu."
                    maintenanceMargin:
                      type: number
                      format: double
                      description: "Tỷ lệ duy trì."
                    liquidationMargin:
                      type: number
                      format: double
                      description: "Tỷ lệ cảnh báo."
                riskStatus:
                  type: object
                  properties:
                    code:
                      type: string
                      description: "Trạng thái RTT."
                    description:
                      type: string
                      description: "Mô tả trạng thái RTT."
          example:
            - accountNo: 0001I97267
              rtt: 99.95
              outstanding: 8858766677
              accruedInterest: 18638724
              dueAmount: 34621881
              overdueAmount: 34621881
              totalFeeDebt: 8885876
              riskPolicy:
                initialMargin: 100
                maintenanceMargin: 80
                liquidationMargin: 30
              riskStatus:
                code: SAFE
                description: An toàn
