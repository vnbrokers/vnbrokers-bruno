"get":
  operationId: getAionCustomersCustodyIdAccounts
  tags:
    - Tài khoản
  "summary": "Hạn mức margin"
  "description": "Lấy thông tin hạn mức margin của khách hàng theo số tài khoản lưu ký."
  "parameters":
    - "name": "custodyId"
      "in": "path"
      "required": true
      "description": "Mã tài khoản lưu ký."
      "schema":
        "type": "string"
  responses:
    "401":
      $ref: ../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                custodyID:
                  type: string
                  description: "Số tài khoản lưu ký."
                accountNo:
                  type: string
                  description: "Số tiểu khoản."
                aftype:
                  type: string
                  description: "Loại hình hợp đồng."
                vsdStatus:
                  type: string
                  description: "Trạng thái VSD."
                accountStatus:
                  type: string
                  description: "Trạng thái: A = Được phép đặt lệnh, P = Không được phép, C = Đã đóng, B = Phong tỏa, N = Chờ đóng, R = Từ chối, T = Chờ cập nhật."
                marginLimit:
                  type: number
                  format: double
                  description: "Hạn mức margin của tiểu khoản."
                accountType:
                  type: string
                  description: "Loại tiểu khoản: normal, margin, copier, trader, CHILD, CW, SPW, SPT."
                isIA:
                  type: string
                  description: "Có kết nối IA: Y = Có, N = Không."
                bankName:
                  type: string
                  description: "Tên ngân hàng kết nối IA."
                bankAccount:
                  type: string
                  description: "Số tài khoản kết nối IA."
