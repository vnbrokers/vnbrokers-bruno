"get":
  "summary": "Tra cứu tài sản cổ phiếu"
  "description": "Tra cứu tài sản cổ phiếu theo tiểu khoản. Số dư tiền dùng /cashInvestments; sao kê tiền dùng /erebos/v2/digital/trans-hist-cashStatements."
  "parameters":
    -
      "name": "accountNo"
      "in": "path"
      "required": true
      "description": "Số tiểu khoản."
      "schema":
        "type": "string"
  responses:
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              assets:
                type: array
                description: "Danh sách tài sản cổ phiếu."
                items:
                  type: object
                  properties:
                    symbol:
                      type: string
                      description: "Mã chứng khoán."
                    quantity:
                      type: integer
                      format: int64
                      description: "Số lượng nắm giữ."
                    avgPrice:
                      type: number
                      format: double
                      description: "Giá trung bình."
                    marketValue:
                      type: number
                      format: double
                      description: "Giá trị thị trường."
