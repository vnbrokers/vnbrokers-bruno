"get":
  operationId: getAionAccountsAccountNoPpseSymbolPrice
  tags:
    - Lệnh cổ phiếu
  "summary": "Lấy sức mua theo mã, giá"
  "description": "Lấy sức mua theo mã cổ phiếu và mức giá cụ thể."
  "parameters":
    - "name": "accountNo"
      "in": "path"
      "required": true
      "description": "Số tiểu khoản."
      "schema":
        "type": "string"
    - "name": "symbol"
      "in": "path"
      "required": true
      "description": "Mã chứng khoán, ví dụ FPT."
      "schema":
        "type": "string"
    - "name": "price"
      "in": "path"
      "required": true
      "description": "Giá dùng để tính sức mua."
      "schema":
        "type": "string"
  responses:
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              pp0:
                type: number
                format: double
                description: "Sức mua cơ bản."
              maxQtty:
                type: number
                format: double
                description: "Số lượng tối đa có thể mua tại mức giá này."
          example:
            pp0: 2057323960
            maxQtty: 39564
