"get":
  "summary": "Tra cứu sổ lệnh thường phái sinh"
  "description": "Tra cứu sổ lệnh thường phái sinh."
  "parameters":
    -
      "name": "accountId"
      "in": "query"
      "required": true
      "description": "Số tài khoản lưu ký."
      "schema":
        "type": "string"
    -
      "name": "pageNo"
      "in": "query"
      "required": true
      "description": "Số trang."
      "schema":
        "type": "number"
        "format": "double"
    -
      "name": "pageSize"
      "in": "query"
      "required": true
      "description": "Kích thước trang."
      "schema":
        "type": "number"
        "format": "double"
    -
      "name": "symbol"
      "in": "query"
      "required": true
      "description": "Bộ lọc: ALL,ALL = all; VN30F2303,B = by mã; ALL,B = by L/S."
      "schema":
        "type": "string"
    -
      "name": "orderType"
      "in": "query"
      "required": true
      "description": "Bộ lọc Loại lệnh: '' = all, 3 = Arbitrage, 4 = SL/TP, 5 = ForceClose, 6 = Thường."
      "schema":
        "$ref": "../../../components/schemas/enums/DerivativeOrderTypeFilter.yaml"
    -
      "name": "status"
      "in": "query"
      "required": true
      "description": "0 = all, 1 = waiting, 2 = matched."
      "schema":
        "$ref": "../../../components/schemas/enums/DerivativeOrderStatusFilter.yaml"
    -
      "name": "refId"
      "in": "query"
      "required": false
      "description": "Ref ID của lệnh."
      "schema":
        "type": "string"
  responses:
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              rc:
                type: string
                description: "Mã kết quả, 1 = thành công."
              data:
                type: array
                description: "Danh sách lệnh thường."
                items:
                  type: object
                  properties:
                    orderNo:
                      type: string
                      description: "Số hiệu lệnh."
                    pk_orderNo:
                      type: string
                      description: "Key lệnh."
                    side:
                      type: string
                      description: "B = Long, S = Short."
                    symbol:
                      type: string
                      description: "Mã hợp đồng."
                    volume:
                      type: number
                      format: double
                      description: "Khối lượng đặt."
                    showPrice:
                      type: string
                      description: "Giá đặt."
                    matchVolume:
                      type: number
                      format: double
                      description: "Khối lượng khớp."
                    status:
                      type: string
                      description: "Trạng thái lệnh."
                    isCancel:
                      type: string
                      description: "0 = không thể hủy, 1 = có thể hủy."
                    isAmend:
                      type: string
                      description: "0 = không thể sửa, 1 = có thể sửa."
