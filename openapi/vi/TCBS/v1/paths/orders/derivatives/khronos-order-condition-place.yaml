post:
  operationId: postKhronosOrderConditionPlace
  tags:
    - Lệnh phái sinh
  summary: Đặt lệnh điều kiện phái sinh
  description: Đặt lệnh điều kiện trên thị trường phái sinh.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            accountId:
              type: string
              description: "Mã tài khoản lưu ký."
            subAccountId:
              type: string
              description: "Số tiểu khoản phái sinh."
            side:
              allOf:
                - $ref: ../../../components/schemas/enums/DerivativeSide.yaml
              description: "B = Mua, S = Bán."
            symbol:
              type: string
              description: "Mã phái sinh, ví dụ VN30F2101."
            price:
              type: number
              format: double
              description: "Giá đặt lệnh."
            volume:
              type: number
              format: double
              description: "Số lượng, lớn hơn 0."
            orderType:
              allOf:
                - $ref: ../../../components/schemas/enums/DerivativeConditionalOrderType.yaml
              description: "SOL = giá TT >= soPrice, SOU = giá TT <= soPrice, TSO = Trailing Stop."
            soPrice:
              type: number
              format: double
              description: "Giá kích hoạt."
            callbackPoint:
              type: number
              format: double
              description: "Biên trượt (chỉ dùng khi orderType = TSO)."
            activationPrice:
              type: number
              format: double
              description: "Giá kích hoạt (chỉ dùng khi orderType = TSO)."
            refId:
              type: string
              description: "Số chống trùng theo từng lệnh."
          required:
            - accountId
            - subAccountId
            - side
            - symbol
            - price
            - volume
            - orderType
            - soPrice
            - callbackPoint
            - activationPrice
  responses:
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              cmd:
                type: string
                description: "Lệnh gọi (echo)."
              rc:
                type: string
                description: "Mã kết quả, 1 = thành công."
              data:
                type: array
                description: "Danh sách kết quả đặt lệnh."
                items:
                  type: object
                  properties:
                    symbol:
                      type: string
                    status:
                      type: string
                    msg_type:
                      type: string
                    showPrice:
                      type: string
                    orderTime:
                      type: string
                    accountCode:
                      type: string
                    orderNo:
                      type: integer
                      format: int64
                    matchVolume:
                      type: number
                      format: double
                    side:
                      type: string
                    volume:
                      type: string
                    pk_orderNo:
                      type: string
                    channel:
                      type: string
                    group:
                      type: string
                    quote:
                      type: string
          example:
            cmd: "Web.newOrder"
            rc: "1"
            data:
              - symbol: "VN30F2110"
                status: "P"
                msg_type: "1I"
                showPrice: "1504.4"
                orderTime: "20:16:57"
                accountCode: "100159A"
                orderNo: 1
                matchVolume: 0
                side: "B"
                volume: "1"
                pk_orderNo: "7843961"
                channel: "D"
                group: "FU"
                quote: "G"
