"post":
  "summary": "Hủy lệnh thường phái sinh"
  "description": "Hủy lệnh thường phái sinh."
  responses:
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              rc:
                type: string
                description: "Mã kết quả, 1 = thành công."
              data:
                type: array
                items:
                  type: object
                  properties:
                    orderNo:
                      type: string
                      description: "Số hiệu lệnh."
                    status:
                      type: string
                      description: "Trạng thái (PW = pending withdrawal)."
                    pk_orderNo:
                      type: string
                      description: "Key lệnh."
                    cancelTime:
                      type: string
                      description: "Thời gian hủy."
  "requestBody":
    "required": true
    "content":
      "application/json":
        "schema":
          "type": "object"
          "properties":
            "accountId":
              "type": "string"
              "description": "Số tài khoản lưu ký."
            "orderNo":
              "type": "string"
              "description": "orderNo từ API sổ lệnh thường."
            "cmd":
              "type": "string"
              "description": "Web.cancelOrder."
            "pin":
              "type": "string"
              "description": "Kênh đặt lệnh (F)."
            "refId":
              "type": "string"
              "description": "Reference ID."
          "required":
            - "accountId"
            - "orderNo"
