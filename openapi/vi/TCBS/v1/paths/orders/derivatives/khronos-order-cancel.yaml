"post":
  operationId: postKhronosOrderCancel
  tags:
    - Lệnh phái sinh
  "summary": "Hủy lệnh thường phái sinh"
  "description": "Hủy lệnh thường phái sinh."
  responses:
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              cmd:
                type: string
                default: "Web.changeOrder"
                description: "Web.changeOrder."
              rc:
                type: string
                description: "Mã kết quả, 1 = thành công."
              data:
                type: array
                items:
                  type: object
                  properties:
                    orderNo:
                      type: string
                      description: "Số hiệu lệnh."
                    msg_type:
                      type: string
                      description: "Loại lệnh (1C = hủy lệnh)."
                    status:
                      type: string
                      description: "Trạng thái (PW = pending withdrawal)."
                    pk_orderNo:
                      type: string
                      description: "Key lệnh."
                    cancelTime:
                      type: string
                      description: "Thời gian hủy."

          example:
            cmd: Web.changeOrder
            rc: "1"
            data:
              - orderNo: "1"
                msg_type: "1C"
                status: PW
                pk_orderNo: "7625368"
                cancelTime: 16:20:15

  "requestBody":
    "required": true
    "content":
      "application/json":
        "schema":
          "type": "object"
          "properties":
            "accountId":
              "type": "string"
              "description": "Số tài khoản lưu ký."
            "orderNo":
              "type": "string"
              "description": "orderNo từ API sổ lệnh thường."
            "cmd":
              "type": "string"
              "description": "Web.cancelOrder."
            "pin":
              "type": "string"
              "description": "Kênh đặt lệnh (F)."
            "refId":
              "type": "string"
              "description": "Reference ID."
          "required":
            - "accountId"
            - "orderNo"
