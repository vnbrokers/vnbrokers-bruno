"get":
  operationId: getKhronosOrderConditionDetail
  tags:
    - Lệnh phái sinh
  "summary": "Tra cứu sổ lệnh điều kiện phái sinh"
  "description": "Tra cứu sổ lệnh điều kiện phái sinh."
  "parameters":
    - "name": "accountId"
      "in": "query"
      "required": true
      "description": "Số tài khoản lưu ký."
      "schema":
        "type": "string"
    - "name": "subAccountID"
      "in": "query"
      "required": true
      "description": "Phái sinh Số tiểu khoản."
      "schema":
        "type": "string"
    - "name": "pageNo"
      "in": "query"
      "required": true
      "description": "Số trang."
      "schema":
        "type": "string"
    - "name": "PageSize"
      "in": "query"
      "required": true
      "description": "Kích thước trang."
      "schema":
        "type": "string"
    - "name": "orderStatus"
      "in": "query"
      "required": true
      "description": "0 = all, 1 = waiting, 2 = activated, 3 = rejected."
      "schema":
        "$ref": "../../../components/schemas/enums/DerivativeOrderStatusFilter.yaml"
    - "name": "orderType"
      "in": "query"
      "required": true
      "description": "'' = all, 3 = Arbitrage, 4 = SL/TP, 5 = Stop order."
      "schema":
        "$ref": "../../../components/schemas/enums/DerivativeConditionalOrderTypeFilter.yaml"
    - "name": "Symbol"
      "in": "query"
      "required": true
      "description": "Bộ lọc: ALL,ALL = all; VN30F2303,B = by mã."
      "schema":
        "type": "string"
  responses:
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              cmd:
                type: string
                default: "Web.Order.ConditionOrder"
                description: "Tên lệnh."
              rc:
                type: string
                description: "Mã kết quả, 1 = thành công."
              data:
                type: array
                description: "Danh sách lệnh điều kiện."
                items:
                  type: object
                  properties:
                    orderNo:
                      type: string
                      description: "Số hiệu lệnh."
                    groupOrder:
                      type: string
                      description: "Mã nhóm lệnh."
                    pk_orderNo:
                      type: string
                      description: "Key lệnh."
                    accountCode:
                      type: string
                      description: "Mã tài khoản."
                    side:
                      type: string
                      description: "B = Long, S = Short."
                    symbol:
                      type: string
                      description: "Mã hợp đồng."
                    showPrice:
                      type: number
                      format: double
                      description: "Giá đặt."
                    volume:
                      type: number
                      format: double
                      description: "Khối lượng đặt."
                    soPrice:
                      type: number
                      format: double
                      description: "Giá stop."
                    orderType:
                      type: string
                      description: "SL = giá >=, SU = giá <=."
                    from_time:
                      type: string
                      description: "Thời gian bắt đầu hiệu lực."
                    exp_time:
                      type: string
                      description: "Thời gian hết hạn."
                    status:
                      type: string
                      description: "0 = chờ kích hoạt, 1 = đã kích hoạt, 2 = đã hủy, 3 = từ chối."
                    send_time:
                      type: string
                      description: "Thời gian gửi lệnh."
                    notes:
                      type: string
                      description: "Loại lệnh: SL/TP, Stop order, Arbitrage."
          example:
            cmd: Web.Order.ConditionOrder
            rc: "1"
            data:
              - orderNo: "1"
                groupOrder: "463502"
                pk_orderNo: "463504"
                accountCode: "000112A"
                side: "B"
                symbol: "VN30F2303"
                showPrice: 1190.5
                volume: 2
                soPrice: 1190.5
                orderType: "SL"
                from_time: 29/04/2021
                exp_time: 29/04/2021
                status: "0"
                send_time: 14:01:01
                notes: "SL/TP"
