"post":
  "summary": "Sửa lệnh điều kiện phái sinh"
  "description": "Sửa lệnh điều kiện phái sinh."
  responses:
    "401":
      $ref: ../../../components/responses/Unauthorized.yaml
    "200":
      description: Phản hồi thành công
      content:
        application/json:
          schema:
            type: object
            properties:
              rc:
                type: string
                description: "Mã kết quả, 1 = thành công."
              data:
                type: array
                items:
                  type: object
                  properties:
                    showPrice:
                      type: string
                      description: "Giá kích hoạt."
                    price:
                      type: string
                      description: "Giá đặt."
                    volume:
                      type: string
                      description: "Khối lượng."
                    pkOrderNo:
                      type: string
                      description: "Số hiệu lệnh."
                    notes:
                      type: string
                      description: "Loại lệnh điều kiện."
  "requestBody":
    "required": true
    "content":
      "application/json":
        "schema":
          "type": "object"
          "properties":
            "accountId":
              "type": "string"
              "description": "Mã tài khoản lưu ký."
            "pkOrderNo":
              "type": "string"
              "description": "pk_orderNo từ API tra cứu sổ lệnh."
            "refId":
              "type": "string"
              "description": "Unique reference ID."
            "soPrice":
              "type": "number"
              "format": "double"
              "description": "Giá kích hoạt mới."
            "type":
              "type": "string"
              "description": "Loại (empty)."
            "cmd":
              "type": "string"
              "description": "Web.Order.ChangeCondition."
          "required":
            - "accountId"
            - "pkOrderNo"
            - "refId"
            - "soPrice"
