type: object
required:
  - symbol
  - timeSec
  - totalBUVol
  - totalBUVolAcc
  - totalSDVol
  - totalSDVolAcc
  - bsAccRatio
  - unitTimeFrame
properties:
  symbol:
    type: string
    description: Mã chứng khoán.
  timeSec:
    type: string
    description: Thời gian epoch seconds.
  totalBUVol:
    type: number
    description: Khối lượng mua chủ động.
  totalBUVolAcc:
    type: number
    description: Mua chủ động tích lũy.
  totalSDVol:
    type: number
    description: Khối lượng bán chủ động.
  totalSDVolAcc:
    type: number
    description: Bán chủ động tích lũy.
  bsAccRatio:
    type: number
    description: Tỷ lệ mua/bán chủ động.
  unitTimeFrame:
    type: string
    description: Khung thời gian 900 giây.
