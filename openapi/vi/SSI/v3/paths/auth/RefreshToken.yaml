post:
  operationId: refreshToken
  tags:
    - Xác thực
  summary: Làm mới access token
  description: Làm mới access token bằng refresh token còn hiệu lực.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - refreshToken
          properties:
            refreshToken:
              type: string
              description: Refresh token còn hiệu lực.
  responses:
    "200":
      description: Thành công.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/TokenResponse.yaml"
          example:
            tokenType: Bearer
            accessToken: "eyJhb..."
            expiresAt: 1787238584
            refreshToken: "eyJhb..."
            refreshExpiresAt: 1787266484
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
  security: []
