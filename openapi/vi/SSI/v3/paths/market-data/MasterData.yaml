get:
  operationId: getMasterData
  tags:
    - Dữ liệu thị trường
  summary: Dữ liệu tham chiếu thị trường
  description: Truy vấn thông tin giá trần, giá sàn, giá tham chiếu của chứng khoán theo ngày giao dịch.
  security:
    - SsiBearerAuth: []
  parameters:
    - $ref: "../../components/parameters/ContentType.yaml"
    - $ref: "../../components/parameters/UserAgent.yaml"
    - $ref: "../../components/parameters/AcceptLanguage.yaml"
    - name: from
      in: query
      description: Ngày bắt đầu theo định dạng `YYYY/MM/DD`. Không truyền thì trả dữ liệu ngày mới nhất.
      required: false
      schema:
        type: string
    - name: to
      in: query
      description: Ngày kết thúc theo định dạng `YYYY/MM/DD`. Không truyền thì trả dữ liệu ngày mới nhất.
      required: false
      schema:
        type: string
    - name: pageIndex
      in: query
      description: Chỉ số trang khi phân trang kết quả, bắt đầu từ 1. Nếu không cung cấp thì hệ thống sẽ sử dụng giá trị mặc định là 1.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: pageSize
      in: query
      description: Số lượng bản ghi trên mỗi trang. Nếu không cung cấp thì hệ thống sẽ sử dụng giá trị mặc định là 10.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 10
  responses:
    "200":
      description: Thành công.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/MasterDataResponse.yaml"
          example:
            code: 200
            msg: ""
            data:
              - board: UPCOM
                symbol: BBM
                tradingDate: 2026/06/20
                ceiling: 8600
                floor: 6400
                refPrice: 7500
              - board: HOSE
                symbol: CCI
                tradingDate: 2026/06/20
                ceiling: 17900
                floor: 15600
                refPrice: 16750
            pageSize: 2
            pageIndex: 10
            pagesCount: 993
            itemsCount: 1985
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
