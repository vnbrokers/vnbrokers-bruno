post:
  operationId: placeOrder
  tags:
    - Giao dịch
  summary: Đặt lệnh
  description: Đặt lệnh mới.
  security:
    - SsiBearerAuth: []
  parameters:
    - $ref: "../../components/parameters/ContentType.yaml"
    - $ref: "../../components/parameters/UserAgent.yaml"
    - $ref: "../../components/parameters/AcceptLanguage.yaml"
    - $ref: "../../components/parameters/XSignature.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/PlaceOrderRequest.yaml"
  responses:
    "200":
      description: Thành công.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/OrderResponse.yaml"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
