get:
  operationId: getAccountInfo
  tags:
    - Tài khoản
  summary: Thông tin tài khoản
  description: Lấy danh sách tài khoản giao dịch của khách hàng. Tài khoản có thể một trong ba loại CASH (thường); MARGIN (ký quỹ); DERIVATIVE (phái sinh). * DERIVATIVE (phái sinh)
  security:
    - SsiBearerAuth: []
  parameters:
    - $ref: "../../components/parameters/ContentType.yaml"
    - $ref: "../../components/parameters/UserAgent.yaml"
    - $ref: "../../components/parameters/AcceptLanguage.yaml"
  responses:
    "200":
      description: Thành công.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/Account.yaml"
          example:
            - accountNo: Q123451
              accountType: Cash
            - accountNo: Q123456
              accountType: Margin
            - accountNo: Q123458
              accountType: Derivative
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
