name: unsubscribeTradingDataRequest
title: Yêu cầu hủy trading data
summary: Hủy đăng ký các topic trên channel TRADING.
payload:
  $ref: ../../schemas/trading/UnsubscribeRequest.yaml
examples:
  - name: unsubscribeTradingData
    summary: Hủy đăng ký các topic trading data.
    payload:
      method: UNSUBSCRIBE
      channel: TRADING
      topics:
        - order.0901351
        - portfolio.0901351
        - order.*
        - portfolio.*
