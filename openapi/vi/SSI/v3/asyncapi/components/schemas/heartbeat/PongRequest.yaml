type: object
additionalProperties: false
required: [method, channel, time]
properties:
  method:
    type: string
    const: PONG
  channel:
    type: string
    const: HEARTBEAT
  time:
    type: string
    description: Thời gian heartbeat theo định dạng `dd-mm-yyyy hh-mm-ss`.
    pattern: '^\d{2}-\d{2}-\d{4} \d{2}-\d{2}-\d{2}$'
