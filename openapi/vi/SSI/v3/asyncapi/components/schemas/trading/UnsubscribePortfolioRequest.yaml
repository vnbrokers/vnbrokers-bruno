type: object
additionalProperties: false
required: [method, channel, topics]
properties:
  method:
    type: string
    const: UNSUBSCRIBE
  channel:
    type: string
    const: TRADING
  topics:
    type: array
    minItems: 1
    uniqueItems: true
    description: Danh sách topic cập nhật danh mục cần hủy.
    items:
      type: string
      minLength: 1
      pattern: '^portfolio\.(\*|[A-Za-z0-9_-]+(?:-[A-Za-z0-9_-]+)*)$'
