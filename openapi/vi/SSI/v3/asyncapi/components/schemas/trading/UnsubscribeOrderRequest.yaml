type: object
additionalProperties: false
required: [method, channel, topics]
properties:
  method:
    type: string
    const: UNSUBSCRIBE
  channel:
    type: string
    const: TRADING
  topics:
    type: array
    minItems: 1
    uniqueItems: true
    description: Danh sách topic sự kiện lệnh cần hủy.
    items:
      type: string
      minLength: 1
      pattern: '^order\.(\*|[A-Za-z0-9_-]+(?:-[A-Za-z0-9_-]+)*)$'
