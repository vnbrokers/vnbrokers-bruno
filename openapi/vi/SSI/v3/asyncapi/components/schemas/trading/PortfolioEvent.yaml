type: object
additionalProperties: false
required:
  [
    eventType,
    notifyId,
    connectionId,
    symbol,
    accountNo,
    longQty,
    shortQty,
    net,
    bidAvgPrice,
    askAvgPrice,
    tradePrice,
    marketPrice,
    floatingPL,
    tradingPL,
  ]
properties:
  eventType: { type: string, const: clientPortfolioEvent, description: Loại event. }
  notifyId: { type: integer, format: int64, description: Số serial của event message. }
  connectionId: { type: string, description: Định danh phiên kết nối stream. }
  symbol: { type: string, description: Mã chứng khoán. }
  accountNo: { type: string, description: Số tài khoản. }
  longQty: { type: number, description: Vị thế long. }
  shortQty: { type: number, description: Vị thế short. }
  net: { type: number, description: "Vị thế net, bằng long trừ short." }
  bidAvgPrice: { type: string, description: Giá mua trung bình. }
  askAvgPrice: { type: string, description: Giá bán trung bình. }
  tradePrice: { type: string, description: Giá khớp. }
  marketPrice: { type: string, description: Giá thị trường. }
  floatingPL: { type: string, description: Lãi/lỗ tạm tính. }
  tradingPL: { type: string, description: Lãi/lỗ đã chốt. }
