type: object
additionalProperties: false
required: [channel, topic, data]
properties:
  channel:
    type: string
    const: DATA
  topic:
    type: string
    pattern: '^market\.(index|exchange|[A-Za-z0-9_-]+(?:-[A-Za-z0-9_-]+)*|\*)$'
  data:
    type: object
    additionalProperties: false
    required: [s, b, t, ce, fl, ref]
    properties:
      s:
        type: string
        description: Mã chứng khoán.
      b:
        type: string
        enum: [HOSE, HNX, UPCOM]
        description: Sàn giao dịch.
      t:
        type: string
        description: "Ngày giao dịch, định dạng `YYYY/MM/DD`."
      ce:
        type: string
        description: Giá trần.
      fl:
        type: string
        description: Giá sàn.
      ref:
        type: string
        description: Giá tham chiếu.
