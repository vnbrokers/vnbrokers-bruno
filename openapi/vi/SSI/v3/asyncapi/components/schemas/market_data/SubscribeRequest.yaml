type: object
additionalProperties: false
required: [method, channel, topics]
properties:
  method:
    type: string
    const: SUBSCRIBE
  channel:
    type: string
    const: DATA
  topics:
    type: array
    minItems: 1
    uniqueItems: true
    description: Danh sách topic market data; mỗi phần tử là một chuỗi topic.
    items:
      type: string
      minLength: 1
      pattern: '^(trade|quote|room|put|oddlot)\.(index|exchange|[A-Za-z0-9_-]+(?:-[A-Za-z0-9_-]+)*|\*)(?:@(tick|1m|5m))?$|^market\.(index|exchange|[A-Za-z0-9_-]+(?:-[A-Za-z0-9_-]+)*|\*)$'
