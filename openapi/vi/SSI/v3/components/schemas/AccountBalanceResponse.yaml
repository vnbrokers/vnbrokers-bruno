type: object
required:
  - equity
  - derivative
properties:
  equity:
    description: Thông tin hoặc danh sách vị thế tài khoản cơ sở.
    type: [object, "null"]
    properties:
      accountNo:
        description: Số tài khoản giao dịch.
        type: string
      accountBalance:
        description: Số dư tài khoản.
        type: string
      totalDebt:
        description: Tổng dư nợ.
        type: string
      interestLoan:
        description: Lãi vay.
        type: string
      overdueFeeLoan:
        description: Phí vay quá hạn.
        type: string
      withdrawable:
        description: Số tiền có thể rút.
        type: string
      onHoldCash:
        description: Tiền mặt đang bị giữ.
        type: string
      sellUnmatched:
        description: Giá trị bán chưa khớp.
        type: string
      sellT0:
        description: Giá trị bán chờ về T+0.
        type: string
      sellT1:
        description: Giá trị bán chờ về T+1.
        type: string
      sellT2:
        description: Giá trị bán chờ về T+2.
        type: string
      buyUnmatched:
        description: Giá trị mua chưa khớp.
        type: string
      buyT0:
        description: Giá trị mua T+0.
        type: string
      buyT1:
        description: Giá trị mua T+1.
        type: string
      buyT2:
        description: Giá trị mua T+2.
        type: string
      advancedCashT0:
        description: Tiền ứng trước T+0.
        type: string
      advancedCashT1:
        description: Tiền ứng trước T+1.
        type: string
      holdSubscription:
        description: Giá trị tiền đang giữ cho quyền mua.
        type: string
      dividend:
        description: Cổ tức.
        type: string
  derivative:
    description: Thông tin tài khoản hoặc vị thế phái sinh.
    type: [object, "null"]
    additionalProperties: true
    properties:
      accountNo:
        description: Số tài khoản giao dịch.
        type: string
      accountBalance:
        description: Số dư tài khoản giao dịch (tiền mặt khả dụng).
        type: string
      fee:
        description: Phí giao dịch.
        type: string
      commission:
        description: Hoa hồng giao dịch.
        type: string
      interest:
        description: Lãi suất vay.
        type: string
      extInterest:
        description: Lãi suất vay ngoài.
        type: string
      loan:
        description: Dư nợ vay gốc đã sử dụng trong tài khoản giao dịch phái sinh.
        type: string
      deliveryAmount:
        description: Số tiền phải trả hoặc được nhận khi đến ngày giao hàng đối với các hợp đồng tương lai.
        type: string
      floatingPL:
        description: Lãi/lỗ chưa thực hiện từ các vị thế mở.
        type: string
      tradingPL:
        description: Lãi/lỗ đã thực hiện từ các vị thế đã đóng.
        type: string
      totalPL:
        description: Tổng lãi/lỗ (floatingPL + tradingPL).
        type: string
      withdrawable:
        description: Số tiền có thể rút từ tài khoản giao dịch phái sinh.
        type: string
      cashSSI:
        description: Số tiền mặt trong tài khoản giao dịch phái sinh tại SSI.
        type: string
      validNonCashSSI:
        description: Số tiền phi tiền mặt hợp lệ trong tài khoản phái sinh tại SSI.
        type: string
      withdrawableSSI:
        description: Số tiền có thể rút từ tài khoản phái sinh tại SSI.
        type: string
      cashVSDC:
        description: Số tiền mặt trong tài khoản giao dịch phái sinh tại VSDC.
        type: string
      validNonCashVSDC:
        description: Số tiền phi tiền mặt hợp lệ trong tài khoản phái sinh tại VSDC.
        type: string
      withdrawableVSDC:
        description: Số tiền có thể rút từ tài khoản phái sinh tại VSDC.
        type: string
