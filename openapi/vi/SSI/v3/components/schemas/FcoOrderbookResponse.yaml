          type: number
        osQuantity:
          description: Khối lượng còn lại.
          type: number
        avgPrice:
          description: Giá khớp trung bình.
          type: number
        status:
          description: Trạng thái xử lý.
          type: string
        detail:
          description: Chi tiết kết quả hoặc lỗi.
          type: string
