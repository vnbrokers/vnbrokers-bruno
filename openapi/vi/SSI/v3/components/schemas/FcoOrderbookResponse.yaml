type: object
properties:
  pageIndex:
    description: Chỉ số trang.
    type: string
  pageSize:
    description: Số lượng bản ghi trên mỗi trang.
    type: string
  itemsCount:
    description: Tổng số bản ghi.
    type: string
  pagesCount:
    description: Tổng số trang.
    type: string
  data:
    description: Dữ liệu trả về.
