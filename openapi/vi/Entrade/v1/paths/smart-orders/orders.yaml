get:
  operationId: listSmartOrders
  tags:
    - Smart Order
  summary: Lấy thông tin lệnh điều kiện
  description: Lấy danh sách lệnh điều kiện (Smart Order).
  servers:
    - url: https://services-staging.entrade.com.vn/papertrade-smart-order
      description: Môi trường staging Smart Order
  parameters:
    - name: investorId
      in: query
      schema:
        type: number
    - name: _start
      in: query
      schema:
        type: number
    - name: _end
      in: query
      schema:
        type: number
  responses:
    "200":
      description: Thành công – trả về danh sách lệnh điều kiện
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/smart-orders/SmartOrderPage.yaml
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
post:
  operationId: placeSmartOrder
  tags:
    - Smart Order
  summary: Đặt lệnh điều kiện
  description: Đặt lệnh điều kiện (Smart Order).
  servers:
    - url: https://services-staging.entrade.com.vn/papertrade-smart-order
      description: Môi trường staging Smart Order
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            investorId:
              type: number
            investorAccountId:
              type: number
            bankMarginPortfolioId:
              type: number
            symbol:
              type: string
            condition:
              type: string
            targetPrice:
              type: number
            targetSide:
              type: string
            targetQuantity:
              type: number
            type:
              type: string
            expiredTime:
              type: string
  responses:
    "200":
      description: Thành công – đặt lệnh điều kiện
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/smart-orders/SmartOrder.yaml
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
delete:
  operationId: cancelAllSmartOrders
  tags:
    - Smart Order
  summary: Hủy tất cả lệnh điều kiện
  description: Hủy tất cả lệnh điều kiện theo investorAccountId và investorId.
  servers:
    - url: https://services-staging.entrade.com.vn/papertrade-smart-order
      description: Môi trường staging Smart Order
  parameters:
    - name: investorAccountId
      in: query
      schema:
        type: number
    - name: investorId
      in: query
      schema:
        type: number
  responses:
    "200":
      description: Thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/smart-orders/SmartOrderBulkCancelResult.yaml
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
