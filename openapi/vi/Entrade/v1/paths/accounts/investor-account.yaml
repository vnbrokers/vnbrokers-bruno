get:
  operationId: getInvestorAccount
  tags:
    - Tài khoản
  summary: Lấy tiểu khoản Master
  description: Lấy thông tin tiểu khoản Master của khách hàng theo investorId.
  parameters:
    - name: investorId
      in: path
      required: true
      description: Mã investorId của Khách Hàng
      schema:
        type: number
  responses:
    "200":
      description: Thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/accounts/InvestorAccount.yaml
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
