patch:
  operationId: updateRiskConfig
  tags:
    - Tài khoản
  summary: Sửa cấu hình cắt lỗ
  description: Sửa cấu hình mặc định cắt lỗ (cut loss config).
  parameters:
    - name: investorAccountId
      in: path
      required: true
      schema:
        type: number
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - type: object
              properties:
                cutLossRate:
                  type: number
                investorAccountId:
                  type: number
                trailingEnabled:
                  type: boolean
                investorId:
                  type: number
                autoIncreaseDealRate:
                  type: boolean
                enableAutoDealDepositNoti:
                  type: boolean
            - type: object
              properties:
                cutLossRate:
                  type: number
                investorId:
                  type: string
                investorAccountId:
                  type: number
                trailingEnabled:
                  type: boolean
  responses:
    "200":
      description: Thành công - sửa cấu hình cắt lỗ
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../../components/schemas/risk/RiskConfig.yaml
              - $ref: ../../components/schemas/risk/RiskConfigV1.yaml
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
