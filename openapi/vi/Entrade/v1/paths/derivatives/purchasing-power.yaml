get:
  operationId: getDerivativePurchasingPower
  tags:
    - Phái sinh
  summary: Lấy sức mua
  description: Lấy sức mua (ppse) và số lượng tối đa có thể đặt (qmax).
  parameters:
    - name: investorId
      in: path
      required: true
      schema:
        type: number
    - name: bankMarginPortfolioId
      in: query
      schema:
        type: number
    - name: price
      in: query
      schema:
        type: number
    - name: symbol
      in: query
      schema:
        type: string
    - name: side
      in: query
      schema:
        type: string
  responses:
    "200":
      description: Thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/derivatives/PurchasingPower.yaml
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
