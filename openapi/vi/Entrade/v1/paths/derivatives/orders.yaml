get:
  operationId: listDerivativeOrders
  tags:
    - Phái sinh
  summary: Lấy sổ lệnh
  description: Lấy sổ lệnh (Order Book) của Phái Sinh.
  parameters:
    - name: investorAccountId
      in: query
      description: Mã tiểu khoản
      schema:
        type: number
    - name: _start
      in: query
      description: Index lấy lệnh đầu tiên
      schema:
        type: number
    - name: _end
      in: query
      description: Index lấy lệnh cuối cùng
      schema:
        type: number
    - name: _sort
      in: query
      description: Field dùng để sort
      schema:
        type: string
    - name: _order
      in: query
      description: Thứ tự
      schema:
        type: string
  responses:
    "200":
      description: Thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/derivatives/DerivativeOrderPage.yaml
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
post:
  operationId: placeDerivativeOrder
  tags:
    - Phái sinh
  summary: Đặt lệnh Phái Sinh
  description: Đặt lệnh Phái Sinh (Long/Short).
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            bankMarginPortfolioId:
              type: number
              description: Id gói vay
            investorId:
              type: number
              description: Mã khách hàng
            symbol:
              type: string
              description: Mã phái sinh, ví dụ VN30F2306
            price:
              type: number
              description: Giá
            orderType:
              type: string
              description: "Loại lệnh: LO/MTL/ATO/ATC/MOK/MAK"
            side:
              type: string
              description: "Lệnh mua: NB, lệnh bán: NS"
            quantity:
              type: number
              description: Khối lượng đặt
  responses:
    "200":
      description: Thành công
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/derivatives/DerivativeOrder.yaml
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
