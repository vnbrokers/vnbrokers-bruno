type: object
additionalProperties: false
required: [name, symbols]
properties:
  name:
    type: string
    description: Topic khớp lệnh nâng cao theo nhóm thị trường.
    pattern: '^tick_extra\.[A-Z0-9]+\.json$'
  symbols:
    type: array
    minItems: 1
    uniqueItems: true
    items: { type: string, minLength: 1 }
