type: object
additionalProperties: false
required: [name, symbols]
properties:
  name:
    type: string
    description: Topic lệnh môi giới theo loại thị trường và mã nhà đầu tư.
    pattern: '^order\.broker\.(STOCK|DERIVATIVE)\.[0-9]+\.json$'
  symbols:
    type: array
    description: DNSE yêu cầu mảng rỗng cho topic lệnh môi giới.
    maxItems: 0
