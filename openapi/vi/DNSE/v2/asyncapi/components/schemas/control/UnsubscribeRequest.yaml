type: object
description: Yêu cầu hủy đăng ký các channel dữ liệu.
additionalProperties: false
required: [action, channels]
properties:
  action:
    type: string
    description: Loại yêu cầu đăng ký.
    const: unsubscribe
  channels:
    type: array
    minItems: 1
    uniqueItems: true
    description: Danh sách channel cần hủy đăng ký.
    items:
      type: object
      additionalProperties: false
      required: [name, symbols]
      properties:
        name:
          type: string
          description: Tên channel cần hủy đăng ký.
        symbols:
          type: array
          description: Danh sách mã cần hủy; truyền mảng rỗng nếu channel không lọc theo mã.
          items:
            type: string
