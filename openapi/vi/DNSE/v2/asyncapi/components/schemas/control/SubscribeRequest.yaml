type: object
description: Yêu cầu đăng ký các channel dữ liệu.
additionalProperties: false
required: [action, channels]
properties:
  action:
    type: string
    description: Loại yêu cầu đăng ký.
    const: subscribe
  channels:
    type: array
    minItems: 1
    uniqueItems: true
    description: Danh sách channel cần đăng ký.
    items:
      type: object
      additionalProperties: false
      required: [name, symbols]
      properties:
        name:
          type: string
          description: Tên channel cần đăng ký.
        symbols:
          type: array
          description: Danh sách mã cần đăng ký; truyền mảng rỗng nếu channel không lọc theo mã.
          items:
            type: string
