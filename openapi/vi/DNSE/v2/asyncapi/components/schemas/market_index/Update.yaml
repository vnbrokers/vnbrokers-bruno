type: object
description: Cập nhật từ topic `market_index.{index_name}.json`.
required:
  - T
  - indexName
  - valueIndexes
  - changedValue
  - changedRatio
  - fluctuationSteadinessIssueCount
  - fluctuationDownIssueCount
  - fluctuationUpIssueCount
  - fluctuationLowerLimitIssueCount
  - fluctuationUpperLimitIssueCount
  - fluctuationDownIssueVolume
  - fluctuationUpIssueVolume
  - fluctuationSteadinessIssueVolume
  - currencyCode
  - indexTypeCode
  - lowestValueIndexes
  - highestValueIndexes
  - priorValueIndexes
  - contauctAccTrdVal
  - contauctAccTrdVol
  - blkTrdAccTrdVal
  - blkTrdAccTrdVol
  - grossTradeAmount
  - totalVolumeTraded
  - marketIndexClass
  - marketId
  - tradingSessionId
  - multicastReceiveTime
  - transactTime
properties:
  T:
    type: string
    description: Mã loại message chỉ số thị trường.
    const: mi
  indexName:
    type: string
    description: Tên chỉ số thị trường.
  valueIndexes:
    type: number
    description: Giá trị hiện tại của chỉ số.
  changedValue:
    type: number
    description: Giá trị tăng hoặc giảm so với giá tham chiếu.
  changedRatio:
    type: number
    description: Tỷ lệ phần trăm tăng hoặc giảm so với giá tham chiếu.
  fluctuationSteadinessIssueCount:
    type: integer
    description: Số lượng mã có giá không đổi.
  fluctuationDownIssueCount:
    type: integer
    description: Số lượng mã có giá giảm.
  fluctuationUpIssueCount:
    type: integer
    description: Số lượng mã có giá tăng.
  fluctuationLowerLimitIssueCount:
    oneOf:
      - type: integer
      - type: "null"
    description: Số lượng mã giảm sàn.
  fluctuationUpperLimitIssueCount:
    type: integer
    description: Số lượng mã tăng trần.
  fluctuationDownIssueVolume:
    type: integer
    format: int64
    description: Tổng khối lượng giao dịch các mã có giá giảm.
  fluctuationUpIssueVolume:
    type: integer
    format: int64
    description: Tổng khối lượng giao dịch các mã có giá tăng.
  fluctuationSteadinessIssueVolume:
    type: integer
    format: int64
    description: Tổng khối lượng giao dịch các mã có giá không đổi.
  currencyCode:
    type: string
    description: Đơn vị tiền tệ.
  indexTypeCode:
    type: string
    description: Mã loại chỉ số.
  lowestValueIndexes:
    type: number
    description: Giá thấp nhất trong phiên.
  highestValueIndexes:
    type: number
    description: Giá cao nhất trong phiên.
  priorValueIndexes:
    type: number
    description: Giá trị tham chiếu.
  contauctAccTrdVal:
    type: number
    description: Tổng giá trị giao dịch theo phương thức khớp lệnh.
  contauctAccTrdVol:
    type: integer
    format: int64
    description: Tổng khối lượng giao dịch theo phương thức khớp lệnh.
  blkTrdAccTrdVal:
    type: number
    description: Tổng giá trị giao dịch theo phương thức thỏa thuận.
  blkTrdAccTrdVol:
    type: integer
    format: int64
    description: Tổng khối lượng giao dịch theo phương thức thỏa thuận.
  grossTradeAmount:
    type: number
    description: Tổng giá trị giao dịch trong ngày.
  totalVolumeTraded:
    type: integer
    format: int64
    description: Tổng khối lượng giao dịch trong ngày.
  marketIndexClass:
    oneOf:
      - type: integer
      - type: string
    description: Phân loại chỉ số.
  marketId:
    type: string
    description: Mã thị trường.
  tradingSessionId:
    type: string
    description: Mã phiên giao dịch hiện tại.
  multicastReceiveTime:
    type: object
    description: Thời gian nhận message qua multicast.
    required:
      - Seconds
      - Nanos
    properties:
      Seconds:
        type: integer
        format: int64
        description: Unix timestamp tính bằng giây.
      Nanos:
        type: integer
        format: int32
        description: Phần nanosecond của timestamp.
  transactTime:
    type: object
    description: Thời gian trong các message giá của sàn trả về.
    required:
      - Seconds
      - Nanos
    properties:
      Seconds:
        type: integer
        format: int64
        description: Unix timestamp tính bằng giây.
      Nanos:
        type: integer
        format: int32
        description: Phần nanosecond của timestamp.
