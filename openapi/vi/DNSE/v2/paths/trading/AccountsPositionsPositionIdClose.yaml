post:
  operationId: postAccountsPositionsPositionIdClose
  security:
    - DnseApiKey: []
      DnseAuxDate: []
      DnseSignature: []
      DnseTradingToken: []
  summary: Đóng vị thế
  parameters:
    - name: marketType
      in: query
      required: true
      description: "Loại thị trường \n- STOCK: Danh sách Deal cơ sở\n- DERIVATIVE: Danh sách Deal phái sinh\nHiện tại chỉ hỗ trợ phái sinh"
      deprecated: false
      schema:
        type: string
      example: DERIVATIVE
  responses:
    "200":
      description: OK
      headers:
        Access-Control-Allow-Credentials:
          $ref: ../../components/headers/AccessControlAllowCredentials.yaml
        Content-Encoding:
          deprecated: false
          schema: {}
          example: br
        Content-Length:
          $ref: ../../components/headers/ContentLength.yaml
        Date:
          $ref: ../../components/headers/Date.yaml
        Vary:
          $ref: ../../components/headers/Vary.yaml
        X-Ratelimit-Limit:
          $ref: ../../components/headers/XRateLimitLimit.yaml
        X-Ratelimit-Remaining:
          $ref: ../../components/headers/XRateLimitRemaining.yaml
        X-Ratelimit-Reset:
          $ref: ../../components/headers/XRateLimitReset.yaml
        X-Tyk-Api-Expires:
          deprecated: false
          schema: {}
          example: Thu, 02 Jan 3000 15:04:00 UTC
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                example: "1636"
                description: ID lệnh giao dịch dạng chuỗi
                format: int32
              side:
                type: string
                example: NS
                description: |-
                  Chiều đặt lệnh
                  - NB: Mua
                  - NS: Bán
              accountNo:
                type: string
                example: "0001179019"
                description: Số tiểu khoản
              symbol:
                type: string
                example: 41I1G4000
                description: Mã chứng khoán
              price:
                type: number
                format: double
                example: 1618.2
                description: Giá đặt
              quantity:
                type: integer
                format: int32
                example: 1
                description: Khối lượng đặt
              orderType:
                type: string
                example: LO
                description: |-
                  Loại lệnh
                  - LO: Lệnh giới hạn
                  - MOK/MAK/MTL: Lệnh thị trường
                  - ATO/ATC: Lệnh phiên định kỳ mở cửa/đóng cửa
                  - PLO: Lệnh khớp lệnh sau giờ
              fillQuantity:
                type: integer
                format: int32
                example: 0
                description: Khối lượng khớp
              leaveQuantity:
                type: integer
                format: int32
                example: 0
                description: Khối lượng còn lại
              canceledQuantity:
                type: integer
                format: int32
                example: 0
                description: Khối lượng đã hủy
              loanPackageId:
                type: integer
                format: int32
                example: 2278
                description: Mã gói vay
              createdDate:
                type: string
                format: date-time
                example: "2026-03-24T04:20:55.63Z"
                description: Thời điểm tạo
              modifiedDate:
                type: string
                format: date-time
                example: "2026-03-24T04:20:55.63Z"
                description: Thời điểm cập nhật
          example:
            id: "1636"
            side: NS
            accountNo: "0001179019"
            symbol: 41I1G4000
            price: 1618.2
            quantity: 1
            orderType: LO
            fillQuantity: 0
            leaveQuantity: 0
            canceledQuantity: 0
            loanPackageId: 2278
            createdDate: "2026-03-24T04:20:55.63Z"
            modifiedDate: "2026-03-24T04:20:55.63Z"
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
  tags:
    - Giao dịch
parameters:
  - name: positionId
    in: path
    required: true
    description: Id vị thế
    deprecated: false
    schema:
      type: string
    example: "177410795472387"
