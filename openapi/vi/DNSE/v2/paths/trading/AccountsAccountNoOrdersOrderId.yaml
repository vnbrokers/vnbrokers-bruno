put:
  operationId: putAccountsAccountNoOrdersOrderId
  security:
    - DnseApiKey: []
      DnseAuxDate: []
      DnseSignature: []
      DnseTradingToken: []
  summary: Sửa lệnh
  parameters:
    - name: marketType
      in: query
      required: true
      description: |-
        Loại thị trường 
        - STOCK: Gói vay giao dịch cơ sở
        - DERIVATIVE: Gói vay giao dịch phái sinh
      deprecated: false
      schema:
        type: string
      example: DERIVATIVE
    - name: orderCategory
      in: query
      required: true
      description: Phân loại lệnh thường, lệnh điều kiện (mặc định NORMAL)
      deprecated: false
      schema:
        type: string
      example: NORMAL
  responses:
    '200':
      description: OK
      headers:
        Content-Length:
          $ref: '../../components/headers/ContentLength.yaml'
        Date:
          $ref: '../../components/headers/Date.yaml'
        Vary:
          $ref: '../../components/headers/Vary.yaml'
        X-Ratelimit-Limit:
          $ref: '../../components/headers/XRateLimitLimit.yaml'
        X-Ratelimit-Remaining:
          $ref: '../../components/headers/XRateLimitRemaining.yaml'
        X-Ratelimit-Reset:
          $ref: '../../components/headers/XRateLimitReset.yaml'
        X-Tyk-Api-Expires:
          schema:
            type: string
          example: Thu, 02 Jan 3000 15:04:00 UTC
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: integer
                format: int32
                example: 1626
                description: Id lệnh giao dịch
              
              accountNo:
                type: string
                example: '0001179019'
                description: Số tiểu khoản
              side:
                type: string
                example: NS
                description: |-
                  Chiều đặt lệnh
                  - NB: Mua
                  - NS: Bán
              loanPackageId:
                type: integer
                format: int32
                example: 2278
                description: Mã gói vay
              symbol:
                type: string
                example: 41I1G4000
                description: Mã chứng khoán
              orderType:
                type: string
                example: LO
                description: |-
                  Loại lệnh
                  - LO: Lệnh giới hạn
                  - MOK/MAK/MTL: Lệnh thị trường
                  - ATO/ATC: Lệnh phiên định kỳ mở cửa/đóng cửa
                  - PLO: Lệnh khớp lệnh sau giờ
              orderCategory:
                type: string
                example: NORMAL
                description: Phân loại lệnh thường (mặc định NORMAL)
              price:
                type: number
                format: double
                example: 1851
                description: Giá đặt
              quantity:
                type: integer
                format: int32
                example: 3
                description: Khối lượng đặt
              fillQuantity:
                type: integer
                format: int32
                example: 0
                description: Khối lượng khớp
              canceledQuantity:
                type: integer
                format: int32
                example: 0
                description: Khối lượng đã hủy
              marketType:
                type: string
                example: DERIVATIVE
                description: |-
                  Loại thị trường
                  - STOCK: Lệnh cơ sở
                  - DERIVATIVE: Lệnh phái sinh
              transDate:
                type: string
                example: '2026-03-16'
                description: Ngày giao dịch
              createdDate:
                type: string
                format: date-time
                example: '2026-03-24T04:09:50.761146893Z'
                description: Thời điểm tạo
              modifiedDate:
                type: string
                format: date-time
                example: '2026-03-24T04:14:21.004856492Z'
                description: Thời điểm cập nhật
          example:
            id: 1626
            accountNo: '0001179019'
            side: NS
            loanPackageId: 2278
            symbol: 41I1G4000
            orderType: LO
            orderCategory: NORMAL
            price: 1851
            quantity: 3
            fillQuantity: 0
            canceledQuantity: 0
            marketType: DERIVATIVE
            transDate: '2026-03-16'
            createdDate: '2026-03-24T04:09:50.761146893Z'
            modifiedDate: '2026-03-24T04:14:21.004856492Z'
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
  tags:
    - Giao dịch
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            price:
              type: number
              format: double
              example: 1851
              description: >-
                Giá mới cho lệnh LO

                - Đối với lệnh cơ sở, có thể sửa cả giá và khối lượng

                - Đối với lệnh phái sinh, chỉ được sửa hoặc giá hoặc khối
                lượng
            quantity:
              type: integer
              format: int32
              example: 3
              description: >-
                Khối lượng mới

                - Đối với lệnh phái sinh, khối lượng mới phải lớn hơn khối
                lượng đã khớp (nếu có) của lệnh đã đặt
        example:
          price: 1851
          quantity: 3
parameters:
  - name: accountNo
    in: path
    required: true
    description: Số tiểu khoản
    deprecated: false
    schema:
      type: string
    example: '0001179019'
  - name: orderId
    in: path
    required: true
    description: Mã lệnh giao dịch
    deprecated: false
    schema:
      type: integer
    example: 96
