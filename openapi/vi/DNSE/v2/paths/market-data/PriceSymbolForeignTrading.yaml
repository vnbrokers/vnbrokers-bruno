  tags:
    - Dữ liệu thị trường
  security:
    - DnseApiKey: []
      DnseAuxDate: []
      DnseSignature: []
  summary: Dữ liệu nhà đầu tư nước ngoài
  parameters:
    - name: symbol
      in: path
      required: true
      schema:
        type: string
    - name: boardId
      in: query
      schema:
        $ref: "../../components/schemas/_common/enums/BoardId.yaml"
    - name: from
      in: query
      required: true
      schema:
        type: string
    - name: to
      in: query
      required: true
      schema:
        type: string
    - name: limit
      in: query
      schema:
        type: integer
    - name: order
      in: query
      schema:
        type: string
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
