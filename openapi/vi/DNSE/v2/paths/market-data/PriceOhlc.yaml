get:
  operationId: getPriceOhlc
  security:
    - DnseApiKey: []
      DnseAuxDate: []
      DnseSignature: []
  summary: Lịch sử OHLC
  parameters:
    - name: symbol
      in: query
      required: true
      description: 'Mã chứng khoán '
      deprecated: false
      schema:
        type: string
      example: ACB
    - name: type
      in: query
      required: true
      description: |-
        Loại thị trường
        - STOCK: Cổ phiếu
        - DERIVATIVE: Phái sinh
        - INDEX: Chỉ số thị trường
      deprecated: false
      schema:
        $ref: '../../components/schemas/_common/enums/Type.yaml'
      example: STOCK
    - name: resolution
      in: query
      required: true
      description: |-
        Khung thời gian nến
        - 1,3,5,15,30,1h,1D,1W
      deprecated: false
      schema:
        $ref: '../../components/schemas/_common/enums/Resolution.yaml'
      example: '15'
    - name: from
      in: query
      required: true
      description: Thời gian bắt đầu
      deprecated: false
      schema:
        type: string
      example: '1773657310'
    - name: to
      in: query
      required: true
      description: Thời gian kết thúc
      deprecated: false
      schema:
        type: string
      example: '1773830110'
  responses:
    '200':
      description: OK
      headers:
        Content-Length:
          $ref: '../../components/headers/ContentLength.yaml'
        Date:
          $ref: '../../components/headers/Date.yaml'
        Vary:
          $ref: '../../components/headers/Vary.yaml'
        X-Content-Type-Options:
          $ref: '../../components/headers/XContentTypeOptions.yaml'
        X-Frame-Options:
          $ref: '../../components/headers/XFrameOptions.yaml'
        X-Ratelimit-Limit:
          $ref: '../../components/headers/XRateLimitLimit.yaml'
        X-Ratelimit-Remaining:
          $ref: '../../components/headers/XRateLimitRemaining.yaml'
        X-Ratelimit-Reset:
          $ref: '../../components/headers/XRateLimitReset.yaml'
        X-Request-Id:
          $ref: '../../components/headers/XRequestId.yaml'
        X-Tyk-Api-Expires:
          deprecated: false
          schema: {}
          example: Thu, 02 Jan 3000 15:04:00 UTC
        X-Xss-Protection:
          $ref: '../../components/headers/XXssProtection.yaml'
      content:
        application/json:
          schema:
            type: object
            properties:
              t:
                type: array
                example:
                  - 1773715500
                items:
                  type: integer
                  format: int32
                  example: 1773715500
                  description: Thời gian nến (timestamp)
                description: Danh sách thời gian nến
              o:
                type: array
