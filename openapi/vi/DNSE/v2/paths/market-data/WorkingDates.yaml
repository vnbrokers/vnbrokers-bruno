get:
  operationId: getWorkingDates
  tags:
    - Dữ liệu thị trường
  summary: Ngày làm việc
  parameters:
    - $ref: ../../components/parameters/XApiKey.yaml
    - $ref: ../../components/parameters/XAuxDate.yaml
    - $ref: ../../components/parameters/XSignature.yaml
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              workingDates:
                type: array
                items:
                  type: string
                  format: date
          example:
            workingDates:
              - "2026-08-03"
              - "2026-08-04"
              - "2026-08-05"
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
