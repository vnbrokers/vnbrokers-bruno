get:
  operationId: getWorkingDates
  tags:
    - Dữ liệu thị trường
  security:
    - DnseApiKey: []
      DnseAuxDate: []
      DnseSignature: []
  summary: Ngày làm việc
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              workingDates:
                type: array
                items:
                  type: string
                  format: date
          example:
            workingDates:
              - "2026-08-03"
              - "2026-08-04"
              - "2026-08-05"
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
