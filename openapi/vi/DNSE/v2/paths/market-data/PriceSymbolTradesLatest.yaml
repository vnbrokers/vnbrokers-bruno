get:
  operationId: getPriceSymbolTradesLatest
  security:
    - DnseApiKey: []
      DnseAuxDate: []
      DnseSignature: []
  summary: Dữ liệu khớp gần nhất
  parameters:
    - name: symbol
      in: path
      required: true
      schema:
        type: string
    - name: boardId
      in: query
      required: true
      description: |-
        Mã bảng giao dịch
        - G1: Lô chẵn
        - G4: Lô lẻ
        - T1: Thỏa thuận trong giờ (9h - 14h45)
        - T3: Thỏa thuận sau giờ (14h45 - 15h)
        - T4: Thỏa thuận lô lẻ trong giờ (9h - 14h45)
        - T6: Thỏa thuận lô lẻ sau giờ  (14h45 - 15h)
      deprecated: false
      schema:
        $ref: '../../components/schemas/_common/enums/BoardId.yaml'
      example: G1
  responses:
    '200':
      description: OK
      headers:
        Content-Length:
          $ref: '../../components/headers/ContentLength.yaml'
        Date:
          $ref: '../../components/headers/Date.yaml'
        Vary:
          $ref: '../../components/headers/Vary.yaml'
        X-Ratelimit-Limit:
          $ref: '../../components/headers/XRateLimitLimit.yaml'
        X-Ratelimit-Remaining:
          $ref: '../../components/headers/XRateLimitRemaining.yaml'
        X-Ratelimit-Reset:
          $ref: '../../components/headers/XRateLimitReset.yaml'
        X-Tyk-Api-Expires:
          deprecated: false
          schema: {}
          example: Thu, 02 Jan 3000 15:04:00 UTC
      content:
        application/json:
          schema:
            type: object
            properties:
              trades:
                type: array
                example:
                  - marketId: STO
                    boardId: G1
                    isin: VN000000ACB8
                    symbol: ACB
                    matchPrice: 23.35
                    matchQtty: 20
                    side: SELL
                    avgPrice: 23.435
                    totalVolumeTraded: 427980
                    grossTradeAmount: 100.295515
                    highestPrice: 23.55
                    lowestPrice: 23.35
                    openPrice: 23.5
                    time: '2026-03-19 04:08:29'
                items:
                  type: object
                  properties:
                    marketId:
                      type: string
                      example: STO
                      description: |-
                        Mã thị trường niêm yết mã chứng khoán
                        - DVX: Phái sinh sàn HNX
                        - HCX: Trái phiếu doanh nghiệp HNX
                        - STO: Cổ phiếu sàn HOSE
                        - STX: Cổ phiếu sàn HNX
                        - UPX: Cổ phiếu sàn Upcom
                    boardId:
                      type: string
                      example: G1
                      description: |-
                        Mã bảng giao dịch
                        - G1: Lô chẵn
                        - G4: Lô lẻ
                        - T1: Thỏa thuận trong giờ (9h - 14h45)
                        - T3: Thỏa thuận sau giờ (14h45 - 15h)
                        - T4: Thỏa thuận lô lẻ trong giờ (9h - 14h45)
                        - T6: Thỏa thuận lô lẻ sau giờ (14h45 - 15h)
                    isin:
                      type: string
                      example: VN000000ACB8
                      description: Mã định danh quốc tế
                    symbol:
                      type: string
                      example: ACB
                      description: Mã chứng khoán
                    matchPrice:
                      type: number
                      format: double
                      example: 23.35
                      description: Giá khớp lệnh của giao dịch
                    matchQtty:
                      type: integer
                      format: int32
                      example: 20
                      description: Khối lượng khớp của giao dịch
                    side:
                      type: string
                      example: SELL
                      description: |-
                        Phía giao dịch chủ động
                        - BUY: Bên mua chủ động
                        - SELL: Bên bán chủ động
                    avgPrice:
                      type: number
                      format: double
                      example: 23.435
                      description: Giá khớp trung bình
                    totalVolumeTraded:
                      type: integer
                      format: int32
                      example: 427980
                      description: Tổng khối lượng đã giao dịch trong ngày
                    grossTradeAmount:
                      type: number
                      format: double
                      example: 100.295515
                      description: Tổng giá trị giao dịch trong nngày
                    highestPrice:
                      type: number
                      format: double
                      example: 23.55
                      description: Giá khớp cao nhất trong ngày
                    lowestPrice:
                      type: number
                      format: double
                      example: 23.35
                      description: Giá khớp thấp nhất trong ngày
                    openPrice:
                      type: number
                      format: float
                      example: 23.5
                      description: Giá mở cửa
                    time:
                      type: string
                      example: '2026-03-19 04:08:29'
                      description: >-
                        Thời gian khớp lệnh (theo định dạng yyyy-MM-dd
                        HH:mm:ss)
                description: ''
          example:
            trades:
              - marketId: STO
                boardId: G1
                isin: VN000000ACB8
                symbol: ACB
                matchPrice: 23.35
                matchQtty: 20
                side: SELL
                avgPrice: 23.435
                totalVolumeTraded: 427980
                grossTradeAmount: 100.295515
                highestPrice: 23.55
                lowestPrice: 23.35
                openPrice: 23.5
                time: '2026-03-19 04:08:29'
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
  tags:
    - Dữ liệu thị trường
parameters:
  - name: symbol
    in: path
    required: true
    description: 'Mã chứng khoán '
    deprecated: false
    schema:
      type: string
    example: ACB
