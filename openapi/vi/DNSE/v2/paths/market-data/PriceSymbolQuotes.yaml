get:
  operationId: getPriceSymbolQuotes
  tags:
    - Dữ liệu thị trường
  summary: Lịch sử bid/ask
  parameters:
    - $ref: ../../components/parameters/XApiKey.yaml
    - $ref: ../../components/parameters/XAuxDate.yaml
    - $ref: ../../components/parameters/XSignature.yaml
    - name: symbol
      in: path
      required: true
      schema:
        type: string
    - name: boardId
      in: query
      schema:
        $ref: ../../components/schemas/_common/enums/BoardId.yaml
      required: true
      description: |-
        Mã bảng giao dịch
        - G1: Lô chẵn
        - G4: Lô lẻ
        - T1: Thỏa thuận trong giờ (9h - 14h45)
        - T3: Thỏa thuận sau giờ (14h45 - 15h)
        - T4: Thỏa thuận lô lẻ trong giờ (9h - 14h45)
        - T6: Thỏa thuận lô lẻ sau giờ  (14h45 - 15h)
      example: G1
    - name: from
      in: query
      required: true
      schema:
        type: string
      description: Thời gian bắt đầu (timestamp)
      example: "1785727927"
    - name: to
      in: query
      required: true
      schema:
        type: string
      description: Thời gian kết thúc (timestamp) (không vượt quá 1 ngày)
      example: "1785735127"
    - name: limit
      in: query
      schema:
        type: integer
      example: 100
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            description: Danh sách dữ liệu sổ lệnh (Market Depth) cùng thông tin phân trang.
            properties:
              quotes:
                type: array
                description: Danh sách dữ liệu sổ lệnh của mã chứng khoán
                example:
                  - marketId: STO
                    boardId: G1
                    isin: VN000000ACB8
                    symbol: ACB
                    bid:
                      - price: 101
                        quantity: 10
                      - price: 100
                        quantity: 50
                      - price: 99.5
                        quantity: 10
                    offer:
                      - price: 106
                        quantity: 4870
                      - price: 106.1
                        quantity: 500
                      - price: 110
                        quantity: 30
                    totalOfferQtty: 0
                    totalBidQtty: 0
                    time: "2026-08-03 10:59:12.336"
                items:
                  type: object
                  properties:
                    marketId:
                      type: string
                      example: STO
                      description: |-
                        Mã thị trường niêm yết mã chứng khoán
                        - DVX: Phái sinh sàn HNX
                        - HCX: Trái phiếu doanh nghiệp HNX
                        - STO: Cổ phiếu sàn HOSE
                        - STX: Cổ phiếu sàn HNX
                        - UPX: Cổ phiếu sàn Upcom
                    boardId:
                      type: string
                      example: G1
                      description: |-
                        Mã bảng giao dịch
                        - G1: Lô chẵn
                        - G4: Lô lẻ
                        - T1: Thỏa thuận trong giờ (9h - 14h45)
                        - T3: Thỏa thuận sau giờ (14h45 - 15h)
                        - T4: Thỏa thuận lô lẻ trong giờ (9h - 14h45)
                        - T6: Thỏa thuận lô lẻ sau giờ (14h45 - 15h)
                    isin:
                      type: string
                      example: VN000000ACB8
                      description: Mã định danh quốc tế (ISIN) của chứng khoán.
                    symbol:
                      type: string
                      example: ACB
                      description: Mã chứng khoán
                    bid:
                      type: array
                      description: Danh sách các mức giá chào mua
                      example:
                        - price: 101
                          quantity: 10
                      items:
                        type: object
                        properties:
                          price:
                            type: number
                            format: double
                            example: 101
                            description: Giá đặt mua
                          quantity:
                            type: integer
                            format: int32
                            example: 10
                            description: Khối lượng đặt mua tại mức giá tương ứng
                    offer:
                      type: array
                      description: Danh sách các mức giá chào bán
                      example:
                        - price: 106
                          quantity: 4870
                      items:
                        type: object
                        properties:
                          price:
                            type: number
                            format: double
                            example: 106
                            description: Giá đặt bán
                          quantity:
                            type: integer
                            format: int32
                            example: 4870
                            description: Khối lượng đặt bán tại mức giá tương ứng
                    totalOfferQtty:
                      type: integer
                      format: int32
                      example: 0
                      description: Tổng khối lượng dư bán
                    totalBidQtty:
                      type: integer
                      format: int32
                      example: 0
                      description: Tổng khối lượng dư mua
                    time:
                      type: string
                      example: "2026-08-03 10:59:12.336"
                      description: "Thời gian ghi nhận. Định dạng: YYYY-MM-DD HH:mm:ss.SSS (GMT+7)"
              nextPageToken:
                type: string
                example: MTM2NDYxOV8yMDI2LTA1LTI2VDA0OjI3OjQyLjQyNFo=
                description: Token dùng để lấy trang dữ liệu tiếp theo. Không có hoặc rỗng nếu không còn dữ liệu
          example:
            quotes:
              - marketId: STO
                boardId: G1
                isin: VN000000ACB8
                symbol: ACB
                bid:
                  - price: 101
                    quantity: 10
                  - price: 100
                    quantity: 50
                  - price: 99.5
                    quantity: 10
                offer:
                  - price: 106
                    quantity: 4870
                  - price: 106.1
                    quantity: 500
                  - price: 110
                    quantity: 30
                totalOfferQtty: 0
                totalBidQtty: 0
                time: "2026-08-03 10:59:12.336"
              - marketId: STO
                boardId: G1
                isin: VN000000ACB8
                symbol: ACB
                bid:
                  - price: 100
                    quantity: 50
                  - price: 99.5
                    quantity: 10
                offer:
                  - price: 106
                    quantity: 4870
                  - price: 106.1
                    quantity: 500
                  - price: 110
                    quantity: 30
                totalOfferQtty: 0
                totalBidQtty: 0
                time: "2026-08-03 10:58:30.105"
              - marketId: STO
                boardId: G1
                isin: VN000000ACB8
                symbol: ACB
                bid:
                  - price: 100
                    quantity: 50
                offer:
                  - price: 106
                    quantity: 4870
                  - price: 106.1
                    quantity: 500
                  - price: 110
                    quantity: 30
                totalOfferQtty: 0
                totalBidQtty: 0
                time: "2026-08-03 10:49:10.822"
              - marketId: STO
                boardId: G1
                isin: VN000000ACB8
                symbol: ACB
                bid:
                  - price: 100
                    quantity: 50
                offer:
                  - price: 106
                    quantity: 4880
                  - price: 106.1
                    quantity: 500
                  - price: 110
                    quantity: 30
                totalOfferQtty: 0
                totalBidQtty: 0
                time: "2026-08-03 10:39:24.198"
            nextPageToken: MTM2NDYxOV8yMDI2LTA1LTI2VDA0OjI3OjQyLjQyNFo=
    "400":
      $ref: ../../components/responses/BadRequest.yaml
    "500":
      $ref: ../../components/responses/InternalError.yaml
