get:
  operationId: getPriceSymbolQuotes
  tags:
    - market-data
  security:
    - DnseApiKey: []
      DnseAuxDate: []
      DnseSignature: []
  summary: Lịch sử bid/ask
  parameters:
    - name: symbol
      in: path
      required: true
      schema:
        type: string
    - name: boardId
      in: query
      schema:
        $ref: '../../components/schemas/_common/enums/BoardId.yaml'
    - name: from
      in: query
      required: true
      schema:
        type: string
    - name: to
      in: query
      required: true
      schema:
        type: string
    - name: limit
      in: query
      schema:
        type: integer
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
