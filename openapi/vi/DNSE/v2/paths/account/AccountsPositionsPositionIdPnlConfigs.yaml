get:
  operationId: getAccountsPositionsPositionIdPnlConfigs
  tags:
    - Tài khoản
  security:
    - DnseApiKey: []
      DnseAuxDate: []
      DnseSignature: []
  summary: Cấu hình chốt lời, cắt lỗ của vị thế
  parameters:
    - name: positionId
      in: path
      required: true
      schema:
        type: string
    - name: marketType
      in: query
      required: true
      schema:
        type: string
        enum: [STOCK, DERIVATIVE]
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/PnlConfigsPositionResponse.yaml'
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'

post:
  operationId: postAccountsPositionsPositionIdPnlConfigs
  tags:
    - Giao dịch
  security:
    - DnseApiKey: []
      DnseAuxDate: []
      DnseSignature: []
      DnseTradingToken: []
  summary: Cài đặt chốt lời, cắt lỗ cho vị thế
  parameters:
    - name: positionId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            takeProfit:
              $ref: '../../components/schemas/PnlConfig.yaml'
            stopLoss:
              $ref: '../../components/schemas/PnlConfig.yaml'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/PnlConfigsPositionResponse.yaml'
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
