get:
  operationId: getAccountsAccountNoExecutionsOrderId
  tags:
    - Tài khoản
  summary: Chi tiết trạng thái lệnh
  parameters:
    - $ref: ../../components/parameters/XApiKey.yaml
    - $ref: ../../components/parameters/XAuxDate.yaml
    - $ref: ../../components/parameters/XSignature.yaml
    - name: accountNo
      in: path
      required: true
      schema:
        type: string
    - name: orderId
      in: path
      required: true
      schema:
        type: string
    - name: marketType
      in: query
      required: true
      schema:
        type: string
        enum:
          - STOCK
          - DERIVATIVE
      description: "Loại thị trường \n- STOCK: Lệnh cơ sở\n- DERIVATIVE: Lệnh phái sinh\n- BOND: Lệnh trái phiếu"
      example: DERIVATIVE
    - name: orderCategory
      in: query
      schema:
        type: string
        enum:
          - NORMAL
          - CONDITIONAL
      required: true
      description: Phân loại lệnh thường (mặc định NORMAL)
      example: NORMAL
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              id:
                type: integer
                format: int32
                example: 1651
                description: ID lệnh
              side:
                type: string
                example: NB
                description: |-
                  Chiều giao dịch
                  - NB: Mua
                  - NS: Bán
              accountNo:
                type: string
                example: "0001179019"
                description: Số tiểu khoản
              symbol:
                type: string
                example: HPG
                description: Mã chứng khoán
              price:
                type: integer
                format: int32
                example: 24250
                description: Giá đặt lệnh
              quantity:
                type: integer
                format: int32
                example: 500
                description: Khối lượng đặt lệnh
              orderType:
                type: string
                example: LO
                description: |-
                  Loại lệnh
                  - LO: Lệnh giới hạn
                  - MOK/MAK/MTL: Lệnh thị trường
                  - ATO/ATC: Lệnh phiên định kỳ mở cửa/đóng cửa
                  - PLO: Lệnh khớp lệnh sau giờ
              loanPackageId:
                type: integer
                format: int32
                example: 5757
                description: Mã gói vay
              orderCategory:
                type: string
                example: NORMAL
                description: Phân loại lệnh (mặc định NORMAL)
              orderStatus:
                type: string
                example: PartiallyFilled
                description: |-
                  Trạng thái lệnh
                  - Pending/PendingNew: Chờ gửi
                  - New: Chờ khớp
                  - PartiallyFilled: Khớp một phần
                  - Filled: Khớp toàn bộ
                  - Rejected: Bị từ chối
                  - Expired: Hết hạn trong phiên
                  - DoneForDay: Lệnh được giải tỏa do không khớp trong phiên
              fillQuantity:
                type: integer
                format: int32
                example: 200
                description: Khối lượng đã khớp
              lastQuantity:
                type: integer
                format: int32
                example: 100
                description: Khối lượng khớp gần nhất
              lastPrice:
                type: integer
                format: int32
                example: 24250
                description: Giá khớp gần nhất
              averagePrice:
                type: integer
                format: int32
                example: 24250
                description: Giá khớp trung bình
              transDate:
                type: string
                example: "2026-07-13"
                description: Ngày giao dịch
              taxRate:
                type: integer
                format: int32
                example: 0
                description: Tỷ lệ thuế
              exchangeFeeRate:
                type: number
                format: double
                example: 0.00027
                description: Tỷ lệ phí trả Sở giao dịch
              feeRate:
                type: number
                format: double
                example: 0.00027
                description: Tổng tỷ lệ phí của lệnh
              leaveQuantity:
                type: integer
                format: int32
                example: 300
                description: Khối lượng còn lại chưa khớp
              canceledQuantity:
                type: integer
                format: int32
                example: 0
                description: Khối lượng đã hủy
              error:
                type: string
                example: ""
                description: Mã lỗi nếu lệnh bị từ chối
              marketType:
                type: string
