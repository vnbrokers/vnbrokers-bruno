get:
  operationId: getAccountsAccountNoOrdersHistory
  security:
    - DnseApiKey: []
      DnseAuxDate: []
      DnseSignature: []
  summary: Lịch sử lệnh
  parameters:
    - name: marketType
      in: query
      required: true
      description: |-
        Loại thị trường 
        - STOCK: Gói vay giao dịch cơ sở
        - DERIVATIVE: Gói vay giao dịch phái sinh
        - BOND: Giao dịch trái phiếu
      deprecated: false
      schema:
        type: string
      example: STOCK
    - name: from
      in: query
      required: true
      description: |-
        Ngày bắt đầu (yyyy-mm-dd) 
        - Thời gian tra cứu tối đa trong 1 năm tính từ ngày hiện tại
      deprecated: false
      schema:
        type: string
      example: '2026-02-15'
    - name: to
      in: query
      required: true
      description: |-
        Ngày kết thúc (yyyy-mm-dd) 
        - Lớn hơn hoặc bằng ngày bắt đầu và không vượt quá ngày hiện tại
      deprecated: false
      schema:
        type: string
      example: '2026-03-18'
  responses:
    '200':
      description: OK
      headers:
        Content-Length:
          $ref: '../../components/headers/ContentLength.yaml'
        Date:
          $ref: '../../components/headers/Date.yaml'
        Vary:
          $ref: '../../components/headers/Vary.yaml'
        X-Ratelimit-Limit:
          $ref: '../../components/headers/XRateLimitLimit.yaml'
        X-Ratelimit-Remaining:
          $ref: '../../components/headers/XRateLimitRemaining.yaml'
        X-Ratelimit-Reset:
          $ref: '../../components/headers/XRateLimitReset.yaml'
        X-Tyk-Api-Expires:
          deprecated: false
          schema: {}
          example: Thu, 02 Jan 3000 15:04:00 UTC
      content:
        application/json:
          schema:
            type: object
            properties:
              accountNo:
                type: string
                example: '0001179019'
                description: Số tiểu khoản
              fillQuantity:
                type: integer
                format: int32
                example: 0
                description: Tổng khối lượng đã khớp
              total:
                type: integer
                format: int32
                example: 8
                description: Tổng số bản ghi
              start:
                type: integer
                format: int32
                example: 0
                description: Vị trí bắt đầu của tập bản ghi được trả về
              end:
                type: integer
                format: int32
                example: 8
                description: Vị trí kết thúc của tập bản ghi được trả về
              marketType:
                type: string
                example: STOCK
                description: |-
                  Loại thị trường
                  - STOCK: Gói vay giao dịch cơ sở
                  - DERIVATIVE: Gói vay giao dịch phái sinh
              data:
                type: array
                example:
                  - id: '20260312_241'
                    symbol: HPG
                    side: NB
                    orderType: LO
                    orderStatus: Expired
                    price: 27200
                    quantity: 200
                    fillQuantity: 0
                    leaveQuantity: 0
                    canceledQuantity: 200
                    averagePrice: 0
                    loanPackageId: 5765
                    transDate: '2026-03-12'
                    createdDate: '2026-03-17T06:44:18.813804Z'
                    modifiedDate: '2026-03-18T15:28:24.44026Z'
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: '20260312_241'
                      description: ID lệnh trên hệ thống
                    symbol:
                      type: string
                      example: HPG
                      description: Mã chứng khoán
                    side:
                      type: string
                      example: NB
                      description: |-
                        Chiều giao dịch
                        NB: Mua
                        NS: Bán
                    orderType:
                      type: string
                      example: LO
                      description: |-
                        Loại lệnh
                        - LO: Lệnh giới hạn
                        - MOK/MAK/MTL: Lệnh thị trường
                        - ATO/ATC: Lệnh phiên định kỳ mở cửa/đóng cửa
                        - PLO: Lệnh khớp lệnh sau giờ
                    orderStatus:
                      type: string
                      example: Expired
                      description: >-
                        Trạng thái lệnh

                        - Pending/PendingNew: Chờ gửi

                        - New: Chờ khớp

                        - PartiallyFilled: Khớp một phần

                        - Filled: Khớp toàn bộ

                        - Rejected: Bị từ chối

                        - Expired: Hết hạn trong phiên

                        - DoneForDay: Lệnh được giải tỏa do không khớp trong
                        phiên
                    price:
                      type: integer
                      format: int32
                      example: 27200
                      description: Giá đặt
                    quantity:
                      type: integer
                      format: int32
                      example: 200
                      description: Khối lượng đặt
                    fillQuantity:
                      type: integer
                      format: int32
                      example: 0
                      description: Khối lượng đã khớp
                    leaveQuantity:
                      type: integer
                      format: int32
                      example: 0
                      description: Khối lượng còn lại
                    canceledQuantity:
                      type: integer
                      format: int32
                      example: 200
                      description: Khối lượng đã huỷ
                    averagePrice:
                      type: integer
                      format: int32
                      example: 0
                      description: Giá khớp trung bình
                    loanPackageId:
                      type: integer
                      format: int32
                      example: 5765
                      description: ID gói vay
                    transDate:
                      type: string
                      example: '2026-03-12'
                      description: Ngày giao dịch
                    createdDate:
                      type: string
                      format: date-time
                      example: '2026-03-17T06:44:18.813804Z'
                      description: Thời điểm tạo
                    modifiedDate:
                      type: string
                      format: date-time
                      example: '2026-03-18T15:28:24.44026Z'
                      description: Thời điểm cập nhật
                description: Danh sách lệnh giao dịch
          example:
