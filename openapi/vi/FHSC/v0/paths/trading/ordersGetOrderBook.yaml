get:
  operationId: ordersGetOrderBook
  tags:
    - Sổ lệnh
  security:
    - FinhayApiKey: []
      FinhayTimestamp: []
      FinhayNonce: []
      FinhaySignature: []
  summary: Lấy sổ lệnh trong ngày
  description: |
    Sổ lệnh (orderbook) đầy đủ trong ngày (bao gồm cả lệnh từ broker-signal và
    HayBond).
  parameters:
    - $ref: '../../components/parameters/SubAccountId.yaml'
  responses:
    '200':
      description: Trả về `result` mảng các lệnh trong ngày của tiểu khoản; mỗi item là 1 lệnh kèm trạng thái khớp / chờ / huỷ.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/trading/OrderBookResponse.yaml'
          example:
            error_code: '0'
            message: success
            result:
              - custodycd: '0123456'
                txdate: '2024-04-18'
                custid: '123456'
                afacctno: '0001234567'
                orderid: ORD123456
                odorderid: '0001'
                txtime: '09:15:23'
                symbol: VNM
                allowcancel: 'Y'
                allowamend: 'Y'
                side_code: NB
                side: BUY
                price: 72000
                pricetype: LO
                via_code: WEB
                via: Web
                qtty: 100
                execqtty: 0
                execamt: 0
                execprice: 0
                remainqtty: 100
                remainamt: 7200000
                status_code: '01'
                status: SENT
                tlname: Finhay
                username: cuong@finhay
                hosesession: PROGRESS
                cancelqtty: 0
                adjustqtty: 0
                isdisposal: 'N'
                rootorderid: ORD123456
                timetype: '0'
                timetypevalue: ''
                feedbackmsg: ''
                quoteqtty: 0
                limitprice: 72000
                odtimestamp: '2024-04-18T09:15:23'
                matchtype_code: ''
                producttypename: STOCK
                afacctno_ext: '0001234567.01'
                side_: BUY
                via_: Web
                status_: SENT
                matchtype_: ''
                strategy_id: null
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '429':
      $ref: '../../components/responses/RateLimited.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl \
          -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          -H "X-FH-TIMESTAMP: $TIMESTAMP_MS" \
          -H "X-FH-NONCE: $NONCE_UUID" \
          -H "X-FH-SIGNATURE: $SIGNATURE_HEX" \
          "https://open-api.fhsc.com.vn/trading/v1/accounts/$SUB_ACCOUNT_NORMAL/order-book"
