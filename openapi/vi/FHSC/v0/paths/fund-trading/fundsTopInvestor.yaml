get:
  operationId: fundsTopInvestor
  tags:
    - Quỹ mở
  summary: Danh sách quỹ theo số nhà đầu tư
  description: Danh sách quỹ theo số nhà đầu tư đang giữ, phân theo `fund-type`.
  parameters:
    - $ref: "../../components/parameters/FundTypeQuery.yaml"
  responses:
    "200":
      description: Trả về `data` mảng các quỹ kèm số nhà đầu tư, sort giảm dần.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/fund-trading/FundTopInvestorResponse.yaml"
          example:
            error_code: "0"
            message: success
            data:
              - fund_name: VESAF
                month: 2025-04
                investors: 12450
              - fund_name: DCDS
                month: 2025-04
                investors: 9870
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/fund-trading/public/fund-certificates/top-investor?fund-type=STOCK_FUND"
