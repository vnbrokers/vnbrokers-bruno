get:
  operationId: fundsGetAssetAllocation
  tags:
    - Quỹ mở
  summary: Phân bổ tài sản của quỹ (bond / stock / others)
  description: |
    Phân bổ tài sản của 1 quỹ.

    `data` là `null` khi quỹ chưa có record phân bổ.
  parameters:
    - $ref: "../../components/parameters/FundName.yaml"
  responses:
    "200":
      description: Trả về `data` là object 3 field (% bond/stock/others), hoặc `null` khi không có record.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/fund-trading/FundAssetAllocationResponse.yaml"
          example:
            error_code: "0"
            message: success
            data:
              bond: 65
              stock: 30
              others: 5
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/fund-trading/public/fund-certificates/VESAF/asset-allocation"
