get:
  operationId: macroGetMacroData
  tags:
    - Kinh tế vĩ mô
  summary: Dữ liệu vĩ mô
  description: |
    Chỉ số kinh tế vĩ mô của Việt Nam hoặc Mỹ. `type` và `country` là
    bắt buộc.
  parameters:
    - name: type
      in: query
      required: true
      description: Loại chỉ số vĩ mô.
      schema:
        $ref: "../../components/schemas/market/MacroType.yaml"
    - name: country
      in: query
      required: true
      description: Mã quốc gia.
      schema:
        $ref: "../../components/schemas/market/Country.yaml"
    - name: period
      in: query
      required: false
      description: Khoảng thời gian lọc.
      schema:
        $ref: "../../components/schemas/market/Period.yaml"
  responses:
    "200":
      description: Trả về `data` mảng các điểm dữ liệu vĩ mô theo tháng cho `type` + `country` đã chọn.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/market/MacroDataResponse.yaml"
          example:
            error_code: "0"
            message: success
            data:
              - type: CPI
                country: VN
                month: 2024-02
                value: 3.45
                date: "2024-02-29"
              - type: CPI
                country: VN
                month: 2024-03
                value: 3.97
                date: "2024-03-31"
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/market/financial-data/macro?type=CPI&country=VN&period=ONE_YEAR"
