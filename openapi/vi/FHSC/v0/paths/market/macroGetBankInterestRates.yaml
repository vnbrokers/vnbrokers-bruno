get:
  operationId: macroGetBankInterestRates
  tags:
    - Kinh tế vĩ mô
  summary: Lãi suất tiền gửi ngân hàng
  description: |
    Lãi suất tiền gửi tiết kiệm của các ngân hàng tại Việt Nam, phân theo
    kỳ hạn (key dạng `1M`, `3M`, `6M`, `12M`, …). Đơn vị: **% / năm**.

    Object `data` map từ mã ngân hàng (`VCB`, `BIDV`, `ACB`, …) sang object
    chứa `bank_name` và `terms` (kỳ hạn → lãi suất).
  responses:
    '200':
      description: Trả về `data` map từ mã ngân hàng sang object `{ bank_name, terms }`; mỗi `terms` là map kỳ hạn → lãi suất % / năm.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/market/BankInterestRatesResponse.yaml'
          example:
            error_code: '0'
            message: success
            data:
              VCB:
                bank_name: Vietcombank
                terms:
                  1M: 2.4
                  3M: 2.7
                  6M: 3.6
                  12M: 4.6
              BIDV:
                bank_name: BIDV
                terms:
                  1M: 2.2
                  3M: 2.6
                  6M: 3.5
                  12M: 4.5
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '429':
      $ref: '../../components/responses/RateLimited.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/market/financial-data/bank-interest-rates"
