get:
  operationId: aggregatedGetGlobalMarket
  tags:
    - Tổng hợp đa loại
  summary: Lịch sử giá instrument toàn cầu (index / Mag7 / hàng hoá / forex)
  description: |
    Lịch sử giá đóng cửa của 1 instrument toàn cầu, phân loại qua param
    `type`. Cover 4 nhóm asset:

    - **Chỉ số chứng khoán Mỹ**: `SP500`, `DOW_JONES`, `NASDAQ`,
      `RUSSELL2000`, `VIX`, `DXY`.
    - **Chỉ số châu Á**: `KOSPI`, `HANGSENG`, `SHANGHAI`, `NIKKEI`.
    - **Cổ phiếu Mag7**: `APPLE`, `MICROSOFT`, `ALPHABET`, `AMAZON`,
      `META`, `NVIDIA`, `TESLA`.
    - **Hàng hoá**: `GOLD`, `SILVER`, `COPPER`, `CRUDE_OIL`, `BRENT_OIL`,
      `NATURAL_GAS`.
    - **Tỷ giá ngoại hối**: `EURUSD`, `USDJPY`, `GBPUSD`.

    Kết quả sort `date DESC` (mới nhất ở đầu mảng). `limit` mặc định `50`,
    tối đa `500`.
  parameters:
    - name: type
      in: query
      required: true
      description: Mã instrument cần lấy lịch sử.
      schema:
        $ref: '../../components/schemas/market/GlobalMarketDataType.yaml'
    - name: limit
      in: query
      required: false
      description: Số điểm dữ liệu cần lấy (mặc định 50, tối đa 500).
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 500
        example: 50
  responses:
    '200':
      description: Trả về `data` mảng các điểm dữ liệu lịch sử của instrument, sort theo `date` giảm dần.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/market/GlobalMarketDataResponse.yaml'
          example:
            error_code: '0'
            message: success
            data:
              - type: SP500
                country: US
                date: '2026-04-22'
                year: 2026
                month: 4
                value: 5234.18
              - type: SP500
                country: US
                date: '2026-04-21'
                year: 2026
                month: 4
                value: 5210.55
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '429':
      $ref: '../../components/responses/RateLimited.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/market/financial-data/market?type=SP500&limit=50"
