get:
  operationId: corporateGetNews
  tags:
    - Tin tức-sự kiện
  summary: Sự kiện doanh nghiệp-tin tức stock
  description: |
    Sự kiện doanh nghiệp (cổ tức, quyền mua, ngày ĐHCĐ, …) lọc theo mã stock
    và / hoặc khoảng thời gian. `from_date` / `to_date` dùng format
    `DD/MM/YYYY`. Nếu bỏ qua,
    mặc định lấy 12 tháng gần nhất. Trả về `[]` khi không có kết quả.
  parameters:
    - name: stock
      in: query
      required: false
      description: Mã stock đơn lẻ.
      schema:
        type: string
        example: VNM
    - name: stocks
      in: query
      required: false
      description: Danh sách mã stock, phân tách bằng dấu phẩy.
      schema:
        type: string
        example: VNM,VIC,HPG
    - $ref: "../../components/parameters/FromDateNews.yaml"
    - $ref: "../../components/parameters/ToDateNews.yaml"
  responses:
    "200":
      description: Trả về `result` là mảng các sự kiện doanh nghiệp / tin tức stock matching filter; `[]` khi không có kết quả.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/market/StockEventsResponse.yaml"
          example:
            error_code: "0"
            message: success
            result:
              - id: 1001
                path: vnm-co-tuc-2024
                title: "VNM: Chi tra co tuc bang tien"
                stock: VNM
                body: Thong bao chi tra co tuc...
                createdDate: 15/07 - 08:30
                actionDate: 01/08/2024
                gdkhqDate: 20/07/2024
                eventType: CASH_DIVIDEND
                eventTypeName: Cash dividend
                createdAt: "2024-07-15T08:30:00Z"
                updatedAt: "2024-07-15T08:30:00Z"
                url: https://fhsc.com.vn/news/vnm-co-tuc-2024
    "400":
      $ref: "../../components/responses/BadRequest.yaml"
    "401":
      $ref: "../../components/responses/Unauthorized.yaml"
    "429":
      $ref: "../../components/responses/RateLimited.yaml"
    "500":
      $ref: "../../components/responses/InternalError.yaml"
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/market/news?stocks=VNM,VIC&from_date=01/01/2024&to_date=31/12/2024"
