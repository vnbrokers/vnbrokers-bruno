get:
  operationId: commoditiesGetTopTrendingCryptos
  tags:
    - Hàng hoá
  summary: Top crypto đang trending
  description: |
    Top crypto đang trending toàn cầu, kèm giá hiện tại, market cap và % thay
    đổi giá ở các khung thời gian (`1h`, `24h`, `7d`, `30d`) cùng ảnh
    sparkline 30 ngày (`last_30d_chart`).

    Trending được xếp hạng theo dữ liệu CoinMarketCap. Số lượng item phụ
    thuộc nguồn — không có cap cứng từ phía Finhay.
  responses:
    '200':
      description: Trả về `data` mảng top crypto trending kèm price, market cap, % change ở 4 khung thời gian.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/market/CryptosTopTrendingResponse.yaml'
          example:
            error_code: '0'
            message: success
            data:
              - name: Bitcoin
                symbol: BTC
                icon_url: https://cdn.finhay.com/crypto/btc.png
                price: 67500.25
                formatted_price: 67.500,25
                percent_change_1h: 0.5
                percent_change_24h: -1.2
                percent_change_7d: 3.8
                percent_change_30d: 12.5
                market_cap: 1325000000000
                last_30d_chart: https://cdn.finhay.com/spark/btc_30d.svg
              - name: Ethereum
                symbol: ETH
                icon_url: https://cdn.finhay.com/crypto/eth.png
                price: 3450
                formatted_price: 3.450,00
                percent_change_1h: 0.2
                percent_change_24h: -0.8
                percent_change_7d: 2.4
                percent_change_30d: 8.9
                market_cap: 414000000000
                last_30d_chart: https://cdn.finhay.com/spark/eth_30d.svg
    '400':
      $ref: '../../components/responses/BadRequest.yaml'
    '401':
      $ref: '../../components/responses/Unauthorized.yaml'
    '429':
      $ref: '../../components/responses/RateLimited.yaml'
    '500':
      $ref: '../../components/responses/InternalError.yaml'
  x-codeSamples:
    - lang: bash
      label: cURL
      source: |
        curl -H "X-FH-APIKEY: $FINHAY_API_KEY" \
          "https://open-api.fhsc.com.vn/market/financial-data/cryptos/top-trending"
