type: object
description: |
  1 row giá vàng hoặc bạc theo index / nhà cung cấp. Dùng chung cho
  `/market/financial-data/gold`, `/silver`, `/gold-providers` và
  `/metal-providers`.
properties:
  index:
    type: string
    description: Index identifier.
    example: SJC_GOLD
  name:
    type: string
    description: Display name.
    example: Vàng SJC
  short_name:
    type: string
    description: Short display name.
    example: SJC
  buy_value:
    type: number
    description: Buy price.
    example: 92500000
  sell_value:
    type: number
    description: Sell price.
    example: 94500000
  usd_value:
    type: number
    description: USD equivalent value.
  vnd_value:
    type: number
    description: VND value.
  date:
    type: string
    description: Price date.
  provider:
    type: string
    description: Data provider name.
    example: SJC
  provider_icon:
    type:
      - string
      - "null"
    description: Provider icon URL.
  updated_at:
    type: string
    description: Last update timestamp.
  change_percent:
    type: number
    description: Price change percentage.
  buy_value_change_percent:
    type: number
    description: Buy value change percentage.
  sell_value_change_percent:
    type: number
    description: Sell value change percentage.
