type: object
description: 1 điểm dữ liệu lịch sử của instrument toàn cầu (index / Mag7 / commodity / forex).
properties:
  type:
    allOf:
      - $ref: 'GlobalMarketDataType.yaml'
    description: Mã instrument.
  country:
    allOf:
      - $ref: 'GlobalMarketCountry.yaml'
    description: Mã 2 ký tự quốc gia phát hành instrument.
  date:
    type: string
    format: date
    description: Ngày dữ liệu, format `YYYY-MM-DD`.
    example: '2026-04-22'
  year:
    type: integer
    description: Năm tách rời từ `date`.
    example: 2026
  month:
    type: integer
    minimum: 1
    maximum: 12
    description: Tháng tách rời từ `date`.
    example: 4
  value:
    type: number
    description: Giá trị đóng cửa (close price) của instrument tại `date`.
    example: 5234.18
