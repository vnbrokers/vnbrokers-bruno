type: object
description: Các chỉ số và tỷ số tài chính quan trọng của 1 mã stock.
properties:
  pe:
    type:
      - number
      - "null"
    description: Price-to-Earnings ratio.
  pb:
    type:
      - number
      - "null"
    description: Price-to-Book ratio.
  ev_ebitda:
    type:
      - number
      - "null"
    description: EV / EBITDA ratio.
  industry:
    type: object
    description: Industry-average ratios.
