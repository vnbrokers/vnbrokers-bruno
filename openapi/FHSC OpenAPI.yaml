      operationId: getNavBenchmark
      tags:
      - Market
      - Funds
      parameters:
      - name: fund-names
        in: query
        required: true
        schema:
          type: string
          example: VESAF,DCDS
        description: Comma-separated fund short names.
      - name: period
        in: query
        required: false
        schema:
          type: string
          enum:
          - BEGIN_THE_YEAR
          - ONE_MONTH
          - THREE_MONTHS
          - SIX_MONTHS
          - ONE_YEAR
          - THREE_YEARS
          - FIVE_YEARS
          - SEVEN_YEARS
          - TEN_YEARS
          - ALL_TIME
          example: ONE_YEAR
        description: Either `period` OR both `from-month` + `to-month` must be provided.
      - name: from-month
        in: query
        required: false
        schema:
          type: string
          example: 2024-01
        description: Start month (`yyyy-MM`). Required if `period` omitted.
      - name: to-month
        in: query
        required: false
        schema:
          type: string
          example: 2024-12
        description: End month (`yyyy-MM`). Required if `period` omitted.
      responses:
