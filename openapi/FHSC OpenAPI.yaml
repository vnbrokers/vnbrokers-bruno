openapi: 3.0.3
info:
  title: FHSC OpenAPI (Finhay)
  version: 2.0.0
  description: Consolidated OpenAPI v3 document generated from finhay/finhay-skills-hub
servers:
- url: https://open-api.fhsc.com.vn
  description: Default Finhay Open API base URL from finhay.sh
tags:
- name: Market
  description: Market data, price history, news, funds, and financial datasets
- name: Portfolio
  description: Read-only portfolio, balances, holdings, rights, and performance
- name: Trading
  description: Order placement, amendment, cancellation, order book, and market session checks
- name: Helper
  description: Client-support endpoints inferred from finhay.sh for user/account discovery and 2FA session management
security:
- XFHApiKey: []
  XFHUserId: []
  XFHTimestamp: []
  XFHNonce: []
  XFHSignature: []
paths:
  /users/v1/users/me:
    get:
      summary: Get current user profile (minimal inferred shape)
      operationId: getCurrentUser
      tags:
      - Portfolio
      - Helper
      description: Inferred helper endpoint used by finhay.sh infer to resolve USER_ID. The exact backend schema is not formally documented in the repository; this definition captures the fields consumed by the CLI.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCurrentUserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
      security:
      - XFHApiKey: []
        XFHUserId: []
        XFHTimestamp: []
        XFHNonce: []
        XFHSignature: []
      x-inferred-from: 'finhay.sh: CMD_INFER'
  /users/v1/users/{userId}/sub-accounts:
    get:
      summary: List sub-accounts for a user (inferred shape)
      operationId: getUserSubAccounts
      tags:
      - Portfolio
      - Helper
      description: Inferred helper endpoint used by finhay.sh infer to discover SUB_ACCOUNT_* values. The client accepts either result[] or data[] as the array container.
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          example: 123456
        description: User ID previously resolved from /users/v1/users/me
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubAccountsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
      security:
      - XFHApiKey: []
        XFHUserId: []
        XFHTimestamp: []
        XFHNonce: []
        XFHSignature: []
      x-inferred-from: 'finhay.sh: CMD_INFER'
  /auth/v1/openapi/2fa/request:
    post:
      summary: Request a 2FA OTP ticket
      operationId: requestTwoFactorOtp
      tags:
      - Trading
      - Helper
      description: Inferred helper endpoint used by finhay.sh 2fa request and the automatic OTP recovery flow for write-order endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorRequestPayload'
      responses:
        '200':
          description: OTP request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
      security:
      - XFHApiKey: []
        XFHUserId: []
        XFHTimestamp: []
        XFHNonce: []
        XFHSignature: []
        XFHBodyHash: []
      x-inferred-from: 'finhay.sh: CMD_2FA request / _2FA_INTERACTIVE_FLOW'
  /auth/v1/openapi/2fa/verify:
    post:
      summary: Verify an OTP ticket and create a 2FA session
      operationId: verifyTwoFactorOtp
      tags:
      - Trading
      - Helper
      description: Inferred helper endpoint used by finhay.sh 2fa verify and the automatic OTP recovery flow for write-order endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorVerifyPayload'
      responses:
        '200':
          description: 2FA verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorVerifyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
      security:
      - XFHApiKey: []
        XFHUserId: []
        XFHTimestamp: []
        XFHNonce: []
        XFHSignature: []
        XFHBodyHash: []
      x-inferred-from: 'finhay.sh: CMD_2FA verify / _2FA_INTERACTIVE_FLOW'
  /auth/v1/openapi/2fa/revoke:
    post:
      summary: Revoke an active 2FA session
      operationId: revokeTwoFactorSession
      tags:
      - Trading
      - Helper
      description: Inferred helper endpoint used by finhay.sh 2fa revoke. Response shape is permissive because the repository does not document it beyond successful invocation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorRevokePayload'
      responses:
        '200':
          description: 2FA session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorRevokeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
      security:
      - XFHApiKey: []
        XFHUserId: []
        XFHTimestamp: []
        XFHNonce: []
        XFHSignature: []
        XFHBodyHash: []
      x-inferred-from: 'finhay.sh: CMD_2FA revoke'
