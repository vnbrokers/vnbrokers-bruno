components:
  securitySchemes:
    XFHApiKey:
      type: apiKey
      in: header
      name: X-FH-APIKEY
      description: Finhay API key
    XFHUserId:
      type: apiKey
      in: header
      name: X-FH-USER-ID
      description: Finhay user ID; resolved by CLI infer flow
    XFHTimestamp:
      type: apiKey
      in: header
      name: X-FH-TIMESTAMP
      description: Unix timestamp in milliseconds
    XFHNonce:
      type: apiKey
      in: header
      name: X-FH-NONCE
      description: Random nonce used in request signing
    XFHSignature:
      type: apiKey
      in: header
      name: X-FH-SIGNATURE
      description: HMAC-SHA256 signature over timestamp, method, path, and optional body hash
    XFHBodyHash:
      type: apiKey
      in: header
      name: X-FH-BODYHASH
      description: SHA256 hex digest of the JSON request body; required for write operations with a body
    XFH2FAToken:
      type: apiKey
      in: header
      name: X-FH-2FA-TOKEN
      description: Daily OTP-backed 2FA session token required for place/modify/cancel order endpoints
    XFHOpenApiSkillVersion:
      type: apiKey
      in: header
      name: X-FH-OPENAPI-SKILL-VERSION
      description: Optional client skill version metadata header sent by finhay.sh
    XFHOpenApiOS:
      type: apiKey
      in: header
      name: X-FH-OPENAPI-OS
      description: Optional client OS metadata header sent by finhay.sh
    XFHOpenApiAgent:
      type: apiKey
      in: header
      name: X-FH-OPENAPI-AGENT
      description: Optional client agent metadata header sent by finhay.sh
  schemas:
    FinancialAnalysisEntry:
      type: object
      description: 'Financial metrics for one period. Contains `year` always; `quarter` is present only when period=quarterly. All other fields are dynamic metric codes (e.g. pe, roe, eps, pb) with numeric or null values.

        '
      properties:
        year:
          type: integer
          example: 2023
        quarter:
          type: integer
          nullable: true
          description: Present only for quarterly period (1–4)
          example: 2
      additionalProperties:
        type: number
        nullable: true
    FinancialOverview:
      type: object
      properties:
        pe:
          type: number
          nullable: true
          description: Price-to-Earnings ratio
        pb:
          type: number
          nullable: true
          description: Price-to-Book ratio
        ev_ebitda:
          type: number
          nullable: true
          description: EV/EBITDA ratio
        industry:
          type: object
          description: Industry average ratios
          properties:
            pe:
              type: number
              nullable: true
            pb:
              type: number
              nullable: true
            ev_ebitda:
              type: number
              nullable: true
        gross_margin:
          type: number
          nullable: true
          description: Gross profit margin
        roe:
          type: number
          nullable: true
          description: Return on Equity
        eps:
          type: number
          nullable: true
          description: Earnings per Share
        dividend_yield:
          type: number
          nullable: true
        nim:
          type: number
          nullable: true
          description: Net Interest Margin (banks only)
        margin_loan_to_equity_ratio:
          type: number
          nullable: true
          description: Margin loan to equity ratio (securities firms only)
        roa:
          type: number
          nullable: true
          description: Return on Assets
    CryptoCurrency:
      type: object
      properties:
        name:
          type: string
          description: Cryptocurrency name
          example: Bitcoin
        symbol:
          type: string
          description: Cryptocurrency symbol
          example: BTC
        icon_url:
          type: string
          description: Icon URL
          example: https://example.com/btc.png
        price:
          type: number
          description: Current price in USD
          example: 67500.25
        formatted_price:
          type: string
          description: Price formatted in Vietnamese locale
          example: 67.500,25
        percent_change_1h:
          type: number
          description: Price change in the last 1 hour (%)
          example: 0.5
        percent_change_24h:
          type: number
          description: Price change in the last 24 hours (%)
          example: -1.2
        percent_change_7d:
          type: number
          description: Price change in the last 7 days (%)
          example: 3.8
        percent_change_30d:
          type: number
          description: Price change in the last 30 days (%)
          example: 12.5
        market_cap:
          type: number
          description: Market capitalization in USD
          example: 1325000000000
        last_30d_chart:
          type: string
          description: URL or data for 30-day sparkline chart
    EconomicCalendarEvent:
      type: object
      properties:
        id:
          type: integer
          example: 1
        date:
          type: string
          description: Event date in `YYYY-MM-DD` format
          example: '2026-04-25'
        country:
          type: string
          description: Country name
          enum:
          - China
          - Euro Area
          - Japan
          - United States
          - United Kingdom
          - Vietnam
          example: United States
        event:
          type: string
          description: Event name
          example: Fed Interest Rate Decision
        actual:
          type: string
          description: Actual value (empty if not yet released)
          example: 5.50%
        previous:
          type: string
          description: Previous period value
          example: 5.25%
        consensus:
          type: string
          description: Market consensus forecast
          example: 5.50%
        forecast:
          type: string
          description: Analyst forecast
          example: 5.50%
        impact:
          type: integer
          description: Impact level (1 = low, 2 = medium, 3 = high)
          example: 3
        category:
          type: string
          description: Event category
          example: Interest Rate
    FinancialData:
      type: object
      properties:
        financial_type:
          type: string
          description: Type of financial data
          enum:
          - GOLD
          - SILVER
          - CRYPTO
          - BANK_INTEREST_RATE
          - USD_EXCHANGE_RATE
        name:
          type: string
          description: Display name of the financial type
        values:
          type: array
          description: 'Array of financial data values. Shape varies by `financial_type`: single-value types use `FinancialDataSingleValue`, buy/sell types use `FinancialDataBuySellValue`, USD/VND types use `FinancialDataUSDVNDValue`.

            '
          items:
            oneOf:
            - $ref: '#/components/schemas/FinancialDataSingleValue'
            - $ref: '#/components/schemas/FinancialDataBuySellValue'
            - $ref: '#/components/schemas/FinancialDataUSDVNDValue'
        last_updated:
          type: string
          description: ISO timestamp of last update
    FinancialDataSingleValue:
      type: object
      properties:
        name:
          type: string
        value:
          type: number
        change_percent:
          type: number
    FinancialDataBuySellValue:
      type: object
      properties:
        name:
          type: string
        buy_value:
          type: number
        sell_value:
          type: number
        change_percent:
          type: number
    FinancialDataUSDVNDValue:
      type: object
      properties:
        name:
          type: string
        usd_value:
          type: number
        vnd_value:
          type: number
    FinancialMetricValue:
      type: object
      description: One metric value for one period.
      properties:
        symbol:
          type: string
          example: VNM
        metricCode:
          type: string
          description: Metric identifier (e.g. "tongDoanhThu", "lnst")
          example: tongDoanhThu
        metricValue:
          type: number
          example: 12500000000000
        timeType:
          type: string
          description: Period type identifier
          example: annual
        year:
          type: integer
          example: 2023
        quarter:
          type: integer
          description: 0 for annual records
          example: 0
    GrowthBenchmark:
      type: object
      properties:
        fund_name:
          type: string
          example: VESAF
        profit_percent:
          type: number
          example: 18.4
        current_amount:
          type: integer
          description: Projected portfolio value in VND.
          example: 11840000
    NavBenchmark:
      type: object
      properties:
        fund_name:
          type: string
          example: VESAF
        nav_records:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                example: '2024-12-31'
              navpf:
                type: number
                example: 18234.56
              change_percent:
                type: number
                example: 1.24
    FundCompany:
      type: object
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: Công ty Quản lý quỹ Vietcombank
        short_name:
          type: string
          example: VCBF
        image_url:
          type: string
          format: uri
    SuggestedFund:
      type: object
      properties:
        fund_name:
          type: string
          example: DCDS
        criteria:
          type: string
          enum:
          - NET_ASSET_EQUIVALENT
          - GROWTH_EQUIVALENT
          description: 'How the fund was matched:

            - `NET_ASSET_EQUIVALENT`: similar AUM size.

            - `GROWTH_EQUIVALENT`: similar historical growth profile.

            '
    NavHistories:
      type: object
      properties:
        nav_histories:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                example: '2025-04-30'
              nav:
                type: number
                example: 18234.56
              benchmark_value:
                type: number
                description: Benchmark index value on the same date.
                example: 1284.91
        benchmark_name:
          type: string
          description: Benchmark name (e.g. `VN-INDEX` for stock funds).
          example: VN-INDEX
    PortfolioFund:
      type: object
      properties:
        month:
          type: string
          description: Portfolio month
          example: 2024-01
        entries:
          type: array
          description: Portfolio holdings sorted by per_nav descending
          items:
            $ref: '#/components/schemas/PortfolioFundEntry'
        stocks_info:
          type: array
          description: Realtime stock info for the holdings
          items:
            $ref: '#/components/schemas/StockInfoV1'
    PortfolioFundEntry:
      type: object
      properties:
        fund_code:
          type: string
          example: DCDS
        symbol:
          type: string
          example: FPT
        sector:
          type: string
          example: Technology
        per_nav:
          type: number
          description: Percentage of NAV
          example: 8.5
        month:
          type: string
          example: 2024-01
    StockInfoV1:
      type: object
      properties:
        symbol:
          type: string
          example: FPT
        name:
          type: string
          example: CTCP FPT
        exchange:
          type: string
          enum:
          - HOSE
          - HNX
          - UPCOM
        floor:
          type: number
          description: Floor price
        ceiling:
          type: number
          description: Ceiling price
        reference:
          type: number
          description: Reference price
        stock_type:
          type: string
          enum:
          - STOCK
          - ETF
          - BOND
          - CW
          - FUTURES
        price:
          type: number
        price_change:
          type: number
        price_change_percent:
          type: number
        volume:
          type: number
          nullable: true
        total_volume:
          type: number
          nullable: true
    FundCertificate:
      type: object
      properties:
        id:
          type: integer
          example: 21
        name:
          type: string
          example: VESAF
        type:
          type: string
          enum:
          - STOCK_FUND
          - BOND_FUND
          - BALANCE_FUND
        aum:
          type: integer
          description: Assets under management in VND.
          example: 1500000000000
        rating:
          type: number
          example: 4.5
    GlobalNewsPage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/GlobalNewsListItem'
        page_total:
          type: integer
          description: Number of items in the current page
        total:
          type: integer
          description: Total number of matching articles
        current_page:
          type: integer
        next_page:
          type: integer
          nullable: true
        previous_page:
          type: integer
          nullable: true
    GlobalNewsListItem:
      type: object
      properties:
        id:
          type: integer
          description: Article ID (use for detail lookup)
        title:
          type: string
        url:
          type: string
          description: Original article URL
        description:
          type: string
          nullable: true
          description: Short summary of the article
        provider:
          type: string
          nullable: true
          description: News source/provider name
        published_at:
          type: string
          format: date-time
          description: Publication timestamp (ISO 8601)
        category:
          type: string
          enum:
          - forex
          - commodities
          - economic-indicators
          - stock-market
          - cryptocurrency
    GlobalNewsDetail:
      allOf:
      - $ref: '#/components/schemas/GlobalNewsListItem'
      - type: object
        properties:
          content:
            type: string
            nullable: true
            description: Full article body/content
    CommodityIndexData:
      type: object
      properties:
        index:
          type: string
          description: Index identifier
          example: SJC_GOLD
        name:
          type: string
          description: Display name
          example: Vàng SJC
        short_name:
          type: string
          description: Short display name
          example: SJC
        buy_value:
          type: number
          description: Buy price
          example: 92500000
        sell_value:
          type: number
          description: Sell price
          example: 94500000
        usd_value:
          type: number
          description: USD equivalent value
        vnd_value:
          type: number
          description: VND value
        date:
          type: string
          description: Price date
        provider:
          type: string
          description: Data provider name
          example: SJC
        provider_icon:
          type: string
          nullable: true
          description: Provider icon URL
        updated_at:
          type: string
          description: Last update timestamp
        change_percent:
          type: number
          description: Price change percentage
        buy_value_change_percent:
          type: number
          description: Buy value change percentage
        sell_value_change_percent:
          type: number
          description: Sell value change percentage
    IndexRealtime:
      type: object
      properties:
        index:
          type: string
          example: VNINDEX
          description: Index code (echoes the requested `index`).
        indexValue:
          type: number
          example: 1792.6
          description: Current index points value.
        change:
          type: number
          example: 2.07
          description: Point change from reference.
        changePercent:
          type: number
          example: 0.12
          description: Percent change from reference (already in percent units, e.g. 0.12 = 0.12%).
        reference:
          type: number
          example: 1790.53
          description: Reference value — previous session close.
        allQuantity:
          type: integer
          format: int64
          example: 248009131
          description: Total matched volume across the market (shares).
        allValue:
          type: number
          description: Total matched trading value across the market (VND).
        advances:
          type: integer
          description: Number of advancing symbols.
        declines:
          type: integer
          description: Number of declining symbols.
        nochanges:
          type: integer
          description: Number of unchanged symbols.
        ceiling:
          type: integer
          description: Number of symbols at ceiling price.
        floor:
          type: integer
          description: Number of symbols at floor price.
        values:
          type: array
          items:
            type: number
          description: Intraday index point series (index-aligned with times/volumes).
        volumes:
          type: array
          items:
            type: number
          description: Intraday volume series (index-aligned with times/values).
        times:
          type: array
          items:
            type: integer
            format: int64
          description: Intraday timestamp series — Unix ms.
        advancesArr:
          type: array
          items:
            type: integer
          description: Intraday advancing-symbol series. KRX indices only.
        declinesArr:
          type: array
          items:
            type: integer
          description: Intraday declining-symbol series. KRX indices only.
        nochangesArr:
          type: array
          items:
            type: integer
          description: Intraday unchanged-symbol series. KRX indices only.
        ceilings:
          type: array
          items:
            type: integer
          description: Intraday ceiling-count series. KRX indices only.
        floors:
          type: array
          items:
            type: integer
          description: Intraday floor-count series. KRX indices only.
        sessionInExchange:
          type: string
          description: Current trading session state of the exchange.
        name:
