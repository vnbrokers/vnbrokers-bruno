          description: Max quantity cap from the broker
        trade:
          type: integer
          format: int64
          description: 'Number of shares of {symbol} available to SELL. Use for SELL: check trade >= quantity.

            '
        balance:
          type: integer
          format: int64
          description: Account cash balance (VND)
        cash_pending_send:
          type: integer
          format: int64
          description: Cash pending transfer (VND)
        mortgage:
          type: integer
          format: int64
          description: Mortgage value (VND)
        marginrate:
          type: number
          description: Margin rate
        mrratioloan:
          type: number
          nullable: true
          description: Margin ratio loan
    CancelOrderRequest:
      type: object
      required:
      - sub_account
      properties:
        sub_account:
          type: string
          description: Extended sub-account ID (use SUB_ACCOUNT_EXT_ORDER — must end in `.4`)
          example: 120C000008.4
    ExchangeSessionInfo:
      type: object
      properties:
        exchange:
          type: string
          enum:
          - HOSE
          - HNX
          - UPCOM
          - HCX
          description: Exchange code
          example: HOSE
        exchange_session:
          type: string
          enum:
          - OPEN
          - PROGRESS
          - BREAK
          - CLOSED
          - PRE_CLOSED
          - PUT_THROUGH
          - POST_SESSION
          - CA
          description: 'Current session: `OPEN` = ATO (opening auction), `PROGRESS` = continuous matching, `BREAK` = lunch break, `CLOSED` = market closed, `PRE_CLOSED` = ATC (closing auction), `PUT_THROUGH` = put-through session, `POST_SESSION` = HNX post-session, `CA` = periodic auction

            '
        available_order_types:
          type: array
          description: Order types available in the current session
          items:
            type: string
            enum:
            - LO
            - MP
            - ATO
            - ATC
            - MAK
            - MOK
            - MTL
            - PLO
            - FOK
            - FAK
          example:
          - LO
          - MP
          - ATC
    UpdateOrderRequest:
      type: object
      properties:
        quantity:
          type: integer
          format: int64
          minimum: 1
          description: New quantity
        price:
          type: integer
          format: int64
          description: New limit price in VND
    OrderBookEntry:
      properties:
        strategy_id:
          type: string
          nullable: true
          description: Strategy ID if the order is linked to a strategy
        custodycd:
          type: string
        txdate:
          type: string
          description: Transaction date
        custid:
          type: string
        afacctno:
          type: string
          description: Account number
        orderid:
          type: string
          description: Order ID
        odorderid:
          type: string
        txtime:
          type: string
          description: Transaction time
        symbol:
          type: string
          example: VNM
        allowcancel:
          type: string
          description: Whether cancel is allowed
        allowamend:
          type: string
          description: Whether amendment is allowed
        side_code:
          type: string
          description: Side code (raw)
        side:
          type: string
          description: Side display name (BUY/SELL)
        price:
          type: integer
          format: int64
        pricetype:
          type: string
          description: Price type code
        via_code:
          type: string
          description: Order channel code
        via:
          type: string
          description: Order channel name
        qtty:
          type: integer
          format: int64
          description: Order quantity
        execqtty:
          type: integer
          format: int64
          description: Executed quantity
        execamt:
          type: integer
          format: int64
          description: Executed amount
        execprice:
          type: integer
          format: int64
          description: Executed price
        remainqtty:
          type: integer
          format: int64
          description: Remaining quantity
        remainamt:
          type: integer
          format: int64
          description: Remaining amount
        status_code:
          type: string
          description: Status code (raw)
        status:
          type: string
          description: Status display name
        tlname:
          type: string
        username:
          type: string
        hosesession:
          type: string
          description: HOSE session info
        cancelqtty:
          type: integer
          format: int64
        adjustqtty:
          type: integer
          format: int64
        isdisposal:
          type: string
        rootorderid:
          type: string
        timetype:
          type: string
        timetypevalue:
          type: string
        feedbackmsg:
          type: string
          description: Feedback message from exchange
        quoteqtty:
          type: integer
          format: int64
        limitprice:
          type: number
          format: double
        odtimestamp:
          type: string
        matchtype_code:
          type: string
        producttypename:
          type: string
        afacctno_ext:
          type: string
        side_:
          type: string
        via_:
          type: string
        status_:
          type: string
        matchtype_:
          type: string
    CreateOrderRequest:
      type: object
      required:
      - side
      - symbol
      - quantity
      - type
      properties:
        sub_account:
          type: string
          description: Extended sub-account ID (must end in `.4` — the order-execution account)
          example: 120C000008.4
        side:
          type: string
          enum:
          - BUY
          - SELL
          description: Order side
        symbol:
          type: string
          description: Stock symbol (e.g. HPG, VNM, FPT)
          example: HPG
        quantity:
          type: integer
          format: int64
          minimum: 1
          description: Number of shares
          example: 100
        type:
          type: string
          enum:
          - LIMIT
          - MARKET
          description: Order type. Determines which price field to use.
        limit_price:
          type: integer
          format: int64
          nullable: true
          description: Limit price in VND. Set when type=LIMIT, null when type=MARKET.
          example: 25500
        market_price:
          type: string
          nullable: true
          enum:
          - MP
          - ATO
          - ATC
          - MAK
          - MOK
          - MTL
          - PLO
          - FOK
          - FAK
          description: Market price type. Set when type=MARKET, null when type=LIMIT.
        stock_type:
          type: string
          enum:
          - STOCK
          - BOND
          - FUND_CERTIFICATE
          - WARRANT
          - ETF
          description: Securities type. Default STOCK for most orders.
          default: STOCK
    OrderResponse:
      type: object
      properties:
        order_id:
          type: string
          description: Exchange order ID
        account_id:
          type: string
        transaction_date:
          type: string
        symbol:
          type: string
        order_side:
          type: string
          enum:
          - BUY
          - SELL
        order_quantity:
          type: integer
          format: int64
        limit_price:
          type: integer
          format: int64
        market_price:
          type: string
        execute_quantity:
          type: integer
          format: int64
        execute_price:
          type: integer
          format: int64
        order_status:
          type: string
          enum:
          - RECEIVED
          - SENT
          - MATCHED
          - CANCELLED
          - REJECTED
          - FAILED
          description: Initial status after placement (usually RECEIVED or SENT)
        fee_amount:
          type: number
        tax_amount:
          type: number
        execute_amount:
          type: integer
          format: int64
        order_type:
          type: string
          enum:
          - LO
          - MP
          - ATO
          - ATC
          - MAK
          - MOK
          - MTL
          - PLO
          - FOK
          - FAK
        code:
          type: string
          nullable: true
          description: Error code if order was rejected. See error-codes.md.
        rejected_reason:
          type: string
          nullable: true
          description: Human-readable rejection reason
        lot:
          type: string
          enum:
          - EVEN
          - ODD
          description: EVEN = round lot (≥100 shares), ODD = odd lot (1-99 shares)
    StandardError:
      type: object
      properties:
        error_code:
          type: string
          nullable: true
          description: Application-level error code
        message:
          type: string
          nullable: true
          description: Human-readable status or error message
        data:
          nullable: true
        result:
          nullable: true
        status:
          type: integer
          nullable: true
          description: HTTP-like status field used by some endpoints
    ApiSuccessEnvelope:
      type: object
      properties:
        status:
          type: integer
          nullable: true
        error_code:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
      additionalProperties: true
    UserProfileLite:
      type: object
      description: Minimal user profile object inferred from finhay.sh infer flow.
      properties:
        user_id:
          type: integer
          example: 123456
      required:
      - user_id
      additionalProperties: true
    GetCurrentUserResponse:
      type: object
      description: Schema inferred from finhay.sh. The client reads data.user_id from this payload.
      properties:
        status:
          type: integer
          nullable: true
        error_code:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        data:
          $ref: '#/components/schemas/UserProfileLite'
      additionalProperties: true
    SubAccount:
      type: object
      description: Schema inferred from finhay.sh infer flow.
      properties:
        type:
          type: string
          example: normal
          description: Sub-account type; client uppercases this to build env vars such as SUB_ACCOUNT_NORMAL
        id:
          type: string
          example: '0001234567'
        sub_account_ext:
          type: string
          example: 120C000008.4
          description: Extended sub-account ID. Values ending with .4 are treated as the order-execution account by finhay.sh.
      additionalProperties: true
    GetSubAccountsResponse:
      type: object
      description: Schema inferred from finhay.sh. The client accepts either result[] or data[] for the sub-account array.
      properties:
        status:
          type: integer
          nullable: true
        error_code:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        result:
          type: array
          items:
            $ref: '#/components/schemas/SubAccount'
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubAccount'
      additionalProperties: true
    TwoFactorRequestPayload:
      type: object
      required:
      - channel
      properties:
        channel:
          type: string
          enum:
          - EMAIL
          example: EMAIL
    TwoFactorRequestResponse:
      type: object
      description: Schema inferred from finhay.sh; ticket_id and masked_destination are consumed by the client.
      properties:
        ticket_id:
          type: string
          example: 2fa-ticket-abc123
        masked_destination:
          type: string
          example: j***@example.com
        message:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true
      required:
      - ticket_id
      additionalProperties: true
    TwoFactorVerifyPayload:
      type: object
      required:
      - ticket_id
      - otp_code
      properties:
        ticket_id:
          type: string
        otp_code:
          type: string
          example: '123456'
    TwoFactorVerifyResponse:
      type: object
      description: Schema inferred from finhay.sh; session_token, expires_at, and expires_at_epoch are consumed by the client.
      properties:
        session_token:
          type: string
          example: eyJhbGciOi...
        expires_at:
          type: string
          format: date-time
          example: '2026-06-22T17:00:00Z'
        expires_at_epoch:
          type: integer
          description: Unix epoch seconds
        message:
          type: string
          nullable: true
        error_code:
          type: string
          nullable: true
      required:
      - session_token
      additionalProperties: true
    TwoFactorRevokePayload:
      type: object
      required:
      - session_token
      properties:
        session_token:
          type: string
    TwoFactorRevokeResponse:
      type: object
      description: Schema is not explicitly documented in the repository; represented as a permissive success envelope inferred from CLI usage.
      properties:
        status:
          type: integer
          nullable: true
        error_code:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
      additionalProperties: true
  responses:
    UnauthorizedError:
      description: Authentication failed or credentials/signature invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    ForbiddenError:
      description: Forbidden. For trading writes this may indicate OTP session required/expired/invalid/revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    RateLimitedError:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
  parameters:
    CacheControl:
      name: cache-control
      in: query
      required: false
      description: Cache control policy
      schema:
        type: string
        enum:
        - CACHE
        - NOCACHE
  headers: {}
externalDocs:
  description: Source repository
  url: https://github.com/vnbrokers/finhay-skills-hub
