info:
  name: Giao dịch bán chưa thanh toán
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v2/cash/unsettleSoldTransaction"
  params:
    - name: account
      value: "{{account}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "message": {
                "type": "string"
              },
              "status": {
                "type": "number"
              },
              "data": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "account": {
                      "type": "string"
                    },
                    "transactionID": {
                      "type": "string"
                    },
                    "amount": {
                      "type": "number"
                    },
                    "settleDate": {
                      "type": "string"
                    },
                    "instrumentID": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### GET  unsettleSoldTransaction

  ```
  https://fc-tradeapi.ssi.com.vn/api/v2/cash/unsettleSoldTransaction
  ```

  Trả danh sách giao dịch chưa thanh toán (tiền chưa về tài khoản)

  **Thông tin chi tiết**

  #### Input

  | Dữ liệu | Kiểu | Bắt buộc | Mô tả |
  | --- | --- | --- | --- |
  | account | string | Yes | Số tài khoản nguồn truy vấn |
  | settleDate | string | No | Ngày tất toánĐịnh dạng: dd/mm/yyyy |

  #### Output

  | Dữ liệu | Kiểu | Mô tả |
  | --- | --- | --- |
  | message | string | Mô tả msg call API |
  | status | number | Trạng thái |
  | data | list | Thông tn dữ liệu trả ra |
  | account | string | Số tài khoản |
  | unsettledSoldTransactions | list | Danh sách đã bán chưa xử lý |
  | tradeDate | string | Ngày bán Chứng khoán |
  | instrumentID | string | Mã chứng khoán |
  | netSellValue | number | Tiền bán khớp (đã trừ phí thuế) |
  | quantity | number | Khối lượng |
  | price | number | Giá khớp |

  **Ví dụ**

  ```json
  Input:
  {
    account: "8888881",
    settleDate: "10/03/2023"
  }
  Output:
  {
      "message": "Success",
      "status": 200,
      "data": {
          "account": "8888881",
          "unsettledSoldTransactions": [
              {
                  "tradeDate": "08/03/2023",
                  "instrumentID": "SSI",
                  "quantity": 100,
                  "price": 0.0,
                  "netSellValue": 1990000.0
              },
              {
                  "tradeDate": "08/03/2023",
                  "instrumentID": "SSI",
                  "quantity": 100,
                  "price": 0.0,
                  "netSellValue": 1990000.0
              },
              {
                  "tradeDate": "08/03/2023",
                  "instrumentID": "SSI",
                  "quantity": 100,
                  "price": 0.0,
                  "netSellValue": 117410.0
              }
          ]
      }
  }
  ```

