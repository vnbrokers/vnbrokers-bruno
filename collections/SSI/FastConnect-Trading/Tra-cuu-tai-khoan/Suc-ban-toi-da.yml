info:
  name: Sức bán tối đa
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/v2/Trading/maxSellQty"
  params:
    - name: account
      value: "{{account}}"
      type: query
    - name: instrumentID
      value: "{{instrumentID}}"
      type: query
    - name: price
      value: "{{price}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: instrumentID
      value: SSI
    - name: price
      value: "25000"

  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "message": {
                "type": "string"
              },
              "status": {
                "type": "number"
              },
              "data": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "account": {
                      "type": "string"
                    },
                    "maxSellQty": {
                      "type": "number"
                    }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### GET  maxSellQty

  ```
  https://fc-tradeapi.ssi.com.vn/api/v2/Trading/maxSellQty
  ```

  Truy vấn số lượng bán tối đa, sử dụng cho cả tài khoản cơ sở và phái sinh.

  **Thông tin chi tiết**

  #### Input

  | Dữ liệu | Kiểu | Bắt buộc | Mô tả |
  | --- | --- | --- | --- |
  | account | string | Yes | Số tài khoản muốn truy vấn bao gồm Cơ sở và Phái sinh |
  | instrumentID | string | Yes | Mã chứng khoán |
  | price | number | Yes | Giá |

  #### Output

  | Dữ liệu | Kiểu | Mô tả |
  | --- | --- | --- |
  | message | string | Thông báo trả ra khi call api |
  | status | number | Trạng thái |
  | data | list | List data |
  | account | string | Số tài khoản |
  | maxSellQty | number | Khối lượng bán tối đa |

  **Ví dụ**

  ```json
  Input:
  {
  account: "0041691",
  intrumentID: “SSI”
  }
  Output:
  {
      "message": "Success",
      "status": 200,
      "data": {
          "account": "0041691",
          "maxSellQty": 2000
      }
  }
  ```

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/Trading/maxSellQty"
