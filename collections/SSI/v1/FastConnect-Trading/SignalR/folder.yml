    ## 3. Order Match Event

    Thông tin Streaming gồm những trường sau:

    | #  | Tên trường   | Kiểu dữ liệu | Mô tả                         |
    |----|--------------|--------------|-------------------------------|
    | 1  | type         | string       | Tên event: orderMatchEvent    |
    | 2  | data         |              | Thông tin khớp lệnh           |
    | 3  | orderID      | string       | Thông tin orderID             |
    | 4  | instrumentID | string       | Mã chứng khoán                |
    | 5  | ipAddress    | string       | IP xác định từ yêu cầu Client |
    | 6  | uniqueID     |  string      |                               |
    | 7  | notifyid     | string       |                               |
    | 8  | buySell      | string       |                               |
    | 9  | matchPrice   | number       |  giá khớp                     |
    | 10 | matchQty     | number       |  khối lượng khớp              |
    | 11 | prefix       | string       |                               |
    | 12 | account      | string       |  Số tài khoản                 |
    | 13 | matchTime    | string       |  Thời gian khớp               |

    Ví dụ:

    ```json
    {
      "type": "orderMatchEvent",
      "data": {
        "orderID": "16201867",
        "notifyID": 101180,
        "instrumentID": "BVS",
        "uniqueID": "24194396",
        "buySell": "B",
        "matchPrice": 1000,
        "ipAddress": "10.48.41.16",
        "matchQty": 100,
        "prefix": "t4c",
        "account": "1184411",
        "matchTime": "1656665019000"
      }
    }
    ```

    ## 4. Vị thế phái sinh

    Thông tin streaming vị thế phái sinh bao gồm vị thế mở và vị thế đã đóng trong ngày. 

    | #  | Tên trường   | Kiểu dữ liệu | Mô tả                                |
    |----|--------------|--------------|--------------------------------------|
    | 1  | type         | string       | Tên event: clientPortfolioEvent      |
    | 2  | uniqueid     | string       |                                      |
    | 3  | connectionid | string       |                                      |
    | 4  | ipaddress    | string       | IP được xác định từ yêu cầu Client   |
    | 5  | notifyid     | string       |                                      |
    | 6  | account      |  string      | Số tài khoản                         |
    | 7  | marketid     | string       | Thị trường- VNFE: Phái sinh          |
    | 8  | instrumentid | string       | Mã chứng khoán                       |
    | 9  | longqty      | number       | Vị thế long                          |
    | 10 | shortqty     | number       | Vị thế short                         |
    | 11 | Net          | number       | Vị thế net (Tính bằng long - short). |
    | 12 | bidavgprice  | number       | Giá mua trung bình                   |
    | 13 | askavgprice  | number       | Giá bán trung bình                   |
    | 14 | tradeprice   | number       | Giá khớp                             |
    | 15 | marketprice  | number       | Giá thị trường                       |
    | 16 | floatingpl   | number       | Lãi/ Lỗ tạm tính                     |
    | 17 | tradingpl    | number       | Lãi/ Lỗ đã chốt                      |

    Ví dụ:

    ```json
    {
      "type": "clientPortfolioEvent",
      "data": {
        "account": "0901358",
        "notifyID": 27,
        "data": null,
        "clientPortfoliosOpen": [
          {
            "martketID": "VNFE",
            "instrumentID": "VN30F2106",
            "longQty": 9,
            "shortQty": 0,
            "net": 9,
            "bidAvgPrice": 1402.4000244140625,
            "askAvgPrice": 0,
            "tradePrice": 0,
            "marketPrice": 873,
            "floatingPL": -476460000,
            "tradingPL": 0
          },
          {
            "martketID": "VNFE",
            "instrumentID": "VN30F2107",
            "longQty": 2,
            "shortQty": 0,
            "net": 2,
            "bidAvgPrice": 830,
            "askAvgPrice": 0,
            "tradePrice": 0,
            "marketPrice": 830,
