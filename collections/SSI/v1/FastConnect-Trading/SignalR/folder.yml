    ## 5. FCO Event

    Thông tin streaming trạng thái lệnh điều kiện 

    | #  | Tên trường        | Kiểu dữ liệu | Mô tả                                                                                                                                   |
    |----|-------------------|--------------|-----------------------------------------------------------------------------------------------------------------------------------------|
    | 1  | type              | string       | Type of event: “fcoEvent”                                                                                                               |
    | 2  |  data             | json         | Thông tin chi tiết của event                                                                                                            |
    | 3  |  fcoId            | string       | Id lệnh điều kiện                                                                                                                       |
    | 4  |  processStatus    |              | Trạng thái lệnh điều kiện                                                                                                               |
    | 5  |  matchedQuantity  | number       | Khối lượng đã khớp                                                                                                                      |
    | 6  |  isPlaceOrder     | boolean      | Trạng thái phát sinh lệnh con: true: Có lệnh thực phát sinh (xuất hiện lệnh ở Orderbook); false: Chưa có Lệnh thực phát sinh            |
    | 7  |  instrumentID     | string       | Mã chứng khoán. Mã chứng khoán, đối với mã phái sinh thì truyền theo mã 1M, 2M, 1Q, 2Q, VN30FYYMM ( Mã tổng quát và chi tiết phái sinh) |
    | 8  |  quantity         | number       | Khối lượng muốn đặt lệnh                                                                                                                |
    | 9  |  price            | string       | Giá đặt (đơn vị đồng): 23500/MP/MOK/MTL                                                                                                 |
    | 10 |  account          |  string      | Tiểu khoản muốn đặt lệnh: ví dụ tài khoản đuôi 8 đuôi 6                                                                                 |
    | 11 |  updatedTime      |  string      | Ngày bắt đầu thực hiên lệnh, định dạng YYYY/MM/DDThh:mm:ss. Nếu không truyền thì tính từ lúc tạo thành công                             |
    | 12 |  status           |  string      | Tham chiếu bảng mã lỗi                                                                                                                  |
    | 13 |  message          |  string      | Thông báo lỗi                                                                                                                           |
    | 14 |  username         |  string      | ID người dùng tại SSI                                                                                                                   |

    Ví dụ:

    ```json
    {
      "type": "fcoEvent",
      "data": {
        "fcoId": "7528ac20-a340-4233-8bb7-a2379fc3c638",
        "notifyID": 1249008,
        "processStatus": "INIT",
        "matchedQuantity": 0,
        "isPlaceOrder": false,    
        "instrumentID": "ssi",
        "quantity": 4000,
        "price": "MP",
        "account": "1231496",
        "updatedTime": "1751966448000",
        "status": "200",
        "message": "Success",
        "username": "123149"
      }
    }
    ```
  type: text/markdown
