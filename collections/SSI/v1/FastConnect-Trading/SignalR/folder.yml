    ## 2. OrderError

    Khi yêu cầu đặt/hủy/sửa bị lỗi, hệ thống sẽ cập nhật qua streaming các thông tin như sau:

    | #  | Tên trường     | Kiểu dữ liệu | Mô tả                                                                                                                     |
    |----|----------------|--------------|---------------------------------------------------------------------------------------------------------------------------|
    | 1  | type           | string       | Tên event: orderError                                                                                                     |
    | 2  | data           |              | Thông tin dữ liệu                                                                                                         |
    | 3  | Detail of data |              |                                                                                                                           |
    | 4  | uniqueid       | string       |                                                                                                                           |
    | 5  | ipaddress      | string       |                                                                                                                           |
    | 6  | notifyID       | string       |                                                                                                                           |
    | 7  | errorCode      | string       | Mã code lỗi trả ra                                                                                                        |
    | 8  | message        | string       | Thông tin lệnh lỗi                                                                                                        |
    | 9  | orderID        | string       | Số hiệu lệnh                                                                                                              |
    | 10 | instrumentID   | string       | Mã CK                                                                                                                     |
    | 11 | buySell        | string       | Chiều mua/ bánB: BuyS: Sell                                                                                               |
    | 12 |                |              |                                                                                                                           |
    | 13 | prefix         | string       |                                                                                                                           |
    | 14 | orderType      | string       | Loại lệnh: LO|ATO|ATC|MP|MTL|MOK|MAK|PLO                                                                                  |
    | 15 | price          | number       | Giá                                                                                                                       |
    | 16 | quantity       | number       | Khối lượng                                                                                                                |
    | 17 | marketID       | string       | Sàn                                                                                                                       |
    | 18 | origOrderID    | string       |                                                                                                                           |
    | 19 | account        | string       | Số tài khoản                                                                                                              |
    | 20 | channel        | string       | Kênh                                                                                                                      |
    | 21 | inputTime      | string       | Thời gian nhận                                                                                                            |
    | 22 | modifiedTime   | string       | Thời gian sửa lệnh                                                                                                        |
    | 23 | isForceSell    | Boolean      | Luôn = F                                                                                                                  |
    | 24 | isShortSell    | Boolean      | Luôn = F                                                                                                                  |
    | 25 | origRequestID  | string       |                                                                                                                           |
    | 26 | stopOrder      | string       | True hoặc False                                                                                                           |
    | 27 | stopPrice      | number       |                                                                                                                           |
    | 28 | stopType       | string       | Loại điều kiện. Bắt buộc nhập nếu stopType = true- D: Down- U: Up- V: Trailling Up- E: Trailing Down- O: OCO- B: BullBear |
    | 29 | stopStep       | number       |                                                                                                                           |
    | 30 | profitPrice    | number       |                                                                                                                           |
    | 31 | modifiable     | string       |                                                                                                                           |
    | 32 | note           | string       | Ghi chú                                                                                                                   |

    Ví dụ:

    ```json
    {
      "type": "orderError",
      "data": {
        "message": "This channel has been block; disallow to place order ",
        "notifyID": 0,
        "errorCode": "ORD015",
        "uniqueID": "6163422",
        "orderID": "T20230504w3806163422",
        "instrumentID": "SSI",
        "ipAddress": "10.255.241.47",
        "buySell": "B",
        "prefix": "w38",
        "orderType": "LO",
        "price": 19600,
        "quantity": 200,
        "marketID": "VN",
