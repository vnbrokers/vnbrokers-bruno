    # Dữ liệu streaming

    ## 1. Order Event

    Thông tin streaming cập nhật trạng thái lệnh về đặt/ hủy/ sửa lệnh bao gồm những thông tin sau:

    | #  | Tên trường    | Kiểu dữ liệu | Mô tả                                                                                                                                                                                                                                                                                       |
    |----|---------------|--------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
    | 1  | type          | string       | Tên event: orderEvent                                                                                                                                                                                                                                                                       |
    | 2  | uniqueID      | string       |                                                                                                                                                                                                                                                                                             |
    | 3  | prefix        | string       |                                                                                                                                                                                                                                                                                             |
    | 4  | ipAddress     | string       | Được xác định yêu cầu từ Client                                                                                                                                                                                                                                                             |
    | 5  | notifyID      | string       | Số serrial của msg                                                                                                                                                                                                                                                                          |
    | 6  | orderID       | string       |                                                                                                                                                                                                                                                                                             |
    | 7  | instrumentID  | string       | Mã chứng khoán                                                                                                                                                                                                                                                                              |
    | 8  | buySell       | string       | buy (B): mua/Sell (S): bán đã đặt theo orderID của lệnhB: BuyS: Sell                                                                                                                                                                                                                        |
    | 9  | orderType     | string       | Loại lệnh: LO|ATO|ATC|MP|MTL|MOK|MAK|PLO                                                                                                                                                                                                                                                    |
    | 10 | price         | number       | Giá                                                                                                                                                                                                                                                                                         |
    | 11 | quantity      | number       | Khối lượng                                                                                                                                                                                                                                                                                  |
    | 12 | marketID      | string       | Sàn: VN: thị trường cơ sởVNFE: thị trường phái sinh                                                                                                                                                                                                                                         |
    | 13 | origRequestID | string       |                                                                                                                                                                                                                                                                                             |
    | 14 | account       | string       | Số tài khoản                                                                                                                                                                                                                                                                                |
    | 15 | cancelQty     | number       | Tổng khối lượng đã hủy                                                                                                                                                                                                                                                                      |
    | 16 | osqty         | number       | Tổng khối lượng chưa khớp                                                                                                                                                                                                                                                                   |
    | 17 | filledQty     | number       | Tổng khối lượng khớp                                                                                                                                                                                                                                                                        |
    | 18 | avgPrice      | number       | Giá trung bình                                                                                                                                                                                                                                                                              |
    | 19 | channel       | string       | Kênh đặt lệnh                                                                                                                                                                                                                                                                               |
    | 20 | inputTime     | string       | Unixtime                                                                                                                                                                                                                                                                                    |
    | 21 | modifiedTime  | string       | Unixtime                                                                                                                                                                                                                                                                                    |
    | 22 | isForceSell   | Boolean      |                                                                                                                                                                                                                                                                                             |
    | 23 | orderStatus   | Boolean      | Trạng thái lệnh:WA: Chờ duyệt RS: Chờ gửi SD: Đã gửi QU: Chờ khớp FF: Đã khớp PF: Khớp 1 phần FFPC: Khớp 1 phần hủy phần còn lại WM: Chờ sửa WC: Chờ hủy CL: Đã hủy RJ: Từ chối EX: Hết hiệu lực SOR: Chờ kích hoạt SOS: Đã kích hoạt IAV: Lệnh trước phiên SOI: Lệnh điều kiện trước phiên |
    | 24 | origOrderID   | string       |                                                                                                                                                                                                                                                                                             |
    | 25 | rejectReason  | string       |                                                                                                                                                                                                                                                                                             |
    | 26 | stopOrder     | string       | Loại lệnh: True: Đối với lệnh điều kiện False: Đối với lệnh thường                                                                                                                                                                                                                          |
    | 27 | stopType      | string       | Loại điều kiện. Bắt buộc nhập nếu stopType = true- D: Down- U: Up- V: Trailling Up- E: Trailing Down- O: OCO- B: BullBear                                                                                                                                                                   |
    | 28 | stopStep      | number       |                                                                                                                                                                                                                                                                                             |
    | 29 | stopPrice     | number       |                                                                                                                                                                                                                                                                                             |
    | 30 | profitPrice   | number       |                                                                                                                                                                                                                                                                                             |


    Ví dụ:

    *Streaming đặt lệnh thành công*

