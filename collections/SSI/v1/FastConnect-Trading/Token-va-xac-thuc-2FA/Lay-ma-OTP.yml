info:
  name: Lấy mã OTP
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v2/Trading/GetOTP"
  body:
    type: json
    data: |-
      {
        "consumerID": "{{consumerID}}",
        "consumerSecret": "{{consumerSecret}}"
      }

runtime:
  variables:
    - name: baseUrl
      value: https://fc-tradeapi.ssi.com.vn

  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "message": {
                "type": "string"
              },
              "status": {
                "type": "number"
              },
              "data": {
                "type": "null"
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### POST  GetOTP

  ```
  https://fc-tradeapi.ssi.com.vn/api/v2/Trading/GetOTP
  ```

  Dùng để lấy mã OTP nếu tài khoản đã đăng ký sử dụng SMS OTP và Email OTP.

  >
  Nếu lấy OTP quá 5 lần mà không xác thực thì dịch vụ OTP sẽ bị tạm khóa.

  **Thông tin chi tiết**

  #### Input

  | Dữ liệu | Kiểu | Bắt buộc | Mô tả |
  | --- | --- | --- | --- |
  | consumerID | string | Yes | ConsumerID trong thông tin kết nối |
  | consumerSecret | string | Yes | ConsumerSecret trong thông tin kết nối |

  #### Output

  | Dữ liệu | Kiểu | Mô tả |
  | --- | --- | --- |
  | message | string | Thông báo trả ra khi call api |
  | status | number | Trạng thái |

  **Ví dụ**

  * Trường hợp thành công

  ```json
  Input:
  {
    "consumerID": "968d7b5940f5437583021aea2b038f35",
    "consumerSecret": "11ab3fc6af954c59ba646fac016f30cb"
  }
  Output:
  {
      message: "Success",
      status: 200
  }
  ```

  * Trường hợp lỗi

  ```json
  Input:
  {
    "consumerID": "968d7b5940f5437583021aea2b038f351",
    "consumerSecret": "11ab3fc6af954c59ba646fac016f30cb"
  }
  Output:
  {
    "message": "ConsumerID is invalid",
    "status": 400
  }
  ```

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/Trading/GetOTP"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "consumerID": "38f5fdfa56b44d5ab8b95895eb588e99",
            "consumerSecret": "6d61bffefc6540fc837c71afd2ca****"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": null
          }
