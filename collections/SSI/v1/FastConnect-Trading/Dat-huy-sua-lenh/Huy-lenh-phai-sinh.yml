                "type": "object",
                "properties": {
                  "requestID": {
                    "type": "string"
                  },
                  "requestData": {
                    "type": "object",
                    "properties": {
                      "orderID": {
                        "type": "string"
                      },
                      "account": {
                        "type": "string"
                      },
                      "marketID": {
                        "type": "string"
                      },
