info:
  name: Dữ liệu OHLCV
  type: websocket
  seq: 6

websocket:
  url: "{{wsFcDataHubBaseUrl}}/v2.0/signalr/connect?transport=webSockets&clientProtocol=2.0&connectionToken={{connectionToken}}&connectionData={{connectionData}}&tid=10"
  message:
    type: json
    data: |-
      {
        "H": "FcMarketDataV2Hub",
        "M": "SwitchChannels",
        "A": [
          "B:All"
        ],
        "I": 1
      }
  auth: inherit

settings:
  timeout: 0
  keepAliveInterval: 0

docs: |-
  ### Dữ liệu OHLCV

  Rtype B sẽ trả ra thông tin open, high, low, close, volume của các mã chứng khoán/chỉ số theo tick.&#x20;

  B:\<Mã ck hoặc mã chỉ số>

  **Lưu ý:** Các mã CK/chỉ số được ngăn cách nhau bởi dấu "-". Hoặc có thể nhập ALL để lấy thông tin OHLCV realtime của tất cả các mã.&#x20;

  **Ví dụ:** B:SSI; B:SSI-VN30 hoặc B:ALL

  | # | Tên trường | Kiểu dữ liệu | Mô tả |
  |---|---|---|---|
  | 1 | Rtype | string | Có giá trị là B |
  | 2 | TradingDate | string | Ngày giao dịch dd/mm/yyyy |
  | 3 | Time | string | Thời gian giao dịch hh:MM:ss |
  | 4 | Symbol | string | Mã chứng khoán/chỉ số |
  | 5 | Open | number | Giá mở cửa |
  | 6 | High | number | Giá cao nhất |
  | 7 | Low | number | Giá thấp nhất |
  | 8 | Close | number | Giá đóng cửa |
  | 9 | Volume | number | Khối lượng khớp gần nhất |
  | 10 | Value | number | Giá trị khớp gần nhất. Tạm thời để bằng 0 |

  **Ví dụ**

  ```json
  Input: 
  B:X26
  Output:
  {"Datatype": 'B',
   "Content": '{
   "RType":"B",
   "Symbol":"X26",
   "TradingDate":"14/08/2023",
   "Time":"14:28:33",
   "Open":16000,
   "High":16000,
   "Low":16000,
   "Close":16000,
   "Volume":5000,
   "Value":0}' 
   }
  ```
