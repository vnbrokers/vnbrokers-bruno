info:
  name: Sức bán tối đa
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/v2/Trading/maxSellQty"
  params:
    - name: account
      value: "{{account}}"
      type: query
    - name: instrumentID
      value: "{{instrumentID}}"
      type: query
    - name: price
      value: "{{price}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
