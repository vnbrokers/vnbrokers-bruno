http:
  method: GET
  url: "{{baseUrl}}/api/v2/Trading/derivPosition"
  params:
    - name: account
      value: "{{account}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

