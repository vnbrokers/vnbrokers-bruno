info:
  name: Lịch sử lệnh
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/v2/Trading/orderHistory"
  params:
    - name: account
      value: "{{account}}"
      type: query
    - name: startDate
      value: "{{startDate}}"
      type: query
    - name: endDate
      value: "{{endDate}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: startDate
      value: 01/01/2026
    - name: endDate
      value: 31/01/2026

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/Trading/orderHistory"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "orderHistories": [
                {
                  "uniqueID": "10000001",
                  "orderID": "12658867",
                  "buySell": "B",
                  "price": 1410,
                  "quantity": 2,
                  "filledQty": "2",
