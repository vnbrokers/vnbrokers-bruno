info:
  name: Sức mua tối đa
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/v2/Trading/maxBuyQty"
  params:
    - name: account
      value: "{{account}}"
      type: query
    - name: instrumentID
      value: "{{instrumentID}}"
      type: query
    - name: price
      value: "{{price}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: instrumentID
      value: SSI
    - name: price
      value: "20000"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### GET  maxBuyQty

  ```
  https://fc-tradeapi.ssi.com.vn/api/v2/Trading/maxBuyQty
  ```

  Truy vấn số lượng mua tối đa, sử dụng cho cả tài khoản cơ sở và phái sinh.

  **Thông tin chi tiết**

  #### Input

  | Dữ liệu | Kiểu | Bắt buộc | Mô tả |
  | --- | --- | --- | --- |
  | account | string | Yes | Số tài khoản muốn truy vấn bao gồm Cơ sở và Phái sinh |
  | instrumentID | string | Yes | Mã chứng khoán |
  | price | number | Yes | Giá |

  #### Output

  | Dữ liệu | Kiểu | Mô tả |
  | --- | --- | --- |
  | message | string | Thông báo trả ra khi call api |
  | status | number | Trạng thái |
  | data | list | List data |
  | account | string | Số tài khoản |
  | maxbuyqty | number | Khối lượng mua tối đa |
  | marginRatio | number | tỷ lệ Margin |
  | purchasingPower | number | Sức mua |
  | origMarginRatio | number | Tỷ lệ ký quỹ ban đầu |

  **Ví dụ**

  ```json
  Input:
  {
  account: "0041691",
  instrumentD: “SSI”,
  price:17
  }
  Output:
  {
      message: "Success",
      status: 200,
      data: {
          account: "0041691",
          maxBuyQty: 8241440,
          marginRatio: "50%",
          purchasingPower: 99292902171
      }
  }
  ```

examples:
