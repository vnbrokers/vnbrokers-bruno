info:
  name: Lịch sử cập nhật lệnh
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v2/Trading/auditOrderBook"
  params:
    - name: account
      value: "{{account}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
