info:
  name: Đặt lệnh phái sinh
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v2/Trading/derNewOrder"
  body:
    type: json
    data: |-
      {
        "account": "{{account}}",
        "instrumentID": "{{instrumentID}}",
        "market": "VNFE",
        "buySell": "{{buySell}}",
        "orderType": "{{orderType}}",
        "price": {{price}},
        "quantity": {{quantity}},
        "requestID": "{{requestID}}",
        "channelID": "TA",
      "deviceId": "{{deviceId}}"

      }
  auth: inherit

runtime:
  variables:
    - name: account
      value: "{{account_8}}"
    - name: instrumentID
      value: 41I1G5000
    - name: buySell
      value: S
    - name: orderType
      value: LO
    - name: price
      value: "2197.0"
    - name: quantity
      value: "1"
    - name: requestID
      value: "{{requestID}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/Trading/derNewOrder"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "account": "0901358",
            "instrumentID": "SSI",
            "marketID": "VNFE",
            "buySell": "B",
            "orderType": "LO",
            "price": 28600,
            "quantity": 100,
            "requestID": "93235974",
            "code": "123456789"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "requestID": "93235974",
              "requestData": {
                "instrumentID": "VN30F2306",
                "marketID": "VNFE",
                "buySell": "B",
                "orderType": "LO",
                "price": 1410,
                "quantity": 2,
                "account": "0901358"
              }
            }
          }
