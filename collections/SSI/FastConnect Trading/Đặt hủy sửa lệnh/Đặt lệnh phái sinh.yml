info:
  name: Đặt lệnh phái sinh
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v2/Trading/derNewOrder"
  body:
    type: json
    data: |-
      {
        "account": "{{account}}",
        "instrumentID": "{{instrumentID}}",
        "marketID": "VNFE",
        "buySell": "{{buySell}}",
        "orderType": "{{orderType}}",
        "price": {{price}},
        "quantity": {{quantity}},
        "requestID": "{{requestID}}",
        "code": "{{code}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
