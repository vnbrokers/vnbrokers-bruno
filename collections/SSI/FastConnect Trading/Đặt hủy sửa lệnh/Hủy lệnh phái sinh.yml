info:
  name: Hủy lệnh phái sinh
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v2/Trading/derCancelOrder"
  body:
    type: json
    data: |-
      {
        "account": "{{account}}",
        "orderID": "{{orderID}}",
        "marketID": "VNFE",
        "instrumentID": "{{instrumentID}}",
        "buySell": "{{buySell}}",
        "requestID": "{{requestID}}",
        "code": null,
        "deviceID": "{{deviceId}}"
      }
  auth: inherit

runtime:
  variables:
    - name: account
      value: "{{account_8}}"
    - name: orderID
      value: 
    - name: marketID
      value: VNFE
    - name: instrumentID
      value: 41I1G5000
    - name: buySell
      value: S
    - name: code
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/Trading/derCancelOrder"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "account": "0901358",
            "orderID": "12658867",
            "marketID": "VNFE",
            "instrumentID": "SSI",
            "buySell": "B",
            "requestID": "93235974",
            "code": "123456789"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
