info:
  name: Hủy lệnh cơ sở
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v2/Trading/CancelOrder"
  body:
    type: json
    data: |-
      {
        "account": "{{account}}",
        "orderID": "{{orderID}}",
        "marketID": "{{marketID}}",
        "instrumentID": "{{instrumentID}}",
        "buySell": "{{buySell}}",
        "requestID": "{{requestID}}",
        "code": "{{code}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/Trading/CancelOrder"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "account": "0901358",
            "orderID": "12658867",
            "marketID": "VN",
            "instrumentID": "SSI",
            "buySell": "B",
            "requestID": "93235974",
            "code": "123456789"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "requestID": "52513603",
              "requestData": {
                "orderID": "12658867",
                "account": "0901358",
                "marketID": "VN",
                "instrumentID": "SSI",
                "buySell": "B",
                "orderType": "LO",
                "price": 28600,
                "quantity": 100
              }
            }
          }
