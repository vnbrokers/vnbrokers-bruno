info:
  name: Sửa lệnh cơ sở
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v2/Trading/ModifyOrder"
  body:
    type: json
    data: |-
      {
        "account": "{{account}}",
        "orderID": "{{orderID}}",
        "marketID": "{{marketID}}",
        "instrumentID": "{{instrumentID}}",
        "buySell": "{{buySell}}",
        "price": {{price}},
        "quantity": {{quantity}},
        "requestID": "{{requestID}}",
        "code": "{{code}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/Trading/ModifyOrder"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "account": "0901358",
            "orderID": "12658867",
            "marketID": "VN",
            "instrumentID": "SSI",
            "buySell": "B",
            "price": 28600,
            "quantity": 100,
            "requestID": "93235974",
            "code": "123456789"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "requestID": "93235974",
              "requestData": {
                "orderID": "12658867",
                "price": 1410,
                "quantity": 2,
                "account": "0901358",
                "instrumentID": "VN30F2306",
                "marketID": "VNFE",
                "buySell": "B",
                "orderType": "LO"
              }
            }
          }
