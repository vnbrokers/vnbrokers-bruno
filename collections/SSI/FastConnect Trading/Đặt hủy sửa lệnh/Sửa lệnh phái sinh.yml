info:
  name: Sửa lệnh phái sinh
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v2/Trading/derModifyOrder"
  body:
    type: json
    data: |-
      {
        "account": "{{account}}",
        "orderID": "{{orderID}}",
        "marketID": "VNFE",
        "instrumentID": "{{instrumentID}}",
        "buySell": "{{buySell}}",
        "price": {{price}},
        "quantity": {{quantity}},
        "requestID": "{{requestID}}",
        "code": "{{code}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
