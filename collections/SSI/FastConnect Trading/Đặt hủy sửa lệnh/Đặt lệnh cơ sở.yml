info:
  name: Đặt lệnh cơ sở
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v2/Trading/NewOrder"
  body:
    type: json
    data: |-
      {
        "account": "{{account}}",
        "instrumentID": "{{instrumentID}}",
        "marketID": "{{marketID}}",
        "buySell": "{{buySell}}",
        "orderType": "{{orderType}}",
        "price": {{price}},
        "quantity": {{quantity}},
        "requestID": "{{requestID}}",
        "code": "{{code}}"
      }
  auth: inherit

runtime:
  variables:
    - name: marketID
      value: VN
    - name: buySell
      value: B
    - name: orderType
      value: LO
    - name: requestID
      value: "{{uuid}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/Trading/NewOrder"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "account": "0901358",
            "instrumentID": "SSI",
            "marketID": "VN",
            "buySell": "B",
            "orderType": "LO",
            "price": 28600,
            "quantity": 100,
            "requestID": "93235974",
            "code": "123456789"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "requestID": "93235974",
              "requestData": {
                "instrumentID": "SSI",
                "marketID": "VN",
                "buySell": "B",
                "orderType": "LO",
                "price": 28600,
                "quantity": 100,
                "account": "0901358"
              }
            }
          }
