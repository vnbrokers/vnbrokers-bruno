    description: Success
    request:
      url: "{{baseUrl}}/api/v2/Trading/GetOTP"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "consumerID": "38f5fdfa56b44d5ab8b95895eb588e99",
            "consumerSecret": "6d61bffefc6540fc837c71afd2ca****"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
