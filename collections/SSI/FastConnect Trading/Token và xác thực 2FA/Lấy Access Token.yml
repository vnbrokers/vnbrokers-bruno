            "twoFactorType": 1,
            "code": "123456789",
            "isSave": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "accessToken": "eyJh..."
            }
          }
