info:
  name: FastConnect Trading
  type: folder
  seq: 1

request:
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit
  variables:
    - name: baseUrl
      value: https://fc-tradeapi.ssi.com.vn
  scripts:
    - type: before-request
      code: |-
        if (!bru.isSafeMode() && req.method === "POST") {
          const {signWithRSA}=require("./signer")
          const privateKey = bru.getEnvVar("privateKey");

          const requestID = Math.floor(Math.random() * 100000000);
          const message = JSON.stringify(bru.interpolate({...req.body,requestID }));
          const signature = signWithRSA(privateKey, message);
          
          req.setHeader("X-Signature", signature)
          bru.setEnvVar("X-Signature", signature)
          bru.setEnvVar("requestID", requestID)
        }
