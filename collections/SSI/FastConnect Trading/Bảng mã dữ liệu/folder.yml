docs:
  content: |
    # OrderType

    Các loại lệnh hỗ trợ trên hệ thống bao gồm:

    | # | Loại lệnh | Mô tả                                                                                          |
    |---|-----------|------------------------------------------------------------------------------------------------|
    | 1 | LO        | Lệnh giới hạn, áp dụng cho tất cả các sàn                                                      |
    | 2 | ATO       | Lệnh ATO, chỉ áp dụng cho sàn HOSE, Phái sinh                                                  |
    | 3 | ATC       | Lệnh ATC, chỉ áp dụng cho sàn HOSE, HNX, Phái sinh                                             |
    | 4 | MP        | MP - Chỉ áp dụng cho sàn HOSE                                                                  |
    | 5 | MTL       | MTL - Chỉ áp dụng cho sàn HNX, UPCOM, Phái sinh                                                |
    | 6 | MOK       | MOK - Chỉ áp dụng cho sàn HNX, UPCOM, Phái sinh                                                |
    | 7 | MAK       | MAK - Chỉ áp dụng cho sàn HNX, UPCOM, Phái sinh                                                |
    | 8 | PLO       | Lệnh đặt với giá đóng cửa trong khoảng thời gian từ 14h45 tới 15h00. Chỉ áp dụng cho sàn HNX.  |
    | 9 | GTD       | GTD                                                                                            |

    # Channel

    Các kênh đặt lệnh

    | # | Channel code | Mô tả (ENG)   | Mô tả (VIE)   |
    |---|--------------|---------------|---------------|
    | 1 | TA           | FCTrading API | FCTrading API |


