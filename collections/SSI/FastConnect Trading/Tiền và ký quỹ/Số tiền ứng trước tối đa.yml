info:
  name: Số tiền ứng trước tối đa
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v2/cash/cashInAdvanceAmount"
  params:
    - name: account
      value: "{{account}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### GET Số tiền ứng trước tối đa

  `GET cash/cashInAdvanceAmount`

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/cash/cashInAdvanceAmount"
      method: GET
      params:
        - name: account
          value: "0901358"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": [
              {
                "account": "0901358",
                "availableAmount": 10000000,
                "fee": 15000
              }
            ]
          }
