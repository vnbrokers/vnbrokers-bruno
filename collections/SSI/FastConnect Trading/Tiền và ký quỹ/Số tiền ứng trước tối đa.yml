info:
  name: Số tiền ứng trước tối đa
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v2/cash/cashInAdvanceAmount"
  params:
    - name: account
      value: "{{account}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "message": {
                "type": "string"
              },
              "status": {
                "type": "number"
              },
              "data": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "account": {
                      "type": "string"
                    },
                    "availableAmount": {
                      "type": "number"
                    },
                    "fee": {
                      "type": "number"
                    }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### GET Số tiền ứng trước tối đa

  `GET cash/cashInAdvanceAmount`

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/cash/cashInAdvanceAmount"
      method: GET
      params:
        - name: account
          value: "0901358"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": [
              {
                "account": "0901358",
                "availableAmount": 10000000,
                "fee": 15000
              }
            ]
          }
