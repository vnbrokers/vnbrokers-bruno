info:
  name: Lịch sử chuyển tiền
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v2/cash/transferHistories?account={{account}}&startDate={{startDate}}&endDate={{endDate}}"
  params:
    - name: account
      value: "{{account}}"
      type: query
    - name: startDate
      value: "{{startDate}}"
      type: query
    - name: endDate
      value: "{{endDate}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/cash/transferHistories"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": [
              {
                "transactionID": "TRF001",
                "senderAccount": "0901358",
                "receiverAccount": "0901359",
                "amount": 1000000,
                "dateTime": "10/08/2023 10:00:00",
                "status": "Success",
                "remark": "Internal transfer"
              }
            ]
          }
