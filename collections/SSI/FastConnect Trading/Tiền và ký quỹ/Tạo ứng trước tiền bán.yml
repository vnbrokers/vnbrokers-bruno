info:
  name: Tạo ứng trước tiền bán
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/v2/cash/createCashInAdvance"
  body:
    type: json
    data: |-
      {
        "account": "{{account}}",
        "ciaAmount": {{ciaAmount}},
        "code": "{{code}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/cash/createCashInAdvance"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "account": "0901358",
            "ciaAmount": 1000000,
            "code": "123456789"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "transactionID": "CIA001",
              "account": "0901358",
              "ciaAmount": 1000000,
              "fee": 1500
            }
          }
