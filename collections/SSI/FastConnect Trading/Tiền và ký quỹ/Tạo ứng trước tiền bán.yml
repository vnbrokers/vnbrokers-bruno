info:
  name: Tạo ứng trước tiền bán
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/v2/cash/createCashInAdvance"
  body:
    type: json
    data: |-
      {
        "account": "{{account}}",
        "ciaAmount": {{ciaAmount}},
        "code": "{{code}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "message": {
                "type": "string"
              },
              "status": {
                "type": "number"
              },
              "data": {
                "type": "object",
                "properties": {
                  "transactionID": {
                    "type": "string"
                  },
                  "account": {
                    "type": "string"
                  },
                  "ciaAmount": {
                    "type": "number"
                  },
                  "fee": {
                    "type": "number"
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### POST  createCashInAdvance

  ```
  https://fc-tradeapi.ssi.com.vn/api/v2/cash/createCashInAdvance
  ```

  Tạo giao dịch ứng trước tiền bán

  **Thông tin chi tiết**

  #### Input

  | Dữ liệu | Kiểu | Bắt buộc | Mô tả |
  | --- | --- | --- | --- |
  | account | string | Yes | Số tài khoản nguồn truy vấn |
  | ciaAmount | string | No | Số tiền muốn ứng trước |
  | receiveAmount | string | No | Số tiền nhận được |
  | code | string | Yes | Mã OTP/PIN cần nhập trước khi làm giao dịch |

  #### Output

  | Dữ liệu | Kiểu | Mô tả |
  | --- | --- | --- |
  | message | string | Mô tả msg call API |
  | status | number | Trạng thái |
  | data | list | Thông tn dữ liệu trả ra |
  | account | string | Số tài khoản |
  | transactionID | string | Số hiệu giao dịch |

  **Ví dụ**

  * Thành công

  ```json
  Input:
  {
    "account": "8888881",
    "ciaAmount": 50000,
    "code": 1234567
  }
  Output:
  {
    "message": "Success",
    "status": 200,
    "data": {
      "account": "1158851",
      "transactionID": "20230824-46286"
    }
  }
  ```

  * Lỗi

  ```json
  Input:
  {
    "account": "8888881",
    "ciaAmount": 50000,
    "code":1234567
  }
  Output:
  {
    "message": "Not support derivatives account",
    "status": 400,
    "data": null
  }
  ```

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/cash/createCashInAdvance"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "account": "0901358",
            "ciaAmount": 1000000,
            "code": "123456789"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "transactionID": "CIA001",
              "account": "0901358",
              "ciaAmount": 1000000,
