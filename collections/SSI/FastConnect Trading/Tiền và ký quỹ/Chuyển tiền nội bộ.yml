info:
  name: Chuyển tiền nội bộ
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v2/cash/transferInternal"
  body:
    type: json
    data: |-
      {
        "senderAccount": "{{senderAccount}}",
        "receiverAccount": "{{receiverAccount}}",
        "amount": {{amount}},
        "remark": "{{remark}}",
        "code": "{{code}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/cash/transferInternal"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "senderAccount": "0901358",
            "receiverAccount": "0901359",
            "amount": 1000000,
            "remark": "Internal transfer",
            "code": "123456789"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "transactionID": "TRF001",
              "senderAccount": "0901358",
              "receiverAccount": "0901359",
              "amount": 1000000
            }
          }
