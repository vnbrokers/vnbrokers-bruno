info:
  name: Chuyển tiền nội bộ
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v2/cash/transferInternal"
  body:
    type: json
    data: |-
      {
        "senderAccount": "{{senderAccount}}",
        "receiverAccount": "{{receiverAccount}}",
        "amount": {{amount}},
        "remark": "{{remark}}",
        "code": "{{code}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### POST  transferInternal

  ```
  https://fc-tradeapi.ssi.com.vn/api/v2/cash/transferInternal
  ```

  Tạo giao dịch chuyển tiền giữa các tài khoản Cơ sở hoặc chuyển tiền từ tài khoản Phái sinh sang Cơ sở

  >
  **Lưu ý:**

  Số tài khoản nguồn và Số tài khoản nhận phải cùng tên và chỉ được chuyển tiền giữa các tiểu khoản

  **Thông tin chi tiết**

  #### Input

  | Dữ liệu | Kiểu | Bắt buộc | Mô tả |
  | --- | --- | --- | --- |
  | account | string | Yes | Số tài khoản nguồn |
  | beneficiaryAccount | string | Yes | Số tài khoản nhận |
  | amount | number | Yes | Số tiền |
  | remark | string | No | Mô tả nội dung tạo giao dịch |
  | code | string | No | isSave = false -> Điền PIN/ OTP tùy phương thức xác thựcisSave = true -> Không cần điền |

  #### Output

  | Dữ liệu | Kiểu | Mô tả |
  | --- | --- | --- |
  | message | string | Mô tả msg call API |
  | status | number | Trạng thái |
  | data | list | Thông tn dữ liệu trả ra |
  | transactionID | string | Số hiệu giao dịch |

  **Ví dụ**

  * Thành công

  ```json
  Input:
  {
    "account": "0901351",
    "beneficiaryAccount": "0901356",
    "amount": 50000,
    "remark": "string",
    "code":"string"
  }
  Output:
  {
    "message": "Success",
    "status": 200,
    "data": {
      "transactionID": "101844165"
    }
  }
  ```

  * Lỗi

  ```json
  Input:
  {
    "account": "0901351",
    "beneficiaryAccount": "0901356",
    "amount": 50000,
    "remark": "string",
    "code":"string"
  }
  Output:
  {
    "message": "Account 0901352 is not exist",
    "status": 400,
    "data": null
  }
  ```

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/cash/transferInternal"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "senderAccount": "0901358",
            "receiverAccount": "0901359",
            "amount": 1000000,
            "remark": "Internal transfer",
            "code": "123456789"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "transactionID": "TRF001",
              "senderAccount": "0901358",
              "receiverAccount": "0901359",
              "amount": 1000000
            }
          }
