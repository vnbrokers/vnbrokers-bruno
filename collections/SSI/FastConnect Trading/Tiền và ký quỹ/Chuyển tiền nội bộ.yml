info:
  name: Chuyển tiền nội bộ
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v2/cash/transferInternal"
  body:
    type: json
    data: |-
      {
        "senderAccount": "{{senderAccount}}",
        "receiverAccount": "{{receiverAccount}}",
        "amount": {{amount}},
        "remark": "{{remark}}",
        "code": "{{code}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
