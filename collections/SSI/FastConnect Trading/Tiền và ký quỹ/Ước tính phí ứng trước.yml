info:
  name: Ước tính phí ứng trước
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v2/cash/estCashInAdvanceFee"
  params:
    - name: account
      value: "{{account}}"
      type: query
    - name: ciaAmount
      value: "{{ciaAmount}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/cash/estCashInAdvanceFee"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "account": "0901358",
              "ciaAmount": 1000000,
              "fee": 1500,
              "receivableAmount": 998500
            }
          }
