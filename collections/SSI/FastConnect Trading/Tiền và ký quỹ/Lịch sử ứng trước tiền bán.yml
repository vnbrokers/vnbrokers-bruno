info:
  name: Lịch sử ứng trước tiền bán
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v2/cash/cashInAdvanceHistories"
  params:
    - name: account
      value: "{{account}}"
      type: query
    - name: startDate
      value: "{{startDate}}"
      type: query
    - name: endDate
      value: "{{endDate}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
