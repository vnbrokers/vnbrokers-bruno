info:
  name: Tạo đăng ký quyền mua
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v2/ors/create"
  body:
    type: json
    data: |-
      {
        "account": "{{account}}",
        "instrumentID": "{{instrumentID}}",
        "quantity": {{quantity}},
        "code": "{{code}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/ors/create"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "account": "0901358",
            "instrumentID": "SSI",
            "quantity": 100,
            "code": "123456789"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "transactionID": "ORS001",
              "account": "0901358",
              "instrumentID": "SSI",
              "quantity": 100
            }
          }
