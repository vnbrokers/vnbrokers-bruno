info:
  name: Tạo đăng ký quyền mua
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v2/ors/create"
  body:
    type: json
    data: |-
      {
        "account": "{{account}}",
        "instrumentID": "{{instrumentID}}",
        "quantity": {{quantity}},
        "code": "{{code}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### POST  create

  ```
  https://fc-tradeapi.ssi.com.vn/api/v2/ors/create
  ```

  Tạo giao dịch đăng ký quyền

  **Thông tin chi tiết**

  #### Input

  | Dữ liệu | Kiểu | Bắt buộc | Mô tả |
  | --- | --- | --- | --- |
  | account | string | Yes | Số tài khoản |
  | instrumentID | string | Yes | Mã chứng khoán |
  | entitlementID | string | Yes | Mã quyền |
  | quantity | number | Yes | Khối lượng |
  | amount | number | Yes | Số tiền |
  | code | string | No | Mã OTP/PIN cần nhập trước khi làm giao dịch |

  #### Output

  | Dữ liệu | Kiểu | Mô tả |
  | --- | --- | --- |
  | message | string | Mô tả msg call API |
  | status | number | Trạng thái |
  | data | list | Thông tn dữ liệu trả ra |
  | account | string | Số tài khoản |
  | transactionID | string | Số hiệu giao dịch |

  **Ví dụ**

  * Thành công

  ```json
  Input:
  {
     "account": "0901351",
     "instrumentID": "SSI",
     "entitlementID": "913312",
     "quantity": 100,
     "amount": 1000,
     "code":"569858"
   }
  Output:
  {
    "message": "Success",
    "status": 200,
    "data": {
      "account": "0901351",
      "transactionID": "17509268"
    }
  }
  ```

  * Lỗi

  ```json
  Input:
  {
     "account": "0901351",
     "instrumentID": "VND",
     "entitlementID": "913312",
     "quantity": 100,
     "amount": 1000,
     "code":"459865"
   }
  Output:
  {
    "message": "Invalid ammount (max amount 1,459,882)",
    "status": 40006,
    "data": null
  }
  ```

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/ors/create"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "account": "0901358",
            "instrumentID": "SSI",
            "quantity": 100,
            "code": "123456789"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "transactionID": "ORS001",
              "account": "0901358",
              "instrumentID": "SSI",
              "quantity": 100
            }
          }
