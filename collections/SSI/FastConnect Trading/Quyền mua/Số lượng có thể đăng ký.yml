info:
  name: Số lượng có thể đăng ký
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v2/ors/exercisableQuantity"
  params:
    - name: account
      value: "{{account}}"
      type: query
    - name: instrumentID
      value: "{{instrumentID}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/ors/exercisableQuantity"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "account": "0901358",
              "instrumentID": "SSI",
              "exercisableQuantity": 100
            }
          }
