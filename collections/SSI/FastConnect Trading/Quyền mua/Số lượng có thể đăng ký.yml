          type: query
        - name: instrumentID
          value: "SSI"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "account": "0901358",
              "instrumentID": "SSI",
              "exercisableQuantity": 100
            }
          }
