info:
  name: Danh sách lệnh điều kiện
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v2/fco/list?pageIndex={{pageIndex}}&pageSize={{pageSize}}"
  headers:
    - name: User-Agent
      value: "{{userAgent}}"
  params:
    - name: fcoId
      value: "{{fcoId}}"
      type: query
      disabled: true
    - name: account
      value: "{{account}}"
      type: query
      disabled: true
    - name: type
      value: "{{conditionalType}}"
      type: query
      disabled: true
    - name: processStatus
      value: "{{processStatus}}"
      type: query
      disabled: true
    - name: instrumentID
      value: "{{instrumentID}}"
      type: query
      disabled: true
    - name: side
      value: "{{side}}"
      type: query
      disabled: true
    - name: fromDate
      value: "{{fromDate}}"
      type: query
      disabled: true
    - name: toDate
      value: "{{toDate}}"
      type: query
      disabled: true
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
    - name: pageSize
      value: "{{pageSize}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/fco/list"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "success",
            "status": 200,
            "data": [
              {
                "fcoId": "FCO001",
                "account": "0901358",
                "instrumentID": "SSI",
                "side": "B",
                "type": "stop_limit",
                "processStatus": "pending"
              }
            ]
          }
