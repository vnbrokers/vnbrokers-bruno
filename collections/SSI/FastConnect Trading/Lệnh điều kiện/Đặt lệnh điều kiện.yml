info:
  name: Đặt lệnh điều kiện
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v2/fco/neworder"
  headers:
    - name: User-Agent
      value: "{{userAgent}}"
  body:
    type: json
    data: |-
      {
        "account": "{{account}}",
        "instrumentID": "{{instrumentID}}",
        "side": "{{side}}",
        "orderType": "{{orderType}}",
        "price": {{price}},
        "quantity": {{quantity}},
        "type": "{{conditionalType}}",
        "code": "{{code}}",
        "userAgent": "{{userAgent}}",
        "deviceId": "{{deviceId}}"
      }
  auth: inherit

runtime:
  variables:
    - name: userAgent
      value: fctrading application for customer {{account}}
    - name: conditionalType
      value: stop_limit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/fco/neworder"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "account": "0901358",
            "instrumentID": "SSI",
            "side": "B",
            "orderType": "LO",
            "price": 28600,
            "quantity": 100,
            "type": "stop_limit",
            "code": "123456789",
            "userAgent": "FCTrading",
            "deviceId": "MAC Address"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "success",
            "status": 200,
            "data": {
              "fcoId": "FCO001",
              "account": "0901358",
              "instrumentID": "SSI",
              "type": "stop_limit",
              "processStatus": "pending"
            }
          }
