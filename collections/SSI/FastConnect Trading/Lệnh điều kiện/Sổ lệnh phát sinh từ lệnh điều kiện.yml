info:
  name: Sổ lệnh phát sinh từ lệnh điều kiện
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v2/fco/orderbook?fcoId={{fcoId}}&pageIndex={{pageIndex}}&pageSize={{pageSize}}"
  headers:
    - name: User-Agent
      value: "{{userAgent}}"
  params:
    - name: fcoId
      value: "{{fcoId}}"
      type: query
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
    - name: pageSize
      value: "{{pageSize}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: pageIndex
      value: "1"
    - name: pageSize
      value: "50"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/fco/orderbook"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "success",
            "status": 200,
            "data": [
              {
                "fcoId": "FCO001",
                "orderID": "12658867",
                "instrumentID": "SSI",
                "quantity": 100,
                "price": 28600,
                "orderStatus": "Qu"
              }
            ]
          }
