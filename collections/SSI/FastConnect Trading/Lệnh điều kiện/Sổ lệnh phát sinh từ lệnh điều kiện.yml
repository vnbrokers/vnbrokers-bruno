info:
  name: Sổ lệnh phát sinh từ lệnh điều kiện
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v2/fco/orderbook"
  headers:
    - name: User-Agent
      value: "{{userAgent}}"
  params:
    - name: fcoId
      value: "{{fcoId}}"
      type: query
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
    - name: pageSize
      value: "{{pageSize}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: pageIndex
      value: "1"
    - name: pageSize
      value: "50"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
