info:
  name: Chuyển chứng khoán
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v2/stock/transfer"
  body:
    type: json
    data: |-
      {
        "senderAccount": "{{senderAccount}}",
        "receiverAccount": "{{receiverAccount}}",
        "instrumentID": "{{instrumentID}}",
        "quantity": {{quantity}},
        "code": "{{code}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/stock/transfer"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "senderAccount": "0901358",
            "receiverAccount": "0901359",
            "instrumentID": "SSI",
            "quantity": 100,
            "code": "123456789"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "account": "0901358",
              "transactionID": "STK001"
            }
          }
