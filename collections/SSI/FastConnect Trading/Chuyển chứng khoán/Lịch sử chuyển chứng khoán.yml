info:
  name: Lịch sử chuyển chứng khoán
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v2/stock/transferHistories"
  params:
    - name: account
      value: "{{account}}"
      type: query
    - name: startDate
      value: "{{startDate}}"
      type: query
    - name: endDate
      value: "{{endDate}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/stock/transferHistories"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": [
              {
                "account": "0901358",
                "stockTransferHistories": [
                  {
                    "transactionID": "STK001",
                    "beneficiaryAccount": "0901359",
                    "instrumentID": "SSI",
                    "quantity": 100,
                    "dateTime": "10/08/2023 10:00:00",
                    "status": "Success",
                    "remark": "",
                    "auditRemark": ""
                  }
                ]
              }
            ]
          }
