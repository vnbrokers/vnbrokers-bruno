info:
  name: Lịch sử chuyển chứng khoán
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v2/stock/transferHistories"
  params:
    - name: account
      value: "{{account}}"
      type: query
    - name: startDate
      value: "{{startDate}}"
      type: query
    - name: endDate
      value: "{{endDate}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
