info:
  name: Chứng khoán có thể chuyển
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v2/stock/transferable"
  params:
    - name: account
      value: "{{account}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "message": {
                "type": "string"
              },
              "status": {
                "type": "number"
              },
              "data": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "account": {
                      "type": "string"
                    },
                    "transferableStocks": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "instrumentID": {
                            "type": "string"
                          },
                          "quantity": {
                            "type": "number"
                          },
                          "instrumentType": {
                            "type": "string"
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### GET  transferable

  ```
  https://fc-tradeapi.ssi.com.vn/api/v2/stock/transferable
  ```

  Truy vấn thông tin số lượng chứng khoán có thể chuyển nhượng của tài khoản

  **Thông tin chi tiết**

  #### Input

  | Dữ liệu | Kiểu | Bắt buộc | Mô tả |
  | --- | --- | --- | --- |
  | account | string | Yes | Số tài khoản nguồn truy vấn |

  #### Output

  | Dữ liệu | Kiểu | Mô tả |
  | --- | --- | --- |
  | message | string | Mô tả msg call API |
  | status | number | Trạng thái |
  | data | list | Thông tn dữ liệu trả ra |
  | account | string | Số tài khoản |
  | transferableStocks | list | Danh sách thông tin số lượng mã chứng khoán có thể chuyển nhượng |
  | instrumentID | string | Mã chứng khoán |
  | quantity | number | Khối lượng |
  | instrumentType | string | Loại mã chứng khoán |

  **Ví dụ**

  ```json
  Input:
  account: 0901351
  Output:
  {
    "message": "Success",
    "status": 200,
    "data": {
      "account": "0901351",
      "transferableStocks": [
        {
          "instrumentID": "ACB",
          "quantity": 100,
          "instrumentType": "EQ"
        },
        {
          "instrumentID": "BTS",
          "quantity": 300,
          "instrumentType": "EQ"
        }
      ]
    }
  }
  ```

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/stock/transferable"
      method: GET
      params:
        - name: account
          value: "0901358"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": [
              {
                "account": "0901358",
                "transferableStocks": [
                  {
                    "instrumentID": "SSI",
                    "quantity": 100,
                    "instrumentType": "S"
                  }
                ]
              }
            ]
          }
