info:
  name: Chứng khoán có thể chuyển
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v2/stock/transferable?account={{account}}"
  params:
    - name: account
      value: "{{account}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/api/v2/stock/transferable"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": [
              {
                "account": "0901358",
                "transferableStocks": [
                  {
                    "instrumentID": "SSI",
                    "quantity": 100,
                    "instrumentType": "S"
                  }
                ]
              }
            ]
          }
