info:
  name: Lấy Access Token
  type: http
  seq: 1

http:
  method: POST
  url: "{{fcDataBaseUrl}}/api/v2/Market/AccessToken"
  body:
    type: json
    data: |-
      {
        "consumerID": "{{consumerID}}",
        "consumerSecret": "{{consumerSecret}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body && res.body.data && res.body.data.accessToken) {
          bru.setEnvVar('accessToken', res.body.data.accessToken);
        }

    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "message": {
                "type": "string"
              },
              "status": {
                "type": "number"
              },
              "data": {
                "type": "object",
                "properties": {
                  "accessToken": {
                    "type": "string"
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{fcDataBaseUrl}}/api/v2/Market/AccessToken"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "consumerID": "c058f55761814787882b2c8df1336e25",
            "consumerSecret": "144cac45770949519d2dfd20edb5****"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
            "status": 200,
            "data": {
              "accessToken": "eyJh..."
            }
          }

docs: |-
  ### AccessToken

  Dùng để lấy access token truy cập vào các API lấy thông tin hoặc streaming của FastConnect Data.

  `POST Market/AccessToken`

  #### Input

  | Dữ liệu | Kiểu | Bắt buộc | Mô tả |
  | --- | --- | --- | --- |
  | consumerID | string | Yes | ConsumerID khách hàng lấy được khi Tạo key trên Iboard |
  | consumerSecret | string | Yes | ConsumerSecret khách hàng lấy được khi Tạo key trên Iboard |

  #### Output

  | Dữ liệu | Kiểu | Mô tả |
  | --- | --- | --- |
  | message | string | Thông báo trả ra khi call api |
  | status | number | Trạng thái |
  | data.accessToken | string | Token để truy cập vào các API Get thông tin khách hàng hoặc Streaming |
