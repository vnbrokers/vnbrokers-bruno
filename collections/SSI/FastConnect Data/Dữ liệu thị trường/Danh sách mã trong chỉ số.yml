info:
  name: Danh sách mã trong chỉ số
  type: http
  seq: 3

http:
  method: GET
  url: "{{fcDataBaseUrl}}/api/v2/Market/IndexComponents"
  params:
    - name: indexCode
      value: "{{indexCode}}"
      type: query
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
    - name: pageSize
      value: "{{pageSize}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
