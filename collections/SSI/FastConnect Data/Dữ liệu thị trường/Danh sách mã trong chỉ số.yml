info:
  name: Danh sách mã trong chỉ số
  type: http
  seq: 3

http:
  method: GET
  url: "{{fcDataBaseUrl}}/api/v2/Market/IndexComponents"
  params:
    - name: indexCode
      value: "{{indexCode}}"
      type: query
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
    - name: pageSize
      value: "{{pageSize}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{fcDataBaseUrl}}/api/v2/Market/IndexComponents"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "IndexCode": "VN30",
                "IndexName": "VN30",
                "Exchange": "HOSE",
                "TotalSymbolNo": "30",
                "IndexComponent": [
                  {
                    "Isin": "ACB",
                    "StockSymbol": "ACB"
                  },
                  {
                    "Isin": "BCM",
                    "StockSymbol": "BCM"
                  }
                ]
              }
            ],
            "message": "Success",
            "status": "Success",
            "totalRecord": 1
          }
