info:
  name: OHLC trong ngày
  type: http
  seq: 6

http:
  method: GET
  url: "{{fcDataBaseUrl}}/api/v2/Market/IntradayOhlc?symbol={{symbol}}&fromDate={{fromDate}}&toDate={{toDate}}&pageIndex={{pageIndex}}&pageSize={{pageSize}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: query
    - name: fromDate
      value: "{{fromDate}}"
      type: query
    - name: toDate
      value: "{{toDate}}"
      type: query
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
    - name: pageSize
      value: "{{pageSize}}"
      type: query
    - name: ascending
      value: "{{ascending}}"
      type: query
      disabled: true
    - name: resollution
      value: "{{resollution}}"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
