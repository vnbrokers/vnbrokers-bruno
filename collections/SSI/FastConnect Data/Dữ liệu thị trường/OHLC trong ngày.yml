docs: |-
  ### OHLC trong ngày

  Dùng để lấy thông tin open, high, low, close, volume, value của mã chứng khoán theo từng tick data.

  `GET Market/IntradayOhlc`

  #### Input

  | Dữ liệu | Kiểu | Bắt buộc | Mô tả |
  | --- | --- | --- | --- |
  | symbol | string | No | Mã của chứng khoán, mã chỉ số, chứng khoán phái sinh |
  | fromDate | string | Yes | Nếu không chỉ định, lấy ngày hiện tại. Định dạng dd/mm/yyyy |
  | toDate | string | Yes | Nếu không chỉ định, lấy ngày hiện tại. Định dạng dd/mm/yyyy |
  | pageIndex | integer | Yes | From 1 to 10. Mặc định 1 |
  | pageSize | integer | Yes | 10; 20; 50; 100; 1000. Mặc định 10 |
  | ascending | boolean | No | true/false |
  | resollution | integer | No | Mặc định 1 minute |

  #### Output

  | Dữ liệu | Kiểu | Mô tả |
  | --- | --- | --- |
  | message | string | Thông báo trả ra khi call api |
  | status | number | Trạng thái |
  | totalRecord | number | Tổng số bản ghi trả ra |
  | data | list | List data |
  | Symbol | string | Mã chứng khoán |
  | TradingDate | date | Ngày giao dịch |
  | Time | timestamp | Thời gian |
  | Open/High/Low/Close | number | Giá OHLC |
  | Volume | number | Tổng khối lượng khớp bình thường |
  | Value | number | Tổng giá trị phù hợp bình thường |
