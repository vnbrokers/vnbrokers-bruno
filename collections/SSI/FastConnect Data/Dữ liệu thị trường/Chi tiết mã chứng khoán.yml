info:
  name: Chi tiết mã chứng khoán
  type: http
  seq: 2

http:
  method: GET
  url: "{{fcDataBaseUrl}}/api/v2/Market/SecuritiesDetails?market={{market}}&symbol={{symbol}}&pageIndex={{pageIndex}}&pageSize={{pageSize}}"
  params:
    - name: market
      value: "{{market}}"
      type: query
    - name: symbol
      value: "{{symbol}}"
      type: query
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
    - name: pageSize
      value: "{{pageSize}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{fcDataBaseUrl}}/api/v2/Market/SecuritiesDetails"
      method: GET
      params:
        - name: market
          value: HOSE
          type: query
        - name: symbol
          value: SSI
          type: query
        - name: pageIndex
          value: "1"
          type: query
        - name: pageSize
          value: "10"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "RType": "y",
                "ReportDate": "19/01/2023",
                "TotalNoSym": "1",
