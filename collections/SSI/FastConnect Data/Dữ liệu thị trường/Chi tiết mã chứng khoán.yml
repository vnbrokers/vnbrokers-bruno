info:
  name: Chi tiết mã chứng khoán
  type: http
  seq: 2

http:
  method: GET
  url: "{{fcDataBaseUrl}}/api/v2/Market/SecuritiesDetails"
  params:
    - name: market
      value: "{{market}}"
      type: query
      disabled: true
    - name: symbol
      value: "{{symbol}}"
      type: query
      disabled: true
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
    - name: pageSize
      value: "{{pageSize}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
