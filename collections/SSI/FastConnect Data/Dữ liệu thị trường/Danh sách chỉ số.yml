info:
  name: Danh sách chỉ số
  type: http
  seq: 4

http:
  method: GET
  url: "{{fcDataBaseUrl}}/api/v2/Market/IndexList"
  params:
    - name: exchange
      value: "{{exchange}}"
      type: query
      disabled: true
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
    - name: pageSize
      value: "{{pageSize}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
