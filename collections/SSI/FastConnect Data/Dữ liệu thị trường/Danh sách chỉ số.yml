info:
  name: Danh sách chỉ số
  type: http
  seq: 4

http:
  method: GET
  url: "{{fcDataBaseUrl}}/api/v2/Market/IndexList"
  params:
    - name: exchange
      value: "{{exchange}}"
      type: query
      disabled: true
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
    - name: pageSize
      value: "{{pageSize}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{fcDataBaseUrl}}/api/v2/Market/IndexList"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "IndexCode": "VN100",
                "IndexName": "VN100",
                "Exchange": "HOSE"
              },
              {
                "IndexCode": "VN30",
                "IndexName": "VN30",
                "Exchange": "HOSE"
              }
            ],
            "message": "Success",
            "status": "Success",
            "totalRecord": 2
          }
