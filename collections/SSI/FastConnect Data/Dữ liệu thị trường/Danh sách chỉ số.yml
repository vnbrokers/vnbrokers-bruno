info:
  name: Danh sách chỉ số
  type: http
  seq: 4

http:
  method: GET
  url: "{{fcDataBaseUrl}}/api/v2/Market/IndexList?exchange={{exchange}}&pageIndex={{pageIndex}}&pageSize={{pageSize}}"
  params:
    - name: exchange
      value: "{{exchange}}"
      type: query
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
    - name: pageSize
      value: "{{pageSize}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{fcDataBaseUrl}}/api/v2/Market/IndexList"
      method: GET
      params:
        - name: exchange
          value: HOSE
          type: query
        - name: pageIndex
          value: "1"
          type: query
        - name: pageSize
          value: "10"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "IndexCode": "VN100",
                "IndexName": "VN100",
                "Exchange": "HOSE"
              },
              {
                "IndexCode": "VN30",
                "IndexName": "VN30",
                "Exchange": "HOSE"
              }
            ],
            "message": "Success",
            "status": "Success",
            "totalRecord": 2
          }

docs: |-
  ### Danh sách chỉ số

  Dùng để lấy danh sách mã chỉ số.

  `GET Market/IndexList`

  #### Input

  | Dữ liệu | Kiểu | Bắt buộc | Mô tả |
  | --- | --- | --- | --- |
  | exchange | string | No | Sàn. Nếu không điền trả toàn bộ dữ liệu |
  | pageIndex | integer | Yes | From 1 to 10. Mặc định 1 |
  | pageSize | integer | Yes | 10; 20; 50; 100; 1000. Mặc định 10 |

  #### Output

  | Dữ liệu | Kiểu | Mô tả |
  | --- | --- | --- |
  | message | string | Thông báo trả ra khi call api |
  | status | number | Trạng thái |
  | totalRecord | number | Tổng số bản ghi trả ra |
  | data | list | List data |
  | IndexCode | string | Mã code index |
  | IndexName | string | Tên index |
  | Exchange | string | Sàn: HOSE\|HNX |
