  url: "{{fcDataBaseUrl}}/api/v2/Market/DailyOhlc?symbol={{symbol}}&fromDate={{fromDate}}&toDate={{toDate}}&pageIndex={{pageIndex}}&pageSize={{pageSize}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: query
    - name: fromDate
      value: "{{fromDate}}"
      type: query
    - name: toDate
      value: "{{toDate}}"
      type: query
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
    - name: pageSize
      value: "{{pageSize}}"
      type: query
