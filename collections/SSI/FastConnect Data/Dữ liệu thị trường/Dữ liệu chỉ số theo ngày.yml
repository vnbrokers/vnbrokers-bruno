info:
  name: Dữ liệu chỉ số theo ngày
  type: http
  seq: 7

http:
  method: GET
  url: "{{fcDataBaseUrl}}/api/v2/Market/DailyIndex"
  params:
    - name: indexId
      value: "{{indexId}}"
      type: query
    - name: fromDate
      value: "{{fromDate}}"
      type: query
    - name: toDate
      value: "{{toDate}}"
      type: query
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
    - name: pageSize
      value: "{{pageSize}}"
      type: query
    - name: ascending
      value: "{{ascending}}"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

