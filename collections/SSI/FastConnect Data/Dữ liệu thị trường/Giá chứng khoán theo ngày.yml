docs: |-
  ### Giá chứng khoán theo ngày

  Dùng để lấy thông tin giao dịch của mã chứng khoán theo ngày.

  `GET Market/DailyStockPrice`

  #### Input

  | Dữ liệu | Kiểu | Bắt buộc | Mô tả |
  | --- | --- | --- | --- |
  | symbol | string | No | Mã chứng khoán |
  | fromDate | string | Yes | Nếu không chỉ định, lấy ngày hiện tại. Định dạng dd/mm/yyyy |
  | toDate | string | Yes | Nếu không chỉ định, lấy ngày hiện tại. Định dạng dd/mm/yyyy |
  | pageIndex | integer | Yes | From 1 to 10. Mặc định 1 |
  | pageSize | integer | Yes | 10; 20; 50; 100; 1000. Mặc định 10 |
  | market | string | No | Sàn: HOSE\|HNX\|UPCOM\|DER\|BOND |

  #### Output

  | Dữ liệu | Kiểu | Mô tả |
  | --- | --- | --- |
  | message | string | Thông báo trả ra khi call api |
  | status | number | Trạng thái |
  | totalRecord | number | Tổng số bản ghi trả ra |
  | data | list | List data |
  | TradingDate | string | Ngày giao dịch |
  | Symbol | string | Mã chứng khoán |
  | PriceChange | string | Giá thay đổi |
  | PerPriceChange | string | % giá thay đổi |
  | OpenPrice/HighestPrice/LowestPrice/ClosePrice | string | Giá giao dịch |
  | TotalMatchVol | string | Tổng khối lượng khớp |
  | TotalMatchVal | string | Total match value |
