info:
  name: Giá chứng khoán theo ngày
  type: http
  seq: 8

http:
  method: GET
  url: "{{fcDataBaseUrl}}/api/v2/Market/DailyStockPrice"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: query
      disabled: true
    - name: fromDate
      value: "{{fromDate}}"
      type: query
    - name: toDate
      value: "{{toDate}}"
      type: query
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
    - name: pageSize
      value: "{{pageSize}}"
      type: query
    - name: market
      value: "{{market}}"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{fcDataBaseUrl}}/api/v2/Market/DailyStockPrice"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
