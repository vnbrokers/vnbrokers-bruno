info:
  name: Giá chứng khoán theo ngày
  type: http
  seq: 8

http:
  method: GET
  url: "{{fcDataBaseUrl}}/api/v2/Market/DailyStockPrice"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: query
      disabled: true
    - name: fromDate
      value: "{{fromDate}}"
      type: query
    - name: toDate
      value: "{{toDate}}"
      type: query
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
    - name: pageSize
      value: "{{pageSize}}"
      type: query
    - name: market
      value: "{{market}}"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
