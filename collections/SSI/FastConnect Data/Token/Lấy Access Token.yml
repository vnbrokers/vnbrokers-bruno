info:
  name: Lấy Access Token
  type: http
  seq: 1

http:
  method: POST
  url: "{{fcDataBaseUrl}}/api/v2/Market/AccessToken"
  body:
    type: json
    data: |-
      {
        "consumerID": "{{consumerID}}",
        "consumerSecret": "{{consumerSecret}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
