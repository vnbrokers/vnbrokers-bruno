info:
  name: Lấy Access Token
  type: http
  seq: 1

http:
  method: POST
  url: "{{fcDataBaseUrl}}/api/v2/Market/AccessToken"
  body:
    type: json
    data: |-
      {
        "consumerID": "{{consumerID}}",
        "consumerSecret": "{{consumerSecret}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar('accessToken', res.body.data.accessToken)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{fcDataBaseUrl}}/api/v2/Market/AccessToken"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "consumerID": "c058f55761814787882b2c8df1336e25",
            "consumerSecret": "144cac45770949519d2dfd20edb5****"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Success",
