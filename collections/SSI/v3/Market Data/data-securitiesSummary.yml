info:
  name: data-securitiesSummary
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v3/data/securitiesSummary?symbol={{symbol}}&index={{index}}&from={{from}}&to={{to}}&pageIndex={{pageIndex}}&pageSize={{pageSize}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response returns success", function () {
          expect(res.status).to.be.oneOf([200]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |- 
  ### GET /api/v3/data/securitiesSummary

  Lấy thông tin tổng hợp giao dịch của một mã chứng khoán hoặc chỉ số theo từng ngày giao dịch. Chỉ truyền một trong hai tham số là Symbol hoặc Index.

  Authentication: Bearer token.