info:
  name: data-marketFile
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v3/data/file?symbol={{symbol}}&timeFrame={{timeFrame}}&index={{index}}&fromDate={{fromDate}}&toDate={{toDate}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: User-Agent
      value: ""
      disabled: true
    - name: Accept-Language
      value: en
  params:
    - name: symbol
      value: "{{symbol}}"
      type: query
      description: Mã chứng khoán.
    - name: timeFrame
      value: "{{timeFrame}}"
      type: query
      description: Khung thời gian dữ liệu thị trường.
    - name: index
      value: "{{index}}"
      type: query
      description: Mã chỉ số.
    - name: fromDate
      value: "{{fromDate}}"
      type: query
      description: |-
        Ngày bắt đầu theo định dạng `YYYY/MM/DD`.
    - name: toDate
      value: "{{toDate}}"
      type: query
      description: |-
        Ngày kết thúc theo định dạng `YYYY/MM/DD`, phải lớn hơn hoặc bằng `fromDate`.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### GET /api/v3/data/file

  Lấy đường dẫn file CSV dữ liệu thị trường theo ngày giao dịch và khung thời gian. File dữ liệu sẽ được hệ thống chuẩn bị sẵn và cung cấp đường dẫn tải về trong vòng 30 phút kể từ khi nhận được yêu cầu. Sau 30 phút, đường dẫn tải về sẽ không còn hiệu lực và khách hàng cần gửi lại yêu cầu để nhận được đường dẫn mới. Dữ liệu trong file sẽ bao gồm các trường symbol, tradingDate, open, high, low, close, volume.

  Authentication: Bearer token.
