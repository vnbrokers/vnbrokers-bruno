info:
  name: data-masterData
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v3/data/masterdata?from={{fromDate}}&to={{toDate}}&pageIndex={{pageIndex}}&pageSize={{pageSize}}"
  headers:
    - name: Content-Type
      value: application/json
      description: |-
        Định dạng nội dung request body. Chủ yếu là application/json.
    - name: User-Agent
      value: ""
      description: Thông tin client gửi request.
      disabled: true
    - name: Accept-Language
      value: en
      description: |-
        Ngôn ngữ phản hồi mong muốn. Nếu không có header này, hệ thống sẽ mặc định là en
  params:
    - name: from
      value: "{{fromDate}}"
      type: query
      description: |-
        Ngày bắt đầu theo định dạng `YYYY/MM/DD`. Không truyền thì trả dữ liệu ngày mới nhất.
    - name: to
      value: "{{toDate}}"
      type: query
      description: |-
        Ngày kết thúc theo định dạng `YYYY/MM/DD`. Không truyền thì trả dữ liệu ngày mới nhất.
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
      description: |-
        Chỉ số trang, bắt đầu từ 1. Mặc định là 1.
    - name: pageSize
      value: "{{pageSize}}"
      type: query
      description: Số lượng bản ghi mỗi trang. Mặc định là 10.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### GET /api/v3/data/masterdata

  Truy vấn thông tin giá trần, giá sàn, giá tham chiếu của chứng khoán theo ngày giao dịch.

  Authentication: Bearer token.
