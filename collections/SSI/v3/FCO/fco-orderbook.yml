info:
  name: fco-orderbook
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v3/trading/fco/orderbook?fcoId={{fcoId}}&pageIndex={{pageIndex}}&pageSize={{pageSize}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: User-Agent
      value: ""
      disabled: true
    - name: Accept-Language
      value: en
  params:
    - name: fcoId
      value: "{{fcoId}}"
      type: query
      description: ID của lệnh điều kiện cần truy vấn sổ lệnh phát sinh.
    - name: pageIndex
      value: "{{pageIndex}}"
      type: query
      description: |-
        Chỉ số trang, bắt đầu từ 1. Mặc định là 1.
    - name: pageSize
      value: "{{pageSize}}"
      type: query
      description: Số lượng bản ghi mỗi trang. Mặc định là 10.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### GET /api/v3/trading/fco/orderbook

  Lấy danh sách các lệnh thực được phát sinh (trigger) bởi một lệnh điều kiện.

  Authentication: Bearer token.
