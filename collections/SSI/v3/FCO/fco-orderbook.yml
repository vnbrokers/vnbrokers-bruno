info:
  name: fco-orderbook
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v3/trading/fco/orderbook?fcoId={{fcoId}}&pageIndex={{pageIndex}}&pageSize={{pageSize}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response returns success", function () {
          expect(res.status).to.be.oneOf([200]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |- 
  ### GET /api/v3/trading/fco/orderbook

  Lấy danh sách các lệnh thực được phát sinh (trigger) bởi một lệnh điều kiện.

  Authentication: Bearer token.