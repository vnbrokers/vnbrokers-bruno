info:
  name: fco-statusHistory
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v3/trading/fco/statusHistory?fcoId={{fcoId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: User-Agent
      value: ""
      disabled: true
    - name: Accept-Language
      value: en
  params:
    - name: fcoId
      value: "{{fcoId}}"
      type: query
      description: ID của lệnh điều kiện cần truy vấn lịch sử trạng thái.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### GET /api/v3/trading/fco/statusHistory

  Lấy lịch sử thay đổi trạng thái của một lệnh điều kiện.

  Authentication: Bearer token.
