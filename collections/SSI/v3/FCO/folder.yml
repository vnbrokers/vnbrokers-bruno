info:
  name: FCO
  type: folder
  seq: 3

request:
  auth:
    type: bearer
    token: "{{accessToken}}"
  scripts:
    - type: before-request
      code: |-
        if (["POST", "DELETE"].includes(req.method)) {
          const { signWithRSA } = require("../../v1/signer")
          const privateKey = bru.getEnvVar("privateKey")
          const signature = signWithRSA(privateKey, JSON.stringify(bru.interpolate(req.body)))
          req.setHeader("X-Signature", signature)
        }
