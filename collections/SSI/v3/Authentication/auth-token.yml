info:
  name: auth-token
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v3/auth/token"
  body:
    type: json
    data: |-
      {
        "apiKey": "{{apiKey}}",
        "apiSecret": "{{apiSecret}}",
        "otp": "{{otp}}",
        "transactionId": "{{transactionId}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body && res.body.accessToken) {
          const accessToken = res.body.accessToken;
          bru.setEnvVar('accessToken', accessToken);
          bru.setEnvVar('refreshToken', res.body.refreshToken);

          try {
            const encodedPayload = accessToken.split('.')[1];
            const base64Payload = encodedPayload
              .replace(/-/g, '+')
              .replace(/_/g, '/')
              .padEnd(encodedPayload.length + (4 - encodedPayload.length % 4) % 4, '=');
            const payload = JSON.parse(Buffer.from(base64Payload, 'base64').toString('utf8'));

            if (payload.client_id) {
              bru.setEnvVar('clientId', String(payload.client_id));
            }
          } catch (error) {
            console.warn('Unable to extract clientId from accessToken JWT:', error.message);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### POST /api/v3/auth/token

  Xác thực apiKey/apiSecret để lấy access token và refresh token (kèm thông tin hết hạn).

  **Request body**

  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | apiKey | string | Yes | API key do SSI/FastConnect cấp cho ứng dụng. |
  | apiSecret | string | Yes | API secret tương ứng với apiKey. |
  | otp | string \| null | No | Mã OTP để cấp token có quyền thực hiện giao dịch. |
  | transactionId | string \| null | No | Mã transaction từ `auth/requestOtp` khi sử dụng SmartOTP. |

  Authentication: Không yêu cầu Bearer token.
