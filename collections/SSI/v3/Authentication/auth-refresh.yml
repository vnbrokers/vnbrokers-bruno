info:
  name: auth-refresh
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v3/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body && res.body.accessToken) {
          bru.setEnvVar('accessToken', res.body.accessToken);
          bru.setEnvVar('refreshToken', res.body.refreshToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### POST /api/v3/auth/refresh

  Làm mới access token bằng refresh token còn hiệu lực.

  **Request body**

  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | refreshToken | string | Yes | Refresh token còn hiệu lực. |

  Authentication: Không yêu cầu Bearer token.
