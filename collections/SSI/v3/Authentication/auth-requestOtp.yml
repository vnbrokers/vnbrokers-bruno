info:
  name: auth-requestOtp
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v3/auth/requestOtp"
  body:
    type: json
    data: |-
      {
        "apiKey": "{{apiKey}}",
        "apiSecret": "{{apiSecret}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response returns success", function () {
          expect(res.status).to.be.oneOf([200]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |- 
  ### POST /api/v3/auth/requestOtp

  Gửi yêu cầu lấy OTP (SMS/Email) phục vụ xác thực giao dịch. Chỉ sử dụng cho tài khoản có kiểu 2FA là SMS và Email.

  Authentication: Không yêu cầu Bearer token.