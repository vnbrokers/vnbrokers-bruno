info:
  name: Sub/Unsub Market Data
  type: websocket
  seq: 4

websocket:
  url: "{{wsBaseUrl}}/ws/v3"
  message:
    type: json
    data: |-
      {
        "method": "SUBSCRIBE",
        "channel": "DATA",
        "topics": [
          "trade.{{symbol}}",
          "quote.{{symbol}}",
          "room.{{symbol}}",
          "market.hose"
        ]
      }
  auth: inherit

settings:
  timeout: 0
  keepAliveInterval: 0

docs: |-
  Subscribe dữ liệu trade, quote, room và market. Đổi `method` thành `UNSUBSCRIBE` để hủy.
