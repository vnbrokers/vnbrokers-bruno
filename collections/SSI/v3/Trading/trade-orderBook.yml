info:
  name: trade-orderBook
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v3/trading/orderBook?accountNo={{accountNo}}&from={{from}}&to={{to}}&symbol={{symbol}}&orderStatus={{orderStatus}}&pageSize={{pageSize}}&pageIndex={{pageIndex}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response returns success", function () {
          expect(res.status).to.be.oneOf([200]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |- 
  ### GET /api/v3/trading/orderBook

  Lấy lịch sử sổ lệnh theo tài khoản và bộ lọc.

  Authentication: Bearer token.