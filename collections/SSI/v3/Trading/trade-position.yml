info:
  name: trade-position
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v3/trading/position?clientId={{clientId}}&accountNo={{accountNo}}&querySummary={{querySummary}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: User-Agent
      value: ""
      disabled: true
    - name: Accept-Language
      value: en
  params:
    - name: clientId
      value: "{{clientId}}"
      type: query
      description: Mã client của ứng dụng.
    - name: accountNo
      value: "{{accountNo}}"
      type: query
      description: Số tài khoản giao dịch.
    - name: querySummary
      value: "{{querySummary}}"
      type: query
      description: Có trả thêm thông tin tổng hợp hay không.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### GET /api/v3/trading/position

  Lấy thông tin vị thế cho tài khoản.

  Authentication: Bearer token.
