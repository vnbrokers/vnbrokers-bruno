info:
  name: 5.5.5. Tổng nợ gốc, Tổng nợ lãi, Rtt thực tế, Tỷ lệ ký quỹ ban đầu, Tỷ lệ duy trì, Tỷ lệ cảnh báo
  type: http
  seq: 5
  tags:
    - purchasing_power_stock_normal
http:
  method: GET
  url: "{{baseUrl}}/hydros/v1/account/:accountNo/risk"
  params:
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: Số tài khoản margin
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "accountNo": {
                  "type": "string"
                },
                "riskPolicy": {
                  "type": "object",
                  "properties": {}
                },
                "rtt": {
                  "type": "number"
                },
                "outstanding": {
                  "type": "number"
                },
                "accruedInterest": {
                  "type": "number"
                },
                "dueAmount": {
                  "type": "number"
                },
                "overdueAmount": {
                  "type": "number"
                },
                "riskStatus": {
                  "type": "object",
                  "properties": {}
                },
                "totalFeeDebt": {
                  "type": "number"
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/hydros/v1/account/:accountNo/risk"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "accountNo": "0001I97267",
