info:
  name: 5.4.1. Lấy sổ lệnh
  type: http
  seq: 1
  tags:
    - get_order_stock_normal

http:
  method: GET
  url: "{{baseUrl}}/aion/v1/accounts/:accountNo/orders"
  params:
    - name: pageSize
      value: "10"
      type: query
      disabled: true
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: Số tiểu khoản
  auth: inherit

