  type: http
  seq: 1
  tags:
    - cancel_order_derivative
http:
  method: POST
  url: "{{baseUrl}}/khronos/v1/order/cancel"
  body:
    type: json
    data: |-
      {
        "accountId": "105C031402",
        "orderNo": "1",
        "cmd": "Web.cancelOrder",
        "pin": "",
        "refId": ""
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "cmd": {
                "type": "string"
              },
              "rc": {
                "type": "string"
              },
              "rs": {
                "type": "string"
              },
              "oID": {
                "type": "string"
              },
              "data": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "orderNo": {
                      "type": "number"
                    },
                    "msg_type": {
                      "type": "string"
                    },
                    "status": {
                      "type": "string"
                    },
                    "pk_orderNo": {
                      "type": "number"
                    },
                    "cancelTime": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

