info:
  name: 6.2.1. Tài sản, vị thế đóng
  type: http
  seq: 1
  tags:
    - asset_derivative
http:
  method: GET
  url: "{{baseUrl}}/khronos/v1/account/portfolio/position/close"
  params:
    - name: accountId
      value: 105C031402
      type: query
      description: số tài khoản lưu kí
    - name: subAccountId
      value: 105C031402A
      type: query
      description: Tiểu khoản phái sinh
    - name: symbol
      value: "{{symbol}}"
      type: query
      description: Mã chứng khoán
      disabled: true
    - name: pageNo
      value: "1"
      type: query
      description: Số trang
    - name: pageSize
      value: "20"
      type: query
      description: Số dòng
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "cmd": {
                "type": "string"
              },
              "rc": {
                "type": "string"
              },
              "rs": {
                "type": "string"
              },
              "oID": {
                "type": "string"
              },
              "data": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "symbol": {
                      "type": "string"
                    },
                    "side": {
                      "type": "string"
                    },
                    "openPrice": {
                      "type": "number"
                    },
                    "closePrice": {
                      "type": "number"
                    },
                    "closePosition": {
                      "type": [
                        "number",
                        "string"
                      ]
                    },
                    "fee": {
                      "type": "number"
                    },
                    "tax": {
                      "type": "number"
                    },
                    "closeVM": {
                      "type": "number"
                    },
                    "unrealize": {
                      "type": "number"
                    },
                    "closePC": {
                      "type": "number"
                    },
                    "time": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

