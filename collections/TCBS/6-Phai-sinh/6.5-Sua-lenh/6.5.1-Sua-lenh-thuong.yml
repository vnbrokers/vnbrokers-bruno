info:
  name: 6.5.1. Sửa lệnh thường
  type: http
  seq: 1
  tags:
    - edit_order_derivative
http:
  method: POST
  url: "{{baseUrl}}/khronos/v1/order/change"
  body:
    type: json
    data: |-
      {
        "accountId": "105C031402",
        "subAccountId": "105C031402A",
        "orderNo": "17",
        "refId": "000123.H.HH2104062",
        "nvol": "300",
        "nprice": "56000.5"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "cmd": {
                "type": "string"
              },
              "rc": {
                "type": "string"
              },
              "rs": {
                "type": "string"
              },
              "oID": {
                "type": "string"
              },
              "data": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "orderNo": {
                      "type": "number"
                    },
                    "msg_type": {
                      "type": "string"
                    },
                    "status": {
                      "type": "string"
                    },
                    "showPrice": {
                      "type": "string"
                    },
                    "volume": {
                      "type": "string"
                    },
                    "pk_orderNo": {
                      "type": "number"
                    }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: |-
      OK Loại bút toán 1: success, < 0: error Chi tiết lỗi
    request:
      url: "{{baseUrl}}/khronos/v1/order/change"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "accountId": "105C031402",
            "subAccountId": "105C031402A",
            "orderNo": "17",
            "refId": "000123.H.HH2104062",
            "nvol": "300",
            "nprice": "56000.5"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "cmd": "Web.changeOrder",
            "rc": "1",
            "rs": "",
            "oID": "",
            "data": [
              {
                "orderNo": 9,
                "msg_type": "1P",
