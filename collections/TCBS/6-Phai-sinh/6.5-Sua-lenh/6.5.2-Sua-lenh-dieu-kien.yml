info:
  name: 6.5.2. Sửa lệnh điều kiện
  type: http
  seq: 2
  tags:
    - edit_order_derivative
http:
  method: POST
  url: "{{baseUrl}}/khronos/v2/order/condition/change"
  body:
    type: json
    data: |-
      {
        "accountId": "105C031402",
        "pkOrderNo": "901938",
        "type": "",
        "refId": "000123.H.HH2104062",
        "soPrice": "1453.9",
        "cmd": "Web.Order.ChangeCondition"
      }
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "cmd": {
                "type": "string"
              },
              "rc": {
                "type": "string"
              },
              "rs": {
                "type": "string"
              },
              "oID": {
                "type": "string"
              },
              "data": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "showPrice": {
                      "type": "string"
                    },
                    "price": {
                      "type": "string"
                    },
                    "volume": {
                      "type": "string"
                    },
                    "pkOrderNo": {
                      "type": "string"
                    },
                    "notes": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK Loại bút toán 1: success, < 0: error Chi tiết lỗi
    request:
      url: "{{baseUrl}}/khronos/v2/order/condition/change"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "accountId": "105C031402",
            "pkOrderNo": "901938",
            "type": "",
            "refId": "000123.H.HH2104062",
            "soPrice": "1453.9",
            "cmd": "Web.Order.ChangeCondition"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "cmd": "Web.Order.ChangeConditionOrder",
            "rc": "1",
            "rs": "",
            "oID": "",
            "data": [
              {
                "showPrice": "1453.9",
                "price": "1362.2",
                "volume": "1",
                "pkOrderNo": "901943",
                "notes": "Stop order"
              }
            ]
          }
