info:
  name: 2.1.1. Trao đổi API Key để lấy JWT Token
  type: http
  seq: 1
  tags:
    - authen

http:
  method: POST
  url: "{{baseUrl}}/gaia/v1/oauth2/openapi/token"
  body:
    type: json
    data: |-
      {
        "otp": "{{otp}}",
        "apiKey": "{{apiKey}}"
      }

runtime:
  variables:
    - name: otp
      value: "123456"
  scripts:
    - type: after-response
      code: |-
        const accessToken = res.body?.token;
        const wsJwtToken = btoa(JSON.stringify({"jwt":accessToken}))

        bru.setEnvVar('accessToken', accessToken)
        bru.setEnvVar('wsJwtToken', wsJwtToken)
        bru.setEnvVar('base64Token',btoa(accessToken))

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/gaia/v1/oauth2/openapi/token"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "otp": "111111",
            "apiKey": "310ebe1b-07a7..."
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "token": "eyJ..."
          }
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/gaia/v1/oauth2/openapi/token"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "otp": "111111",
            "apiKey": "310ebe1b-07a7..."
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "203074",
            "message": "The API Key is invalid"
          }
