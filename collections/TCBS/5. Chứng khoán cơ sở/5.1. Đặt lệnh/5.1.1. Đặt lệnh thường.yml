info:
  name: 5.1.1. Đặt lệnh thường
  type: http
  seq: 1
  tags:
    - order_stock_normal
http:
  method: POST
  url: "{{baseUrl}}/akhlys/v1/accounts/:accountNo/orders"
  params:
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: Số tiểu khoản
  body:
    type: json
    data: |-
      {
        "execType": "NS",
        "price": 10000,
        "priceType": "LO",
        "quantity": 100,
        "symbol": "{{symbol}}"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/akhlys/v1/accounts/:accountNo/orders"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "execType": "NS",
            "price": 10000,
            "priceType": "LO",
            "quantity": 100,
            "symbol": "VNM"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "0",
            "message": "Đặt lệnh thành công!",
            "orderId": "9202205230000324355"
          }
