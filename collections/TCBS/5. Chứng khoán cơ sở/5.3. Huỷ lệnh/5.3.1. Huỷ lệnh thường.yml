info:
  name: 5.3.1. Huỷ lệnh thường
  type: http
  seq: 1
  tags:
    - cancel_order_stock_normal
http:
  method: PUT
  url: "{{baseUrl}}/akhlys/v1/accounts/:accountNo/cancel-orders"
  params:
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: Số tiểu khoản
  body:
    type: json
    data: |-
      {
        "ordersList": [
          {
            "orderID": "{{orderId}}"
          }
        ]
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/akhlys/v1/accounts/:accountNo/cancel-orders"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "ordersList": []
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "details": [
                  {
                    "deleted": "",
                    "errorCode": "0",
                    "errorMesage": "Giao dịch thực hiện thành công",
                    "orderID": "9202205230000324355"
                  }
                ],
                "object": ""
              }
            ],
            "object": "deleteOrderList",
            "pageIndex": 1,
