info:
  name: 5.3.1. Huỷ lệnh thường
  type: http
  seq: 1
  tags:
    - cancel_order_stock_normal
http:
  method: PUT
  url: "{{baseUrl}}/akhlys/v1/accounts/:accountNo/cancel-orders"
  params:
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: Số tiểu khoản
  body:
    type: json
    data: |-
      {
        "ordersList": [
          {
            "orderID": "{{orderId}}"
          }
        ]
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
