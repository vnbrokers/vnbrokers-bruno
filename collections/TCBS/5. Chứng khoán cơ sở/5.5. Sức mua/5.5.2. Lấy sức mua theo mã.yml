info:
  name: 5.5.2. Lấy sức mua theo mã
  type: http
  seq: 2
  tags:
  - purchasing_power_stock_normal
http:
  method: GET
  url: "{{baseUrl}}/aion/v1/accounts/:accountNo/ppse/:symbol"
  params:
  - name: accountNo
    value: "{{accountNo}}"
    type: path
    description: Số tiểu khoản
  - name: symbol
    value: "{{symbol}}"
    type: path
    description: Mã chứng khoán
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
