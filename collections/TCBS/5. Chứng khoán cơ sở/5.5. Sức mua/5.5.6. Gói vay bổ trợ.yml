info:
  name: 5.5.6. Gói vay bổ trợ
  type: http
  seq: 6
  tags:
    - purchasing_power_stock_normal
http:
  method: GET
  url: "{{baseUrl}}/campaign-management/v1/margin/subscription/:accountNo/addons/detail"
  params:
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: Số tài khoản margin
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "marginSureViews": {
                "type": "array",
                "items": {}
              },
              "tplus": {
                "type": "array",
                "items": {}
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/campaign-management/v1/margin/subscription/:accountNo/addons/detail"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "marginSureViews": [],
            "tplus": []
          }
