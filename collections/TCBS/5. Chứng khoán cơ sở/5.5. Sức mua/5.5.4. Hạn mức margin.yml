info:
  name: 5.5.4. Hạn mức margin
  type: http
  seq: 4
  tags:
    - purchasing_power_stock_normal

http:
  method: GET
  url: "{{baseUrl}}/aion/v1/customers/:custodyId/accounts"
  params:
    - name: custodyId
      value: "{{custodyCode}}"
      type: path
      description: Số tài khoản
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "custodyID": {
                  "type": "string"
                },
                "accountNo": {
                  "type": "string"
                },
                "aftype": {
                  "type": "string"
                },
                "vsdStatus": {
                  "type": "string"
                },
                "accountStatus": {
                  "type": "string"
                },
                "marginLimit": {
                  "type": "number"
                },
                "isIA": {
                  "type": "string"
                },
                "bankName": {
                  "type": "string"
                },
                "bankAccount": {
                  "type": "string"
                },
                "accountType": {
                  "type": "string"
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/aion/v1/customers/:custodyId/accounts"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "custodyID": "105C738764",
              "accountNo": "0001000075",
              "aftype": "0075",
              "vsdStatus": "Y",
              "accountStatus": "A",
              "marginLimit": 0,
              "isIA": "Y",
              "bankName": "TCB",
              "bankAccount": "11520154590019",
              "accountType": "normal"
            }
          ]
