info:
  name: 5.5.1. Lấy sức mua
  type: http
  seq: 1
  tags:
    - purchasing_power_stock_normal
http:
  method: GET
  url: "{{baseUrl}}/aion/v1/accounts/:accountNo/ppse"
  params:
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: Số tiểu khoản
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "accountNo": {
                "type": "string"
              },
              "custodyID": {
                "type": "string"
              },
              "symbol": {
                "type": "string"
              },
              "price": {
                "type": "string"
              },
              "pp0": {
                "type": "string"
              },
              "ppse": {
                "type": "string"
              },
              "ppseref": {
                "type": "string"
              },
              "maxBuyQuantity": {
                "type": "string"
              },
              "realMaxBuyQuantity": {
                "type": "string"
              },
              "minBuyQuantity": {
                "type": "string"
              },
              "marginRatioLoan": {
                "type": "string"
              },
              "marginPriceLoan": {
                "type": "string"
              },
              "rateBrkS": {
                "type": "string"
              },
              "rateBrkB": {
                "type": "string"
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/aion/v1/accounts/:accountNo/ppse"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "accountNo": "0001170730",
            "custodyID": "105C336398",
            "symbol": "FPT",
            "price": "120000",
