  type: http
  seq: 1
  tags:
    - market_information_stock_normal
http:
  method: GET
  url: "{{baseUrl}}/tartarus/v1/tickerCommons"
  params:
    - name: tickers
      value: FPT,MWG,VNM
      type: query
      description: Danh sách mã cổ phiếu (Không dùng kết hợp với query param index)
