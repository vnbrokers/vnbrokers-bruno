info:
  name: 5.7.7. Cung cầu theo ngày
  type: http
  seq: 7
  tags:
    - market_information_stock_normal
http:
  method: GET
  url: "{{baseUrl}}/nyx/v1/intraday/:ticker/bsa"
  params:
    - name: ticker
      value: TCB
      type: path
      description: Mã cổ phiếu
    - name: type
      value: all
      type: query
      description: |
        Loại nhà đầu tư:
        - sheep (Nhà đầu tư cá nhân nhỏ lẻ)
        - wolf (Nhà đầu tư tổ chức vừa)
        - shark (Nhà đầu tư lớn/tổ chức lớn)
        - all (Tất cả loại nhà đầu tư)
      disabled: true
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK Mã cổ phiếu
    request:
      url: "{{baseUrl}}/nyx/v1/intraday/:ticker/bsa"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "ticker": "TCB",
            "data": [
              {
                "bup": 0.65,
                "sdp": 0.35,
                "bsr": 1.25,
                "t": "09:15"
              }
            ]
          }
