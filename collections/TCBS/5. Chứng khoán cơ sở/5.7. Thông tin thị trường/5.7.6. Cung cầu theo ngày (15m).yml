info:
  name: 5.7.6. Cung cầu theo ngày (15m)
  type: http
  seq: 6
  tags:
    - market_information_stock_normal
http:
  method: GET
  url: "{{baseUrl}}/nyx/v1/intraday/:ticker/bsa-ext"
  params:
    - name: ticker
      value: TCB
      type: path
      description: Mã cổ phiếu
    - name: timeWindow
      value: '15'
      type: query
      description: |
        Khung thời gian tính bằng phút:
        - 15
        - 60
    - name: tWindow
      value: '15'
      type: query
      description: |
        Khung thời gian tính bằng phút:
        - 15
    - name: type
      value: all
      type: query
      description: |
        Loại nhà đầu tư:
        - sheep (Nhà đầu tư cá nhân nhỏ lẻ)
        - wolf (Nhà đầu tư tổ chức vừa)
        - shark (Nhà đầu tư lớn/tổ chức lớn)
        - all (Tất cả loại nhà đầu tư)
      disabled: true
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK Mã cổ phiếu
    request:
      url: "{{baseUrl}}/nyx/v1/intraday/:ticker/bsa-ext"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "ticker": "TCB",
            "data": [
              {
                "bu": 1000000,
                "bms": 5000000,
                "bup": 0.65,
                "sd": 800000,
                "sms": 3000000,
                "sdp": 0.35,
                "bsr": 1.25,
                "t": "09:15:00",
                "s": 1640995200000
              }
            ]
          }
