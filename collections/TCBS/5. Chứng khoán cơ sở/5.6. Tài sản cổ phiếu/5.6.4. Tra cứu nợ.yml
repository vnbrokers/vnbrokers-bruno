info:
  name: 5.6.4. Tra cứu nợ
  type: http
  seq: 4
  tags:
    - get_asset_stock_normal

http:
  method: GET
  url: "{{baseUrl}}/erebos/v2/digital/margin-info?acctno={{accountNo}}&fromdate=2026-01-01&todate=2026-04-25&page=1&size=25"
  params:
    - name: acctno
      value: "{{accountNo}}"
      type: query
    - name: fromdate
      value: 2026-01-01
      type: query
    - name: todate
      value: 2026-04-25
      type: query
    - name: page
      value: "1"
      type: query
    - name: size
      value: "25"
      type: query
    - name: custodycd
      value: "{{custodyCode}}"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/erebos/v2/digital/margin-info?acctno={{accountNo}}&fromdate=2026-01-01&todate=2026-04-25&page=1&size=25"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "response": [
              {
                "remainingInterestFee": 0,
                "releasedDay": 4,
                "printAmount": "0E-10",
                "paidInterestFee": 18205,
                "intAmount": "0E-10",
                "releaseDate": "2022-07-11",
                "rate2": 11.5,
                "overDueDate": "2022-10-10",
                "paidFee": 0,
                "releasedAmount": 14444940,
                "remainingFee": 0,
                "intPaid": 18205,
                "prinPaid": 14444940
              }
            ]
          }
