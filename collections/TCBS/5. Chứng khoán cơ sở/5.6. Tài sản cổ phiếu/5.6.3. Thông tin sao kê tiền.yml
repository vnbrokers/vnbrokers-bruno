info:
  name: 5.6.3. Thông tin sao kê tiền
  type: http
  seq: 3
  tags:
    - get_asset_stock_normal

http:
  method: GET
  url: "{{baseUrl}}/erebos/v2/digital/trans-hist-cashStatements?acctno={{accountNo}}&fromDate=2025-12-01&toDate=2026-01-15&pageSize=25&pageIndex=1"
  params:
    - name: acctno
      value: "{{accountNo}}"
      type: query
    - name: fromDate
      value: 2025-12-01
      type: query
    - name: toDate
      value: 2026-01-15
      type: query
    - name: pageSize
      value: "25"
      type: query
    - name: pageIndex
      value: "1"
      type: query
    - name: transactionCode
      value: "1153"
      type: query
      description: Loại giao dịch
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/erebos/v2/digital/trans-hist-cashStatements?acctno={{accountNo}}&fromDate=2025-12-01&toDate=2026-01-15&pageSize=25&pageIndex=1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "response": [
              {
                "custodyID": "105C209414",
                "transactionCode": "1153",
                "debitAmount": 0,
                "transactionName": "Ứng truớc tiền bán",
                "descriptions": "UTTB ngày GD 16-DEC-22, ngày TT 20/12/2022 Ung truoc tien lenh ban",
                "businessDate": "2022-12-16",
                "transactionNum": "6800124310",
                "accountNo": "0001490922",
                "transationDate": "2022-12-16",
                "creditAmount": 2814359
              }
            ]
          }
