info:
  name: 5.6.1. Tra cứu tài sản cổ phiếu theo tiểu khoản
  type: http
  seq: 1
  tags:
    - get_asset_stock_normal
http:
  method: GET
  url: "{{baseUrl}}/aion/v1/accounts/:accountNo/se"
  params:
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: Số tiểu khoản
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/aion/v1/accounts/:accountNo/se"
      method: GET
