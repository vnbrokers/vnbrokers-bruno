info:
  name: 5.4.2. Lấy sổ lệnh theo Order ID
  type: http
  seq: 2
  tags:
    - get_order_stock_normal
http:
  method: GET
  url: "{{baseUrl}}/aion/v1/accounts/:accountNo/orders/:orderID"
  params:
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: Số tiểu khoản
    - name: orderID
      value: "{{orderId}}"
      type: path
      description: Order ID
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
