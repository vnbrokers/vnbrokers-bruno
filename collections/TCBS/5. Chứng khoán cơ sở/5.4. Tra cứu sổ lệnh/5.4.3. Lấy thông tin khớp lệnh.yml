info:
  name: 5.4.3. Lấy thông tin khớp lệnh
  type: http
  seq: 3
  tags:
    - get_order_stock_normal
http:
  method: GET
  url: "{{baseUrl}}/aion/v1/accounts/:accountNo/matching-details"
  params:
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: Số tiểu khoản
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "object": {
                "type": "string"
              },
              "totalCount": {
                "type": "number"
              },
              "pageSize": {
                "type": "number"
              },
              "pageIndex": {
                "type": "number"
              },
              "data": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "orderId": {
                      "type": "number"
                    },
                    "side": {
                      "type": "string"
                    },
                    "symbol": {
                      "type": "string"
                    },
                    "quoteQtty": {
                      "type": "number"
                    },
                    "quotePrice": {
                      "type": "number"
                    },
                    "tradeId": {
                      "type": "number"
                    },
                    "qtty": {
                      "type": "number"
                    },
                    "price": {
                      "type": "number"
                    },
                    "timeExec": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/aion/v1/accounts/:accountNo/matching-details"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "object": "",
            "totalCount": 25,
            "pageSize": 25,
            "pageIndex": 0,
            "data": [
              {
                "orderId": 9202407170000281000,
                "side": "B",
                "symbol": "FPT",
                "quoteQtty": 800,
                "quotePrice": 54000,
                "tradeId": 202409160000220380,
                "qtty": 200,
                "price": 53000,
                "timeExec": "2024-09-16T17:05:20"
              }
            ]
          }
