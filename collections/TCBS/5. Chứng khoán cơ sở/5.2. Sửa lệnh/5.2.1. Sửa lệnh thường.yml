info:
  name: 5.2.1. Sửa lệnh thường
  type: http
  seq: 1
  tags:
    - update_order_stock_normal
http:
  method: PUT
  url: "{{baseUrl}}/akhlys/v1/accounts/:accountNo/orders/:orderId"
  params:
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: Số tiểu khoản
    - name: orderId
      value: "{{orderId}}"
      type: path
      description: orderId
  body:
    type: json
    data: |-
      {
        "price": 10000,
        "quantity": 100
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/akhlys/v1/accounts/:accountNo/orders/:orderId"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "price": 10000,
            "quantity": 100
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "0",
            "message": "Đặt lệnh thành công!",
            "orderId": "9202205230000324355"
          }
