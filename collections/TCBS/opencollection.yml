opencollection: 1.0.0

info:
  name: TCBS iFlash Open API
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: apikey
    key: Authorization
    value: Bearer {{accessToken}}
    placement: header
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
