info:
  name: 4.2.2. Nộp ký quỹ
  type: http
  seq: 3
  tags:
    - money

http:
  method: POST
  url: "{{baseUrl}}/khronos/v1/cash/deposit/update"
  body:
    type: json
    data: |-
      {
        "accountId": "105C000113",
        "subAccountId": "105C000113A",
        "amount": 1500000,
        "paymentContent": "NAP TIEN KY QUY"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "cmd": {
                "type": "string"
              },
              "rc": {
                "type": "string"
              },
              "rs": {
                "type": "string"
              },
              "oID": {
                "type": "string"
              },
              "data": {
                "type": "array",
                "items": {}
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK Loại bút toán 1: success, < 0: error Chi tiết lỗi
    request:
      url: "{{baseUrl}}/khronos/v1/cash/deposit/update"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "accountId": "105C000113",
            "subAccountId": "105C000113A",
            "amount": 1500000,
            "paymentContent": "NAP TIEN KY QUY"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "cmd": "",
