info:
  name: 4.1.1. Chuyển tiền nội bộ
  type: http
  seq: 1
  tags:
    - money
http:
  method: POST
  url: "{{baseUrl}}/physis/v1/stock/transfer"
  body:
    type: json
    data: |-
      {
        "sourceAccountNumber": "0001170730",
        "destinationAccountNumber": "105C738764A",
        "amount": "90000",
        "description": "CHUYEN TIEN PHAI SINH"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK Code trả về, 200 là thành công, khác 200 là lỗi Nội dung trả về
    request:
      url: "{{baseUrl}}/physis/v1/stock/transfer"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "sourceAccountNumber": "0001170730",
            "destinationAccountNumber": "105C738764A",
            "amount": "90000",
            "description": "CHUYEN TIEN PHAI SINH"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "200",
            "message": "OK"
          }
