info:
  name: Lấy danh sách nguồn tin
  type: http
  seq: 3
  tags:
    - Posts

http:
  method: GET
  url: "{{baseUrl}}/posts/sources"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/posts/sources"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "postSourceID": 0,
              "name": "",
              "url": ""
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/posts/sources"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
