info:
  name: Lấy danh sách người thích 1 bài viết
  type: http
  seq: 18
  tags:
    - Posts

http:
  method: GET
  url: "{{baseUrl}}/posts/:postId/likes"
  params:
    - name: postId
      value: ""
      type: path
      description: Id của bài viết
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/posts/:postId/likes"
      method: GET
      params:
        - name: postId
          value: ""
          type: path
          description: Id của bài viết
        - name: offset
          value: ""
          type: query
          description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
          disabled: true
        - name: limit
          value: ""
          type: query
          description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "name": "",
              "bio": "",
              "isAuthentic": false,
              "followed": false
            }
