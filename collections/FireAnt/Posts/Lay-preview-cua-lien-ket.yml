          value: ""
          type: query
          description: Liên kết
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "title": "",
            "url": "",
            "image": "",
            "description": ""
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/posts/link-detail"
      method: GET
      params:
        - name: url
          value: ""
          type: query
          description: Liên kết
    response:
      status: 400
