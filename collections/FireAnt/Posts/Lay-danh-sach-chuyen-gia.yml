info:
  name: Lấy danh sách chuyên gia
  type: http
  seq: 2
  tags:
    - Posts

http:
  method: GET
  url: "{{baseUrl}}/posts/experts"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/posts/experts"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "name": "",
              "bio": "",
              "isAuthentic": false,
              "followed": false
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/posts/experts"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
