info:
  name: Lấy danh sách bài viết liên quan tới 1 bài viết
  type: http
  seq: 15
  tags:
    - Posts

http:
  method: GET
  url: "{{baseUrl}}/posts/:postId/related-posts"
  params:
    - name: postId
      value: ""
      type: path
      description: Id của bài viết
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

