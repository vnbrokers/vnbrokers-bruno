info:
  name: Lấy thống kê dữ liệu thời điểm hiện tại của ngành (GET)
  type: http
  seq: 2
  tags:
    - Industries

http:
  method: GET
  url: "{{baseUrl}}/industries/:industryCode/current-stats"
  params:
    - name: industryCode
      value: ""
      type: path
      description: Mã ngành
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: symbols-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/industries/:industryCode/current-stats"
      method: GET
      params:
        - name: industryCode
          value: ""
          type: path
          description: Mã ngành
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "industryCode": "",
            "date": "",
            "indexHigh": 0,
            "indexLow": 0,
            "indexOpen": 0,
            "indexClose": 0,
            "indexBasic": 0,
            "totalVolume": 0,
            "totalValue": 0,
            "buyCount": 0,
            "sellCount": 0,
            "buyQuantity": 0,
            "sellQuantity": 0,
            "advancesValue": 0,
            "declinesValue": 0,
            "unchangeValue": 0,
            "buyForeignQuantity": 0,
            "buyForeignValue": 0,
            "sellForeignQuantity": 0,
            "sellForeignValue": 0,
            "totalActiveBuyVolume": 0,
            "totalActiveSellVolume": 0,
            "pe": 0,
            "ps": 0,
            "pb": 0,
            "marketCap": 0
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/industries/:industryCode/current-stats"
      method: GET
      params:
        - name: industryCode
          value: ""
          type: path
          description: Mã ngành
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
