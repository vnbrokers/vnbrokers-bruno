info:
  name: Lấy danh sách bài viết của 1 user
  type: http
  seq: 8
  tags:
    - Users

http:
  method: GET
  url: "{{baseUrl}}/users/:userId/posts"
  params:
    - name: userId
      value: ""
      type: path
      description: ID của user
    - name: type
      value: ""
      type: query
      description: "Loại bài viết (0: Bài viết mạng xã hội, 1: Tin tức, mặc định là 0)"
      disabled: true
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: posts-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

