info:
  name: Lấy danh sách người đang theo dõi 1 user
  type: http
  seq: 5
  tags:
    - Users

http:
  method: GET
  url: "{{baseUrl}}/users/:userId/followers"
  params:
    - name: userId
      value: ""
      type: path
      description: ID của user
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
