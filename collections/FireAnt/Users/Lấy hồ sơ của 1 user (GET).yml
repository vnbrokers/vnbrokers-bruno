info:
  name: Lấy hồ sơ của 1 user (GET)
  type: http
  seq: 1
  tags:
    - Users

http:
  method: GET
  url: "{{baseUrl}}/users/:userId/profile"
  params:
    - name: userId
      value: ""
      type: path
      description: ID của user
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/users/:userId/profile"
      method: GET
      params:
        - name: userId
          value: ""
          type: path
          description: ID của user
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "status": "",
            "isExpert": false,
            "isTeacher": false,
            "bio": "",
            "address": "",
            "facebookLink": "",
            "totalPosts": 0,
            "totalLikes": 0,
            "followers": 0,
            "following": 0,
            "followed": false,
            "blocked": false,
            "beingBlocked": false,
            "groups": 0,
            "isAuthentic": false
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/users/:userId/profile"
      method: GET
      params:
        - name: userId
          value: ""
          type: path
          description: ID của user
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 404 Response
    description: User không tồn tại
    request:
      url: "{{baseUrl}}/users/:userId/profile"
      method: GET
      params:
        - name: userId
          value: ""
          type: path
          description: ID của user
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
