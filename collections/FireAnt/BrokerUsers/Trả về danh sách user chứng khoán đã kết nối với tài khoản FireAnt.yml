info:
  name: Trả về danh sách user chứng khoán đã kết nối với tài khoản FireAnt
  type: http
  seq: 1
  tags:
    - BrokerUsers

http:
  method: GET
  url: "{{baseUrl}}/broker-users"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
