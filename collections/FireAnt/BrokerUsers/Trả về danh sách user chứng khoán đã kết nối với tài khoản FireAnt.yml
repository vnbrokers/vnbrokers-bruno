    description: Thành công
    request:
      url: "{{baseUrl}}/broker-users"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "userId": 0,
              "userName": "",
              "brokerId": "",
              "brokerName": "",
              "linkedUserName": ""
            }
          ]
