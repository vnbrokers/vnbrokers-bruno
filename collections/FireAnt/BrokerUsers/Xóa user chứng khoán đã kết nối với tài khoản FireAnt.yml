info:
  name: Xóa user chứng khoán đã kết nối với tài khoản FireAnt
  type: http
  seq: 2
  tags:
    - BrokerUsers

http:
  method: DELETE
  url: "{{baseUrl}}/broker-users/:userId"
  params:
    - name: userId
      value: ""
      type: path
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: accounts-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/broker-users/:userId"
      method: DELETE
      params:
        - name: userId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "userId": 0,
              "userName": "",
              "brokerId": "",
              "brokerName": "",
              "linkedUserName": ""
            }
          ]
  - name: 404 Response
    description: User không tồn tại
    request:
      url: "{{baseUrl}}/broker-users/:userId"
      method: DELETE
      params:
        - name: userId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
