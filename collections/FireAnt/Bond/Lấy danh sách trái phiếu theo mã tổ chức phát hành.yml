info:
  name: Lấy danh sách trái phiếu theo mã tổ chức phát hành
  type: http
  seq: 3
  tags:
    - Bond

http:
  method: GET
  url: "{{baseUrl}}/bonds/issuer/:symbol"
  params:
    - name: symbol
      value: ""
      type: path
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: symbols-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/bonds/issuer/:symbol"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "bondCode": "",
              "issuerName": "",
              "tenorPeriod": 0,
              "issueDate": "",
              "maturityDate": "",
              "bondRate": 0,
              "bondRateType": "",
              "currentListedVolume": 0,
              "status": "",
              "infoObj": {
                "bondCode": "",
                "issuerInstitutionID": 0,
                "issuerSymbol": "",
                "issueICBCode": "",
                "icbNameLv1": "",
                "icbNameLv2": "",
                "icbNameLv3": "",
                "icbNameLv4": ""
              }
            }
          ]
