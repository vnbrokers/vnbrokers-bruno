info:
  name: Lấy thông tin chi tiết một mã trái phiếu
  type: http
  seq: 4
  tags:
    - Bond

http:
  method: GET
  url: "{{baseUrl}}/bonds/:bondCode"
  params:
    - name: bondCode
      value: ""
      type: path
      description: Mã trái phiếu
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

