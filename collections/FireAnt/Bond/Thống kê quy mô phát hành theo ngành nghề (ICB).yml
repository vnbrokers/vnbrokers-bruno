info:
  name: Thống kê quy mô phát hành theo ngành nghề (ICB)
  type: http
  seq: 9
  tags:
    - Bond

http:
  method: GET
  url: "{{baseUrl}}/bonds/stats/industries"
  params:
    - name: top
      value: ""
      type: query
      description: Số lượng
      disabled: true
    - name: level
      value: ""
      type: query
      description: Cấp của ngành cần lấy
      disabled: true
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: symbols-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/bonds/stats/industries"
      method: GET
      params:
        - name: top
          value: ""
          type: query
          description: Số lượng
          disabled: true
        - name: level
          value: ""
          type: query
          description: Cấp của ngành cần lấy
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "icbCode": "",
              "icbName": "",
              "bondCount": 0,
              "totalIssuedVolume": 0,
              "totalIssuedValue": 0,
              "totalCurrentListedVolume": 0,
              "totalCurrentListedValue": 0,
              "totalDebtFull": 0,
              "totalRemainingDebt": 0,
              "avgRate": 0,
              "avgCouponRate": 0,
              "floatingRate": 0
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/bonds/stats/industries"
      method: GET
      params:
        - name: top
          value: ""
          type: query
          description: Số lượng
          disabled: true
        - name: level
          value: ""
          type: query
          description: Cấp của ngành cần lấy
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
