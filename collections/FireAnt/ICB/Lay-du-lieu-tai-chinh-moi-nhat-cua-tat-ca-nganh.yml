info:
  name: Lấy dữ liệu tài chính mới nhất của tất cả ngành
  type: http
  seq: 5
  tags:
    - ICB

http:
  method: GET
  url: "{{baseUrl}}/icb/financial-data"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/icb/financial-data"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "symbol": "",
              "year": 0,
              "quarter": 0,
              "companyType": "",
              "icbCode": "",
              "icbName": "",
              "financialValues": {}
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/icb/financial-data"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
