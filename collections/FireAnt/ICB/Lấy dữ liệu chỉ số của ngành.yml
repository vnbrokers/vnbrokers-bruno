info:
  name: Lấy dữ liệu chỉ số của ngành
  type: http
  seq: 6
  tags:
    - ICB

http:
  method: GET
  url: "{{baseUrl}}/icb/:industryCode/historical-index"
  params:
    - name: industryCode
      value: ""
      type: path
      description: Mã ngành
    - name: startDate
      value: ""
      type: query
      description: Ngày bắt đầu
    - name: endDate
      value: ""
      type: query
      description: Ngày kết thúc
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: symbols-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/icb/:industryCode/historical-index"
      method: GET
      params:
        - name: industryCode
          value: ""
          type: path
          description: Mã ngành
        - name: startDate
          value: ""
          type: query
          description: Ngày bắt đầu
        - name: endDate
          value: ""
          type: query
          description: Ngày kết thúc
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "industryCode": "",
              "date": "",
              "indexValues": {}
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/icb/:industryCode/historical-index"
      method: GET
      params:
        - name: industryCode
          value: ""
          type: path
          description: Mã ngành
        - name: startDate
          value: ""
          type: query
          description: Ngày bắt đầu
        - name: endDate
          value: ""
          type: query
          description: Ngày kết thúc
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
