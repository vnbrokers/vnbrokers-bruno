info:
  name: Lấy dữ liệu tài chính mới nhất của tất cả ngành (GET)
  type: http
  seq: 7
  tags:
    - ICB

http:
  method: GET
  url: "{{baseUrl}}/icb/latest-index"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/icb/latest-index"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "industryCode": "",
              "date": "",
              "indexValues": {}
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/icb/latest-index"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
