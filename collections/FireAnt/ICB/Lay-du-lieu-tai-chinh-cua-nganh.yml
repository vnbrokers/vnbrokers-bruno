          value: ""
          type: path
          description: Mã ngành
        - name: type
          value: ""
          type: query
          description: "Loại dữ liệu (Y: Năm, Q: Quý, A: Tất cả)"
        - name: count
          value: ""
          type: query
          description: Số lượng dữ liệu
