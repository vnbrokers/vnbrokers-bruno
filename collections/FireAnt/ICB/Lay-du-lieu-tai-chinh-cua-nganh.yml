info:
  name: Lấy dữ liệu tài chính của ngành
  type: http
  seq: 4
  tags:
    - ICB

http:
  method: GET
  url: "{{baseUrl}}/icb/:industryCode/financial-data"
  params:
    - name: industryCode
      value: ""
      type: path
      description: Mã ngành
    - name: type
      value: ""
      type: query
      description: "Loại dữ liệu (Y: Năm, Q: Quý, A: Tất cả)"
    - name: count
      value: ""
      type: query
      description: Số lượng dữ liệu
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/icb/:industryCode/financial-data"
      method: GET
      params:
        - name: industryCode
          value: ""
          type: path
          description: Mã ngành
        - name: type
          value: ""
          type: query
          description: "Loại dữ liệu (Y: Năm, Q: Quý, A: Tất cả)"
        - name: count
          value: ""
          type: query
          description: Số lượng dữ liệu
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "symbol": "",
              "year": 0,
              "quarter": 0,
              "companyType": "",
              "icbCode": "",
              "icbName": "",
              "financialValues": {}
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/icb/:industryCode/financial-data"
      method: GET
