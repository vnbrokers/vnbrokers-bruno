    description: Thành công
    request:
      url: "{{baseUrl}}/icb/:industryCode/statistics"
      method: GET
      params:
        - name: industryCode
          value: ""
          type: path
          description: Mã ngành
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "industryCode": "",
            "statisticValues": {}
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/icb/:industryCode/statistics"
      method: GET
      params:
        - name: industryCode
          value: ""
          type: path
          description: Mã ngành
    response:
      status: 400
      statusText: Bad Request
      body:
