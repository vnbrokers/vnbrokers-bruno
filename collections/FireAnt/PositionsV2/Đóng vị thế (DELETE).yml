info:
  name: Đóng vị thế (DELETE)
  type: http
  seq: 2
  tags:
    - PositionsV2

http:
  method: DELETE
  url: "{{baseUrl}}/v2/broker-users/:userId/accounts/:accountId/positions/:positionId"
  params:
    - name: userId
      value: ""
      type: path
      description: Id của user đã kết nối vào tài khoản FireAnt
    - name: accountId
      value: ""
      type: path
      description: Id tài khoản tại công ty chứng khoán của user
    - name: positionId
      value: ""
      type: path
      description: Id của vị thế
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: orders-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/v2/broker-users/:userId/accounts/:accountId/positions/:positionId"
      method: DELETE
      params:
        - name: userId
          value: ""
          type: path
          description: Id của user đã kết nối vào tài khoản FireAnt
        - name: accountId
          value: ""
          type: path
          description: Id tài khoản tại công ty chứng khoán của user
        - name: positionId
          value: ""
          type: path
          description: Id của vị thế
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/v2/broker-users/:userId/accounts/:accountId/positions/:positionId"
      method: DELETE
      params:
        - name: userId
          value: ""
