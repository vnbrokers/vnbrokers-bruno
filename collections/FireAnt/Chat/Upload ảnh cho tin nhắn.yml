info:
  name: Upload ảnh cho tin nhắn
  type: http
  seq: 2
  tags:
    - Chat

http:
  method: POST
  url: "{{baseUrl}}/chat/images"
  body:
    type: json
    data: |-
      {
        "image": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/chat/images"
      method: POST
      body:
        type: json
        data: |-
          {
            "image": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/chat/images"
      method: POST
      body:
        type: json
        data: |-
          {
            "image": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
