info:
  name: Tìm kiếm
  type: http
  seq: 1
  tags:
    - Search

http:
  method: GET
  url: "{{baseUrl}}/search?keywords="
  params:
    - name: keywords
      value: ""
      type: query
      description: Từ khóa tìm kiếm
    - name: type
      value: ""
      type: query
      description: Loại kết quả trả về (symbol, individual, hashtag, user, room, post). Mặc định là "symbol"
      disabled: true
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/search"
      method: GET
      params:
        - name: keywords
          value: ""
          type: query
          description: Từ khóa tìm kiếm
        - name: type
          value: ""
          type: query
          description: Loại kết quả trả về (symbol, individual, hashtag, user, room, post). Mặc định là "symbol"
          disabled: true
        - name: offset
          value: ""
          type: query
          description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
          disabled: true
        - name: limit
          value: ""
          type: query
          description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "type": "",
              "key": "",
              "name": "",
              "description": ""
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
