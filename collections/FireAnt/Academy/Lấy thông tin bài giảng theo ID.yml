info:
  name: Lấy thông tin bài giảng theo ID
  type: http
  seq: 10
  tags:
    - Academy

http:
  method: GET
  url: "{{baseUrl}}/academy/lessons/:lessonId"
  params:
    - name: lessonId
      value: ""
      type: path
      description: ID của bài giảng
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: academy-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/academy/lessons/:lessonId"
      method: GET
      params:
        - name: lessonId
          value: ""
          type: path
          description: ID của bài giảng
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "lessonId": 0,
              "lessonName": "",
              "hasAttachedFile": false,
              "content": "",
              "videoUrl": "",
              "courseId": 0,
              "positionIndex": 0,
              "course": ""
            }
          ]
  - name: 404 Response
    description: Bài giảng không tồn tại
    request:
      url: "{{baseUrl}}/academy/lessons/:lessonId"
      method: GET
      params:
        - name: lessonId
          value: ""
          type: path
          description: ID của bài giảng
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
