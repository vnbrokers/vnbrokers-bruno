info:
  name: Lấy thông tin của tin tức theo ID
  type: http
  seq: 12
  tags:
    - Academy

http:
  method: GET
  url: "{{baseUrl}}/academy/news/:newsId"
  params:
    - name: newsId
      value: ""
      type: path
      description: ID của tin
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/academy/news/:newsId"
      method: GET
      params:
        - name: newsId
          value: ""
          type: path
          description: ID của tin
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "newsId": 0,
            "title": "",
            "content": "",
            "description": "",
            "isHot": false,
            "date": "",
            "hasAttachedFile": false,
            "approved": false,
            "createdDate": "",
            "lastModifiedBy": "",
            "lastModifiedDate": ""
          }
  - name: 404 Response
    description: Tin không tồn tại
    request:
      url: "{{baseUrl}}/academy/news/:newsId"
      method: GET
      params:
        - name: newsId
          value: ""
          type: path
          description: ID của tin
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
