http:
  method: GET
  url: "{{baseUrl}}/academy/classes/enrolledClasses"
  params:
    - name: type
      value: ""
      type: query
      description: "Phân loại (0: lớp học, 1: hội thảo, mặc địch là 0)"
      disabled: true
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

