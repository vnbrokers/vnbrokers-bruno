info:
  name: Lấy thông tin chủ đề khóa học
  type: http
  seq: 2
  tags:
    - Academy

http:
  method: GET
  url: "{{baseUrl}}/academy/subjects/:subjectId"
  params:
    - name: subjectId
      value: ""
      type: path
      description: ID của chủ đề
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/academy/subjects/:subjectId"
      method: GET
      params:
        - name: subjectId
          value: ""
          type: path
          description: ID của chủ đề
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "subjectId": 0,
            "name": ""
          }
  - name: 500 Response
    description: Lỗi hệ thống
    request:
      url: "{{baseUrl}}/academy/subjects/:subjectId"
      method: GET
      params:
        - name: subjectId
          value: ""
          type: path
          description: ID của chủ đề
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: text
        data: ""
