info:
  name: Lấy danh sách tin tức
  type: http
  seq: 11
  tags:
    - Academy

http:
  method: GET
  url: "{{baseUrl}}/academy/news"
  params:
    - name: isHot
      value: ""
      type: query
      description: Lọc theo tin nổi bật
      disabled: true
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: academy-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/academy/news"
      method: GET
      params:
        - name: isHot
          value: ""
          type: query
          description: Lọc theo tin nổi bật
          disabled: true
        - name: offset
