info:
  name: Lấy thông tin đăng ký khóa học
  type: http
  seq: 24
  tags:
    - Academy

http:
  method: GET
  url: "{{baseUrl}}/academy/enrollments/:enrollmentId"
  params:
    - name: enrollmentId
      value: ""
      type: path
      description: Id đăng ký
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: academy-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/academy/enrollments/:enrollmentId"
      method: GET
      params:
        - name: enrollmentId
          value: ""
          type: path
          description: Id đăng ký
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "enrollmentId": 0,
            "enrollmentDate": "",
            "email": "",
            "userName": "",
            "name": "",
            "phone": "",
            "courseId": 0,
            "courseName": "",
            "courseFee": 0,
            "address": "",
            "note": "",
            "isPaid": false,
            "paymentMethod": 0
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/academy/enrollments/:enrollmentId"
      method: GET
      params:
        - name: enrollmentId
          value: ""
          type: path
          description: Id đăng ký
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
