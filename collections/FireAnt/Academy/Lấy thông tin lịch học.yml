info:
  name: Lấy thông tin lịch học
  type: http
  seq: 17
  tags:
    - Academy

http:
  method: GET
  url: "{{baseUrl}}/academy/classes/:classId/schedule"
  params:
    - name: classId
      value: ""
      type: path
      description: ID của lớp học
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: academy-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/academy/classes/:classId/schedule"
      method: GET
      params:
        - name: classId
          value: ""
          type: path
          description: ID của lớp học
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "scheduleId": 0,
              "classId": 0,
              "time": "",
              "teacherUserName": "",
              "status": 0,
              "note": "",
              "lessons": [
                {
                  "lessonId": 0,
                  "lessonName": "",
                  "hasAttachedFile": false,
                  "content": "",
                  "videoUrl": "",
                  "courseId": 0,
                  "positionIndex": 0,
                  "course": ""
                }
              ]
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/academy/classes/:classId/schedule"
      method: GET
      params:
        - name: classId
          value: ""
          type: path
          description: ID của lớp học
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
