info:
  name: Lấy danh sách khóa học
  type: http
  seq: 5
  tags:
    - Academy

http:
  method: GET
  url: "{{baseUrl}}/academy/courses"
  params:
    - name: subjectId
      value: ""
      type: query
      description: Lọc theo chủ đề khóa học (Mặc định là 0, lấy tất cả)
      disabled: true
    - name: type
      value: ""
      type: query
      description: "Phân loại (0: lớp học, 1: hội thảo, mặc địch là 0)"
      disabled: true
    - name: level
      value: ""
      type: query
      description: Lọc theo cấp độ khóa học (Basic, Advance...)
      disabled: true
    - name: isHot
      value: ""
      type: query
      description: Lọc theo khóa học nổi bật
      disabled: true
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

