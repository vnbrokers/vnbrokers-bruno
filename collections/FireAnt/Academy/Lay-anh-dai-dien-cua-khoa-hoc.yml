info:
  name: Lấy ảnh đại diện của khóa học
  type: http
  seq: 7
  tags:
    - Academy

http:
  method: GET
  url: "{{baseUrl}}/academy/courses/:courseID/thumbnail"
  params:
    - name: courseID
      value: ""
      type: path
      description: ID ảnh
    - name: width
      value: ""
      type: query
      description: Chiều rộng ảnh (=0 nếu muốn lấy kích thước đầy đủ, mặc định = 0)
      disabled: true
    - name: height
      value: ""
      type: query
      description: Chiều cao ảnh (=0 nếu muốn lấy kích thước đầy đủ, mặc định = 0)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

