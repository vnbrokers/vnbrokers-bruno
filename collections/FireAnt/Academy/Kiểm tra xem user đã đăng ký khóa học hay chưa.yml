info:
  name: Kiểm tra xem user đã đăng ký khóa học hay chưa
  type: http
  seq: 9
  tags:
    - Academy

http:
  method: GET
  url: "{{baseUrl}}/academy/courses/:courseId/isEnrolled"
  params:
    - name: courseId
      value: ""
      type: path
      description: Id của khóa học
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: academy-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/academy/courses/:courseId/isEnrolled"
      method: GET
      params:
        - name: courseId
          value: ""
          type: path
          description: Id của khóa học
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "false"
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/academy/courses/:courseId/isEnrolled"
      method: GET
      params:
        - name: courseId
          value: ""
          type: path
          description: Id của khóa học
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
