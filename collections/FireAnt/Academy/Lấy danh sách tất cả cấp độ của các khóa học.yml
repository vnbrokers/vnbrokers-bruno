info:
  name: Lấy danh sách tất cả cấp độ của các khóa học
  type: http
  seq: 4
  tags:
    - Academy

http:
  method: GET
  url: "{{baseUrl}}/academy/courses/levels"
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: academy-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/academy/courses/levels"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "level": "",
              "count": 0
            }
          ]
  - name: 500 Response
    description: Có lỗi khi lấy danh sách cấp độ của khóa học
    request:
      url: "{{baseUrl}}/academy/courses/levels"
      method: GET
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: text
        data: ""
