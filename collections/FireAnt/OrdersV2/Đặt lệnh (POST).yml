info:
  name: Đặt lệnh (POST)
  type: http
  seq: 2
  tags:
    - OrdersV2

http:
  method: POST
  url: "{{baseUrl}}/v2/broker-users/:userId/accounts/:accountId/orders"
  params:
    - name: userId
      value: ""
      type: path
      description: Id của user đã kết nối vào tài khoản FireAnt
    - name: accountId
      value: ""
      type: path
      description: Id tài khoản tại công ty chứng khoán của user
  body:
    type: json
    data: |-
      {
        "instrument": "",
        "qty": 0,
        "qtyType": 0,
        "side": "",
        "type": "",
        "limitPrice": 0,
        "stopPrice": 0,
        "stopLoss": 0,
        "takeProfit": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/v2/broker-users/:userId/accounts/:accountId/orders"
      method: POST
