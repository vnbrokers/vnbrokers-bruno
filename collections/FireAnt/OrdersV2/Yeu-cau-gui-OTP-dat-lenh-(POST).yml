info:
  name: Yêu cầu gửi OTP đặt lệnh (POST)
  type: http
  seq: 4
  tags:
    - OrdersV2

http:
  method: POST
  url: "{{baseUrl}}/v2/broker-users/:userId/accounts/:accountId/orders/otp"
  params:
    - name: userId
      value: ""
      type: path
      description: Id của user đã kết nối vào tài khoản FireAnt
    - name: accountId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/v2/broker-users/:userId/accounts/:accountId/orders/otp"
      method: POST
      params:
        - name: userId
          value: ""
          type: path
          description: Id của user đã kết nối vào tài khoản FireAnt
        - name: accountId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "false"
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
