info:
  name: Lấy số lượng thuật ngữ theo từ khóa
  type: http
  seq: 4
  tags:
    - Investopedia

http:
  method: GET
  url: "{{baseUrl}}/investopedia/terms/keywords/recordCount"
  params:
    - name: keywords
      value: ""
      type: query
      description: Từ khóa
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: investopedia-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/investopedia/terms/keywords/recordCount"
      method: GET
      params:
        - name: keywords
          value: ""
          type: query
          description: Từ khóa
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "0"
