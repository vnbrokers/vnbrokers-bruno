    description: Thành công
    request:
      url: "{{baseUrl}}/investopedia/terms/categories/:categoryId"
      method: GET
      params:
        - name: categoryId
          value: ""
          type: path
          description: ID của danh mục
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "categoryID": 0,
            "name": ""
          }
  - name: 500 Response
    description: Lỗi hệ thống
    request:
      url: "{{baseUrl}}/investopedia/terms/categories/:categoryId"
      method: GET
      params:
        - name: categoryId
          value: ""
          type: path
          description: ID của danh mục
    response:
