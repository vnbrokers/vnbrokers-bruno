info:
  name: Lấy thông tin danh mục thuật ngữ
  type: http
  seq: 8
  tags:
    - Investopedia

http:
  method: GET
  url: "{{baseUrl}}/investopedia/terms/categories/:categoryId"
  params:
    - name: categoryId
      value: ""
      type: path
      description: ID của danh mục
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: investopedia-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/investopedia/terms/categories/:categoryId"
      method: GET
      params:
        - name: categoryId
          value: ""
          type: path
          description: ID của danh mục
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "categoryID": 0,
            "name": ""
          }
  - name: 500 Response
    description: Lỗi hệ thống
    request:
      url: "{{baseUrl}}/investopedia/terms/categories/:categoryId"
      method: GET
      params:
        - name: categoryId
          value: ""
          type: path
          description: ID của danh mục
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: text
        data: ""
