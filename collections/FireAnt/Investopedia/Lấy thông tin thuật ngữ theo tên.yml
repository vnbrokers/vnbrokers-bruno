info:
  name: Lấy thông tin thuật ngữ theo tên
  type: http
  seq: 5
  tags:
    - Investopedia

http:
  method: GET
  url: "{{baseUrl}}/investopedia/terms/:termKey"
  params:
    - name: termKey
      value: ""
      type: path
      description: Tên thuật ngữ
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: investopedia-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/investopedia/terms/:termKey"
      method: GET
      params:
        - name: termKey
          value: ""
          type: path
          description: Tên thuật ngữ
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "termId": 0,
              "categoryId": 0,
              "category": {
                "categoryID": 0,
                "name": ""
              },
              "termKey": "",
              "name": "",
              "englishName": "",
              "excerpt": "",
              "content": "",
              "created": "",
              "modified": "",
              "views": 0,
              "videoUrl": ""
            }
          ]
  - name: 404 Response
    description: Thuật ngữ không tồn tại
    request:
      url: "{{baseUrl}}/investopedia/terms/:termKey"
      method: GET
      params:
        - name: termKey
          value: ""
          type: path
          description: Tên thuật ngữ
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
