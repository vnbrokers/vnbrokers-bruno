info:
  name: Tìm kiếm thuật ngữ theo từ khóa
  type: http
  seq: 3
  tags:
    - Investopedia

http:
  method: GET
  url: "{{baseUrl}}/investopedia/terms/search"
  params:
    - name: keywords
      value: ""
      type: query
      description: Từ khóa
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/investopedia/terms/search"
      method: GET
      params:
        - name: keywords
          value: ""
          type: query
          description: Từ khóa
        - name: offset
          value: ""
          type: query
          description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
          disabled: true
        - name: limit
          value: ""
          type: query
          description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "termId": 0,
              "categoryId": 0,
              "category": {
                "categoryID": 0,
                "name": ""
              },
              "termKey": "",
              "name": "",
              "englishName": "",
              "excerpt": "",
              "content": "",
              "created": "",
              "modified": "",
              "views": 0,
              "videoUrl": ""
            }
          ]
  - name: 404 Response
    description: Thuật ngữ không tồn tại
    request:
      url: "{{baseUrl}}/investopedia/terms/search"
      method: GET
      params:
        - name: keywords
          value: ""
          type: query
          description: Từ khóa
        - name: offset
          value: ""
          type: query
          description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
          disabled: true
        - name: limit
          value: ""
          type: query
          description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
          disabled: true
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
