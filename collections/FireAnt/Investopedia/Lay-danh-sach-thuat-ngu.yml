info:
  name: Lấy danh sách thuật ngữ
  type: http
  seq: 1
  tags:
    - Investopedia

http:
  method: GET
  url: "{{baseUrl}}/investopedia/terms"
  params:
    - name: categoryId
      value: ""
      type: query
      description: Lọc theo danh mục
      disabled: true
    - name: startWith
      value: ""
      type: query
      description: Lọc theo chữ cái đầu
      disabled: true
    - name: isMostRead
      value: ""
      type: query
      description: Lọc theo thuật ngữ nhiều người xem nhất
      disabled: true
    - name: isLastest
      value: ""
      type: query
      description: Lọc theo thuật ngữ mới nhất
      disabled: true
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

