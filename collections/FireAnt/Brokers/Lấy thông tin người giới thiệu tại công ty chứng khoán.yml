info:
  name: Lấy thông tin người giới thiệu tại công ty chứng khoán.
  type: http
  seq: 7
  tags:
    - Brokers

http:
  method: GET
  url: "{{baseUrl}}/brokers/:brokerId/referrer-info"
  params:
    - name: brokerId
      value: ""
      type: path
      description: "Id của công ty chứng khoán (VD: BSC, Shinhan...)"
    - name: referrerCode
      value: ""
      type: query
      description: Mã người giới thiệu
    - name: referrenceCode
      value: ""
      type: query
      description: "Mã giới thiệu (mặc định: fireant)"
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: accounts-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/brokers/:brokerId/referrer-info"
      method: GET
      params:
        - name: brokerId
          value: ""
          type: path
          description: "Id của công ty chứng khoán (VD: BSC, Shinhan...)"
        - name: referrerCode
          value: ""
          type: query
          description: Mã người giới thiệu
        - name: referrenceCode
          value: ""
          type: query
          description: "Mã giới thiệu (mặc định: fireant)"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "referrerName": "",
            "referrerCode": ""
          }
  - name: 400 Response
    description: Thông tin người giới thiệu không chính xác
