info:
  name: Lấy liên kết dùng để kết nối tài khoản tại công ty chứng khoán với tài khoản FireAnt.
  type: http
  seq: 2
  tags:
    - Brokers

http:
  method: GET
  url: "{{baseUrl}}/brokers/:brokerId/link-user-url"
  params:
    - name: brokerId
      value: ""
      type: path
      description: "Id của công ty chứng khoán (VD: BSC,...)"
    - name: returnUrl
      value: ""
      type: query
      description: Liên kết quay về sau khi kết nối thành công
      disabled: true
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: accounts-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/brokers/:brokerId/link-user-url"
      method: GET
      params:
        - name: brokerId
          value: ""
          type: path
          description: "Id của công ty chứng khoán (VD: BSC,...)"
        - name: returnUrl
          value: ""
          type: query
          description: Liên kết quay về sau khi kết nối thành công
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Công ty chứng khoán không tồn tại
    request:
      url: "{{baseUrl}}/brokers/:brokerId/link-user-url"
      method: GET
      params:
        - name: brokerId
          value: ""
          type: path
          description: "Id của công ty chứng khoán (VD: BSC,...)"
        - name: returnUrl
          value: ""
          type: query
          description: Liên kết quay về sau khi kết nối thành công
          disabled: true
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
