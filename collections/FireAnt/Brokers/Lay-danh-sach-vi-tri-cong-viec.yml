info:
  name: Lấy danh sách vị trí công việc.
  type: http
  seq: 6
  tags:
    - Brokers

http:
  method: GET
  url: "{{baseUrl}}/brokers/:brokerId/job-positions"
  params:
    - name: brokerId
      value: ""
      type: path
      description: "Id của công ty chứng khoán (VD: BSC,...)"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/brokers/:brokerId/job-positions"
      method: GET
      params:
        - name: brokerId
          value: ""
          type: path
          description: "Id của công ty chứng khoán (VD: BSC,...)"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": ""
          }
  - name: 404 Response
    description: Công ty chứng khoán không tồn tại
    request:
      url: "{{baseUrl}}/brokers/:brokerId/job-positions"
      method: GET
      params:
        - name: brokerId
          value: ""
          type: path
          description: "Id của công ty chứng khoán (VD: BSC,...)"
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
