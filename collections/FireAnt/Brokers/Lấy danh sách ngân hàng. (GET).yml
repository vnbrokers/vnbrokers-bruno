info:
  name: Lấy danh sách ngân hàng. (GET)
  type: http
  seq: 9
  tags:
    - Brokers

http:
  method: GET
  url: "{{baseUrl}}/brokers/:brokerId/cif-branches/:branch"
  params:
    - name: brokerId
      value: ""
      type: path
      description: "Id của công ty chứng khoán (VD: BSC,...)"
    - name: branch
      value: ""
      type: path
      description: Id của chi nhánh
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: accounts-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/brokers/:brokerId/cif-branches/:branch"
      method: GET
      params:
        - name: brokerId
          value: ""
          type: path
          description: "Id của công ty chứng khoán (VD: BSC,...)"
        - name: branch
          value: ""
          type: path
          description: Id của chi nhánh
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": ""
          }
  - name: 404 Response
    description: Công ty chứng khoán không tồn tại
    request:
      url: "{{baseUrl}}/brokers/:brokerId/cif-branches/:branch"
      method: GET
      params:
        - name: brokerId
          value: ""
          type: path
          description: "Id của công ty chứng khoán (VD: BSC,...)"
        - name: branch
          value: ""
          type: path
          description: Id của chi nhánh
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
