info:
  name: Lấy common banners.
  type: http
  seq: 12
  tags:
    - Brokers

http:
  method: GET
  url: "{{baseUrl}}/brokers/:brokerId/common-banners"
  params:
    - name: brokerId
      value: ""
      type: path
      description: "Id của công ty chứng khoán (VD: BSC,...)"
    - name: status
      value: ""
      type: query
      description: Trạng thái của banner (optional)
      disabled: true
    - name: type
      value: ""
      type: query
      description: "Loại banner (5: banner chính, 6: banner khuyến mại) (optional)"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/brokers/:brokerId/common-banners"
      method: GET
      params:
        - name: brokerId
          value: ""
          type: path
          description: "Id của công ty chứng khoán (VD: BSC,...)"
        - name: status
          value: ""
          type: query
          description: Trạng thái của banner (optional)
          disabled: true
        - name: type
          value: ""
          type: query
          description: "Loại banner (5: banner chính, 6: banner khuyến mại) (optional)"
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
