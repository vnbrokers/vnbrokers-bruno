info:
  name: Lấy tên tài khoản tại công ty chứng khoán theo số chứng minh thư
  type: http
  seq: 4
  tags:
    - Brokers

http:
  method: GET
  url: "{{baseUrl}}/brokers/:brokerId/users/:identityNumber"
  params:
    - name: brokerId
      value: ""
      type: path
      description: "Id của công ty chứng khoán (VD: BSC,...)"
    - name: identityNumber
      value: ""
      type: path
      description: Số chứng minh thư
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/brokers/:brokerId/users/:identityNumber"
      method: GET
      params:
        - name: brokerId
          value: ""
          type: path
          description: "Id của công ty chứng khoán (VD: BSC,...)"
        - name: identityNumber
          value: ""
          type: path
          description: Số chứng minh thư
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: Công ty chứng khoán không tồn tại
    request:
      url: "{{baseUrl}}/brokers/:brokerId/users/:identityNumber"
      method: GET
      params:
        - name: brokerId
          value: ""
          type: path
          description: "Id của công ty chứng khoán (VD: BSC,...)"
        - name: identityNumber
          value: ""
          type: path
          description: Số chứng minh thư
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
