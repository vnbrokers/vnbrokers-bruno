info:
  name: Trả về danh sách lệnh khớp trong phiên của 1 mã chứng khoán
  type: http
  seq: 1
  tags:
    - Executions

http:
  method: GET
  url: "{{baseUrl}}/broker-users/:userId/accounts/:accountId/executions"
  params:
    - name: userId
      value: ""
      type: path
      description: Id của user đã kết nối vào tài khoản FireAnt
    - name: accountId
      value: ""
      type: path
      description: Id tài khoản tại công ty chứng khoán của user
    - name: instrument
      value: ""
      type: query
      description: Mã chứng khoán
    - name: maxCount
      value: ""
      type: query
      description: Số lượng bản ghi tối đa
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: orders-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/broker-users/:userId/accounts/:accountId/executions"
      method: GET
      params:
        - name: userId
          value: ""
          type: path
          description: Id của user đã kết nối vào tài khoản FireAnt
        - name: accountId
          value: ""
          type: path
          description: Id tài khoản tại công ty chứng khoán của user
        - name: instrument
          value: ""
          type: query
          description: Mã chứng khoán
        - name: maxCount
          value: ""
          type: query
          description: Số lượng bản ghi tối đa
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
