info:
  name: Lấy danh sách tài sản của một cá nhân
  type: http
  seq: 6
  tags:
    - Individuals

http:
  method: GET
  url: "{{baseUrl}}/individuals/:individualId/assets"
  params:
    - name: individualId
      value: ""
      type: path
      description: ID của cá nhân
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: individuals-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/individuals/:individualId/assets"
      method: GET
      params:
        - name: individualId
          value: ""
          type: path
          description: ID của cá nhân
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "majorHolderID": 0,
              "individualID": 0,
              "isFounder": false,
              "institutionID": 0,
              "ownership": 0,
              "shares": 0,
              "value": 0,
              "institutionName": "",
              "institutionIsListing": false,
              "institutionSymbol": ""
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/individuals/:individualId/assets"
      method: GET
      params:
        - name: individualId
          value: ""
          type: path
          description: ID của cá nhân
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
