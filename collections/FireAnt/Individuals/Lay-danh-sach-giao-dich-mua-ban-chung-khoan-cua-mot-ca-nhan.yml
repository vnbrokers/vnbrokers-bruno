info:
  name: Lấy danh sách giao dịch mua/bán chứng khoán của một cá nhân
  type: http
  seq: 8
  tags:
    - Individuals

http:
  method: GET
  url: "{{baseUrl}}/individuals/:individualId/transactions"
  params:
    - name: individualId
      value: ""
      type: path
      description: ID của cá nhân
    - name: executedOnly
      value: ""
      type: query
      description: Chỉ lấy giao dịch đã thưc hiện
      disabled: true
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/individuals/:individualId/transactions"
      method: GET
      params:
        - name: individualId
          value: ""
          type: path
          description: ID của cá nhân
        - name: executedOnly
          value: ""
          type: query
          description: Chỉ lấy giao dịch đã thưc hiện
          disabled: true
        - name: offset
          value: ""
          type: query
          description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
          disabled: true
        - name: limit
          value: ""
          type: query
          description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "transactionID": 0,
              "majorHolderID": 0,
              "individualHolderID": 0,
              "institutionHolderID": 0,
              "institutionHolderSymbol": "",
              "institutionHolderExchange": "",
              "name": "",
              "position": "",
              "symbol": "",
              "type": 0,
              "executionVolume": 0,
              "executionDate": "",
              "startDate": "",
              "endDate": "",
              "registeredVolume": 0
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/individuals/:individualId/transactions"
      method: GET
      params:
        - name: individualId
          value: ""
          type: path
          description: ID của cá nhân
        - name: executedOnly
          value: ""
          type: query
          description: Chỉ lấy giao dịch đã thưc hiện
          disabled: true
        - name: offset
          value: ""
          type: query
          description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
          disabled: true
        - name: limit
          value: ""
          type: query
          description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
