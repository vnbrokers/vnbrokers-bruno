info:
  name: Lấy hồ sơ một cá nhân
  type: http
  seq: 4
  tags:
    - Individuals

http:
  method: GET
  url: "{{baseUrl}}/individuals/:individualId/profile"
  params:
    - name: individualId
      value: ""
      type: path
      description: ID của cá nhân
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/individuals/:individualId/profile"
      method: GET
      params:
        - name: individualId
          value: ""
          type: path
          description: ID của cá nhân
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "individualID": 0,
            "isForeign": false,
            "name": "",
            "bio": "",
            "gender": 0,
            "hasPhoto": false,
            "photoURL": "",
            "dateOfBirth": "",
            "homeTown": "",
            "education": 0,
            "placeOfBirth": "",
            "isDead": false,
            "symbol": "",
            "positionName": "",
            "institutionName": "",
            "institutionIsListing": false,
            "institutionSymbol": "",
            "asset": 0
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/individuals/:individualId/profile"
      method: GET
      params:
        - name: individualId
          value: ""
          type: path
          description: ID của cá nhân
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
