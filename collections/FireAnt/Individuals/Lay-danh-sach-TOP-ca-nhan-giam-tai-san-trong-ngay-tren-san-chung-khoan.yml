info:
  name: Lấy danh sách TOP cá nhân giảm tài sản trong ngày trên sàn chứng khoán
  type: http
  seq: 11
  tags:
    - Individuals

http:
  method: GET
  url: "{{baseUrl}}/individuals/losers"
  params:
    - name: industryCode
      value: ""
      type: query
      description: Lọc theo ngành (mã ngành ICB hoặc để trống để lấy tất cả), mặc định lấy tất cả ngành
      disabled: true
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

