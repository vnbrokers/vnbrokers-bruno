  type: http
  seq: 28
  tags:
    - Fmarket

http:
  method: POST
  url: "{{baseUrl}}/fmarket/markets/get-product-detail"
  body:
    type: json
    data: |-
      {
        "product_id": ""
      }
  auth: inherit

settings:
