info:
  name: Check if an account is already registered
  type: http
  seq: 1
  tags:
    - Fmarket

http:
  method: POST
  url: "{{baseUrl}}/fmarket/accounts/is-register"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/fmarket/accounts/is-register"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "fmarket_id": "",
            "full_name": "",
            "id_no": "",
            "cell_phone": "",
            "email": ""
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/fmarket/accounts/is-register"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
