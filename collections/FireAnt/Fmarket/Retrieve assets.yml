info:
  name: Retrieve assets
  type: http
  seq: 27
  tags:
    - Fmarket

http:
  method: POST
  url: "{{baseUrl}}/fmarket/assets/filter-assets"
  body:
    type: json
    data: |-
      {
        "fmarket_id": "",
        "page": 0,
        "page_size": 0
      }
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/fmarket/assets/filter-assets"
      method: POST
      body:
        type: json
        data: |-
          {
            "fmarket_id": "",
            "page": 0,
            "page_size": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "page": 0,
            "page_size": 0,
            "total_items": 0,
            "items": [
              {
                "code": "",
                "create_date": 0,
                "create_date_format": "",
                "purchase_price": 0,
