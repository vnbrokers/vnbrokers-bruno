info:
  name: Confirm purchase order (POST)
  type: http
  seq: 14
  tags:
    - Fmarket

http:
  method: POST
  url: "{{baseUrl}}/fmarket/v2/orders/create-purchase-order/confirm"
  body:
    type: json
    data: |-
      {
        "fmarket_id": "",
        "verification_id": "",
        "verification_token": ""
      }
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/fmarket/v2/orders/create-purchase-order/confirm"
      method: POST
      body:
        type: json
        data: |-
          {
            "fmarket_id": "",
            "verification_id": "",
            "verification_token": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "order_code": ""
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/fmarket/v2/orders/create-purchase-order/confirm"
      method: POST
      body:
        type: json
        data: |-
          {
            "fmarket_id": "",
            "verification_id": "",
            "verification_token": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
