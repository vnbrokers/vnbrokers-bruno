info:
  name: Retrieve transaction list
  type: http
  seq: 25
  tags:
    - Fmarket

http:
  method: POST
  url: "{{baseUrl}}/fmarket/orders/filter-transactions"
  body:
    type: json
    data: |-
      {
        "fmarket_id": "",
        "page": 0,
        "page_size": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

