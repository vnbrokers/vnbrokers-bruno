info:
  name: Get nationality list
  type: http
  seq: 32
  tags:
    - Fmarket

http:
  method: POST
  url: "{{baseUrl}}/fmarket/static/nationalities"
  body:
    type: json
    data: |-
      {
        "page": 0,
        "page_size": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/fmarket/static/nationalities"
      method: POST
      body:
        type: json
        data: |-
          {
            "page": 0,
            "page_size": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "page": 0,
            "page_size": 0,
            "total_items": 0,
            "items": [
              {
                "id": 0,
                "name": ""
              }
            ]
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/fmarket/static/nationalities"
      method: POST
      body:
        type: json
        data: |-
          {
            "page": 0,
            "page_size": 0
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
