info:
  name: Create linked fmarket account
  type: http
  seq: 4
  tags:
    - Fmarket

http:
  method: POST
  url: "{{baseUrl}}/fmarket/accounts/link-account/create"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/fmarket/accounts/link-account/create"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "verification_id": "",
            "verification_token_required": "",
            "verification_token_expire_time": ""
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/fmarket/accounts/link-account/create"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
