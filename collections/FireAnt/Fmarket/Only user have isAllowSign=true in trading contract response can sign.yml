info:
  name: Only user have isAllowSign=true in trading contract response can sign
  type: http
  seq: 8
  tags:
    - Fmarket

http:
  method: POST
  url: "{{baseUrl}}/fmarket/accounts/esign/create"
  body:
    type: json
    data: |-
      {
        "fmarket_id": "",
        "trading_contract_id": 0,
        "base64_file": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/fmarket/accounts/esign/create"
      method: POST
      body:
        type: json
        data: |-
          {
            "fmarket_id": "",
            "trading_contract_id": 0,
            "base64_file": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "verification_id": "",
            "verification_token_required": false,
            "verification_token_expire_time": 0
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/fmarket/accounts/esign/create"
      method: POST
      body:
        type: json
        data: |-
          {
            "fmarket_id": "",
            "trading_contract_id": 0,
            "base64_file": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
