info:
  name: Retrieve Fmarket’s account detail
  type: http
  seq: 3
  tags:
    - Fmarket

http:
  method: POST
  url: "{{baseUrl}}/fmarket/accounts/get-account-info"
  body:
    type: json
    data: |-
      {
        "fmarket_id": ""
      }
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/fmarket/accounts/get-account-info"
      method: POST
      body:
        type: json
        data: |-
          {
            "fmarket_id": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "fmarket_id": "",
            "full_name": "",
            "email": "",
            "email_verified": false,
            "cell_phone": "",
            "cell_phone_verified": false,
            "gender": 0,
            "dob": "",
            "province_id": 0,
            "nationality_id": "",
            "nationality_label": "",
            "id_type": "",
            "id_no": "",
            "id_date_of_issue": "",
            "id_place_of_issue": "",
            "id_front_photo_url": "",
            "id_back_photo_url": "",
            "permanent_address": "",
            "mailing_address": "",
            "bank_account_no": {
              "bank_id": "",
              "bank_swift_code": "",
              "bank_name": "",
              "bank_branch": "",
              "bank_acc_no": "",
              "bank_acc_name": "",
              "bin_code": ""
            },
            "contract_url": "",
            "is_linked": false,
            "is_kyc": false,
            "fatca_code": ""
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/fmarket/accounts/get-account-info"
      method: POST
      body:
        type: json
        data: |-
          {
            "fmarket_id": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
