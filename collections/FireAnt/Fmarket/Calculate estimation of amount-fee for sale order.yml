info:
  name: Calculate estimation of amount/fee for sale order
  type: http
  seq: 15
  tags:
    - Fmarket

http:
  method: POST
  url: "{{baseUrl}}/fmarket/orders/estimate-sale"
  body:
    type: json
    data: |-
      {
        "fmarket_id": "",
        "product_id": 0,
        "volume": 0,
        "program_id": 0
      }
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/fmarket/orders/estimate-sale"
      method: POST
      body:
        type: json
        data: |-
          {
            "fmarket_id": "",
            "product_id": 0,
            "volume": 0,
            "program_id": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "estimate_value": 0,
            "estimate_fee_percent": 0,
            "estimate_fee_amount": 0
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/fmarket/orders/estimate-sale"
      method: POST
      body:
        type: json
        data: |-
          {
            "fmarket_id": "",
            "product_id": 0,
            "volume": 0,
            "program_id": 0
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
