info:
  name: Confirm sign
  type: http
  seq: 9
  tags:
    - Fmarket

http:
  method: POST
  url: "{{baseUrl}}/fmarket/accounts/esign/confirm"
  body:
    type: json
    data: |-
      {
        "fmarket_id": "",
        "verification_id": "",
        "verification_token": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

