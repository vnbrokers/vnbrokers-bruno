info:
  name: Query list of products
  type: http
  seq: 29
  tags:
    - Fmarket

http:
  method: POST
  url: "{{baseUrl}}/fmarket/markets/filter-products"
  body:
    type: json
    data: |-
      {
        "page": 0,
        "page_size": 0,
        "fundAssetTypes": [],
        "sortField": "",
        "sortOrder": ""
      }
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

