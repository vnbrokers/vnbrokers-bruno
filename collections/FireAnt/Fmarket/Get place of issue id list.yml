info:
  name: Get place of issue id list
  type: http
  seq: 33
  tags:
    - Fmarket

http:
  method: POST
  url: "{{baseUrl}}/fmarket/static/place-of-issue-id-list"
  body:
    type: json
    data: |-
      {
        "page": 0,
        "page_size": 0
      }
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/fmarket/static/place-of-issue-id-list"
      method: POST
      body:
        type: json
        data: |-
          {
            "page": 0,
            "page_size": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "page": 0,
            "page_size": 0,
            "total_items": 0,
            "items": [
              {
                "id": 0,
                "name": "",
                "administrative_code": ""
              }
            ]
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/fmarket/static/place-of-issue-id-list"
      method: POST
      body:
        type: json
        data: |-
          {
            "page": 0,
            "page_size": 0
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
