info:
  name: Danh sách user mới đăng ký hôm trước
  type: http
  seq: 3
  tags:
    - Admin

http:
  method: GET
  url: "{{baseUrl}}/admin/yesterday-new-users"
  params:
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
