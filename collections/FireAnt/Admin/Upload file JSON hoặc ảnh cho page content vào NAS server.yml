info:
  name: Upload file JSON hoặc ảnh cho page content vào NAS server.
  type: http
  seq: 6
  tags:
    - Admin

http:
  method: POST
  url: "{{baseUrl}}/admin/upload-ads-content"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/admin/upload-ads-content"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/admin/upload-ads-content"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Không có quyền thực hiện hành động
    request:
      url: "{{baseUrl}}/admin/upload-ads-content"
      method: POST
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
