info:
  name: Lấy danh sách thành viên nhóm
  type: http
  seq: 15
  tags:
    - Rooms

http:
  method: GET
  url: "{{baseUrl}}/rooms/:roomId/members"
  params:
    - name: roomId
      value: ""
      type: path
      description: Id nhóm
    - name: keywords
      value: ""
      type: query
      description: Từ khóa tìm kiếm (null để lấy tất)
      disabled: true
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/rooms/:roomId/members"
      method: GET
      params:
        - name: roomId
          value: ""
          type: path
          description: Id nhóm
        - name: keywords
          value: ""
          type: query
          description: Từ khóa tìm kiếm (null để lấy tất)
          disabled: true
        - name: offset
          value: ""
          type: query
          description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
          disabled: true
        - name: limit
          value: ""
          type: query
          description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "name": "",
              "bio": "",
              "followed": false,
              "roomID": 0,
              "memberID": 0,
              "role": 0
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
