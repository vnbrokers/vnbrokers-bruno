info:
  name: Lấy danh sách các yêu cầu tham giá nhóm đang chờ
  type: http
  seq: 10
  tags:
    - Rooms

http:
  method: GET
  url: "{{baseUrl}}/rooms/:roomId/requests"
  params:
    - name: roomId
      value: ""
      type: path
      description: Id nhóm
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/rooms/:roomId/requests"
      method: GET
      params:
        - name: roomId
          value: ""
          type: path
          description: Id nhóm
        - name: offset
          value: ""
          type: query
          description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
          disabled: true
        - name: limit
          value: ""
          type: query
          description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "requestID": 0,
              "requestedDate": "",
              "user": {
                "id": "",
                "name": "",
                "bio": "",
                "isAuthentic": false,
                "followed": false
              }
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/rooms/:roomId/requests"
      method: GET
      params:
        - name: roomId
          value: ""
          type: path
          description: Id nhóm
        - name: offset
          value: ""
          type: query
          description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
          disabled: true
        - name: limit
          value: ""
          type: query
          description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
