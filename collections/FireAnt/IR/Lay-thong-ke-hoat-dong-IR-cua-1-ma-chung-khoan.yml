info:
  name: Lấy thống kê hoạt động IR của 1 mã chứng khoán
  type: http
  seq: 3
  tags:
    - IR

http:
  method: GET
  url: "{{baseUrl}}/ir/latest-statistics/:symbol"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã chứng khoán
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/ir/latest-statistics/:symbol"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "symbol": "",
            "lastUpdated": "",
            "statistics": {}
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/ir/latest-statistics/:symbol"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
