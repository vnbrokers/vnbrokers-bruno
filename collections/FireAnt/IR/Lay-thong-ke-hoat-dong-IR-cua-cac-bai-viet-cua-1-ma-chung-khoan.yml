    description: Thành công
    request:
      url: "{{baseUrl}}/ir/post-statistics/:symbol"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán
        - name: fromDate
          value: ""
          type: query
          description: Từ ngày
        - name: toDate
          value: ""
          type: query
          description: Đến ngày
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
