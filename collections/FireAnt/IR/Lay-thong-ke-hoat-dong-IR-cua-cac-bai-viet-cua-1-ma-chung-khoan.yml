info:
  name: Lấy thống kê hoạt động IR của các bài viết của 1 mã chứng khoán
  type: http
  seq: 5
  tags:
    - IR

http:
  method: GET
  url: "{{baseUrl}}/ir/post-statistics/:symbol"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã chứng khoán
    - name: fromDate
      value: ""
      type: query
      description: Từ ngày
    - name: toDate
      value: ""
      type: query
      description: Đến ngày
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
