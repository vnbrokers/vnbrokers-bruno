info:
  name: Lấy tất cả hợp đồng IR
  type: http
  seq: 1
  tags:
    - IR

http:
  method: GET
  url: "{{baseUrl}}/ir/contracts"
  params:
    - name: type
      value: ""
      type: query
      description: "Loại hợp đồng (0: Tất cả, 1: Còn hạn, 2: Sắp hết hạn, mặc định là 0)"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/ir/contracts"
      method: GET
      params:
        - name: type
          value: ""
          type: query
          description: "Loại hợp đồng (0: Tất cả, 1: Còn hạn, 2: Sắp hết hạn, mặc định là 0)"
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "symbol": "",
              "status": "",
              "endDate": "",
              "daysRemaining": 0,
              "contractCode": ""
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/ir/contracts"
      method: GET
      params:
        - name: type
          value: ""
          type: query
          description: "Loại hợp đồng (0: Tất cả, 1: Còn hạn, 2: Sắp hết hạn, mặc định là 0)"
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
