info:
  name: Lấy lịch sử hoạt động IR của 1 mã chứng khoán
  type: http
  seq: 4
  tags:
    - IR

http:
  method: GET
  url: "{{baseUrl}}/ir/historical-statistics/:symbol"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã chứng khoán
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
    - name: periodType
      value: ""
      type: query
      description: "Khoảng thời gian (Day: Ngày, Week: Tuần, Month: Tháng, mặc định là Day)"
      disabled: true
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/ir/historical-statistics/:symbol"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán
        - name: limit
          value: ""
          type: query
          description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
          disabled: true
        - name: periodType
          value: ""
          type: query
          description: "Khoảng thời gian (Day: Ngày, Week: Tuần, Month: Tháng, mặc định là Day)"
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "symbol": "",
            "lastUpdated": "",
            "statistics": {}
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/ir/historical-statistics/:symbol"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán
        - name: limit
          value: ""
          type: query
          description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
          disabled: true
        - name: periodType
          value: ""
          type: query
          description: "Khoảng thời gian (Day: Ngày, Week: Tuần, Month: Tháng, mặc định là Day)"
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
