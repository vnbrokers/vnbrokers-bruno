info:
  name: Ra quyết định với lời mời tham gia nhóm
  type: http
  seq: 80
  tags:
    - Me

http:
  method: PUT
  url: "{{baseUrl}}/me/room-invitations/:invitationId"
  params:
    - name: invitationId
      value: ""
      type: path
      description: Id nhóm
  body:
    type: json
    data: |-
      {
        "accepted": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/room-invitations/:invitationId"
      method: PUT
      params:
        - name: invitationId
          value: ""
          type: path
          description: Id nhóm
      body:
        type: json
        data: |-
          {
            "accepted": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/room-invitations/:invitationId"
      method: PUT
      params:
        - name: invitationId
          value: ""
          type: path
          description: Id nhóm
      body:
        type: json
        data: |-
          {
            "accepted": false
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
