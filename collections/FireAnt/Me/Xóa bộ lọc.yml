info:
  name: Xóa bộ lọc
  type: http
  seq: 74
  tags:
    - Me

http:
  method: DELETE
  url: "{{baseUrl}}/me/screeners/:id"
  params:
    - name: id
      value: ""
      type: path
      description: Id của bộ lọc
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/screeners/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
          description: Id của bộ lọc
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/screeners/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
          description: Id của bộ lọc
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
