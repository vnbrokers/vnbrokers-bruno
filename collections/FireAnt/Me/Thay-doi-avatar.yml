info:
  name: Thay đổi avatar
  type: http
  seq: 22
  tags:
    - Me

http:
  method: PUT
  url: "{{baseUrl}}/me/avatar"
  body:
    type: json
    data: |-
      {
        "avatar": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/avatar"
      method: PUT
      body:
        type: json
        data: |-
          {
            "avatar": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "false"
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/avatar"
      method: PUT
      body:
        type: json
        data: |-
          {
            "avatar": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
