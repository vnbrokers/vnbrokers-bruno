info:
  name: Thêm tài khoản ngân hàng
  type: http
  seq: 100
  tags:
    - Me

http:
  method: POST
  url: "{{baseUrl}}/me/bank-accounts"
  body:
    type: json
    data: |-
      {
        "bankID": 0,
        "accountNo": "",
        "accountName": "",
        "bankBranch": "",
        "otp": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/bank-accounts"
      method: POST
      body:
        type: json
        data: |-
          {
            "bankID": 0,
            "accountNo": "",
            "accountName": "",
            "bankBranch": "",
            "otp": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "bankAccountID": 0,
            "bankID": 0,
            "userName": "",
            "bankBranch": "",
            "accountNo": "",
            "accountName": ""
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/bank-accounts"
      method: POST
      body:
        type: json
        data: |-
          {
            "bankID": 0,
            "accountNo": "",
            "accountName": "",
            "bankBranch": "",
            "otp": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
