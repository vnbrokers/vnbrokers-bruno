info:
  name: Lấy số điện thoại của user
  type: http
  seq: 10
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/phone-number"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/phone-number"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "phoneNumber": "",
            "confirmed": false
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/phone-number"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
