info:
  name: Lấy các mã chứng khoán gần đây mà user đã xem
  type: http
  seq: 2
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/recent-symbols"
  params:
    - name: anonymousUserID
      value: ""
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/recent-symbols"
      method: GET
      params:
        - name: anonymousUserID
          value: ""
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/recent-symbols"
      method: GET
      params:
        - name: anonymousUserID
          value: ""
          type: query
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
