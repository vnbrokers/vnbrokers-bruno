info:
  name: Lấy danh sách bộ lọc
  type: http
  seq: 70
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/screeners"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/screeners"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "name": "",
              "description": "",
              "lastUpdated": "",
              "conditions": {}
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/screeners"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
