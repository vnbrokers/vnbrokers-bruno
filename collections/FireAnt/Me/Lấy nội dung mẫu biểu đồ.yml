  type: http
  seq: 54
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/chart-templates/:templateID"
  params:
    - name: templateID
      value: ""
      type: path
      description: ID mẫu biểu đồ
  auth: inherit

settings:
