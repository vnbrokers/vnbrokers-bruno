      type: query
      description: Id của cảnh báo
      disabled: true
    - name: symbol
      value: ""
      type: query
      description: Mã chứng khoán
      disabled: true
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
