info:
  name: Lấy thông tin các sản phẩm người dùng đã mua
  type: http
  seq: 17
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/purchased-items"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/purchased-items"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "serviceID": 0,
              "packageID": 0,
              "name": "",
              "orderID": 0,
              "amount": 0,
              "orderDate": ""
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/purchased-items"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
