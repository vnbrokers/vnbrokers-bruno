info:
  name: Thêm đăng ký nhận cảnh báo
  type: http
  seq: 62
  tags:
    - Me

http:
  method: POST
  url: "{{baseUrl}}/me/alerts"
  body:
    type: json
    data: |-
      {
        "id": "",
        "definitionId": "",
        "options": {},
        "parameters": {},
        "preventPopup": false
      }
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

