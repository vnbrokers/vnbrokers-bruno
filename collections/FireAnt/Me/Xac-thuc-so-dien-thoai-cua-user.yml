info:
  name: Xác thực số điện thoại của user
  type: http
  seq: 12
  tags:
    - Me

http:
  method: POST
  url: "{{baseUrl}}/me/phone-number/verify"
  body:
    type: json
    data: |-
      {
        "phoneNumber": "",
        "code": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/phone-number/verify"
      method: POST
      body:
        type: json
        data: |-
          {
            "phoneNumber": "",
            "code": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "verified": false
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/phone-number/verify"
      method: POST
      body:
        type: json
        data: |-
          {
            "phoneNumber": "",
            "code": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
