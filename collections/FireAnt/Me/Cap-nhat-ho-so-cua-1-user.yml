    description: Thành công
    request:
      url: "{{baseUrl}}/me/profile"
      method: PUT
      body:
        type: json
        data: |-
          {
            "userName": "",
            "name": "",
            "bio": "",
            "address": "",
            "facebookLink": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "status": "",
            "isExpert": false,
            "isTeacher": false,
            "bio": "",
            "address": "",
            "facebookLink": "",
            "totalPosts": 0,
            "totalLikes": 0,
            "followers": 0,
            "following": 0,
            "followed": false,
            "blocked": false,
            "beingBlocked": false,
