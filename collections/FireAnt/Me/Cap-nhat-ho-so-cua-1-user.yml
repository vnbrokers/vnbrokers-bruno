info:
  name: Cập nhật hồ sơ của 1 user
  type: http
  seq: 14
  tags:
    - Me

http:
  method: PUT
  url: "{{baseUrl}}/me/profile"
  body:
    type: json
    data: |-
      {
        "userName": "",
        "name": "",
        "bio": "",
        "address": "",
        "facebookLink": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
