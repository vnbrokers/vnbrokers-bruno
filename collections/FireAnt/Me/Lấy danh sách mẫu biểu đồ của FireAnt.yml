info:
  name: Lấy danh sách mẫu biểu đồ của FireAnt
  type: http
  seq: 53
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/fireant-chart-templates"
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/fireant-chart-templates"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "chartTemplateID": 0,
              "name": "",
              "description": "",
              "userName": "",
              "symbol": "",
              "interval": "",
              "state": "",
              "template": "",
              "lastUpdated": "",
              "sharing": false,
              "isSystem": false
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/fireant-chart-templates"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
