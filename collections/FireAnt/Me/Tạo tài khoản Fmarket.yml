          value: application/json
      body:
        type: json
        data: "{}"
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/fmarket-account"
      method: POST
      body:
        type: json
        data: |-
          {
