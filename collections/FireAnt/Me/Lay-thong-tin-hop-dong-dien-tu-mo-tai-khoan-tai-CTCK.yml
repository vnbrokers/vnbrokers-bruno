info:
  name: Lấy thông tin hợp đồng điện tử mở tài khoản tại CTCK.
  type: http
  seq: 90
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/broker-user/:brokerId/econtract"
  params:
    - name: brokerId
      value: ""
      type: path
      description: "Id của công ty chứng khoán (VD: BSC, Shinhan,...)"
    - name: accountNumber
      value: ""
      type: query
      description: Số tài khoản ứng với hợp đồng
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/broker-user/:brokerId/econtract"
      method: GET
      params:
        - name: brokerId
          value: ""
          type: path
          description: "Id của công ty chứng khoán (VD: BSC, Shinhan,...)"
        - name: accountNumber
          value: ""
          type: query
          description: Số tài khoản ứng với hợp đồng
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "contractId": "",
            "envId": "",
            "url": "",
            "cookieName": "",
            "cookieValue": "",
            "expireTime": 0,
            "userName": "",
            "password": "",
            "iframeUrl": ""
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/broker-user/:brokerId/econtract"
      method: GET
      params:
        - name: brokerId
          value: ""
          type: path
          description: "Id của công ty chứng khoán (VD: BSC, Shinhan,...)"
        - name: accountNumber
          value: ""
          type: query
          description: Số tài khoản ứng với hợp đồng
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
