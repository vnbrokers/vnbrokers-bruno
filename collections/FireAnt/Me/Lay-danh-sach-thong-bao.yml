info:
  name: Lấy danh sách thông báo
  type: http
  seq: 39
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/notifications"
  params:
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
