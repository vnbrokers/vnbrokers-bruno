info:
  name: Lấy danh sách mẫu biểu đồ được chia sẻ
  type: http
  seq: 52
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/following-chart-templates"
  params:
    - name: keywords
      value: ""
      type: query
      description: Từ khóa tìm kiếm
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/following-chart-templates"
      method: GET
      params:
        - name: keywords
          value: ""
          type: query
          description: Từ khóa tìm kiếm
        - name: offset
          value: ""
          type: query
          description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
          disabled: true
        - name: limit
          value: ""
          type: query
          description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
