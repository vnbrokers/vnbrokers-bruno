info:
  name: Link tài khoản đã có tại công ty chứng khoán.
  type: http
  seq: 87
  tags:
    - Me

http:
  method: POST
  url: "{{baseUrl}}/me/broker-user/:brokerId/link"
  params:
    - name: brokerId
      value: ""
      type: path
      description: "Id của công ty chứng khoán (VD: BSC,...)"
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/broker-user/:brokerId/link"
      method: POST
      params:
        - name: brokerId
          value: ""
          type: path
          description: "Id của công ty chứng khoán (VD: BSC,...)"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/broker-user/:brokerId/link"
      method: POST
      params:
        - name: brokerId
          value: ""
          type: path
          description: "Id của công ty chứng khoán (VD: BSC,...)"
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
