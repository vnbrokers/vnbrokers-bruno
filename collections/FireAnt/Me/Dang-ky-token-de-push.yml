info:
  name: Đăng ký token để push
  type: http
  seq: 1
  tags:
    - Me

http:
  method: POST
  url: "{{baseUrl}}/me/push-tokens"
  body:
    type: json
    data: |-
      {
        "anonymousUserID": "",
        "token": "",
        "type": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/push-tokens"
      method: POST
      body:
        type: json
        data: |-
          {
            "anonymousUserID": "",
            "token": "",
            "type": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/push-tokens"
      method: POST
      body:
        type: json
        data: |-
          {
            "anonymousUserID": "",
            "token": "",
            "type": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
