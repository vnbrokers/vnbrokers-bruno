info:
  name: Upload file
  type: http
  seq: 112
  tags:
    - Me

http:
  method: POST
  url: "{{baseUrl}}/me/upload-file"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/upload-file"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/upload-file"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
