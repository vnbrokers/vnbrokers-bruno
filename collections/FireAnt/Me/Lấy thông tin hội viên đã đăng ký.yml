info:
  name: Lấy thông tin hội viên đã đăng ký
  type: http
  seq: 58
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/membership"
  params:
    - name: noCache
      value: ""
      type: query
      disabled: true
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/membership"
      method: GET
      params:
        - name: noCache
          value: ""
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "level": 0,
            "endDate": "",
            "applications": [
              {
                "id": 0,
                "version": 0,
                "endDate": ""
              }
            ]
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/membership"
      method: GET
      params:
        - name: noCache
          value: ""
          type: query
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
