info:
  name: Lấy danh sách cảnh báo điện thoại
  type: http
  seq: 65
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/mobile-alerts"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/mobile-alerts"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "symbol": "",
              "priceAbove": 0,
              "priceBelow": 0,
              "volumeAbove": 0,
              "new52WeekHigh": false,
              "new52WeekLow": false,
              "aboveMA5": false,
              "aboveMA10": false,
              "aboveMA20": false,
              "belowMA5": false,
              "belowMA10": false,
              "belowMA20": false
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/mobile-alerts"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
