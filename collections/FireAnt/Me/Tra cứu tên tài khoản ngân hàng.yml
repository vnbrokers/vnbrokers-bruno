info:
  name: Tra cứu tên tài khoản ngân hàng
  type: http
  seq: 101
  tags:
    - Me

http:
  method: POST
  url: "{{baseUrl}}/me/bank-accounts/lookup-name"
  body:
    type: json
    data: |-
      {
        "bankID": 0,
        "accountNo": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/bank-accounts/lookup-name"
      method: POST
      body:
        type: json
        data: |-
          {
            "bankID": 0,
            "accountNo": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/bank-accounts/lookup-name"
      method: POST
      body:
        type: json
        data: |-
          {
            "bankID": 0,
            "accountNo": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
