info:
  name: Thay đổi mật khẩu
  type: http
  seq: 20
  tags:
    - Me

http:
  method: PUT
  url: "{{baseUrl}}/me/password"
  body:
    type: json
    data: |-
      {
        "oldPassword": "",
        "newPassword": "",
        "confirmPassword": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/password"
      method: PUT
      body:
        type: json
        data: |-
          {
            "oldPassword": "",
            "newPassword": "",
            "confirmPassword": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "false"
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/password"
      method: PUT
      body:
        type: json
        data: |-
          {
            "oldPassword": "",
            "newPassword": "",
            "confirmPassword": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
