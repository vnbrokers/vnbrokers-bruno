info:
  name: Lấy danh sách vị thế mở hàng hóa MXV
  type: http
  seq: 105
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/mxv/positions"
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/mxv/positions"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "_id": "",
              "positionID": "",
              "investorCode": "",
              "investorName": "",
              "contractCode": "",
              "contractName": "",
              "currency": "",
              "decimalFormat": 0,
              "open": {
                "buyPosition": 0,
                "sellPosition": 0,
                "estimatedProfit": 0,
                "averagePrice": 0,
                "marketPrice": 0,
                "estimatedProfitVND": 0
              },
              "fills": [
                {
                  "_id": "",
                  "positionFillID": "",
                  "settled": false,
                  "orderCode": "",
                  "txnCode": "",
                  "cqgOrderCode": "",
                  "cqgTxnCode": "",
                  "orderDatetime": "",
                  "txnDatetime": "",
                  "averagePrice": 0,
                  "transactionFee": 0,
                  "sellPosition": 0,
                  "buyPosition": 0,
                  "sessionDate": "",
                  "estimatedProfit": 0,
                  "estimatedProfitVND": 0
                }
              ],
              "buyPosition": 0,
              "sellPosition": 0,
              "estimatedProfit": 0,
              "averagePrice": 0,
              "marketPrice": 0,
              "estimatedProfitVND": 0
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/mxv/positions"
      method: GET
