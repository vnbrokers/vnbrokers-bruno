info:
  name: Lấy các thiết lập hiện tại của user
  type: http
  seq: 15
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/settings"
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/settings"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "userName": "",
            "mobileQuoteAlerts": false,
            "mobileNewsAlerts": false,
            "mobileRealtime": false
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/settings"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
