info:
  name: Lấy yêu cầu tạo tài khoản giao dịch hàng hóa MXV
  type: http
  seq: 106
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/mxv/account-request"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/mxv/account-request"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "requestID": 0,
            "accountID": 0,
            "name": "",
            "email": "",
            "website": "",
            "phoneNumber": "",
            "dateOfBirth": "",
            "sex": "",
            "identityNumber": "",
            "issueDate": "",
            "expiredDate": "",
            "issueLocation": "",
            "identityAddress": "",
            "bankAccountNo": "",
            "bankID": 0,
            "images": [],
            "status": "",
            "investorCode": ""
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/mxv/account-request"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
