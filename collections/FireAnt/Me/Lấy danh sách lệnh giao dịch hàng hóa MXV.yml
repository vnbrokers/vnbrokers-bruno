info:
  name: Lấy danh sách lệnh giao dịch hàng hóa MXV
  type: http
  seq: 104
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/mxv/orders"
  params:
    - name: status
      value: ""
      type: query
      description: "Danh sách trạng thái lệnh (VD: WORKING,FILLED)"
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
