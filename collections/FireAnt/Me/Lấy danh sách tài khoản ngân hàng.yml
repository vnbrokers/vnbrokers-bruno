info:
  name: Lấy danh sách tài khoản ngân hàng
  type: http
  seq: 99
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/bank-accounts"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/bank-accounts"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "bankAccountID": 0,
              "bankID": 0,
              "userName": "",
              "bankBranch": "",
              "accountNo": "",
              "accountName": ""
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/bank-accounts"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
