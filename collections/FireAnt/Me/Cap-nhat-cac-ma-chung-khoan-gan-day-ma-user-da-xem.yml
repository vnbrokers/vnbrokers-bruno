info:
  name: Cập nhật các mã chứng khoán gần đây mà user đã xem
  type: http
  seq: 3
  tags:
    - Me

http:
  method: POST
  url: "{{baseUrl}}/me/recent-symbols"
  body:
    type: json
    data: |-
      {
        "anonymousUserID": "",
        "symbols": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/recent-symbols"
      method: POST
      body:
        type: json
        data: |-
          {
            "anonymousUserID": "",
            "symbols": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/recent-symbols"
      method: POST
      body:
        type: json
        data: |-
          {
            "anonymousUserID": "",
            "symbols": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
