info:
  name: Lấy hồ sơ của 1 user
  type: http
  seq: 13
  tags:
    - Me

http:
  method: GET
  url: "{{baseUrl}}/me/profile"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/me/profile"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "",
            "status": "",
            "isExpert": false,
            "isTeacher": false,
            "bio": "",
            "address": "",
            "facebookLink": "",
            "totalPosts": 0,
            "totalLikes": 0,
            "followers": 0,
            "following": 0,
            "followed": false,
            "blocked": false,
            "beingBlocked": false,
            "groups": 0,
            "isAuthentic": false
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/me/profile"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
