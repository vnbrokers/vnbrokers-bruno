info:
  name: Lấy lịch sử nộp rút ký quỹ
  type: http
  seq: 7
  tags:
    - MXV

http:
  method: GET
  url: "{{baseUrl}}/mxv/account/margin-transactions"
  params:
    - name: status
      value: ""
      type: query
      description: "Trạng thái (Bắt buộc): PENDING_FOR_MEMBER, PENDING_LEVEL1, PENDING_LEVEL2, PENDING_FOR_BANK, APPROVED, REJECTED. Có thể truyền nhiều giá trị cách nhau bởi dấu phẩy"
    - name: accountType
      value: "0"
      type: query
      description: Loại tài khoản (Optional) (0 = FUTURE, 1 = NANO, 2 = MXV)
      disabled: true
    - name: accountType
      value: "1"
      type: query
      description: Loại tài khoản (Optional) (0 = FUTURE, 1 = NANO, 2 = MXV)
      disabled: true
    - name: accountType
      value: "2"
      type: query
      description: Loại tài khoản (Optional) (0 = FUTURE, 1 = NANO, 2 = MXV)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: "Số lượng bản ghi tối đa (mặc định: 100)"
      disabled: true
    - name: offset
      value: ""
      type: query
      description: "Vị trí bắt đầu (mặc định: 0)"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

