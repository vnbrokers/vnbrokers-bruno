info:
  name: Chi tiết hàng hoá
  type: http
  seq: 13
  tags:
    - MXV

http:
  method: GET
  url: "{{baseUrl}}/mxv/market/commodities/:commodityCode"
  params:
    - name: commodityCode
      value: ""
      type: path
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/mxv/market/commodities/:commodityCode"
      method: GET
      params:
        - name: commodityCode
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "commodityCode": "",
            "commodityName": "",
            "exchangeCode": "",
            "tradingUnit": "",
            "quotationUnit": "",
            "tickSize": 0,
            "tickValue": 0,
            "currency": ""
          }
