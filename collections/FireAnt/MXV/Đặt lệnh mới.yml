info:
  name: Đặt lệnh mới
  type: http
  seq: 20
  tags:
    - MXV

http:
  method: POST
  url: "{{baseUrl}}/mxv/orders"
  params:
    - name: accountType
      value: "0"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
    - name: accountType
      value: "1"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
    - name: accountType
      value: "2"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
  body:
    type: json
    data: |-
      {
        "symbol": "",
        "side": "",
        "quantity": 0,
        "orderType": "",
        "timeInForce": "",
        "price": 0,
        "stopPrice": 0,
        "expireDate": ""
      }
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/mxv/orders"
      method: POST
      params:
        - name: accountType
          value: "0"
          type: query
          description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
          disabled: true
        - name: accountType
          value: "1"
          type: query
          description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
          disabled: true
        - name: accountType
          value: "2"
          type: query
          description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
          disabled: true
      body:
        type: json
        data: |-
          {
            "symbol": "",
            "side": "",
            "quantity": 0,
            "orderType": "",
            "timeInForce": "",
            "price": 0,
            "stopPrice": 0,
            "expireDate": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "cl_ord_id": "",
            "order_id": "",
            "message": "",
            "error": ""
          }
