  type: http
  seq: 6
  tags:
    - MXV

http:
  method: GET
  url: "{{baseUrl}}/mxv/account/margin-status"
  params:
    - name: accountType
      value: "0"
      type: query
      description: Loại tài khoản (0 = FUTURE, 1 = NANO, 2 = MXV)
      disabled: true
    - name: accountType
      value: "1"
      type: query
      description: Loại tài khoản (0 = FUTURE, 1 = NANO, 2 = MXV)
      disabled: true
    - name: accountType
      value: "2"
      type: query
      description: Loại tài khoản (0 = FUTURE, 1 = NANO, 2 = MXV)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

