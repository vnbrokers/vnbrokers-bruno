info:
  name: Lấy trạng thái tài khoản MXV (Future, Nano, MXV)
  type: http
  seq: 5
  tags:
    - MXV

http:
  method: GET
  url: "{{baseUrl}}/mxv/account/status"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/mxv/account/status"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "userName": "",
            "futureInvestorCode": "",
            "futureStatus": "",
            "nanoInvestorCode": "",
            "nanoStatus": "",
            "mxvInvestorCode": "",
            "mxvStatus": ""
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/mxv/account/status"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
