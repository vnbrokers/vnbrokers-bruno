info:
  name: Danh sách tất toán
  type: http
  seq: 17
  tags:
    - MXV

http:
  method: GET
  url: "{{baseUrl}}/mxv/positions/settle"
  params:
    - name: accountType
      value: "0"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
    - name: accountType
      value: "1"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
    - name: accountType
      value: "2"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
    - name: fromDate
      value: ""
      type: query
      disabled: true
    - name: toDate
      value: ""
      type: query
      disabled: true
    - name: sortBy
      value: ""
      type: query
      disabled: true
    - name: limit
      value: ""
      type: query
      disabled: true
    - name: offset
      value: ""
      type: query
      disabled: true
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

