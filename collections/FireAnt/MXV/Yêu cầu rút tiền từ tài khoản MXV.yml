info:
  name: Yêu cầu rút tiền từ tài khoản MXV
  type: http
  seq: 9
  tags:
    - MXV

http:
  method: POST
  url: "{{baseUrl}}/mxv/account/withdraw-request"
  params:
    - name: accountType
      value: "0"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
    - name: accountType
      value: "1"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
    - name: accountType
      value: "2"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
  body:
    type: json
    data: |-
      {
        "amount": 0,
        "bankAccountID": 0
      }
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/mxv/account/withdraw-request"
      method: POST
      params:
        - name: accountType
          value: "0"
          type: query
          description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
          disabled: true
        - name: accountType
          value: "1"
          type: query
          description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
          disabled: true
        - name: accountType
          value: "2"
          type: query
          description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
          disabled: true
      body:
        type: json
        data: |-
          {
            "amount": 0,
            "bankAccountID": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
