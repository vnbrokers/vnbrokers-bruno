info:
  name: Yêu cầu nạp tiền vào tài khoản MXV
  type: http
  seq: 8
  tags:
    - MXV

http:
  method: POST
  url: "{{baseUrl}}/mxv/account/deposit-request"
  params:
    - name: accountType
      value: "0"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
    - name: accountType
      value: "1"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
    - name: accountType
      value: "2"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
  body:
    type: json
    data: |-
      {
        "amount": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

