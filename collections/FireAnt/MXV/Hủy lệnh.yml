http:
  method: DELETE
  url: "{{baseUrl}}/mxv/orders/:clientOrderId"
  params:
    - name: clientOrderId
      value: ""
      type: path
    - name: side
      value: ""
      type: query
    - name: orderId
      value: ""
      type: query
    - name: accountType
      value: "0"
      type: query
      disabled: true
    - name: accountType
      value: "1"
      type: query
      disabled: true
    - name: accountType
      value: "2"
      type: query
      disabled: true
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

