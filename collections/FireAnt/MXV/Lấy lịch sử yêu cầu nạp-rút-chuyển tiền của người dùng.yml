info:
  name: Lấy lịch sử yêu cầu nạp/rút/chuyển tiền của người dùng
  type: http
  seq: 11
  tags:
    - MXV

http:
  method: GET
  url: "{{baseUrl}}/mxv/account/money-requests"
  params:
    - name: accountType
      value: "0"
      type: query
      description: Loại tài khoản (Optional) (0 = FUTURE, 1 = NANO, 2 = MXV)
      disabled: true
    - name: accountType
      value: "1"
      type: query
      description: Loại tài khoản (Optional) (0 = FUTURE, 1 = NANO, 2 = MXV)
      disabled: true
    - name: accountType
      value: "2"
      type: query
      description: Loại tài khoản (Optional) (0 = FUTURE, 1 = NANO, 2 = MXV)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: "Số lượng bản ghi tối đa (mặc định: 20)"
      disabled: true
    - name: offset
      value: ""
      type: query
      description: "Vị trí bắt đầu (mặc định: 0)"
      disabled: true
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/mxv/account/money-requests"
      method: GET
      params:
        - name: accountType
          value: "0"
          type: query
          description: Loại tài khoản (Optional) (0 = FUTURE, 1 = NANO, 2 = MXV)
          disabled: true
        - name: accountType
          value: "1"
          type: query
          description: Loại tài khoản (Optional) (0 = FUTURE, 1 = NANO, 2 = MXV)
          disabled: true
        - name: accountType
          value: "2"
          type: query
          description: Loại tài khoản (Optional) (0 = FUTURE, 1 = NANO, 2 = MXV)
          disabled: true
        - name: limit
          value: ""
          type: query
          description: "Số lượng bản ghi tối đa (mặc định: 20)"
          disabled: true
        - name: offset
          value: ""
          type: query
          description: "Vị trí bắt đầu (mặc định: 0)"
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
