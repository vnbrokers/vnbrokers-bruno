info:
  name: Lấy thông tin chi tiết tài khoản MXV
  type: http
  seq: 3
  tags:
    - MXV

http:
  method: GET
  url: "{{baseUrl}}/mxv/account"
  params:
    - name: accountType
      value: "0"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
    - name: accountType
      value: "1"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
    - name: accountType
      value: "2"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/mxv/account"
      method: GET
      params:
        - name: accountType
          value: "0"
          type: query
          description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
          disabled: true
        - name: accountType
          value: "1"
          type: query
          description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
          disabled: true
        - name: accountType
          value: "2"
          type: query
          description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "account": {
              "availableBalance": 0,
              "currency": "",
              "investorCode": "",
              "investorName": "",
              "marginDeficitInterestRate": 0,
              "marginSurplusInterestRate": 0,
              "totalProfitVND": 0,
              "availableMarginProvisional": 0
            },
            "contact": {
              "email": "",
              "fullName": "",
              "phoneNumber": ""
            },
            "createdDate": 0,
            "status": "",
            "subInvestors": [],
            "type": ""
          }
