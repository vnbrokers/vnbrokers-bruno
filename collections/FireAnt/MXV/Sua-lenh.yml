http:
  method: PUT
  url: "{{baseUrl}}/mxv/orders/:clientOrderId"
  params:
    - name: clientOrderId
      value: ""
      type: path
    - name: accountType
      value: "0"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
    - name: accountType
      value: "1"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
    - name: accountType
      value: "2"
      type: query
      description: " (0 = FUTURE, 1 = NANO, 2 = MXV)"
      disabled: true
  body:
    type: json
    data: |-
      {
        "symbol": "",
        "newQuantity": 0,
        "orderId": "",
        "newPrice": 0,
        "newStopPrice": 0
      }
  auth: inherit

settings:
