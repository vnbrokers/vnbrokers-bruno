info:
  name: Chi tiết lệnh
  type: http
  seq: 21
  tags:
    - MXV

http:
  method: GET
  url: "{{baseUrl}}/mxv/orders/:clientOrderId"
  params:
    - name: clientOrderId
      value: ""
      type: path
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/mxv/orders/:clientOrderId"
      method: GET
      params:
        - name: clientOrderId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "clientOrderCode": "",
            "orderCode": "",
            "contractCode": "",
            "contractName": "",
            "side": "",
            "orderType": "",
            "qty": 0,
            "limitPrice": 0,
            "stopPrice": 0,
            "filledPrice": 0,
            "filledQty": 0,
            "orderDatetime": "",
            "status": "",
            "transactionFee": 0,
            "investorCode": "",
            "sessionDate": "",
            "dataSource": "",
            "transactions": [
              {
                "status": "",
                "filledPrice": 0,
                "qty": 0,
                "transactionFee": 0,
                "sessionDate": ""
              }
            ]
          }
