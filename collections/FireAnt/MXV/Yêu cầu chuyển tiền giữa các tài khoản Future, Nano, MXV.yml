info:
  name: Yêu cầu chuyển tiền giữa các tài khoản Future, Nano, MXV
  type: http
  seq: 10
  tags:
    - MXV

http:
  method: POST
  url: "{{baseUrl}}/mxv/account/transfer-money-request"
  body:
    type: json
    data: |-
      {
        "fromAccountType": 0,
        "toAccountType": 0,
        "amount": 0
      }
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/mxv/account/transfer-money-request"
      method: POST
      body:
        type: json
        data: |-
          {
            "fromAccountType": 0,
            "toAccountType": 0,
            "amount": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
