info:
  name: Tạo tài khoản MXV (Future, Nano, MXV)
  type: http
  seq: 4
  tags:
    - MXV

http:
  method: POST
  url: "{{baseUrl}}/mxv/account"
  body:
    type: json
    data: |-
      {
        "accountNumber": "",
        "collaboratorCode": "",
        "brokerCode": "",
        "accountType": ""
      }
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: user-data-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/mxv/account"
      method: POST
      body:
        type: json
        data: |-
          {
            "accountNumber": "",
            "collaboratorCode": "",
            "brokerCode": "",
            "accountType": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "",
            "investorCode": "",
            "signingLink": "",
            "createdDate": "",
            "approvalId": ""
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/mxv/account"
      method: POST
      body:
        type: json
        data: |-
          {
            "accountNumber": "",
            "collaboratorCode": "",
            "brokerCode": "",
            "accountType": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
