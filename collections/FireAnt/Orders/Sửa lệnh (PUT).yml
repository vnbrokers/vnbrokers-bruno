info:
  name: Sửa lệnh (PUT)
  type: http
  seq: 4
  tags:
    - Orders

http:
  method: PUT
  url: "{{baseUrl}}/broker-users/:userId/accounts/:accountId/orders/:orderId"
  params:
    - name: userId
      value: ""
      type: path
      description: Id của user đã kết nối vào tài khoản FireAnt
    - name: accountId
      value: ""
      type: path
      description: Id tài khoản tại công ty chứng khoán của user
    - name: orderId
      value: ""
      type: path
      description: Id của lệnh
  body:
    type: json
    data: |-
      {
        "qty": 0,
        "qtyType": 0,
        "limitPrice": 0,
        "stopPrice": 0,
        "stopLoss": 0,
        "takeProfit": 0
      }
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: orders-write
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

