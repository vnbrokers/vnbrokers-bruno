info:
  name: Lấy danh sách các loại dữ liệu vĩ mô
  type: http
  seq: 1
  tags:
    - Macro

http:
  method: GET
  url: "{{baseUrl}}/macro-data/types"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/macro-data/types"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "type": "",
              "name": "",
              "description": ""
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/macro-data/types"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
