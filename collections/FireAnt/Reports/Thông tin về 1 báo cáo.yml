info:
  name: Thông tin về 1 báo cáo
  type: http
  seq: 1
  tags:
    - Reports

http:
  method: GET
  url: "{{baseUrl}}/reports/:reportID"
  params:
    - name: reportID
      value: ""
      type: path
      description: ID của báo cáo
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: symbols-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/reports/:reportID"
      method: GET
      params:
        - name: reportID
          value: ""
          type: path
          description: ID của báo cáo
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "reportID": 0,
            "categoryID": 0,
            "sourceID": 0,
            "sourceName": "",
            "sectorID": 0,
            "symbol": "",
            "title": "",
            "description": "",
            "date": "",
            "pages": 0,
            "size": 0,
            "fileName": "",
            "fileExtension": "",
            "language": "",
            "downloads": 0,
            "isHot": false
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/reports/:reportID"
      method: GET
      params:
        - name: reportID
          value: ""
          type: path
          description: ID của báo cáo
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
