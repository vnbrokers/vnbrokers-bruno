info:
  name: Danh sách danh mục báo cáo
  type: http
  seq: 3
  tags:
    - Reports

http:
  method: GET
  url: "{{baseUrl}}/reports/categories"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/reports/categories"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "categoryID": 0,
              "title": ""
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/reports/categories"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
