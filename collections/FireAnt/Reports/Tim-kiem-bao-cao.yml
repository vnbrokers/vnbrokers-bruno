info:
  name: Tìm kiếm báo cáo
  type: http
  seq: 2
  tags:
    - Reports

http:
  method: GET
  url: "{{baseUrl}}/reports/search"
  params:
    - name: startDate
      value: ""
      type: query
      description: Thời gian bắt đầu
    - name: endDate
      value: ""
      type: query
      description: Thời gian kết thúc
    - name: categoryID
      value: ""
      type: query
      description: Danh mục báo cáo (bỏ qua nếu muốn tìm tất cả)
      disabled: true
    - name: sourceID
      value: ""
      type: query
      description: Nguồn báo cáo (bỏ qua nếu muốn tìm tất cả)
      disabled: true
    - name: sectorID
      value: ""
      type: query
      description: Lĩnh vực báo cáo (bỏ qua nếu muốn tìm tất cả)
      disabled: true
    - name: symbol
      value: ""
      type: query
      description: Mã chứng khoán (bỏ qua nếu muốn tìm tất cả)
      disabled: true
    - name: keywords
      value: ""
      type: query
      description: Từ khóa tìm kiếm
      disabled: true
    - name: ranking
      value: ""
      type: query
      description: Xếp hạng
      disabled: true
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

