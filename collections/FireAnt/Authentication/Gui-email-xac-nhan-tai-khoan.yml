info:
  name: Gửi email xác nhận tài khoản
  type: http
  seq: 8
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/authentication/email-confirmation"
  body:
    type: json
    data: |-
      {
        "email": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/authentication/email-confirmation"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/authentication/email-confirmation"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
