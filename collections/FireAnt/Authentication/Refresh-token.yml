info:
  name: Refresh token
  type: http
  seq: 9
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/authentication/refresh-token"
  body:
    type: json
    data: |-
      {
        "refreshToken": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/authentication/refresh-token"
      method: POST
      body:
        type: json
        data: |-
          {
            "refreshToken": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "succeeded": false,
            "errorMessage": "",
            "accessToken": "",
            "refreshToken": ""
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/authentication/refresh-token"
      method: POST
      body:
        type: json
        data: |-
          {
            "refreshToken": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
