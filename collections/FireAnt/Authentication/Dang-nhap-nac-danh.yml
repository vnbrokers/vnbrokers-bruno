info:
  name: Đăng nhập nặc danh
  type: http
  seq: 1
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/authentication/anonymous-login"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: res.status === 200 && bru.setEnvVar("accessToken", res.body.accessToken)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/authentication/anonymous-login"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/authentication/anonymous-login"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
