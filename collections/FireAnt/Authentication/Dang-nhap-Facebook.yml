info:
  name: Đăng nhập Facebook
  type: http
  seq: 5
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/authentication/facebook-login"
  body:
    type: json
    data: |-
      {
        "accessToken": "",
        "idToken": "",
        "name": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/authentication/facebook-login"
      method: POST
      body:
        type: json
        data: |-
          {
            "accessToken": "",
            "idToken": "",
            "name": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/authentication/facebook-login"
      method: POST
      body:
        type: json
        data: |-
          {
            "accessToken": "",
            "idToken": "",
            "name": ""
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
