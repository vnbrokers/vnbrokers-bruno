info:
  name: Tìm kiếm mã chứng khoán
  type: http
  seq: 2
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/search"
  params:
    - name: keywords
      value: ""
      type: query
      description: Từ khóa tìm kiếm
    - name: exchange
      value: ""
      type: query
      description: Sàn (HSX, HNX, UPCOM hoặc bỏ trống nếu tìm trên tất cả các sàn)
      disabled: true
    - name: type
      value: ""
      type: query
      description: Loại chứng khoán (stock, futures, warrant, index, fund, bond)
      disabled: true
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: symbols-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/symbols/search"
      method: GET
      params:
        - name: keywords
          value: ""
          type: query
          description: Từ khóa tìm kiếm
        - name: exchange
          value: ""
          type: query
          description: Sàn (HSX, HNX, UPCOM hoặc bỏ trống nếu tìm trên tất cả các sàn)
          disabled: true
        - name: type
          value: ""
          type: query
          description: Loại chứng khoán (stock, futures, warrant, index, fund, bond)
          disabled: true
        - name: offset
          value: ""
          type: query
          description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
          disabled: true
        - name: limit
          value: ""
          type: query
          description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "symbol": "",
              "isListing": false,
              "name": "",
              "exchange": "",
              "instrument": "",
              "type": "",
              "industryCode": "",
              "icbCode": ""
            }
          ]
