info:
  name: Lấy thông tin chi tiết hợp đồng tương lai hàng hóa phái sinh
  type: http
  seq: 24
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/:symbol/commodity-contract"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã hàng hóa CQG
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/symbols/:symbol/commodity-contract"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã hàng hóa CQG
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "symbol": "",
            "exchange": "",
            "name": "",
            "commoditySymbol": "",
            "category": "",
            "month": 0,
            "year": 0,
            "contractUnit": "",
            "contractVolume": 0,
            "tickSize": 0,
            "firstNoticeDate": "",
            "lastTradingDate": "",
            "session": "",
            "settlementDate": "",
            "finalDeliveryDate": "",
            "lastNoticeDate": "",
            "currency": ""
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/symbols/:symbol/commodity-contract"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã hàng hóa CQG
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
