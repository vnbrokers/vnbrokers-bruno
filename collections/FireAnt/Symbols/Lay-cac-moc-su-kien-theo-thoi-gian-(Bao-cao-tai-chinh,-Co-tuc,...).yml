  type: http
  seq: 18
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/:symbol/timescale-marks"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã chứng khoán (với tổ chức đã niêm yết)/ID của tổ chức
    - name: startDate
      value: ""
      type: query
      description: Từ ngày
    - name: endDate
      value: ""
      type: query
      description: Đến ngày
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

