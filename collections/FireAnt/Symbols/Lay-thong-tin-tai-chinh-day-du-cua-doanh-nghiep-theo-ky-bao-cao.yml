info:
  name: Lấy thông tin tài chính đầy đủ của doanh nghiệp theo kỳ báo cáo
  type: http
  seq: 30
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/:symbol/financial-data-by-period"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã chứng khoán
    - name: year
      value: ""
      type: query
      description: Năm
    - name: quarter
      value: ""
      type: query
      description: "Quý (1 =&gt; 4: Để lấy báo cáo quý, 0: Để lấy báo cáo năm)"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/symbols/:symbol/financial-data-by-period"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán
        - name: year
          value: ""
          type: query
          description: Năm
        - name: quarter
          value: ""
          type: query
          description: "Quý (1 =&gt; 4: Để lấy báo cáo quý, 0: Để lấy báo cáo năm)"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "symbol": "",
            "year": 0,
            "quarter": 0,
            "companyType": "",
            "icbCode": "",
            "icbName": "",
            "financialValues": {}
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/symbols/:symbol/financial-data-by-period"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán
        - name: year
          value: ""
          type: query
          description: Năm
        - name: quarter
          value: ""
          type: query
          description: "Quý (1 =&gt; 4: Để lấy báo cáo quý, 0: Để lấy báo cáo năm)"
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
