info:
  name: Lấy hồ sơ công ty
  type: http
  seq: 13
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/:symbol/profile"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã chứng khoán (với tổ chức đã niêm yết)/ID của tổ chức
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: symbols-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/symbols/:symbol/profile"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán (với tổ chức đã niêm yết)/ID của tổ chức
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "institutionID": 0,
            "symbol": "",
            "icbCode": "",
            "companyName": "",
            "shortName": "",
            "internationalName": "",
            "headQuarters": "",
            "phone": "",
            "fax": "",
            "email": "",
            "webAddress": "",
            "overview": "",
            "history": "",
            "businessAreas": "",
            "employees": 0,
            "branches": 0,
            "establishmentDate": "",
            "businessLicenseNumber": "",
            "dateOfIssue": "",
            "taxIDNumber": "",
            "charterCapital": 0,
            "dateOfListing": "",
            "exchange": "",
            "initialListingPrice": 0,
            "listingVolume": 0,
            "stateOwnership": 0,
            "foreignOwnership": 0,
            "otherOwnership": 0,
            "isListed": false
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/symbols/:symbol/profile"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán (với tổ chức đã niêm yết)/ID của tổ chức
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
