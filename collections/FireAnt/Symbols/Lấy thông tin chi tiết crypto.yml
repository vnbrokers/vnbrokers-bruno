info:
  name: Lấy thông tin chi tiết crypto
  type: http
  seq: 27
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/:symbol/crypto-info"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã crypto
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: symbols-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/symbols/:symbol/crypto-info"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã crypto
    response:
