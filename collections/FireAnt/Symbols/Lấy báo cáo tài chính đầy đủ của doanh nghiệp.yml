info:
  name: Lấy báo cáo tài chính đầy đủ của doanh nghiệp
  type: http
  seq: 10
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/:symbol/full-financial-reports"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã chứng khoán
    - name: type
      value: ""
      type: query
      description: "Loại báo cáo (1: Cân đối kế toán, 2: Kết quả SXKD, 3: Lưu chuyển tiền tệ trực tiếp, 4: Lưu chuyển tiền tệ gián tiếp)"
    - name: year
      value: ""
      type: query
      description: Năm lấy báo cáo
    - name: quarter
      value: ""
      type: query
      description: Quý lấy báo cáo
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Mặc địch là 5)
      disabled: true
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: symbols-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/symbols/:symbol/full-financial-reports"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán
        - name: type
          value: ""
          type: query
          description: "Loại báo cáo (1: Cân đối kế toán, 2: Kết quả SXKD, 3: Lưu chuyển tiền tệ trực tiếp, 4: Lưu chuyển tiền tệ gián tiếp)"
        - name: year
          value: ""
          type: query
          description: Năm lấy báo cáo
        - name: quarter
          value: ""
          type: query
          description: Quý lấy báo cáo
        - name: limit
          value: ""
          type: query
          description: Số lượng tối đa bản ghi lấy về (Mặc địch là 5)
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 0,
              "name": "",
              "parentID": 0,
              "expanded": false,
              "level": 0,
              "field": "",
              "values": [
                {
                  "period": "",
                  "year": 0,
                  "quarter": 0,
                  "value": 0
                }
              ]
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/symbols/:symbol/full-financial-reports"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán
        - name: type
          value: ""
          type: query
          description: "Loại báo cáo (1: Cân đối kế toán, 2: Kết quả SXKD, 3: Lưu chuyển tiền tệ trực tiếp, 4: Lưu chuyển tiền tệ gián tiếp)"
        - name: year
          value: ""
          type: query
          description: Năm lấy báo cáo
        - name: quarter
          value: ""
          type: query
          description: Quý lấy báo cáo
        - name: limit
          value: ""
          type: query
          description: Số lượng tối đa bản ghi lấy về (Mặc địch là 5)
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
