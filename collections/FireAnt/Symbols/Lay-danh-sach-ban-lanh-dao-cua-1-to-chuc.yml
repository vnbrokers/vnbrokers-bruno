info:
  name: Lấy danh sách ban lãnh đạo của 1 tổ chức
  type: http
  seq: 16
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/:symbol/officers"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã chứng khoán (với tổ chức đã niêm yết)/ID của tổ chức
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/symbols/:symbol/officers"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán (với tổ chức đã niêm yết)/ID của tổ chức
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "officerID": 0,
              "individualID": 0,
              "name": "",
              "positionID": 0,
              "position": "",
              "isForeigner": false
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/symbols/:symbol/officers"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán (với tổ chức đã niêm yết)/ID của tổ chức
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
