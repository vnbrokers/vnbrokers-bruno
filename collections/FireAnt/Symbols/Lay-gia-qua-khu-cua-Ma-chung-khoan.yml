info:
  name: Lấy giá quá khứ của Mã chứng khoán
  type: http
  seq: 8
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/:symbol/historical-quotes"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã chứng khoán
    - name: startDate
      value: ""
      type: query
      description: Ngày bắt đầu
    - name: endDate
      value: ""
      type: query
      description: Ngày kết thúc
    - name: offset
      value: ""
      type: query
      description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/symbols/:symbol/historical-quotes"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán
        - name: startDate
          value: ""
          type: query
          description: Ngày bắt đầu
        - name: endDate
          value: ""
          type: query
          description: Ngày kết thúc
        - name: offset
          value: ""
          type: query
          description: Vị trí bản ghi đầu tiên lấy về (Dùng để phân trang, mặc địch là 0)
          disabled: true
        - name: limit
          value: ""
          type: query
          description: Số lượng tối đa bản ghi lấy về (Dùng để phân trang, mặc địch là 20)
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "date": "",
              "symbol": "",
              "priceHigh": 0,
              "priceLow": 0,
              "priceOpen": 0,
              "priceAverage": 0,
              "priceClose": 0,
              "priceBasic": 0,
