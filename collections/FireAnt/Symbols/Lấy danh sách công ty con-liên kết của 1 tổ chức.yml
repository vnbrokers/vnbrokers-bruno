info:
  name: Lấy danh sách công ty con/liên kết của 1 tổ chức
  type: http
  seq: 14
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/:symbol/subsidiaries"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã chứng khoán (với tổ chức đã niêm yết)/ID của tổ chức
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: symbols-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/symbols/:symbol/subsidiaries"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán (với tổ chức đã niêm yết)/ID của tổ chức
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "institutionID": 0,
              "symbol": "",
              "exchange": "",
              "companyName": "",
              "shortName": "",
              "internationalName": "",
              "companyProfile": "",
              "type": 0,
              "ownership": 0,
              "shares": 0,
              "isListed": false,
              "charterCapital": 0
            }
          ]
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/symbols/:symbol/subsidiaries"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán (với tổ chức đã niêm yết)/ID của tổ chức
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
