    description: Thành công
    request:
      url: "{{baseUrl}}/symbols/commodities/:category"
      method: GET
      params:
        - name: category
          value: ""
          type: path
          description: "Nhóm hàng hóa (Metals: Kim loại, Enegies: Năng lượng, Grains: Nông sản, Softs: Nguyên liệu công nghiệp)."
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
