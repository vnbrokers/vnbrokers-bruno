info:
  name: Lấy danh sách hợp đồng tương lai hàng hóa phái sinh theo danh mục
  type: http
  seq: 25
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/commodities/:category"
  params:
    - name: category
      value: ""
      type: path
      description: "Nhóm hàng hóa (Metals: Kim loại, Enegies: Năng lượng, Grains: Nông sản, Softs: Nguyên liệu công nghiệp)."
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
