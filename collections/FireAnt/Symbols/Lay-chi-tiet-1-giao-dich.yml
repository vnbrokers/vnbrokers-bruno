info:
  name: Lấy chi tiết 1 giao dịch
  type: http
  seq: 20
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/transactions/:transactionID"
  params:
    - name: transactionID
      value: ""
      type: path
      description: ID giao dịch
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/symbols/transactions/:transactionID"
      method: GET
      params:
        - name: transactionID
          value: ""
          type: path
          description: ID giao dịch
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "transactionID": 0,
            "majorHolderID": 0,
            "individualHolderID": 0,
            "institutionHolderID": 0,
            "institutionHolderSymbol": "",
            "institutionHolderExchange": "",
            "name": "",
            "position": "",
            "symbol": "",
            "type": 0,
            "executionVolume": 0,
            "executionDate": "",
            "startDate": "",
            "endDate": "",
            "registeredVolume": 0
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/symbols/transactions/:transactionID"
      method: GET
      params:
        - name: transactionID
          value: ""
          type: path
          description: ID giao dịch
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
