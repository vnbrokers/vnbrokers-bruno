http:
  method: GET
  url: "{{baseUrl}}/symbols/:symbol/dividends"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã chứng khoán
    - name: count
      value: ""
      type: query
      description: Số lượng
      disabled: true
