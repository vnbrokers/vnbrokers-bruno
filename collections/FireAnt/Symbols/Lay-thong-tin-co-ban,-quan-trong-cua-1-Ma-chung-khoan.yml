info:
  name: Lấy thông tin cơ bản, quan trọng của 1 Mã chứng khoán
  type: http
  seq: 12
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/:symbol/fundamental"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã chứng khoán
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/symbols/:symbol/fundamental"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "symbol": "",
            "companyType": 0,
            "sharesOutstanding": 0,
            "freeShares": 0,
            "beta": 0,
            "dividend": 0,
            "dividendYield": 0,
            "marketCap": 0,
            "low52Week": 0,
            "high52Week": 0,
            "priceChange1y": 0,
            "avgVolume10d": 0,
            "avgVolume3m": 0,
            "pe": 0,
            "eps": 0,
            "sales_TTM": 0,
            "netProfit_TTM": 0,
            "insiderOwnership": 0,
            "institutionOwnership": 0,
            "foreignOwnership": 0
          }
  - name: 400 Response
    description: Có lỗi khi thực hiện thao tác
    request:
      url: "{{baseUrl}}/symbols/:symbol/fundamental"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
