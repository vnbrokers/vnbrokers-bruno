info:
  name: TOP cổ phiếu biến động
  type: http
  seq: 3
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/movers"
  params:
    - name: exchange
      value: ""
      type: query
      description: Sàn (HSX, HNX, UPCOM hoặc bỏ trống nếu tìm trên tất cả các sàn)
      disabled: true
    - name: type
      value: ""
      type: query
      description: Loại chứng khoán (stock, warrant, crypto...)
      disabled: true
    - name: topType
      value: ""
      type: query
      description: Loại TOP (Actives, Gainers, Losers)
      disabled: true
    - name: count
      value: ""
      type: query
      description: Số lượng bản ghi
      disabled: true
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: symbols-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

