info:
  name: Lấy báo cáo tài chính tóm tắt của doanh nghiệp
  type: http
  seq: 9
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/:symbol/financial-reports"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã chứng khoán
    - name: type
      value: ""
      type: query
      description: "Loại báo cáo (BS: Cân đối kế toán, IS: Kết quả SXKD)"
    - name: period
      value: ""
      type: query
      description: "Giai đoạn (Q: Quý, Y: Năm)"
      disabled: true
    - name: compact
      value: ""
      type: query
      description: Rút gọn (Chỉ lấy chỉ tiêu quan trọng, mặc định = 1)
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Số lượng tối đa bản ghi lấy về (Mặc địch là 5)
      disabled: true
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: symbols-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/symbols/:symbol/financial-reports"
