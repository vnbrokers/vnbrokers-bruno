info:
  name: Lấy thông tin tài chính đầy đủ của doanh nghiệp
  type: http
  seq: 28
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/:symbol/financial-data"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã chứng khoán
    - name: type
      value: ""
      type: query
      description: "Loại dữ liệu (Y: Theo năm, Q: Theo quý)"
    - name: count
      value: ""
      type: query
      description: Số lượng kỳ
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công
    request:
      url: "{{baseUrl}}/symbols/:symbol/financial-data"
      method: GET
      params:
        - name: symbol
          value: ""
          type: path
          description: Mã chứng khoán
        - name: type
          value: ""
          type: query
          description: "Loại dữ liệu (Y: Theo năm, Q: Theo quý)"
        - name: count
          value: ""
          type: query
          description: Số lượng kỳ
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
