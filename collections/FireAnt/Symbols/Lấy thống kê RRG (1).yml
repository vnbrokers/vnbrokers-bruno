info:
  name: Lấy thống kê RRG (1)
  type: http
  seq: 22
  tags:
    - Symbols

http:
  method: GET
  url: "{{baseUrl}}/symbols/:symbol/rrg"
  params:
    - name: symbol
      value: ""
      type: path
      description: Mã chứng khoán
    - name: startDate
      value: ""
      type: query
      description: Ngày bắt đầu
    - name: endDate
      value: ""
      type: query
      description: Ngày kết thúc
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://accounts.fireant.vn/connect/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: symbols-read
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

