info:
  name: Thông tin giao dịch chứng khoán
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/price/:symbol/secdef?boardId=G1"
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"
      disabled: true
    - name: X-Aux-Date
      value: ""
      disabled: true
    - name: X-Signature
      value: ""
      disabled: true
  params:
    - name: boardId
      value: G1
      type: query
    - name: symbol
      value: HPG
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – trả về thông tin giao dịch của mã chứng khoán
    request:
      url: "{{baseUrl}}/price/{{symbol}}/secdef"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
      params:
        - name: boardId
          value: ""
          type: query
        - name: symbol
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "marketId": "",
              "boardId": "",
              "isin": "",
              "symbol": "",
              "productGrpId": "",
              "securityGroupId": "",
              "basicPrice": 0,
              "ceilingPrice": 0,
              "floorPrice": 0,
              "securityStatus": "",
              "symbolAdminStatusCode": "",
              "symbolTradingMethodStatusCode": "",
              "symbolTradingSanctionStatusCode": ""
            }
          ]
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/price/{{symbol}}/secdef"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
      params:
        - name: boardId
          value: ""
          type: query
        - name: symbol
          value: ""
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/price/{{symbol}}/secdef"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
      params:
        - name: boardId
          value: ""
          type: query
        - name: symbol
          value: ""
          type: path
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |
  API trả về thông tin giao dịch của mã chứng khoán.

  Query Parameters:
    - boardId (string, optional): Mã bảng giao dịch
        G1: Lô chẵn
        G4: Lô lẻ
        T1: Thỏa thuận trong giờ
        T3: Thỏa thuận sau giờ
        T4: Thỏa thuận lô lẻ trong giờ
        T6: Thỏa thuận lô lẻ sau giờ

  Path Parameters:
    - symbol (string): Mã chứng khoán

  Response bao gồm:
    - Giá tham chiếu, giá trần, giá sàn
    - Trạng thái giao dịch, trạng thái hành chính, trạng thái cơ chế giao dịch
    - Nhóm sản phẩm, nhóm chứng khoán, mã ISIN
