info:
  name: Thông tin giao dịch chứng khoán
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/price/:symbol/secdef?boardId=G1"
  params:
    - name: boardId
      value: G1
      type: query
    - name: symbol
      value: "{{symbol}}"
      type: path
  auth: inherit

runtime:
  variables:
    - name: symbol
      value: HPG

  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "GetSecdefResponse",
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "marketId": {
                  "type": "string"
                },
                "boardId": {
                  "type": "string"
                },
                "isin": {
                  "type": "string"
                },
                "symbol": {
                  "type": "string"
                },
                "productGrpId": {
                  "type": "string"
                },
                "securityGroupId": {
                  "type": "string"
                },
                "basicPrice": {
                  "type": "number"
                },
                "ceilingPrice": {
                  "type": "number"
                },
                "floorPrice": {
                  "type": "number"
                },
                "securityStatus": {
                  "type": "string"
                },
                "symbolAdminStatusCode": {
                  "type": "string"
                },
                "symbolTradingMethodStatusCode": {
                  "type": "string"
                },
                "symbolTradingSanctionStatusCode": {
                  "type": "string"
                },
                "finalTradeDate": {
                  "type": [
                    "string",
                    "null"
                  ]
                },
                "listingDate": {
                  "type": "string"
                },
                "time": {
                  "type": "string"
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

