      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: 2026-05-07
      params:
        - name: boardId
          value: ""
          type: query
        - name: symbol
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
