info:
  name: Lịch sử khớp lệnh
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/price/:symbol/trades?boardId=G1&from=1773182637&to=1773183637&limit=1000"
  params:
    - name: boardId
      value: G1
      type: query
    - name: from
      value: "1773182637"
      type: query
    - name: to
      value: "1773183637"
      type: query
    - name: limit
      value: "1000"
      type: query
    - name: symbol
      value: "{{symbol}}"
      type: path
  auth: inherit

runtime:
  variables:
    - name: symbol
      value: ACB
  scripts:

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – trả về lịch sử khớp lệnh theo khoảng thời gian
    request:
      url: "{{baseUrl}}/price/{{symbol}}/trades"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-05-07"
      params:
        - name: boardId
          value: G1
          type: query
        - name: from
          value: "1773282637"
          type: query
        - name: to
          value: "1773289837"
          type: query
        - name: limit
          value: ""
          type: query
        - name: symbol
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "trades": [],
            "nextPageToken": ""
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/price/{{symbol}}/trades"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-05-07"
      params:
        - name: boardId
          value: ""
          type: query
        - name: from
          value: ""
          type: query
        - name: to
          value: ""
          type: query
        - name: symbol
          value: ""
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/price/{{symbol}}/trades"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-05-07"
      params:
        - name: boardId
          value: ""
          type: query
        - name: from
          value: ""
          type: query
        - name: to
          value: ""
          type: query
        - name: symbol
          value: ""
          type: path
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |-
  API trả về lịch sử khớp lệnh theo mã chứng khoán và khoảng thời gian.

  Query Parameters:
    - boardId (string, required): Mã bảng giao dịch
        G1: Lô chẵn
        G4: Lô lẻ
        T1: Thỏa thuận trong giờ
        T3: Thỏa thuận sau giờ
        T4: Thỏa thuận lô lẻ trong giờ
        T6: Thỏa thuận lô lẻ sau giờ
    - from (string, required): Timestamp bắt đầu
    - to (string, required): Timestamp kết thúc
    - limit (number, optional): Số bản ghi tối đa

  Path Parameters:
    - symbol (string): Mã chứng khoán

  Response bao gồm:
    - Danh sách giao dịch: giá khớp, khối lượng, giá trị, thời gian
    - nextPageToken: Token để lấy trang tiếp theo
