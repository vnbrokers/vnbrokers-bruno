info:
  name: Lịch sử khớp lệnh
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/price/:symbol/trades?boardId=G1&from=1773182637&to=1773183637&limit=1000"
  params:
    - name: boardId
      value: G1
      type: query
    - name: from
      value: "1773182637"
      type: query
    - name: to
      value: "1773183637"
      type: query
    - name: limit
      value: "1000"
      type: query
    - name: symbol
      value: "{{symbol}}"
      type: path
  auth: inherit

runtime:
  variables:
    - name: symbol
      value: ACB

  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "GetHistoryTradesResponse",
            "type": "object",
            "properties": {
              "trades": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "marketId": {
                      "type": "string"
                    },
                    "boardId": {
                      "type": "string"
                    },
                    "isin": {
                      "type": "string"
                    },
                    "symbol": {
                      "type": "string"
                    },
                    "matchPrice": {
                      "type": "number"
                    },
                    "matchQtty": {
                      "type": "integer"
                    },
                    "side": {
                      "type": "string"
                    },
                    "avgPrice": {
                      "type": "number"
                    },
                    "totalVolumeTraded": {
                      "type": "integer"
                    },
                    "grossTradeAmount": {
                      "type": "number"
                    },
                    "highestPrice": {
                      "type": "number"
                    },
                    "lowestPrice": {
                      "type": "number"
                    },
                    "openPrice": {
                      "type": "integer"
                    },
                    "time": {
                      "type": "string"
                    }
                  }
                }
              },
              "nextPageToken": {
                "type": [
                  "string",
                  "null"
                ]
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

