          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "t": [],
            "o": [],
            "h": [],
            "l": [],
            "c": [],
            "v": [],
            "nextTime": 0
