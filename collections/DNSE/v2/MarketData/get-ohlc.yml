info:
  name: Lịch sử OHLC
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/price/ohlc?symbol=ACB&type=STOCK&resolution=15&from=1773657310&to=1773830110"
  params:
    - name: symbol
      value: ACB
      type: query
    - name: type
      value: STOCK
      type: query
    - name: resolution
      value: "15"
      type: query
    - name: from
      value: "1773657310"
      type: query
    - name: to
      value: "1773830110"
      type: query
  auth: inherit

runtime:
  scripts:


settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

