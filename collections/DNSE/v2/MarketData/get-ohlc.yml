docs: |
  API trả về dữ liệu lịch sử OHLC (Open – High – Low – Close) theo mã chứng khoán và khoảng thời gian.

  Query Parameters:
    - symbol (string, required): Mã chứng khoán
    - type (string, required): Loại thị trường
        STOCK: Cổ phiếu
        DERIVATIVE: Phái sinh
        INDEX: Chỉ số thị trường
    - resolution (string, required): Khung thời gian nến (1,3,5,15,30,1h,1D,1W)
    - from (string, required): Timestamp bắt đầu
    - to (string, required): Timestamp kết thúc

  Response bao gồm:
    - t: Danh sách timestamp
    - o: Giá mở cửa
    - h: Giá cao nhất
    - l: Giá thấp nhất
    - c: Giá đóng cửa
    - v: Khối lượng giao dịch
    - nextTime: Timestamp của cây nến tiếp theo (0 nếu không còn)
