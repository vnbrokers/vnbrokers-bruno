            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/price/{{symbol}}/trades/latest"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
