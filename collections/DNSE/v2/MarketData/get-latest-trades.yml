info:
  name: Dữ liệu khớp gần nhất
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/price/:symbol/trades/latest"
  params:
    - name: boardId
      value: G1
      type: query
    - name: symbol
      value: "{{symbol}}"
      type: path
  auth: inherit

runtime:
  variables:
    - name: symbol
      value: HPG

  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "GetLatestTradesResponse",
            "type": "object",
            "properties": {
              "trades": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "marketId": {
                      "type": "string"
                    },
                    "boardId": {
                      "type": "string"
                    },
                    "isin": {
                      "type": "string"
                    },
                    "symbol": {
                      "type": "string"
                    },
                    "matchPrice": {
                      "type": "number"
                    },
                    "matchQtty": {
                      "type": "integer"
                    },
                    "side": {
                      "type": "string"
                    },
                    "avgPrice": {
                      "type": "number"
                    },
                    "totalVolumeTraded": {
                      "type": "integer"
                    },
                    "grossTradeAmount": {
                      "type": "number"
                    },
                    "highestPrice": {
                      "type": "number"
                    },
                    "lowestPrice": {
                      "type": "number"
                    },
                    "openPrice": {
                      "type": "number"
                    },
                    "time": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công - trả về dữ liệu khớp gần nhất của mã chứng khoán
    request:
      url: "{{baseUrl}}/price/{{symbol}}/trades/latest"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: 2026-05-07
      params:
        - name: boardId
          value: G1
          type: query
        - name: symbol
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "trades": [
              {
                "marketId": "STO",
                "boardId": "G1",
                "isin": "VN000000ACB8",
                "symbol": "ACB",
                "matchPrice": 23.35,
                "matchQtty": 20,
                "side": "SELL",
                "avgPrice": 23.435,
                "totalVolumeTraded": 427980,
                "grossTradeAmount": 100.295515,
                "highestPrice": 23.55,
                "lowestPrice": 23.35,
                "openPrice": 23.5,
                "time": "2026-05-27 09:43:32.706"
              }
            ]
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/price/{{symbol}}/trades/latest"
      method: GET
      headers:
        - name: X-API-Key
