info:
  name: Giá đóng cửa
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/price/:symbol/close?boardId=G1"
  params:
    - name: boardId
      value: G1
      type: query
    - name: symbol
      value: "{{symbol}}"
      type: path
  auth: inherit

runtime:
  variables:
    - name: symbol
      value: ACB

  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "GetPriceSymbolCloseResponse",
            "type": "object",
            "properties": {
              "prices": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "marketId": {
                      "type": "string"
                    },
                    "boardId": {
                      "type": "string"
                    },
                    "isin": {
                      "type": "string"
                    },
                    "symbol": {
                      "type": "string"
                    },
                    "closePrice": {
                      "type": "number"
                    },
                    "time": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công - trả về lịch sử khớp lệnh theo khoảng thời gian
    request:
      url: "{{baseUrl}}/price/{{symbol}}/trades"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: 2026-05-07
      params:
        - name: boardId
          value: G1
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "prices": [
              {
                "marketId": "STO",
                "boardId": "G1",
                "isin": "VN000000HPG4",
                "symbol": "HPG",
                "closePrice": 26.8,
                "time": "2026-04-08 02:14:59.775"
              }
            ]
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/price/{{symbol}}/trades"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: 2026-05-07
      params:
        - name: boardId
          value: ""
          type: query
        - name: from
          value: ""
          type: query
        - name: to
          value: ""
          type: query
        - name: symbol
          value: ""
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/price/{{symbol}}/trades"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: 2026-05-07
      params:
        - name: boardId
          value: ""
          type: query
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |-
  Truy vấn thông tin giá đóng cửa trong phiên giao dịch của mã chứng khoán.

  <h3 id="getpricesymbolclose-parameters">Parameters</h3>

  |Name|In|Type|Required|Description|
  |---|---|---|---|---|
  |boardId|query|string|false|Mã bảng giao dịch|
  |X-API-Key|header|string|true|API Key được cấp khi đăng ký dịch vụ|
  |X-Aux-Date|header|string|true|Thời gian thực hiện yêu cầu|
  |X-Signature|header|string|true|Chữ ký xác thực yêu cầu|
  |version|header|string(date)|false|Phiên bản API |
  |symbol|path|string|true|Mã chứng khoán|

  #### Detailed descriptions

  **boardId**: Mã bảng giao dịch
  - G1: Lô chẵn
  - G4: Lô lẻ
  - T1: Thỏa thuận trong giờ (9h - 14h45)
  - T3: Thỏa thuận sau giờ (14h45 - 15h)
  - T4: Thỏa thuận lô lẻ trong giờ (9h - 14h45)
  - T6: Thỏa thuận lô lẻ sau giờ  (14h45 - 15h)

  <h3 id="getpricesymbolclose-responseschema">Response Schema</h3>

  |Name|Type|Required|Restrictions|Description|
  |---|---|---|---|---|
  |» prices|[object]|false|none|none|
  |»» marketId|string|false|none|Mã thị trường niêm yết mã chứng khoán<br>- DVX: Phái sinh sàn HNX<br>- HCX: Trái phiếu doanh nghiệp HNX<br>- STO: Cổ phiếu sàn HOSE<br>- STX: Cổ phiếu sàn HNX<br>- UPX: Cổ phiếu sàn Upcom|
  |»» boardId|string|false|none|Mã bảng giao dịch<br>- G1: Lô chẵn<br>- G4: Lô lẻ<br>- T1: Thỏa thuận trong giờ (9h - 14h45)<br>- T3: Thỏa thuận sau giờ (14h45 - 15h)<br>- T4: Thỏa thuận lô lẻ trong giờ (9h - 14h45)<br>- T6: Thỏa thuận lô lẻ sau giờ (14h45 - 15h)|
  |»» isin|string|false|none|Mã định danh quốc tế|
  |»» symbol|string|false|none|Mã chứng khoán|
  |»» closePrice|number(double)|false|none|Giá đóng cửa gần nhất|
  |»» time|string|false|none|Thời gian ghi nhận (theo định dạng yyyy-MM-dd HH:mm:ss.SSS) (GMT+7)|
