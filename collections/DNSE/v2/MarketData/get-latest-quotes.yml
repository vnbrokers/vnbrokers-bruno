info:
  name: Dữ liệu bid/ask gần nhất
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/price/:symbol/quotes/latest?boardId=G1"
  params:
    - name: boardId
      value: G1
      type: query
      description: "Mã bảng giao dịch: G1 (lô chẵn), G4 (lô lẻ), T1/T3/T4/T6 (thỏa thuận)."
    - name: symbol
      value: "{{symbol}}"
      type: path
      description: "Mã chứng khoán."
  auth: inherit

runtime:
  variables:
    - name: symbol
      value: ACB

  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "GetLatestQuotesResponse",
            "type": "object",
            "properties": {
              "quotes": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "marketId": {
                      "type": "string"
                    },
                    "boardId": {
                      "type": "string"
                    },
                    "isin": {
                      "type": "string"
                    },
                    "symbol": {
                      "type": "string"
                    },
                    "bid": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "price": {
                            "type": "number"
                          },
                          "quantity": {
                            "type": "integer"
                          }
                        }
                      }
                    },
                    "offer": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "price": {
                            "type": "number"
                          },
                          "quantity": {
                            "type": "integer"
                          }
                        }
                      }
                    },
                    "totalOfferQtty": {
                      "type": "integer"
                    },
                    "totalBidQtty": {
                      "type": "integer"
                    },
                    "time": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – trả về dữ liệu bid/ask gần nhất
    request:
      url: "{{baseUrl}}/price/{{symbol}}/quotes/latest"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-07-23"
      params:
        - name: boardId
          value: G1
          type: query
        - name: symbol
          value: ACB
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "quotes": [
              {
                "marketId": "STO",
                "boardId": "G1",
                "isin": "VN000000ACB8",
                "symbol": "ACB",
                "bid": [
                  {
                    "price": 24.55,
                    "quantity": 60590
                  },
                  {
                    "price": 24.5,
                    "quantity": 30250
                  },
                  {
                    "price": 24.45,
                    "quantity": 19600
                  }
                ],
                "offer": [
                  {
                    "price": 24.6,
                    "quantity": 10450
                  },
                  {
                    "price": 24.65,
                    "quantity": 8450
                  },
                  {
                    "price": 24.7,
                    "quantity": 23080
                  }
                ],
                "totalOfferQtty": 0,
                "totalBidQtty": 0,
                "time": "2026-05-27 09:49:01.001"
              }
            ]
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/price/{{symbol}}/quotes/latest"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-07-23"
      params:
        - name: boardId
          value: ""
          type: query
        - name: symbol
          value: ""
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/price/{{symbol}}/quotes/latest"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-07-23"
      params:
        - name: boardId
          value: ""
          type: query
        - name: symbol
          value: ""
          type: path
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

