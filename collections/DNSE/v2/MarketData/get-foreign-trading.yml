info:
  name: Dữ liệu NĐT nước ngoài
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/price/:symbol/foreign-trading?boardId=G1&from=1781139600&to=1781172000"
  params:
    - name: boardId
      value: G1
      type: query
      description: "Mã bảng giao dịch"
    - name: from
      value: "1781139600"
      type: query
      description: "Thời gian bắt đầu (timestamp)"
    - name: to
      value: "1781172000"
      type: query
      description: "Thời gian kết thúc (timestamp) (không vượt quá 1 ngày)"
    - name: limit
      value: ""
      type: query
      description: "Số lượng bản ghi tối đa trả về."
    - name: order
      value: ""
      type: query
      description: "Thứ tự sắp xếp kết quả."
    - name: symbol
      value: "{{symbol}}"
      type: path
      description: "Mã chứng khoán"
  auth: inherit

runtime:
  variables:
    - name: symbol
      value: ACB

  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "GetForeignTradingResponse",
            "type": "object",
            "properties": {
              "foreigners": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "marketId": { "type": "string" },
                    "boardId": { "type": "string" },
                    "symbol": { "type": "string" },
                    "tradingSessionId": { "type": "string" },
                    "sellVolume": { "type": "integer" },
                    "sellTradedAmount": { "type": "integer" },
                    "buyVolume": { "type": "integer" },
                    "buyTradedAmount": { "type": "integer" },
                    "totalSellVolume": { "type": "integer" },
                    "totalSellTradedAmount": { "type": "integer" },
                    "totalBuyVolume": { "type": "integer" },
                    "totalBuyTradedAmount": { "type": "integer" },
                    "foreignerOrderLimitQuantity": { "type": "integer" },
                    "foreignerBuyPossibleQuantity": { "type": "integer" },
                    "time": { "type": "string" }
                  }
                }
              },
              "nextPageToken": {
                "type": ["string", "null"]
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

