docs: |-
  Truy vấn thông tin dữ liệu nhà đầu tư nước ngoài.

  <h3 id="get-foreign-trading-parameters">Parameters</h3>

  |Name|In|Type|Required|Description|
  |---|---|---|---|---|
  |boardId|query|string|false|Mã bảng giao dịch|
  |from|query|integer|true|Thời gian bắt đầu (timestamp)|
  |to|query|integer|true|Thời gian kết thúc (timestamp) (không vượt quá 1 ngày)|
  |limit|query|integer|false|none|
  |order|query|string|false|none|
  |X-API-Key|header|string|true|API Key được cấp khi đăng ký dịch vụ|
  |X-Aux-Date|header|string|true|Thời gian thực hiện yêu cầu|
  |X-Signature|header|string|true|Chữ ký xác thực yêu cầu|
  |version|header|string|false|Phiên bản API |
  |symbol|path|string|true|Mã chứng khoán|

  #### Detailed descriptions

  **boardId**: Mã bảng giao dịch
  - G1: Lô chẵn
  - G4: Lô lẻ
  - T1: Thỏa thuận trong giờ (9h - 14h45)
  - T3: Thỏa thuận sau giờ (14h45 - 15h)
  - T4: Thỏa thuận lô lẻ trong giờ (9h - 14h45)
  - T6: Thỏa thuận lô lẻ sau giờ  (14h45 - 15h)

  <h3 id="get-foreign-trading-responseschema">Response Schema</h3>

  Status Code **200**

  |Name|Type|Required|Restrictions|Description|
  |---|---|---|---|---|
  |» foreigners|[object]|false|none|none|
  |»» marketId|string|false|none|Mã thị trường niêm yết mã chứng khoán|
  |»» boardId|string|false|none|Mã bảng giao dịch|
  |»» symbol|string|false|none|Mã chứng khoán|
  |»» tradingSessionId|string|false|none|Mã phiên giao dịch hiện tại|
  |»» sellVolume|integer(int32)|false|none|Khối lượng bán khớp lệnh của NĐT nước ngoài trong phiên|
  |»» sellTradedAmount|integer(int64)|false|none|Giá trị bán khớp lệnh của NĐT nước ngoài trong phiên|
  |»» buyVolume|integer(int32)|false|none|Khối lượng mua khớp lệnh của NĐT nước ngoài trong phiên|
  |»» buyTradedAmount|integer(int64)|false|none|Giá trị mua khớp lệnh của NĐT nước ngoài trong phiên|
  |»» totalSellVolume|integer(int32)|false|none|Tổng khối lượng bán lũy kế của NĐT nước ngoài|
  |»» totalSellTradedAmount|integer(int64)|false|none|Tổng giá trị bán lũy kế của NĐT nước ngoài|
  |»» totalBuyVolume|integer(int32)|false|none|Tổng khối lượng mua lũy kế của NĐT nước ngoài|
  |»» totalBuyTradedAmount|integer(int64)|false|none|Tổng giá trị mua lũy kế của NĐT nước ngoài|
  |»» foreignerOrderLimitQuantity|integer(int32)|false|none|Giới hạn khối lượng sở hữu tối đa cho NĐT nước ngoài|
  |»» foreignerBuyPossibleQuantity|integer(int32)|false|none|Khối lượng còn lại NĐT nước ngoài được phép mua|
  |»» time|string|false|none|Thời gian trong message giá của sàn (YYYY-MM-DD HH:mm:ss.SSS (GMT+7))|
  |» nextPageToken|string or null|false|none|Token dùng để lấy trang dữ liệu tiếp theo|
