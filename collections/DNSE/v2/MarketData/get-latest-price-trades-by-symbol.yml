info:
  name: Dữ liệu khớp gần nhất
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/price/:symbol/trades/latest"
  params:
    - name: boardId
      value: G1
      type: query
    - name: symbol
      value: "{{symbol}}"
      type: path
  auth: inherit

runtime:
  variables:
    - name: symbol
      value: ACB

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – trả về dữ liệu khớp gần nhất của mã chứng khoán
    request:
      url: "{{baseUrl}}/price/{{symbol}}/trades/latest"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-05-07"
      params:
        - name: boardId
          value: G1
          type: query
        - name: symbol
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "trades": []
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/price/{{symbol}}/trades/latest"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-05-07"
      params:
        - name: boardId
          value: ""
          type: query
        - name: symbol
          value: ""
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/price/{{symbol}}/trades/latest"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-05-07"
      params:
        - name: boardId
          value: ""
          type: query
        - name: symbol
          value: ""
          type: path
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |-
  API trả về dữ liệu khớp gần nhất của mã chứng khoán.

  Query Parameters:
    - boardId (string, required): Mã bảng giao dịch
        G1: Lô chẵn
        G4: Lô lẻ
        T1: Thỏa thuận trong giờ
        T3: Thỏa thuận sau giờ
        T4: Thỏa thuận lô lẻ trong giờ
        T6: Thỏa thuận lô lẻ sau giờ

  Path Parameters:
    - symbol (string): Mã chứng khoán

  Response bao gồm:
    - Danh sách giao dịch gần nhất: giá khớp, khối lượng, giá trị, thời gian
