info:
  name: Lấy danh sách mã chứng khoán
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/instruments?symbol=ACB&limit=1000"
  params:
    - name: symbol
      value: ACB
      type: query
      description: "Danh sách mã chứng khoán, phân tách bằng dấu phẩy. Ví dụ: 'SSI,SHS,ACB'."
    - name: marketId
      value: ""
      type: query
      description: "Mã thị trường niêm yết: STO, STX, UPX, DVX, HCX."
      disabled: true
    - name: securityGroupId
      value: ""
      type: query
      description: "Nhóm chứng khoán: ST, EF, EW, FU, BS."
      disabled: true
    - name: indexName
      value: VN30
      type: query
      description: "Tên chỉ số thị trường: VN30, VN100, HNX30."
      disabled: true
    - name: limit
      value: "1000"
      type: query
      description: Số bản ghi trên mỗi trang.
    - name: page
      value: ""
      type: query
      description: Trang hiện tại (bắt đầu từ 1).
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "GetInstrumentsResponse",
            "type": "object",
            "properties": {
              "data": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "symbol": {
                      "type": "string"
                    },
                    "marketId": {
                      "type": "string"
                    },
                    "securityGroupId": {
                      "type": "string"
                    },
                    "symbolType": {
                      "type": "string"
                    },
                    "listedDate": {
                      "type": "string"
                    },
                    "shortName": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "indexName": {
                      "type": "array",
                      "items": {}
                    }
                  }
                }
              },
              "total": {
                "type": "integer"
              },
              "page": {
                "type": "integer"
              },
              "pageSize": {
                "type": "integer"
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

