info:
  name: Chi tiết mã chứng khoán
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/instruments?symbol=ACB&marketId=STO&securityGroupId=ST&indexName=VN30&limit=10&page=1"
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"
      disabled: true
    - name: X-Aux-Date
      value: ""
      disabled: true
    - name: X-Signature
      value: ""
      disabled: true
  params:
    - name: symbol
      value: ACB
      type: query
    - name: marketId
      value: STO
      type: query
    - name: securityGroupId
      value: ST
      type: query
    - name: indexName
      value: VN30
      type: query
    - name: limit
      value: "10"
      type: query
    - name: page
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – trả về danh sách thông tin mã chứng khoán
    request:
      url: "{{baseUrl}}/instruments"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
      params:
        - name: symbol
          value: SSI,SHS,ACB,HUT,DSE
          type: query
        - name: marketId
          value: ""
          type: query
        - name: securityGroupId
          value: ""
          type: query
        - name: indexName
          value: ""
          type: query
        - name: limit
          value: ""
          type: query
        - name: page
          value: ""
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [],
            "total": 0,
            "page": 1,
            "pageSize": 0
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/instruments"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
      params:
        - name: symbol
          value: ""
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/instruments"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
      params:
        - name: symbol
          value: ""
          type: query
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |
  API trả về thông tin chi tiết của mã chứng khoán.

  Query Parameters:
    - symbol (string, required): Danh sách mã chứng khoán, phân tách bằng dấu phẩy
    - marketId (string, optional): Mã thị trường niêm yết
        STO: HOSE
        STX: HNX
        UPX: UPCOM
        DVX: Phái sinh
        HCX: Trái phiếu doanh nghiệp
    - securityGroupId (string, optional): Nhóm chứng khoán
        ST: Cổ phiếu
        EF: ETF
        EW: Chứng quyền
        FU: Hợp đồng tương lai
        BS: Trái phiếu
    - indexName (string, optional): Chỉ số thị trường (VN30, VN100, HNX30)
    - limit (number, optional): Số bản ghi mỗi trang
    - page (number, optional): Trang hiện tại

  Response bao gồm:
    - Thông tin mã chứng khoán: tên, ngày niêm yết, nhóm ngành, chỉ số liên quan
    - Thông tin phân trang: total, page, pageSize
