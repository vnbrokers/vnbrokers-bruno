info:
  name: Chi tiết mã chứng khoán
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/instruments?symbol=ACB&marketId=STO&securityGroupId=ST&indexName=VN30&limit=10&page=1"
  params:
    - name: symbol
      value: ACB
      type: query
    - name: marketId
      value: STO
      type: query
    - name: securityGroupId
      value: ST
      type: query
    - name: indexName
      value: VN30
      type: query
    - name: limit
      value: "10"
      type: query
    - name: page
      value: "1"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "GetInstrumentsByFilterResponse",
            "type": "object",
            "properties": {
              "data": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "symbol": {
                      "type": "string"
                    },
                    "marketId": {
                      "type": "string"
                    },
                    "securityGroupId": {
                      "type": "string"
                    },
                    "symbolType": {
                      "type": "string"
                    },
                    "listedDate": {
                      "type": "string"
                    },
                    "shortName": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "indexName": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    }
                  }
                }
              },
              "total": {
                "type": "integer"
              },
              "page": {
                "type": "integer"
              },
              "pageSize": {
                "type": "integer"
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

