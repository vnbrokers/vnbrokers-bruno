info:
  name: Thông tin phiên giao dịch
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/market/trading-session?tscProdGrpId=STO"
  params:
    - name: boardId
      value: G1
      type: query
      description: "Mã bảng giao dịch: G1 (Lô chẵn), G4 (Lô lẻ), T1 (Thỏa thuận trong giờ), T3 (Thỏa thuận sau giờ), T4 (Thỏa thuận lô lẻ trong giờ), T6 (Thỏa thuận lô lẻ sau giờ)."
      disabled: true
    - name: tscProdGrpId
      value: STO
      type: query
      description: "Nhóm sản phẩm theo thị trường: STO, STX, UPX, FBX, FIO, HCX."
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "GetTradingSessionResponse",
            "type": "object",
            "properties": {
              "tradingSessions": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "marketId": { "type": "string" },
                    "boardId": { "type": "string" },
                    "tscProdGrpId": { "type": "string" },
                    "tradingSessionId": { "type": "string" },
                    "eventId": { "type": "string" },
                    "time": { "type": "string" }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

