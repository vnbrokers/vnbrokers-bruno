info:
  name: Lịch sử bid/ask
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/price/:symbol/quotes?boardId=G1&from=1780022000&to=1780042000&limit=100"
  params:
    - name: boardId
      value: G1
      type: query
    - name: from
      value: "1780022000"
      type: query
    - name: to
      value: "1780042000"
      type: query
    - name: limit
      value: "100"
      type: query
    - name: symbol
      value: "{{symbol}}"
      type: path
  auth: inherit

runtime:
  variables:
    - name: symbol
      value: ACB
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "GetQuotesResponse",
            "type": "object",
            "properties": {
              "quotes": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "marketId": {
                      "type": "string"
                    },
                    "boardId": {
                      "type": "string"
                    },
                    "isin": {
                      "type": "string"
                    },
                    "symbol": {
                      "type": "string"
                    },
                    "bid": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "price": {
                            "type": "number"
                          },
                          "quantity": {
                            "type": "integer"
                          }
                        }
                      }
                    },
                    "offer": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "price": {
                            "type": "number"
                          },
                          "quantity": {
                            "type": "integer"
                          }
                        }
                      }
                    },
                    "totalOfferQtty": {
                      "type": "integer"
                    },
                    "totalBidQtty": {
                      "type": "integer"
                    },
                    "time": {
                      "type": "string"
                    }
                  }
                }
              },
              "nextPageToken": {
                "type": "string"
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – trả về lịch sử bid/ask
    request:
      url: "{{baseUrl}}/price/{{symbol}}/quotes"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: 2026-05-07
      params:
        - name: boardId
          value: G1
          type: query
        - name: from
          value: "1780022000"
          type: query
        - name: to
          value: "1780022000"
          type: query
        - name: limit
          value: "100"
          type: query
        - name: symbol
          value: ACB
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "quotes": [
              {
                "marketId": "STO",
                "boardId": "G1",
                "isin": "VN000000ACB8",
                "symbol": "ACB",
                "bid": [
                  {
                    "price": 24.25,
                    "quantity": 1210
                  },
                  {
                    "price": 24.2,
                    "quantity": 20240
                  },
                  {
                    "price": 24.15,
                    "quantity": 38820
                  }
                ],
                "offer": [
                  {
                    "price": 24.3,
                    "quantity": 37590
                  },
                  {
                    "price": 24.35,
                    "quantity": 119710
                  },
                  {
                    "price": 24.4,
                    "quantity": 127640
                  }
                ],
                "totalOfferQtty": 0,
                "totalBidQtty": 0,
                "time": "2026-05-26 11:29:57.677"
              }
            ],
            "nextPageToken": ""
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/price/{{symbol}}/quotes"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: 2026-05-07
      params:
        - name: boardId
          value: ""
          type: query
        - name: from
          value: "1780022000"
          type: query
        - name: to
          value: "1780022000"
          type: query
        - name: limit
          value: "100"
          type: query
        - name: symbol
          value: ""
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/price/{{symbol}}/quotes"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: 2026-05-07
      params:
        - name: boardId
          value: ""
          type: query
        - name: from
          value: "1780022000"
          type: query
        - name: to
          value: "1780022000"
          type: query
        - name: limit
          value: "100"
          type: query
        - name: symbol
          value: ""
          type: path
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |-
  Truy vấn thông tin lịch sử nến (open, high, low, close, volume) cho Cổ phiếu, Phái sinh và Chỉ số thị trường theo khung thời gian và khoảng thời gian cụ thể.

  |Name|Type|Required|Restrictions|Description|
  |---|---|---|---|---|
  |» quotes|[object]|false|none|Danh sách dữ liệu|
  |»» marketId|string|false|none|Mã thị trường niêm yết mã chứng khoán|
  |»» boardId|string|false|none|Mã bảng giao dịch|
  |»» isin|string|false|none|Mã định danh quốc tế|
  |»» symbol|string|false|none|Mã chứng khoán|
  |»» bid|[object]|false|none|Danh sách các mức giá chào mua|
  |»»» price|number(float)|false|none|Giá chào mua|
  |»»» quantity|integer(int32)|false|none|Khối lượng chào mua tại mức giá tương ứng|
  |»» offer|[object]|false|none|Danh sách các mức giá chào bán|
  |»»» price|number(double)|false|none|Giá chào bán|
  |»»» quantity|integer(int32)|false|none|Khối lượng chào bán tại mức giá tương ứng|
  |»» totalOfferQtty|integer(int32)|false|none|Tổng khối lượng chào bán|
  |»» totalBidQtty|integer(int32)|false|none|Tổng khối lượng chào mua|
  |»» time|string|false|none|Thời gian trong các message giá của sàn trả về (YYYY-MM-DD HH:mm:ss.SSS (GMT+7))|
  |» nextPageToken|string|false|none|Token dùng để phân trang và truy vấn dữ liệu trang tiếp theo|

