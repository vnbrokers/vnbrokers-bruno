info:
  name: Ngày làm việc (Working Dates)
  type: http
  seq: 502

http:
  method: GET
  url: https://openapi.dnse.com.vn/market/working-dates
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "GetWorkingDatesResponse",
            "type": "object",
            "properties": {
              "workingDates": {
                "type": "array",
                "items": {
                  "type": "string"
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – trả về danh sách ngày làm việc
    request:
      url: https://openapi.dnse.com.vn/market/working-dates
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: X-Aux-Date
          value: "{{X-Aux-Date}}"
        - name: X-Signature
          value: "{{X-Signature}}"
        - name: version
          value: 2026-05-07
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "workingDates": [
              "2026-04-16"
            ]
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: https://openapi.dnse.com.vn/market/working-dates
      method: GET
      headers:
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
        - name: version
          value: ""
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: https://openapi.dnse.com.vn/market/working-dates
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: X-Aux-Date
          value: "{{X-Aux-Date}}"
        - name: X-Signature
          value: "{{X-Signature}}"
        - name: version
          value: 2026-05-07
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |-
  Truy vấn danh sách ngày làm việc (ngày giao dịch) của thị trường chứng khoán trong vòng 1 năm tính từ ngày hiện tại, đã loại trừ các ngày nghỉ lễ và cuối tuần.

  <h3 id="getmarketworkingdates-parameters">Parameters</h3>

  |Name|In|Type|Required|Description|
  |---|---|---|---|---|
  |X-API-Key|header|string|true|API Key được cấp khi đăng ký dịch vụ|
  |X-Aux-Date|header|string|true|Chữ ký xác thực yêu cầu|
  |X-Signature|header|string|true|Thời gian thực hiện yêu cầu|
  |version|header|string(date)|false|Phiên bản API |

  <h3 id="getmarketworkingdates-responseschema">Response Schema</h3>

  |Name|Type|Required|Restrictions|Description|
  |---|---|---|---|---|
  |» workingDates|[string]|false|none|Danh sách ngày làm việc|
