info:
  name: Ngày làm việc (Working Dates)
  type: http
  seq: 502

http:
  method: GET
  url: https://openapi.dnse.com.vn/market/working-dates
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – trả về danh sách ngày làm việc
    request:
      url: https://openapi.dnse.com.vn/market/working-dates
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: X-Aux-Date
          value: "{{X-Aux-Date}}"
        - name: X-Signature
          value: "{{X-Signature}}"
        - name: version
          value: 2026-05-07
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "workingDates": [
              "2026-04-16"
            ]
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: https://openapi.dnse.com.vn/market/working-dates
      method: GET
      headers:
        - name: X-API-Key
          value: ""
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
        - name: version
          value: ""
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: https://openapi.dnse.com.vn/market/working-dates
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: X-Aux-Date
          value: "{{X-Aux-Date}}"
        - name: X-Signature
          value: "{{X-Signature}}"
        - name: version
          value: 2026-05-07
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: Lấy danh sách ngày làm việc của thị trường chứng khoán trong 1 năm.
