opencollection: 1.0.0

info:
  name: DNSE Lightspeed v2
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: X-Api-Key
      value: "{{apiKey}}"
    - name: X-Signature
      value: "{{X-Signature}}"
    - name: X-Aux-Date
      value: "{{X-Aux-Date}}"
    - name: Content-Type
      value: application/json
    - name: Version
      value: "2026-05-07"
  auth:
    type: apikey
    key: X-API-Key
    value: "{{apiKey}}"
    placement: header
  scripts:
    - type: before-request
      code: |-
        const {sign} = require('./signer')
        sign(req)
    - type: after-response
      code: |-
        // `after-response` script for curl/HTTP clients code generation
        const {sign} = require('./signer')
        sign(req)
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
