opencollection: 1.0.0

info:
  name: DNSE Lightspeed v2
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"
      description: "API Key được cấp khi đăng ký dịch vụ."
    - name: X-Signature
      value: "{{X-Signature}}"
      description: "Chữ ký xác thực yêu cầu."
    - name: X-Aux-Date
      value: "{{X-Aux-Date}}"
      description: "Thời gian thực hiện yêu cầu."
    - name: Content-Type
      value: application/json
      description: "Định dạng dữ liệu của request."
    - name: version
      value: "2026-07-23"
      description: "Phiên bản API theo định dạng YYYY-MM-DD."
  auth:
    type: apikey
    key: X-API-Key
    value: "{{apiKey}}"
    placement: header
  scripts:
    - type: before-request
      code: |-
        const {sign} = require('./signer')
        sign(req)
    - type: after-response
      code: |-
        // `after-response` script for curl/HTTP clients code generation
        const {sign} = require('./signer')
        sign(req)
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
