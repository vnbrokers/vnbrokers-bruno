info:
  name: onForeign
  type: websocket
  seq: 8

websocket:
  url: "{{wsBaseUrl}}/v1/stream?encoding=json"
  message:
    type: text
    data: |-
      {
        "action": "subscribe",
        "channels": [
          {
            "name": "foreign.G1.json",
            "symbols": [
              "HPG"
            ]
          }
        ]
      }

settings:
  timeout: 0
  keepAliveInterval: 0

docs: |-
  ### Giao dịch nhà đầu tư nước ngoài (Foreign Investor)

  Cung cấp dữ liệu giao dịch của nhà đầu tư nước ngoài theo từng mã chứng khoán, bao gồm khối lượng và giá trị mua/bán,
  tổng lũy kế trong ngày và room còn lại. Dữ liệu được cập nhật trong phiên giao dịch khi có thay đổi.

  #### Input

  - **symbols**: Mã hoặc danh sách mã chứng khoán. Nếu không truyền, hệ thống sẽ trả toàn bộ danh sách mã chứng khoán trên
    phạm vi thị trường.
  - **boardId**: Mã bảng giao dịch (VD: G1 – lô chẵn). Nếu không truyền, hệ thống sẽ lấy tất cả các bảng.

  ```json
  {
    "action": "subscribe",
    "channels": [
      {
        "name": "foreign.G1.json",
        "symbols": [
          "HPG"
        ]
      }
    ]
  }
  ```

  #### Payload

  ```json lines
  {
    "marketId": "STO",
    //string  // Mã thị trường
    "boardId": "G1",
    //string  // Mã bảng giao dịch
    "tradingSessionId": "40",
    //string  // Mã phiên giao dịch hiện tại
    "symbol": "FPT",
    //string  // Mã chứng khoán
    "transactTime": "035200011",
    //string  // Thời điểm cập nhật
    "foreignInvestorTypeCode": "10",
    //string  // Loại nhà đầu tư nước ngoài
    "sellVolume": 1449400,
    //integer // Khối lượng bán trong ngày theo bảng giao dịch
    "sellTradedAmount": 109774810000,
    //float   // Giá trị bán trong ngày theo bảng giao dịch
    "buyVolume": 608300,
    //integer // Khối lượng mua trong ngày theo bảng giao dịch
    "buyTradedAmount": 46040960000,
    //float   // Giá trị mua trong ngày theo bảng giao dịch
    "totalSellVolume": 1449716,
    //integer // Tổng khối lượng bán trong ngày
    "totalSellTradedAmount": 109798718600,
    //float   // Tổng giá trị bán trong ngày
    "totalBuyVolume": 608370,
    //integer // Tổng khối lượng mua trong ngày
    "totalBuyTradedAmount": 46046280000,
    //float   // Tổng giá trị mua trong ngày
    "foreignerOrderLimitQuantity": 341884580,
    //integer // Tổng room sở hữu tối đa của NĐT nước ngoài
    "foreignerBuyPossibleQuantity": 351900000
    //integer // Room còn lại có thể mua
  }
  ```


