info:
  name: onQuotes
  type: websocket
  seq: 5

websocket:
  url: "{{wsBaseUrl}}/v1/stream?encoding=json"
  message:
    - title: message 1
      selected: false
      message:
        type: json
        data: |-
          {
            "action":"auth",
            "api_key":"{{apiKey}}",
            "signature":"{{wsSignature}}",
            "timestamp":{{wsTimestamp}},
            "nonce":"{{wsNonce}}"
          }
    - title: message 2
      selected: false
      message:
        type: json
        data: |-
          {
            "action": "pong"
          }
    - title: message 3
      selected: true
      message:
        type: json
        data: |
          {
            "action": "subscribe",
            "channels": [
              {
                "name": "top_price.G1.json",
                "symbols": [
                  "HPG"
                ]
              }
            ]
          }

settings:
  timeout: 0
  keepAliveInterval: 0

docs: |-
  ### Độ sâu thị trường (Quote)

  Cung cấp thông tin giá chào mua và chào bán tốt nhất của mã chứng khoán tại bảng giao dịch cụ thể, cập nhật theo thời
  gian thực trong phiên giao dịch.

  - Sàn HOSE hỗ trợ 3 mức giá.
  - Sàn HNX, UPCOM hỗ trợ 10 mức giá.

  #### Input

  - **symbols**: Mã hoặc danh sách mã chứng khoán. Nếu không truyền, hệ thống sẽ trả toàn bộ danh sách mã chứng khoán trên
    phạm vi thị trường.
  - **boardId**: Mã bảng giao dịch (VD: G1 – lô chẵn). Nếu không truyền, hệ thống sẽ lấy tất cả các bảng.

  ```json
  {
    "action": "subscribe",
    "channels": [
      {
        "name": "top_price.G1.json",
        "symbols": [
          "HPG"
        ]
      }
    ]
  }
  ```

  #### Payload

  ```json lines
  {
    "marketId": "STO",
    //string  // Mã thị trường niêm yết mã chứng khoán
    "boardId": "G1",
    //string  // Mã bảng giao dịch
    "isin": "VN000000HPG4",
    //string  // Mã định danh quốc tế
    "symbol": "HPG",
    //string  // Mã chứng khoán
    "bid": [
      {
        "price": 28.3,
        //float   // Giá chào mua cao nhất
        "quantity": 13330.0
        //float   // Tổng khối lượng chào mua tại mức giá này
      },
      {
        "price": 28.25,
        //float   // Mức giá chào mua tiếp theo
        "quantity": 40830.0
        //float   // Tổng khối lượng chào mua tại mức giá này
      },
      {
        "price": 28.2,
        //float   // Mức giá chào mua thấp hơn
        "quantity": 50490.0
        //float   // Tổng khối lượng chào mua tại mức giá này
      }
    ],
    "offer": [
      {
        "price": 28.35,
        //float   // Giá chào bán thấp nhất
        "quantity": 12660.0
        //float   // Tổng khối lượng chào bán tại mức giá tương ứng
      },
      {
        "price": 28.4,
        //float   // Mức giá chào bán tiếp theo
        "quantity": 27530.0
        //float   // Tổng khối lượng chào bán tại mức giá tương ứng
      },
      {
        "price": 28.45,
        //float   // Mức giá chào bán cao hơn
        "quantity": 26710.0
        //float   // Tổng khối lượng chào bán tại mức giá tương ứng
      }
    ],
    "totalOfferQtty": 922230,
    //integer // Tổng khối lượng chào bán
    "totalBidQtty": 643750
    //integer // Tổng khối lượng chào mua
  }
  ```

  #### Raw stream message

  ```json
  {
    "T": "q",
    "bid": [
      {
        "price": 23.45,
        "qtty": 53120
      },
      {
        "price": 23.4,
        "qtty": 79240
      },
      {
        "price": 23.35,
        "qtty": 75080
      }
    ],
    "boardId": "G1",
    "isin": "VN000000HPG4",
    "marketId": "STO",
    "multicastReceiveTime": {
      "Nanos": 487386393,
      "Seconds": 1782965020
    },
    "offer": [
      {
        "price": 23.5,
        "qtty": 14840
      },
      {
        "price": 23.55,
        "qtty": 23430
      },
      {
        "price": 23.6,
        "qtty": 49430
      }
    ],
    "symbol": "HPG",
    "time": {
      "Nanos": 489000000,
      "Seconds": 1782965020
    }
  }
  ```

  #### Raw stream message

  ```json
  {
    "T": "b",
    "close": 23.5,
    "high": 23.5,
    "lastUpdated": 1782965181,
    "low": 23.45,
    "open": 23.45,
    "resolution": "1",
    "symbol": "HPG",
    "time": 1782965160,
    "type": "STOCK",
    "volume": 2600
  }
  ```