info:
  name: onTradeExtra
  type: websocket
  seq: 4

websocket:
  url: "{{wsBaseUrl}}/v1/stream?encoding=json"
  message:
    type: json
    data: |-
      {
        "action": "subscribe",
        "channels": [
          {
            "name": "tick_extra.G1.json",
            "symbols": [
              "HPG"
            ]
          }
        ]
      }

settings:
  timeout: 0
  keepAliveInterval: 0

docs: |-
  ### Dữ liệu khớp lệnh (Trade Extra)

  DNSE cung cấp dữ liệu khớp lệnh của một mã chứng khoán qua 2 Function khác nhau: Trade và Trade Extra. Trade Extra có
  thêm một số thông tin mà DNSE tự tổng hợp thêm (mua bán chủ động, giá khớp trung bình), nếu người dùng không có nhu cầu
  lấy các thông tin này thì có thể dùng function Trade đơn thuần để tối ưu hơn về tốc độ nhận dữ liệu.

  #### Input

  - **symbols**: Mã hoặc danh sách mã chứng khoán. Nếu không truyền, hệ thống sẽ trả toàn bộ danh sách mã chứng khoán trên
    phạm vi thị trường.
  - **boardId**: Mã bảng giao dịch (VD: G1 – lô chẵn). Nếu không truyền, hệ thống sẽ lấy tất cả các bảng.


  ```json
  {
    "action": "subscribe",
    "channels": [
      {
        "name": "tick_extra.G1.json",
        "symbols": [
          "HPG"
        ]
      }
    ]
  }
  ```

  #### Payload

  ```json lines
  ```json lines
  {
    "marketId": "DVX",
    //string  // Mã thị trường niêm yết mã chứng khoán
    "boardId": "G1",
    //string  // Mã bảng giao dịch
    "isin": "VN41I1G20009",
    //string  // Mã định danh quốc tế
    "symbol": "41I1G2000",
    //string  // Mã chứng khoán
    "price": 1994.0,
    //float   // Giá khớp gần nhất
    "quantity": 1.0,
    //float   // Khối lượng khớp gần nhất
    "side": "UNSPECIFIED",
    //string  // Chiều mua, bán chủ động
    "avgPrice": 1997.654,
    //float   // Giá khớp trung bình
    "totalVolumeTraded": 104264,
    //integer // Tổng khối lượng khớp trong ngày
    "grossTradeAmount": 20828.33542,
    //float   // Tổng giá trị giao dịch trong ngày
    "highestPrice": 2009.6,
    //float   // Giá khớp cao nhất trong ngày
    "lowestPrice": 1988.8,
    //float   // Giá khớp thấp nhất trong ngày
    "openPrice": 2005.6,
    //float   // Giá mở cửa
    "tradingSessionId": "40"
    //string  // Mã phiên giao dịch hiện tại
  }
  ```

  #### Raw stream message

  ```json
  {
    "T": "te",
    "avgPrice": 23.529,
    "boardId": "G1",
    "grossTradeAmount": 100.603425,
    "highestPrice": 23.65,
    "isin": "VN000000HPG4",
    "lowestPrice": 23.45,
    "marketId": "STO",
    "matchPrice": 23.45,
    "matchQtty": 150,
    "multicastReceiveTime": {
      "Nanos": 448799357,
      "Seconds": 1782964423
    },
    "openPrice": 23.5,
    "side": "SELL",
    "symbol": "HPG",
    "time": {
      "Nanos": 449000000,
      "Seconds": 1782964423
    },
    "totalVolumeTraded": 427580,
    "tradingSessionId": "40"
  }
  ```  