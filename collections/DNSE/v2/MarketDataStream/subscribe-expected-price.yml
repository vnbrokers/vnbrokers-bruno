info:
  name: onExpectedPrice
  type: websocket
  seq: 6

websocket:
  url: "{{wsBaseUrl}}/v1/stream?encoding=json"
  message:
    type: json
    data: |
      {
        "action": "subscribe",
        "channels": [
          {
            "name": "expected_price.G1.json",
            "symbols": [
              "HPG"
            ]
          }
        ]
      }

settings:
  timeout: 0
  keepAliveInterval: 0

docs: |-
  ### Giá khớp dự kiến (Expected Price)

  Cung cấp thông tin giá đóng cửa, giá khớp dự kiến và khối lượng khớp dự kiến của mã chứng khoán trong các phiên giao
  dịch khớp lệnh định kỳ ATO và ATC.

  #### Input

  - **symbols**: Mã hoặc danh sách mã chứng khoán. Nếu không truyền, hệ thống sẽ trả toàn bộ danh sách mã chứng khoán trên
    phạm vi thị trường.
  - **boardId**: Mã bảng giao dịch (VD: G1 – lô chẵn). Nếu không truyền, hệ thống sẽ lấy tất cả các bảng.

  ```json
  {
    "action": "subscribe",
    "channels": [
      {
        "name": "expected_price.G1.json",
        "symbols": [
          "HPG"
        ]
      }
    ]
  }
  ```

  #### Payload

  ```json lines
  {
    "marketId": "DVX",
    //string    // Mã thị trường niêm yết mã chứng khoán
    "boardId": "G1",
    //string    // Mã bảng giao dịch
    "symbol": "41I1G1000",
    //string    // Mã chứng khoán
    "isin": "VN41I1G10000",
    //string    // Mã định danh quốc tế
    "closePrice": 28.45,
    //float     // Giá đóng cửa
    "expectedTradePrice": 28.45,
    //float     // Giá dự khớp tại thời điểm xác định
    "expectedTradeQuantity": 133780
    //integer   // Khối lượng dự khớp tại thời điểm xác định
  }
  ```

  #### Raw stream message:

  ```json
  ```
