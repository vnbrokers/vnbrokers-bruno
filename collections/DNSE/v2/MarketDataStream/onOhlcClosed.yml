info:
  name: onOhlcClosed
  type: websocket
  seq: 12

websocket:
  url: "{{wsBaseUrl}}/v1/stream?encoding=json"
  message:
    type: json
    data: |-
      {
        "action": "subscribe",
        "channels": [
          {
            "name": "ohlc_closed.1.json",
            "symbols": [
              "HPG"
            ]
          }
        ]
      }

settings:
  timeout: 0
  keepAliveInterval: 0

docs: |-
  ### OHLC đóng nến (OHLC Closed)

  Cung cấp dữ liệu nến đã đóng theo từng khung thời gian (resolution). Dữ liệu chỉ gửi khi kết thúc mỗi khung thời gian và
  không thay đổi sau đó.

  #### Input

  - **symbol**: Mã hoặc danh sách mã chứng khoán hay chỉ số thị trường
      - Lưu ý: Đối với phái sinh, truyền lên `symbolType` (VD: VN30F1M) thay vì `symbol` (VD: 41I1G4000).
  - **resolution**: Khung thời gian của nến (VD: 1, 3, 5, 15, 30, 1H, 1D, 1W)

  ```json
  {
    "action": "subscribe",
    "channels": [
      {
        "name": "ohlc_closed.1.json",
        "symbols": [
          "HPG"
        ]
      }
    ]
  }
  ```

  #### Payload

  ```json lines
  {
    "time": 1757992500,
    //integer   // Thời gian bắt đầu nến
    "open": 30.4,
    //float     // Giá mở cửa
    "high": 30.4,
    //float     // Giá cao nhất trong nến
    "low": 30.25,
    //float     // Giá thấp nhất trong nến
    "close": 30.3,
    //float     // Giá đóng cửa
    "volume": 1398200,
    //integer   // Khối lượng giao dịch
    "symbol": "HPG",
    //string    // Mã chứng khoán
    "resolution": "15",
    //string    // Khung thời gian nến
    "lastUpdated": 1757993014,
    //integer   // Thời gian cập nhật lần cuối
    "type": "STOCK"
    //string    // Loại nhóm thị trường
  }
  ```
