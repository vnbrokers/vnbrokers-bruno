info:
  name: Lấy thông tin tài khoản giao dịch
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("accountNo", res.getBody()?.accounts?.[0]?.id || "")
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "GetAccountsResponse",
            "type": "object",
            "properties": {
              "name": {
                "type": "string"
              },
              "custodyCode": {
                "type": "string"
              },
              "investorId": {
                "type": "string"
              },
              "accounts": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "dealAccount": {
                      "type": "boolean"
                    },
                    "derivativeAccount": {
                      "type": "boolean"
                    },
                    "derivative": {
                      "type": "object",
                      "properties": {
                        "status": {
                          "type": "string"
                        }
                      }
                    }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công - trả về thông tin khách hàng và danh sách tài khoản
    request:
      url: "{{baseUrl}}/accounts"
      method: GET
      headers:
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-07-23"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "Nguyen Van A",
            "custodyCode": "064CSUN032",
            "investorId": "1000005917",
            "accounts": [
              {
                "id": "0001179019",
                "dealAccount": true,
                "derivativeAccount": true,
                "derivative": {
                  "status": "ACTIVE"
                }
              }
            ]
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/accounts"
      method: GET
      headers:
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-07-23"
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/accounts"
      method: GET
      headers:
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-07-23"
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |-
  Truy vấn thông tin định danh của người dùng cùng danh sách tiểu khoản giao dịch, phục vụ cho việc xác định khả năng giao dịch và trạng thái hoạt động của tiểu khoản.

  <h3 id="getaccounts-parameters">Parameters</h3>

  |Name|In|Type|Required|Description|
  |---|---|---|---|---|
  |X-API-Key|header|string|true|API Key được cấp khi đăng ký dịch vụ|
  |X-Aux-Date|header|string|true|Thời gian thực hiện yêu cầu|
  |X-Signature|header|string|true|Chữ ký xác thực yêu cầu|
  |version|header|string(date)|false|Phiên bản API |

  <h3 id="getaccounts-responseschema">Response Schema</h3>

  |Name|Type|Required|Restrictions|Description|
  |---|---|---|---|---|
  |» name|string|false|none|Họ tên khách hàng|
  |» custodyCode|string|false|none|Số tài khoản lưu ký tại VSD|
  |» investorId|string|false|none|Mã định danh khách hàng tại DNSE|
  |» accounts|[object]|false|none|none|
  |»» id|string|false|none|Số tiểu khoản|
  |»» dealAccount|boolean|false|none|Tiểu khoản theo DEAL hoặc không|
  |»» derivativeAccount|boolean|false|none|none|
  |»» derivative|object|false|none|Trạng thái tài khoản phái sinh<br>ACTIVE: Đang hoạt động<br>INACTIVE: Ngừng hoạt động|
  |»»» status|string|false|none|Tiểu khoản được phép giao dịch phái sinh hoặc không|
