info:
  name: Lấy thông tin tài khoản giao dịch
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/accounts"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("accountNo", res.getBody()?.accounts?.[0]?.id || "")
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công - trả về thông tin khách hàng và danh sách tài khoản
    request:
      url: "{{baseUrl}}/accounts"
      method: GET
      headers:
        - name: X-API-Key
          value: ""
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
        - name: X-API-Key
          value: "{{apiKey}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "Nguyen Van A",
            "custodyCode": "064CSUN032",
            "investorId": "1000005917",
            "accounts": [
              {
                "id": "0001179019",
                "dealAccount": true,
                "derivativeAccount": true,
                "derivative": {
                  "status": "ACTIVE"
                }
              }
            ]
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/accounts"
      method: GET
      headers:
        - name: X-API-Key
          value: ""
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
        - name: X-API-Key
          value: "{{apiKey}}"
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/accounts"
      method: GET
      headers:
        - name: X-API-Key
          value: ""
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
        - name: X-API-Key
          value: "{{apiKey}}"
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: Trả về thông tin khách hàng và danh sách tài khoản (deal/derivative).
