            "type": "object",
            "properties": {
              "data": {
                "type": "object",
                "properties": {
                  "id": {
                    "type": "integer"
                  },
                  "symbol": {
                    "type": "string"
                  },
                  "marketType": {
                    "type": "string"
                  },
                  "accountNo": {
                    "type": "string"
                  },
                  "status": {
                    "type": "string"
                  },
                  "loanPackageId": {
                    "type": "integer"
                  },
                  "side": {
                    "type": "string"
                  },
                  "accumulateQuantity": {
                    "type": "integer"
                  },
                  "tradeQuantity": {
                    "type": "integer"
                  },
                  "closedQuantity": {
                    "type": "integer"
                  },
                  "openQuantity": {
                    "type": "integer"
                  },
                  "overNightQuantity": {
                    "type": "integer"
                  },
                  "costPrice": {
                    "type": "number"
                  },
                  "averageCostPrice": {
                    "type": "number"
                  },
                  "averageClosePrice": {
                    "type": "number"
                  },
                  "marketPrice": {
                    "type": "number"
                  },
                  "breakEvenPrice": {
                    "type": "number"
                  },
                  "createdDate": {
                    "type": "string"
                  },
                  "modifiedDate": {
                    "type": "string"
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

