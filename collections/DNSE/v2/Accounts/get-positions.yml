info:
  name: Vị thế nắm giữ
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/accounts/:accountNo/positions?marketType=DERIVATIVE&pageSize=20"
  params:
    - name: marketType
      value: DERIVATIVE
      type: query
    - name: pageSize
      value: "20"
      type: query
    - name: accountNo
      value: "{{accountNo}}"
      type: path
  auth: inherit

