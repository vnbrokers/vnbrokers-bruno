info:
  name: Sổ lệnh
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/accounts/:accountNo/orders?marketType=DERIVATIVE&orderCategory=NORMAL"
  params:
    - name: marketType
      value: DERIVATIVE
      type: query
    - name: orderCategory
      value: NORMAL
      type: query
    - name: accountNo
      value: "{{accountNo}}"
      type: path
  auth: inherit

