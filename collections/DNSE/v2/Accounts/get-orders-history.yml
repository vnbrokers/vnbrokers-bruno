                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "symbol": {
                      "type": "string"
                    },
                    "side": {
                      "type": "string"
                    },
                    "orderType": {
                      "type": "string"
                    },
                    "orderStatus": {
                      "type": "string"
                    },
                    "price": {
                      "type": "number"
                    },
                    "quantity": {
                      "type": "integer"
                    },
                    "fillQuantity": {
