info:
  name: Lịch sử lệnh
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/accounts/:accountNo/orders/history?marketType=DERIVATIVE&from=2026-05-01&to=2026-06-01"
  params:
    - name: marketType
      value: DERIVATIVE
      type: query
      description: "Loại thị trường"
    - name: from
      value: "2026-05-01"
      type: query
      description: "Ngày bắt đầu (yyyy-mm-dd)"
    - name: to
      value: "2026-06-01"
      type: query
      description: "Ngày kết thúc (yyyy-mm-dd)"
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: "Số tiểu khoản"
  auth: inherit

