info:
  name: Lấy số dư tài khoản theo số tiểu khoản
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/accounts/:accountNo/balances"
  params:
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: Số tiểu khoản
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "GetAccountBalancesResponse",
            "type": "object",
            "properties": {
              "stock": {
                "type": "object",
                "properties": {
                  "totalCash": {
                    "type": "integer"
                  },
                  "availableCash": {
                    "type": "integer"
                  },
                  "depositInterest": {
                    "type": "integer"
                  },
                  "totalDebt": {
                    "type": "integer"
                  },
                  "depositFeeAmount": {
                    "type": "integer"
                  },
                  "secureAmount": {
                    "type": "integer"
                  },
                  "orderSecured": {
                    "type": "integer"
                  },
                  "withdrawableCash": {
                    "type": "integer"
                  },
                  "cashDividendReceiving": {
                    "type": "integer"
                  }
                }
              },
              "derivative": {
                "type": "object",
                "properties": {
                  "pendingDepositWithdraw": {
                    "type": "integer"
                  },
                  "remainSecure": {
                    "type": "integer"
                  },
                  "usedSecure": {
                    "type": "integer"
                  },
                  "pendingSecure": {
                    "type": "integer"
                  },
                  "holdTaxAndFee": {
                    "type": "integer"
                  },
                  "totalLoanDebt": {
                    "type": "integer"
                  }
                }
              },
              "bond": {
                "type": "object",
                "properties": {
                  "totalValue": {
                    "type": "integer"
                  }
                }
              },
              "egg": {
                "type": "object",
                "properties": {
                  "totalValue": {
                    "type": "integer"
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

