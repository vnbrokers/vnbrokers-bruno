info:
  name: Lấy danh sách gói vay theo tiểu khoản
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/accounts/:accountNo/loan-packages?marketType=STOCK&symbol=ACB"
  params:
    - name: marketType
      value: STOCK
      type: query
      description: "Loại thị trường"
    - name: symbol
      value: ACB
      type: query
      description: "Mã chứng khoán"
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: "Số tiểu khoản"
  auth: inherit

