info:
  name: Chi tiết trạng thái lệnh
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/accounts/:accountNo/executions/:orderId?marketType=STOCK&orderCategory=NORMAL"
  params:
    - name: marketType
      value: STOCK
      type: query
    - name: orderCategory
      value: NORMAL
      type: query
    - name: accountNo
      value: "{{accountNo}}"
      type: path
    - name: orderId
      value: "{{orderId}}"
      type: path
  auth: inherit

runtime:
  variables:
    - name: orderId
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – trả về chi tiết trạng thái lệnh
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/executions/{{orderId}}"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
      params:
        - name: marketType
          value: DERIVATIVE
          type: query
        - name: orderCategory
          value: NORMAL
          type: query
        - name: accountNo
          value: ""
          type: path
        - name: orderId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 0,
            "side": "",
            "accountNo": "",
            "symbol": "",
            "price": 0,
            "quantity": 0,
            "orderType": "",
            "loanPackageId": 0,
            "orderCategory": "",
            "orderStatus": "",
            "fillQuantity": 0,
            "lastQuantity": 0,
            "lastPrice": 0,
            "averagePrice": 0,
            "transDate": "",
            "taxRate": 0,
            "exchangeFeeRate": 0,
            "feeRate": 0,
            "leaveQuantity": 0,
            "canceledQuantity": 0,
            "error": "",
            "marketType": "",
            "priceSecure": 0,
            "createdDate": "",
            "modifiedDate": "",
            "metadata": "",
            "reports": []
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/executions/{{orderId}}"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
      params:
        - name: marketType
          value: ""
          type: query
        - name: orderCategory
          value: ""
          type: query
        - name: accountNo
          value: ""
          type: path
        - name: orderId
          value: ""
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/executions/{{orderId}}"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
      params:
        - name: marketType
          value: ""
          type: query
        - name: orderCategory
          value: ""
          type: query
        - name: accountNo
          value: ""
          type: path
        - name: orderId
          value: ""
          type: path
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |-
  API trả về chi tiết trạng thái lệnh theo orderId và tiểu khoản.

  Query Parameters:
    - marketType (string, required): Loại thị trường (STOCK / DERIVATIVE)
    - orderCategory (string, required): Phân loại lệnh (mặc định NORMAL)

  Path Parameters:
    - accountNo (string): Số tiểu khoản
    - orderId (number): ID lệnh

  Response bao gồm:
    - Thông tin lệnh: giá, khối lượng, trạng thái, loại lệnh
    - Thông tin khớp: lastPrice, lastQuantity, averagePrice
    - Metadata bổ sung
    - Danh sách reports (lịch sử cập nhật trạng thái)
