info:
  name: Lấy sổ lệnh theo tiểu khoản
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/accounts/:accountNo/orders?marketType=DERIVATIVE&orderCategory=NORMAL"
  params:
    - name: marketType
      value: DERIVATIVE
      type: query
    - name: orderCategory
      value: NORMAL
      type: query
    - name: accountNo
      value: "{{accountNo}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công - trả về danh sách lệnh giao dịch
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/orders"
      method: GET
      headers:
        - name: X-API-Key
          value: ""
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
        - name: X-API-Key
          value: "{{apiKey}}"
      params:
        - name: accountNo
          value: ""
          type: path
        - name: marketType
          value: ""
          type: query
        - name: orderCategory
          value: ""
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
