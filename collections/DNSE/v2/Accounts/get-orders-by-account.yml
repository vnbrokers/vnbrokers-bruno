docs: |-
  Trả về danh sách lệnh giao dịch theo tiểu khoản, bao gồm thông tin giá, khối lượng, trạng thái và loại lệnh.

  Query Parameters
  marketType
  string
  required
  Loại thị trường

  STOCK: Sổ lệnh cơ sở
  DERIVATIVE: Sổ lệnh phái sinh
  Example: STOCK
  orderCategory
  string
  required
  Phân loại lệnh thường, lệnh điều kiện (mặc định NORMAL)

  Example: NORMAL
