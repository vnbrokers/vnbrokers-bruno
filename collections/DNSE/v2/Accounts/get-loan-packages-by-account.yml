    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/loan-packages"
      method: GET
      headers:
        - name: X-API-Key
          value: ""
        - name: X-Aux-Date
          value: ""
