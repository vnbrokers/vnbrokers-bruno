                  "channel": "",
                  "schemaType": "",
                  "createdDate": "",
                  "modifiedDate": "",
                  "fixedTradingFee": 0,
                  "fixedDailyCloseTradingFee": 0,
                  "progressTradingFee": [
                    {
                      "fromQuantity": 0,
                      "toQuantity": 0,
