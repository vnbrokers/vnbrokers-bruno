docs: |-
  Trả về danh sách gói vay theo tiểu khoản, bao gồm tỷ lệ vay, biểu phí và thông tin gói vay theo từng loại thị trường.

  ```
  {
    "symbol": "ACB",
    "marketType": "STOCK",
    "loanPackages": [
      {
        "id": 1775,
        "name": "GD Tiền mặt",
        "initialRate": 1.0,
        "interestRate": 0.0999,
        "liquidRate": 0.3,
        "maintenanceRate": 0.4,
        "type": "M",
        "brokerFirmBuyingFeeRate": 0.0,
        "brokerFirmSellingFeeRate": 0.0
      },
      {
        "id": 1769,
        "name": "RocketX",
        "initialRate": 0.5,
