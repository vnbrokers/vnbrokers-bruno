                      "fee": 0
                    }
                  ]
                }
              }
            ]
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/loan-packages"
      method: GET
      headers:
        - name: X-API-Key
          value: ""
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-05-07"
      params:
        - name: accountNo
          value: ""
          type: path
        - name: marketType
          value: ""
          type: query
        - name: symbol
          value: ""
