info:
  name: Lấy danh sách gói vay theo tiểu khoản
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/accounts/:accountNo/loan-packages?marketType=STOCK&symbol=ACB"
  params:
    - name: marketType
      value: STOCK
      type: query
    - name: symbol
      value: ACB
      type: query
    - name: accountNo
      value: "{{accountNo}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công - trả về danh sách gói vay
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/loan-packages"
      method: GET
      headers:
        - name: X-API-Key
          value: ""
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-05-07"
      params:
        - name: accountNo
          value: ""
          type: path
        - name: marketType
          value: ""
          type: query
        - name: symbol
          value: ""
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "symbolType": "",
            "marketType": "",
            "loanPackages": [
              {
                "id": 0,
                "name": "",
                "initialRate": 0,
                "maintenanceRate": 0,
                "liquidRate": 0,
                "tradingFee": {
                  "id": 0,
                  "name": "",
