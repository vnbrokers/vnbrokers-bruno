info:
  name: Lịch sử sự kiện quyền
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/accounts/:accountNo/corporate-action-history?symbol=ACB&caType=cashDividend&caStatus=pending&pageIndex=0&pageSize=100"
  params:
    - name: symbol
      value: ACB
      type: query
    - name: caType
      value: cashDividend
      type: query
    - name: caStatus
      value: pending
      type: query
    - name: pageIndex
      value: "0"
      type: query
    - name: pageSize
      value: "100"
      type: query
    - name: accountNo
      value: "{{accountNo}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – trả về danh sách vị thế nắm giữ
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/positions"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: 2026-05-07
      params:
        - name: accountNo
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "positions": [
