info:
  name: Lấy sức mua, sức bán theo tiểu khoản
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/accounts/:accountNo/ppse?marketType=STOCK&symbol=ACB&loanPackageId=1769&price=22100"
  params:
    - name: marketType
      value: STOCK
      type: query
    - name: symbol
      value: ACB
      type: query
    - name: loanPackageId
      value: "1769"
      type: query
    - name: price
      value: "22100"
      type: query
    - name: accountNo
      value: "{{accountNo}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

