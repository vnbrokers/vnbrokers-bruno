info:
  name: Lấy sức mua, sức bán theo tiểu khoản
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/accounts/:accountNo/ppse?marketType=STOCK&symbol=ACB&loanPackageId=1769&price=22100"
  params:
    - name: marketType
      value: STOCK
      type: query
      description: "Loại thị trường"
    - name: symbol
      value: ACB
      type: query
      description: "Mã chứng khoán"
    - name: loanPackageId
      value: "1769"
      type: query
      description: "Id gói vay"
    - name: price
      value: "22100"
      type: query
      description: "Giá đặt lệnh"
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: "Số tiểu khoản"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "GetPpseResponse",
            "type": "object",
            "properties": {
              "qmaxBuy": {
                "type": "integer"
              },
              "qmaxSell": {
                "type": "integer"
              },
              "price": {
                "type": "number"
              },
              "pp0Buy": {
                "type": "number"
              },
              "pp0Short": {
                "type": "number"
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

