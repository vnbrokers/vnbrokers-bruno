info:
  name: Lịch sử lệnh
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/accounts/:accountNo/orders/history?marketType=DERIVATIVE&from=2025-05-01&to=2026-05-01"
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"
      disabled: true
    - name: X-Aux-Date
      value: ""
      disabled: true
    - name: X-Signature
      value: ""
      disabled: true
  params:
    - name: marketType
      value: DERIVATIVE
      type: query
    - name: from
      value: 2025-05-01
      type: query
    - name: to
      value: 2026-05-01
      type: query
    - name: start
      value: "100"
      type: query
      disabled: true
    - name: accountNo
      value: "{{accountNo}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – trả về lịch sử lệnh theo khoảng thời gian
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/orders/history"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
      params:
        - name: marketType
          value: STOCK
          type: query
        - name: from
          value: 2026-02-15
          type: query
        - name: to
          value: 2026-03-18
          type: query
        - name: accountNo
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "accountNo": "",
            "fillQuantity": 0,
            "total": 0,
            "start": 0,
            "end": 0,
            "marketType": "",
            "data": []
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/orders/history"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
      params:
        - name: marketType
          value: ""
          type: query
        - name: from
          value: ""
          type: query
        - name: to
          value: ""
          type: query
        - name: accountNo
          value: ""
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/orders/history"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
      params:
        - name: marketType
          value: ""
          type: query
        - name: from
          value: ""
          type: query
        - name: to
          value: ""
          type: query
        - name: accountNo
          value: ""
          type: path
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |
  API trả về lịch sử lệnh theo khoảng thời gian.

  Query Parameters:
    - marketType (string, required): Loại thị trường (STOCK / DERIVATIVE)
    - from (string, required): Ngày bắt đầu (yyyy-mm-dd)
    - to (string, required): Ngày kết thúc (yyyy-mm-dd)

  Path Parameters:
    - accountNo (string): Số tiểu khoản

  Ghi chú:
    - Khoảng thời gian tra cứu tối đa 1 năm tính từ ngày hiện tại.
    - Ngày "to" phải >= "from" và không vượt quá ngày hiện tại.

  Response bao gồm:
    - Tổng số bản ghi
    - Tổng khối lượng đã khớp
    - Danh sách lệnh: giá, khối lượng, trạng thái, loại lệnh, thời gian tạo/cập nhật
