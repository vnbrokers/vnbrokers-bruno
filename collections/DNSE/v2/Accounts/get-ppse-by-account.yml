docs: |-
  Trả về sức mua và sức bán tối đa theo tiểu khoản, dựa trên thị trường, mã chứng khoán, gói vay và giá đặt lệnh.


  marketType
  string
  required
  Loại thị trường

  STOCK: Gói vay giao dịch cơ sở
  DERIVATIVE: Gói vay giao dịch phái sinh
  Example: STOCK
  symbol
  string
  required
  Mã chứng khoán

  Example: ACB
  loanPackageId
  string
  required
  Id gói vay

  Example: 5757
  price
  string
  required
  Giá đặt lệnh

  Example: 23000

  {
    "qmaxBuy": 1209,
    "qmaxSell": 700,
    "price": 23000
  }
