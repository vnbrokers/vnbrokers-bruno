info:
  name: Chi tiết vị thế theo ID
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/positions/:positionId?marketType=STOCK"
  params:
    - name: marketType
      value: STOCK
      type: query
      description: "Loại thị trường"
    - name: positionId
      value: "{{positionId}}"
      type: path
      description: "Id vị thế"
  auth: inherit

runtime:
  variables:
    - name: positionId
      value: "2183078"

  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "GetPositionByIdResponse",
            "type": "object",
            "properties": {
              "id": {
                "type": "integer"
              },
              "marketType": {
                "type": "string"
              },
              "symbol": {
                "type": "string"
              },
              "accountNo": {
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "loanPackageId": {
                "type": "integer"
              },
              "side": {
                "type": "string"
              },
              "accumulateQuantity": {
                "type": "integer"
              },
              "tradeQuantity": {
                "type": "integer"
              },
              "closedQuantity": {
                "type": "integer"
              },
              "openQuantity": {
                "type": "integer"
              },
              "overNightQuantity": {
                "type": ["integer", "null"]
              },
              "costPrice": {
                "type": "number"
              },
              "averageCostPrice": {
                "type": "number"
              },
              "averageClosePrice": {
                "type": "number"
              },
              "marketPrice": {
                "type": "number"
              },
              "breakEvenPrice": {
                "type": "number"
              },
              "createdDate": {
                "type": "string"
              },
              "modifiedDate": {
                "type": "string"
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

