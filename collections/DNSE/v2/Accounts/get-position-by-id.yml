info:
  name: Chi tiết vị thế theo ID
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/accounts/positions/:positionId?marketType=STOCK"
  params:
    - name: marketType
      value: STOCK
      type: query
    - name: positionId
      value: "{{positionId}}"
      type: path
  auth: inherit

runtime:
  variables:
    - name: positionId
      value: "2183078"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
