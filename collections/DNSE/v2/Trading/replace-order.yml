info:
  name: Sửa lệnh
  type: http
  seq: 20

http:
  method: PUT
  url: "{{baseUrl}}/accounts/:accountNo/orders/:orderId?marketType=STOCK&orderCategory=NORMAL"
  headers:
    - name: trading-token
      value: "{{tradingToken}}"
      description: "Token xác thực giao dịch."
  params:
    - name: marketType
      value: STOCK
      type: query
      description: "Loại thị trường"
    - name: orderCategory
      value: NORMAL
      type: query
      description: "Phân loại lệnh thường, lệnh điều kiện (mặc định NORMAL)"
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: "Số tiểu khoản"
    - name: orderId
      value: "{{orderId}}"
      type: path
      description: "Id lệnh giao dịch"
  body:
    type: json
    data: |-
      {
        "price": {{price}},
        "quantity": {{quantity}}
      }
  auth: inherit

runtime:
  variables:
    - name: orderId
      value: "1"
    - name: price
      value: "10000"
    - name: quantity
      value: "1"
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "ReplaceOrderResponse",
            "type": "object",
            "properties": {
              "id": {
                "type": "integer"
              },
              "accountNo": {
                "type": "string"
              },
              "side": {
                "type": "string"
              },
              "loanPackageId": {
                "type": "integer"
              },
              "symbol": {
                "type": "string"
              },
              "orderType": {
                "type": "string"
              },
              "orderCategory": {
                "type": "string"
              },
              "price": {
                "type": "number"
              },
              "quantity": {
                "type": "integer"
              },
              "fillQuantity": {
                "type": "integer"
              },
              "canceledQuantity": {
                "type": "integer"
              },
              "marketType": {
                "type": "string"
              },
              "transDate": {
                "type": "string"
              },
              "createdDate": {
                "type": "string"
              },
              "modifiedDate": {
                "type": "string"
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – trả về thông tin lệnh sau khi sửa
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/orders/{{orderId}}"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: trading-token
          value: "{{tradingToken}}"
        - name: version
          value: "2026-07-23"
      params:
        - name: marketType
          value: DERIVATIVE
          type: query
        - name: orderCategory
          value: NORMAL
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 1626,
            "accountNo": "0001179019",
            "side": "NS",
            "loanPackageId": 2278,
            "symbol": "41I1G4000",
            "orderType": "LO",
            "orderCategory": "NORMAL",
            "price": 1851,
            "quantity": 3,
            "fillQuantity": 0,
            "canceledQuantity": 0,
            "marketType": "DERIVATIVE",
            "transDate": "2026-03-16",
            "createdDate": "2026-03-24T04:09:50.761146893Z",
            "modifiedDate": "2026-03-24T04:14:21.004856492Z"
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/orders/{{orderId}}"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: trading-token
          value: "{{tradingToken}}"
        - name: version
          value: "2026-07-23"
      params:
        - name: marketType
          value: ""
          type: query
        - name: orderCategory
          value: ""
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/orders/{{orderId}}"
      method: PUT
      headers:
        - name: Content-Type
          value: application/json
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: trading-token
          value: "{{tradingToken}}"
        - name: version
          value: "2026-07-23"
      params:
        - name: marketType
          value: DERIVATIVE
          type: query
        - name: orderCategory
          value: NORMAL
          type: query
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |-
  Gửi yêu cầu sửa lệnh đã đặt theo `orderId`.

  - Với cơ sở, lệnh sửa thành công đồng nghĩa với hủy lệnh cũ và đặt lại lệnh mới, người dùng có thể sửa đồng thời giá và khối lượng.
      
  - Với phái sinh, người dùng chỉ có thể sửa hoặc giá hoặc khối lượng. Khối lượng sửa phải lớn hơn khối lượng đã khớp (nếu có).

  <h3 id="replaceorder-parameters">Parameters</h3>

  |Name|In|Type|Required|Description|
  |---|---|---|---|---|
  |marketType|query|string|true|Loại thị trường |
  |orderCategory|query|string|true|Phân loại lệnh thường, lệnh điều kiện (mặc định NORMAL)|
  |X-API-Key|header|string|true|API Key được cấp khi đăng ký dịch vụ|
  |X-Signature|header|string|true|Chữ ký xác thực yêu cầu|
  |X-Aux-Date|header|string|true|Thời gian thực hiện yêu cầu|
  |trading-token|header|string|true|Token đặt lệnh|
  |version|header|string(date)|false|Phiên bản API |
  |body|body|object|false|none|
  |» price|body|number(double)|false|Giá mới cho lệnh LO|
  |» quantity|body|integer(int32)|false|Khối lượng mới|
  |accountNo|path|string|true|Số tiểu khoản|
  |orderId|path|integer|true|Id lệnh giao dịch|

  #### Detailed descriptions

  **marketType**: Loại thị trường 
  - STOCK: Giao dịch cơ sở
  - DERIVATIVE: Giao dịch phái sinh
  - BOND: Giao dịch trái phiếu

  **» price**: Giá mới cho lệnh LO
  - Đối với lệnh cơ sở, có thể sửa cả giá và khối lượng
  - Đối với lệnh phái sinh, chỉ được sửa hoặc giá hoặc khối lượng

  **» quantity**: Khối lượng mới
  - Đối với lệnh phái sinh, khối lượng mới phải lớn hơn khối lượng đã khớp (nếu có) của lệnh đã đặt

  <h3 id="replaceorder-responseschema">Response Schema</h3>

  |Name|Type|Required|Restrictions|Description|
  |---|---|---|---|---|
  |» id|integer(int32)|false|none|Id lệnh giao dịch|
  |» accountNo|string|false|none|Số tiểu khoản|
  |» side|string|false|none|Chiều đặt lệnh<br>- NB: Mua<br>- NS: Bán|
  |» loanPackageId|integer(int32)|false|none|Mã gói vay|
  |» symbol|string|false|none|Mã chứng khoán|
  |» orderType|string|false|none|Loại lệnh<br>- LO: Lệnh giới hạn<br>- MOK/MAK/MTL: Lệnh thị trường<br>- ATO/ATC: Lệnh phiên định kỳ mở cửa/đóng cửa<br>- PLO: Lệnh khớp lệnh sau giờ|
  |» orderCategory|string|false|none|Phân loại lệnh thường (mặc định NORMAL)|
  |» price|number(double)|false|none|Giá đặt|
  |» quantity|integer(int32)|false|none|Khối lượng đặt|
  |» fillQuantity|integer(int32)|false|none|Khối lượng khớp|
  |» canceledQuantity|integer(int32)|false|none|Khối lượng đã hủy|
  |» marketType|string|false|none|Loại thị trường<br>- STOCK: Lệnh cơ sở<br>- DERIVATIVE: Lệnh phái sinh|
  |» transDate|string|false|none|Ngày giao dịch|
  |» createdDate|string(date-time)|false|none|Thời điểm tạo|
  |» modifiedDate|string(date-time)|false|none|Thời điểm cập nhật|
