info:
  name: Cài đặt chốt lời, cắt lỗ cho vị thế
  type: http
  seq: 24

http:
  method: POST
  url: "{{baseUrl}}/positions/:positionId/pnl-configs"
  headers:
    - name: trading-token
      value: "{{tradingToken}}"
      description: "Token xác thực giao dịch."
  params:
    - name: marketType
      value: DERIVATIVE
      type: query
      description: "Loại thị trường"
      disabled: true
    - name: positionId
      value: "{{positionId}}"
      type: path
      description: "Id vị thế"
  body:
    type: json
    data: |-
      {
        "takeProfit": {
          "enabled": true,
          "strategy": "DELTA_PRICE",
          "rate": 0.52,
          "deltaPrice": 162.8,
          "orderMethod": "FASTEST",
          "orderDeltaPrice": 2
        },
        "stopLoss": {
          "enabled": true,
          "strategy": "PNL_RATE",
          "rate": -0.34,
          "deltaPrice": 50.3,
          "orderMethod": "DELTA_PRICE",
          "orderDeltaPrice": 10.5,
          "trailingEnabled": true
        }
      }
  auth: inherit

