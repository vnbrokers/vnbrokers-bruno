              },
              "positionId": {
                "type": "integer"
              },
              "configs": {
                "type": "object",
                "properties": {
                  "takeProfit": {
                    "type": "object",
                    "properties": {
                      "enabled": {
                        "type": "boolean"
                      },
                      "strategy": {
                        "type": "string"
                      },
                      "rate": {
                        "type": "number"
                      },
                      "deltaPrice": {
                        "type": "number"
                      },
                      "orderMethod": {
                        "type": "string"
                      },
                      "orderDeltaPrice": {
                        "type": "integer"
                      }
                    }
                  },
                  "stopLoss": {
                    "type": "object",
                    "properties": {
                      "enabled": {
                        "type": "boolean"
                      },
                      "strategy": {
                        "type": "string"
                      },
                      "rate": {
                        "type": "number"
                      },
                      "deltaPrice": {
                        "type": "number"
                      },
                      "orderMethod": {
                        "type": "string"
                      },
                      "orderDeltaPrice": {
                        "type": "number"
                      },
                      "trailingEnabled": {
                        "type": "boolean"
                      }
                    }
                  }
                }
              },
              "createdDate": {
                "type": "string"
              },
              "modifiedDate": {
                "type": "string"
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

