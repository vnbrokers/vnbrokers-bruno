              },
              "price": {
                "type": "number"
              },
              "quantity": {
                "type": "integer"
              },
              "orderType": {
                "type": "string"
              },
              "loanPackageId": {
                "type": "integer"
              },
              "orderCategory": {
                "type": "string"
              },
              "orderStatus": {
                "type": "string"
              },
              "fillQuantity": {
                "type": "integer"
              },
              "lastQuantity": {
                "type": "integer"
              },
              "lastPrice": {
                "type": "number"
              },
              "averagePrice": {
                "type": "number"
              },
              "transDate": {
                "type": "string"
              },
              "taxRate": {
                "type": "integer"
              },
              "exchangeFeeRate": {
                "type": "integer"
              },
              "feeRate": {
                "type": "integer"
              },
              "leaveQuantity": {
                "type": "integer"
              },
              "canceledQuantity": {
