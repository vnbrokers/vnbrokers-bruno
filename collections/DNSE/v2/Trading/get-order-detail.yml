info:
  name: Chi tiết lệnh theo ID
  type: http
  seq: 22

http:
  method: GET
  url: "{{baseUrl}}/accounts/:accountNo/orders/:orderId?marketType=DERIVATIVE&orderCategory=NORMAL"
  params:
    - name: marketType
      value: DERIVATIVE
      type: query
      description: "Loại thị trường"
    - name: orderCategory
      value: NORMAL
      type: query
      description: "Phân loại lệnh thường, lệnh điều kiện (mặc định NORMAL)"
    - name: accountNo
      value: "{{accountNo}}"
      type: path
      description: "Số tiểu khoản"
    - name: orderId
      value: "{{orderId}}"
      type: path
      description: "Id lệnh giao dịch"
  auth: inherit

