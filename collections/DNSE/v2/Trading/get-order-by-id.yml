info:
  name: Chi tiết lệnh theo ID
  type: http
  seq: 22

http:
  method: GET
  url: "{{baseUrl}}/accounts/:accountNo/orders/:orderId?marketType=DERIVATIVE&orderCategory=NORMAL"
  headers:
    - name: Accept
      value: application/json
      disabled: true
    - name: X-API-Key
      value: "{{apiKey}}"
      disabled: true
    - name: X-Aux-Date
      value: ""
      disabled: true
    - name: X-Signature
      value: ""
      disabled: true
  params:
    - name: marketType
      value: DERIVATIVE
      type: query
    - name: orderCategory
      value: NORMAL
      type: query
    - name: accountNo
      value: "{{accountNo}}"
      type: path
    - name: orderId
      value: "{{orderId}}"
      type: path
  auth: inherit

runtime:
  variables:
    - name: orderId
      value: "116"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – trả về chi tiết lệnh
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/orders/{{orderId}}"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: X-API-Key
          value: "{{apiKey}}"
      params:
        - name: marketType
          value: DERIVATIVE
          type: query
        - name: orderCategory
          value: NORMAL
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 0,
            "side": "",
            "accountNo": "",
            "symbol": "",
            "price": 0,
            "quantity": 0,
            "orderType": "",
            "loanPackageId": 0,
            "orderCategory": "",
            "orderStatus": "",
            "fillQuantity": 0,
            "lastQuantity": 0,
            "lastPrice": 0,
            "averagePrice": 0,
            "transDate": "",
            "taxRate": 0,
            "exchangeFeeRate": 0,
            "feeRate": 0,
            "leaveQuantity": 0,
            "canceledQuantity": 0,
            "error": "",
            "marketType": "",
            "priceSecure": 0,
            "createdDate": "",
            "modifiedDate": "",
            "metadata": "",
            "reports": []
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/orders/{{orderId}}"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: X-API-Key
          value: "{{apiKey}}"
      params:
        - name: marketType
          value: ""
          type: query
        - name: orderCategory
          value: ""
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/accounts/{{accountNo}}/orders/{{orderId}}"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: X-API-Key
          value: "{{apiKey}}"
      params:
        - name: marketType
          value: DERIVATIVE
          type: query
        - name: orderCategory
          value: NORMAL
          type: query
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |
  API lấy chi tiết lệnh theo ID.

  Query Parameters:
    - marketType (string, required): STOCK hoặc DERIVATIVE
    - orderCategory (string, required): NORMAL (mặc định)

  Header Parameters:
    - X-API-Key (string, optional)
    - X-Aux-Date (string, optional)
    - X-Signature (string, optional)

  Path Parameters:
    - accountNo (string): Số tiểu khoản
    - orderId (number): ID lệnh

  Response:
    - Thông tin chi tiết lệnh, bao gồm giá, khối lượng, trạng thái, phí, metadata và lịch sử cập nhật (reports)
