      headers:
        - name: Accept
          value: application/json
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: trading-token
          value: "{{tradingToken}}"
        - name: version
          value: "2026-07-23"
      params:
        - name: marketType
          value: DERIVATIVE
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
