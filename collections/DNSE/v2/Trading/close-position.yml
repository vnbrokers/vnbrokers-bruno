info:
  name: Đóng vị thế
  type: http
  seq: 23

http:
  method: POST
  url: "{{baseUrl}}/positions/:positionId/close?marketType=DERIVATIVE"
  headers:
    - name: trading-token
      value: "{{tradingToken}}"
      description: "Token xác thực giao dịch."
  params:
    - name: marketType
      value: DERIVATIVE
      type: query
      description: "Loại thị trường"
    - name: positionId
      value: "{{positionId}}"
      type: path
      description: "Id vị thế"
  auth: inherit

runtime:
  variables:
    - name: positionId
      value: "123"

  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "ClosePositionResponse",
            "type": "object",
            "properties": {
              "id": {
                "type": "integer"
              },
              "side": {
                "type": "string"
              },
              "accountNo": {
                "type": "string"
              },
              "symbol": {
                "type": "string"
              },
              "price": {
                "type": "number"
              },
              "quantity": {
                "type": "integer"
              },
              "orderType": {
                "type": "string"
              },
              "fillQuantity": {
                "type": "integer"
              },
              "leaveQuantity": {
                "type": "integer"
              },
              "canceledQuantity": {
                "type": "integer"
              },
              "loanPackageId": {
                "type": "integer"
              },
              "createdDate": {
                "type": "string"
              },
              "modifiedDate": {
                "type": "string"
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công - tạo lệnh đóng vị thế
    request:
      url: "{{baseUrl}}/positions/{{positionId}}/close"
