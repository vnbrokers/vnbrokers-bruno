info:
  name: Gửi Email OTP
  type: http
  seq: 17

http:
  method: POST
  url: "{{baseUrl}}/registration/send-email-otp"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "SendEmailOtpResponse",
            "type": "object",
            "properties": {}
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response (Không có ví dụ từ tài liệu)
    description: Thành công – OTP được gửi qua email
    request:
      url: "{{baseUrl}}/registration/send-email-otp"
      method: POST
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-07-23"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/registration/send-email-otp"
      method: POST
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-07-23"
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "OA-003",
            "message": "Thông tin nhập không hợp lệ",
            "status": 400
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/registration/send-email-otp"
      method: POST
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-07-23"
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |-
  Gửi yêu cầu nhận mã OTP qua Email, chỉ áp dụng cho các tài khoản đang sử dụng phương thức xác thực lớp thứ hai là Email OTP.

  <h3 id="sendemailotp-parameters">Parameters</h3>

  |Name|In|Type|Required|Description|
  |---|---|---|---|---|
  |X-API-Key|header|string|true|API Key được cấp khi đăng ký dịch vụ|
  |X-Aux-Date|header|string|true|Thời gian thực hiện yêu cầu|
  |X-Signature|header|string|true|Chữ ký xác thực yêu cầu|
  |version|header|string(date)|false|Phiên bản API |

  
