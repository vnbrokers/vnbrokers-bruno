info:
  name: Gửi Email OTP
  type: http
  seq: 17

http:
  method: POST
  url: "{{baseUrl}}/registration/send-email-otp"
  headers:
    - name: X-API-Key
      value: "{{apiKey}}"
    - name: X-Aux-Date
      value: ""
      disabled: true
    - name: X-Signature
      value: ""
      disabled: true
  auth: inherit

runtime:
  scripts:


settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response (Không có ví dụ từ tài liệu)
    description: Thành công – OTP được gửi qua email
    request:
      url: "{{baseUrl}}/registration/send-email-otp"
      method: POST
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/registration/send-email-otp"
      method: POST
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "OA-003",
            "message": "Thông tin nhập không hợp lệ",
            "status": 400
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/registration/send-email-otp"
      method: POST
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |
  API gửi mã OTP đến email của người dùng để xác thực.

  Header Parameters:
    - X-API-Key (string, required): API Key được cấp khi đăng ký dịch vụ
    - X-Aux-Date (string, required): Thời gian thực hiện yêu cầu
    - X-Signature (string, required): Chữ ký xác thực yêu cầu

  Response:
    - 200: OTP đã được gửi thành công
    - 400: Thông tin nhập không hợp lệ
    - 500: Lỗi hệ thống
