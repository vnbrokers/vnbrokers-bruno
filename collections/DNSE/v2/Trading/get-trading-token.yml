info:
  name: Xác thực OTP
  type: http
  seq: 18

http:
  method: POST
  url: "{{baseUrl}}/registration/trading-token"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-API-Key
      value: "{{apiKey}}"
      disabled: true
    - name: X-Aux-Date
      value: ""
      disabled: true
    - name: X-Signature
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
        "otpType": "{{otpType}}",
        "passcode": "{{passcode}}"

      }
  auth: inherit

runtime:
  variables:
    - name: otpType
      value: smart_otp
    - name: passcode
      value: "136583"
  scripts:
    - type: after-response
      code: |-
        const tradingToken = res.getBody().tradingToken
        bru.setEnvVar("tradingToken", tradingToken)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – trả về tradingToken
    request:
      url: "{{baseUrl}}/registration/trading-token"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-05-07"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "tradingToken": ""
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/registration/trading-token"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-05-07"
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/registration/trading-token"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-05-07"
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |-
  API xác thực mã OTP để lấy tradingToken phục vụ đặt lệnh.

  Body Parameters:
    - otpType (string, required): Phương thức xác thực OTP
        email_otp: OTP gửi qua email
        smart_otp: OTP từ ứng dụng Smart OTP
    - passcode (string, required): Mã OTP

  Response:
    - tradingToken: Token dùng để đặt lệnh
    - 400: Thông tin không hợp lệ
    - 500: Lỗi hệ thống
