              },
              "side": {
                "type": "string"
              },
              "orderType": {
                "type": "string"
              },
              "orderStatus": {
                "type": "string"
              },
              "price": {
                "type": "number"
              },
              "averagePrice": {
                "type": "integer"
              },
              "quantity": {
                "type": "integer"
              },
              "fillQuantity": {
                "type": "integer"
              },
              "canceledQuantity": {
                "type": "integer"
              },
              "leaveQuantity": {
                "type": "integer"
              },
              "accountNo": {
                "type": "string"
              },
              "marketType": {
                "type": "string"
              },
              "orderCategory": {
                "type": "string"
              },
              "transDate": {
                "type": "string"
              },
              "createdDate": {
                "type": "string"
              },
