info:
  name: Đặt lệnh
  type: http
  seq: 19

http:
  method: POST
  url: "{{baseUrl}}/accounts/orders?marketType=DERIVATIVE"
  headers:
    - name: trading-token
      value: "{{tradingToken}}"
  params:
    - name: marketType
      value: DERIVATIVE
      type: query
    - name: orderCategory
      value: NORMAL
      type: query
      disabled: true
  body:
    type: json
    data: |2-
          {
            "accountNo": "{{accountNo}}",
            "loanPackageId": {{loanPackageId}},
            "orderType": "{{orderType}}",
            "price": {{price}},
            "quantity":{{quantity}},
            "side": "{{side}}",
            "symbol": "{{symbol}}"
          }
  auth: inherit

