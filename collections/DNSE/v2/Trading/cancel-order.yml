info:
  name: Hủy lệnh
  type: http
  seq: 21

http:
  method: DELETE
  url: "{{baseUrl}}/accounts/:accountNo/orders/:orderId?marketType=DERIVATIVE&orderCategory=NORMAL"
  headers:
    - name: trading-token
      value: "{{tradingToken}}"
  params:
    - name: marketType
      value: DERIVATIVE
      type: query
    - name: orderCategory
      value: NORMAL
      type: query
    - name: accountNo
      value: "{{accountNo}}"
      type: path
    - name: orderId
      value: "{{orderId}}"
      type: path
  auth: inherit

runtime:
  variables:
    - name: orderId
      value: "116"

  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "CancelOrderResponse",
            "type": "object",
            "properties": {
              "id": {
                "type": "integer"
              },
              "symbol": {
                "type": "string"
              },
              "side": {
                "type": "string"
              },
              "orderType": {
                "type": "string"
              },
              "orderStatus": {
                "type": "string"
              },
              "loanPackageId": {
                "type": "string"
              },
              "price": {
                "type": "number"
              },
              "averagePrice": {
                "type": "number"
              },
              "quantity": {
                "type": "integer"
              },
              "fillQuantity": {
                "type": "integer"
              },
              "canceledQuantity": {
                "type": "integer"
              },
              "leaveQuantity": {
                "type": "integer"
              },
              "accountNo": {
                "type": "string"
              },
              "orderCategory": {
                "type": "string"
              },
              "marketType": {
                "type": "string"
              },
              "transDate": {
                "type": "string"
              },
              "createdDate": {
                "type": "string"
              },
              "modifiedDate": {
                "type": "string"
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

