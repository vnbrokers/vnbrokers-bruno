info:
  name: Xác thực OTP
  type: http
  seq: 18

http:
  method: POST
  url: "{{baseUrl}}/registration/trading-token"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-API-Key
      value: "{{apiKey}}"
      disabled: true
    - name: X-Aux-Date
      value: ""
      disabled: true
    - name: X-Signature
      value: ""
      disabled: true
  body:
    type: json
    data: |-
      {
        "otpType": "{{otpType}}",
        "passcode": "{{passcode}}"

      }
  auth: inherit

runtime:
  variables:
    - name: otpType
      value: smart_otp
    - name: passcode
      value: "136583"
  scripts:
    - type: after-response
      code: |-
        const tradingToken = res.getBody().tradingToken
        bru.setEnvVar("tradingToken", tradingToken)

    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "2FaVerificationResponse",
            "type": "object",
            "properties": {
              "tradingToken": {
                "type": "string"
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công - trả về tradingToken
    request:
      url: "{{baseUrl}}/registration/trading-token"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-05-07"
      body:
        type: json
        data: |-
          {
            "otpType": "email_otp",
            "passcode": "519752"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "tradingToken": "9ab81e9c-8a81-45aa-8190-b69a1c17****"
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/registration/trading-token"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-05-07"
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/registration/trading-token"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: version
          value: "2026-05-07"
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |-
  Xác thực mã OTP theo phương thức xác thực (Email OTP hoặc Smart OTP) đã đăng ký để lấy Trading Token. Đây là thông tin bắt buộc để xác thực quyền giao dịch, có hiệu lực trong 8 tiếng.

  <h3 id="2faverification-parameters">Parameters</h3>

  |Name|In|Type|Required|Description|
  |---|---|---|---|---|
  |X-API-Key|header|string|true|API Key được cấp khi đăng ký dịch vụ|
  |X-Aux-Date|header|string|true|Thời gian thực hiện yêu cầu|
  |X-Signature|header|string|true|Chữ ký xác thực yêu cầu|
  |version|header|string(date)|false|Phiên bản API |
  |body|body|object|false|none|
  |» otpType|body|string|false|Phương thức xác thực OTP|
  |» passcode|body|string|false|Mã OTP tương ứng với phương thức xác thực|

  #### Detailed descriptions

  **» otpType**: Phương thức xác thực OTP
  - email_otp: Áp dụng cho tài khoản đăng ký phương thức xác thực lớp thứ 2 là Email OTP
  - smart_otp: Áp dụng cho tài khoản đăng ký phương thức xác thực lớp thứ 2 là Smart OTP

  <h3 id="2faverification-responseschema">Response Schema</h3>

  |Name|Type|Required|Restrictions|Description|
  |---|---|---|---|---|
  |» tradingToken|string|false|none|Token đặt lệnh|
