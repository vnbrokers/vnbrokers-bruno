info:
  name: Danh sách tiểu khoản quản lý
  type: http
  seq: 501

http:
  method: GET
  url: "{{baseUrl}}/brokers/accounts/care-by"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "title": "CareByResponse",
            "type": "object",
            "properties": {
              "careBy": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "accountNo": {
                      "type": "string"
                    },
                    "fullName": {
                      "type": "string"
                    },
                    "investorId": {
                      "type": "string"
                    },
                    "custodyCode": {
                      "type": "string"
                    },
                    "underlyingNav": {
                      "type": "number"
                    },
                    "derivativeNav": {
                      "type": "number"
                    },
                    "totalNav": {
                      "type": "number"
                    },
                    "dealAccount": {
                      "type": "boolean"
                    },
                    "derivativeAccount": {
                      "type": "boolean"
                    },
                    "derivative": {
                      "type": "object",
                      "properties": {
                        "status": {
                          "type": "string"
                        }
                      }
                    },
                    "permissions": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "product": {
                            "type": "string"
                          },
                          "role": {
                            "type": "string"
                          }
                        }
                      }
                    }
                  }
                }
              },
              "total": {
                "type": "integer"
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – trả về danh sách tiểu khoản quản lý
    request:
      url: "{{baseUrl}}/brokers/accounts/care-by"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: X-Aux-Date
          value: "{{X-Aux-Date}}"
        - name: X-Signature
          value: "{{X-Signature}}"
        - name: version
          value: "2026-07-23"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "careBy": [
              {
                "accountNo": "0335000633",
                "fullName": "Hoang Tu Mai",
                "investorId": "1000009250",
                "custodyCode": "064C1MAI20",
                "underlyingNav": 21345678901,
                "derivativeNav": 32789123456,
                "totalNav": 54134802357,
                "dealAccount": true,
                "derivativeAccount": true,
                "derivative": {
                  "status": "ACTIVE"
                },
                "permissions": [
                  {
                    "product": "UNDERLYING_STOCK",
                    "role": "ADVISOR"
                  },
                  {
                    "product": "DERIVATIVES_STOCK",
                    "role": "BROKER"
                  }
                ]
              }
            ],
            "total": 1
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/brokers/accounts/care-by"
      method: GET
      headers:
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
        - name: version
          value: ""
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/brokers/accounts/care-by"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: X-Aux-Date
          value: "{{X-Aux-Date}}"
        - name: X-Signature
          value: "{{X-Signature}}"
        - name: version
          value: "2026-07-23"
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: |-
  Truy vấn danh sách tiểu khoản thuộc phạm vi quản lý của Môi giới/SACO DNSE, bao gồm thông tin định danh, giá trị tài sản cơ sở và phái sinh, danh sách quyền theo từng sản phẩm.

  <h3 id="getbrokersaccountscareby-parameters">Parameters</h3>

  |Name|In|Type|Required|Description|
  |---|---|---|---|---|
  |X-API-Key|header|string|true|API Key được cấp khi đăng ký dịch vụ|
  |X-Aux-Date|header|string|true|Chữ ký xác thực yêu cầu|
  |X-Signature|header|string|true|Thời gian thực hiện yêu cầu|
  |version|header|string(date)|false|Phiên bản API |

  <h3 id="getbrokersaccountscareby-responseschema">Response Schema</h3>

  |Name|Type|Required|Restrictions|Description|
  |---|---|---|---|---|
  |» careBy|[object]|false|none|none|
  |»» accountNo|string|false|none|Số tiểu khoản khách hàng|
  |»» fullName|string|false|none|Họ tên khách hàng|
  |»» investorId|string|false|none|Mã định danh khách hàng tại DNSE|
  |»» custodyCode|string|false|none|Số lưu ký tài khoản khách hàng|
  |»» underlyingNav|number(double)|false|none|Tài sản ròng cơ sở|
  |»» derivativeNav|number(double)|false|none|Tài sản phái sinh|
  |»» totalNav|number(double)|false|none|Tổng tài sản tiểu khoản|
  |»» dealAccount|boolean|false|none|Tiểu khoản theo Deal hoặc không|
  |»» derivativeAccount|boolean|false|none|Trạng thái tài khoản phái sinh<br>- ACTIVE: Đang hoạt động<br>- INACTIVE: Ngừng hoạt động|
  |»» derivative|object|false|none|none|
  |»»» status|string|false|none|Tiểu khoản được phép giao dịch phái sinh hoặc không|
  |»» permissions|[object]|false|none|Phạm vi quyền quản lý|
  |»»» product|string|false|none|Sản phẩm áp dụng:<br>- UNDERLYING_STOCK: Cơ sở<br>- DERIVATIVES_STOCK: Phái sinh|
  |»»» role|string|false|none|Vai trò trên sản phẩm:<br>- ADVISOR: Theo dõi<br>- BROKER: Giao dịch|
  |» total|integer(int32)|false|none|Tổng số tiểu khoản quản lý|
