info:
  name: MarketData stream
  type: websocket
  seq: 2

websocket:
  url: wss://ws-openapi.dnse.com.vn/v1/stream?encoding=json
  message:
    type: json
    data: |-
      {
        "action":"auth",
        "api_key":"{{apiKey}}",
        "signature":"{{wsSignature}}",
        "timestamp":{{wsTimestamp}},
        "nonce":"{{wsNonce}}"
      }

settings:
  timeout: 0
  keepAliveInterval: 0

docs: |-
  Step 1: Send an auth message:
  ```
  {
    "action":"auth",
    "api_key":"{{apiKey}}",
    "signature":"{{wsSignature}}",
    "timestamp":{{wsTimestamp}},
    "nonce":"{{wsNonce}}"
  }
  ```

  Step 2: Send a subscription message:

  {
    "action": "subscribe",
    "channels": [
      {
        "name": "ohlc_closed.1.json",
        "symbols": ["ACB"]
      }
    ]
  }
  ```

  Step 3: Send another subscription message:

  ```
  {
    "action": "subscribe",
    "channels": [
      {
        "name": "ohlc.1.json",
        "symbols": ["VN30F1M"]
      }
    ]
  }
  ```

  ```
  {
    "action": "subscribe",
    "channels": [
      {
        "name": "order.STOCK.json",
        "symbols": []
      }
    ]
  }

  Step 4: Send a ping message every 30s to keep the connection alive:
  ```
  {
    "action": "ping"
  }
  ```

  Step ...: Unsubscribe from channels:
  {
    "action": "unsubscribe",
    "channels": [
      {
        "name": "order.DERIVATIVE.json",
        "symbols": []
      }
    ]
  }
  ```
