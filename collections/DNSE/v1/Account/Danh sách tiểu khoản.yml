info:
  name: Danh sách tiểu khoản
  type: http
  seq: 2
  tags:
    - Account

http:
  method: GET
  url: "{{baseUrl}}/order-service/accounts"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Danh sách tiểu khoản
    request:
      url: "{{baseUrl}}/dnse-user-service/api/sub-accounts"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "type": "stock",
              "status": "ACTIVE",
              "marginEnabled": false
            }
          ]
  - name: 401 Response
    description: Chưa xác thực hoặc token không hợp lệ
    request:
      url: "{{baseUrl}}/dnse-user-service/api/sub-accounts"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": 401,
            "message": "Unauthorized"
          }

docs: |
  Lấy danh sách tất cả tiểu khoản (sub-account) thuộc tài khoản chính.
  Mỗi tài khoản DNSE có thể có nhiều tiểu khoản cho cơ sở và phái sinh.
