info:
  name: Danh sách deal đang nắm giữ
  type: http
  seq: 5
  tags:
    - Trading

http:
  method: GET
  url: "{{baseUrl}}/dnse-order-service/v2/deals"
  params:
    - name: subAccount
      value: ""
      type: query
      description: Mã tiểu khoản
    - name: assetType
      value: stock
      type: query
      disabled: true
    - name: assetType
      value: derivative
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Danh sách deal nắm giữ
    request:
      url: "{{baseUrl}}/dnse-order-service/v2/deals"
      method: GET
      params:
        - name: subAccount
          value: ""
          type: query
          description: Mã tiểu khoản
        - name: assetType
          value: stock
          type: query
          disabled: true
        - name: assetType
          value: derivative
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "dealId": "",
              "symbol": "",
              "side": "long",
              "quantity": 0,
              "avgPrice": 0,
              "currentPrice": 0,
              "unrealizedPnl": 0,
              "unrealizedPnlPercent": 0,
              "marginRatio": 0,
              "assetType": "stock",
              "openedAt": ""
            }
          ]
  - name: 401 Response
    description: Chưa xác thực hoặc token không hợp lệ
    request:
      url: "{{baseUrl}}/dnse-order-service/v2/deals"
      method: GET
      params:
        - name: subAccount
          value: ""
          type: query
          description: Mã tiểu khoản
        - name: assetType
          value: stock
          type: query
          disabled: true
        - name: assetType
          value: derivative
          type: query
          disabled: true
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": 401,
            "message": "Unauthorized"
          }

docs: |-
  Lấy danh sách các vị thế (deal) đang mở của tiểu khoản.
  Áp dụng cho cả cổ phiếu cơ sở và phái sinh.
