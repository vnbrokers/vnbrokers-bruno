            "price": 1300,
            "order_type": "LO",
            "loan_package_id": 2403,
            "asset_type": "derivative"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": 0,
            "message": "",
            "details": ""
          }
  - name: 401 Response (Mua cổ phiếu cơ sở)
    description: Chưa xác thực hoặc token không hợp lệ
    request:
      url: "{{baseUrl}}/dnse-order-service/v2/orders"
      method: POST
      body:
        type: json
        data: |-
          {
            "account": "064C123456",
            "symbol": "VIC",
            "side": "buy",
            "quantity": 100,
            "price": 41600,
            "order_type": "LO",
            "loan_package_id": null,
            "asset_type": "stock"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": 401,
            "message": "Unauthorized"
          }
  - name: 401 Response (Bán phái sinh (Short))
    description: Chưa xác thực hoặc token không hợp lệ
