        data: |-
          {
            "code": 0,
            "message": "",
            "details": ""
          }
  - name: 422 Response (Bán phái sinh (Short))
    description: Không thể xử lý lệnh (số dư không đủ, quá giới hạn, v.v.)
    request:
      url: "{{baseUrl}}/dnse-order-service/v2/orders"
