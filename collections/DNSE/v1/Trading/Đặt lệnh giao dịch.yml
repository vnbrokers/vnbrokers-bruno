docs: |
  Đặt lệnh mua hoặc bán chứng khoán cơ sở / phái sinh.

  **Yêu cầu:** Trading Token (xác thực cấp 2).

  Các loại lệnh hỗ trợ: `LO`, `ATO`, `ATC`, `MTL`, `MOK`, `MAK`.
