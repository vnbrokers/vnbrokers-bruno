info:
  name: Hủy lệnh
  type: http
  seq: 4
  tags:
    - Trading

http:
  method: DELETE
  url: "{{baseUrl}}/dnse-order-service/v2/orders/:orderId"
  params:
    - name: orderId
      value: ""
      type: path
      description: Mã lệnh cần hủy
    - name: subAccount
      value: ""
      type: query
    - name: assetType
      value: stock
      type: query
      disabled: true
    - name: assetType
      value: derivative
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Hủy lệnh thành công
    request:
      url: "{{baseUrl}}/dnse-order-service/v2/orders/:orderId"
      method: DELETE
      params:
        - name: orderId
          value: ""
          type: path
          description: Mã lệnh cần hủy
        - name: subAccount
          value: ""
          type: query
        - name: assetType
          value: stock
          type: query
          disabled: true
        - name: assetType
          value: derivative
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Thao tác thành công"
          }
  - name: 400 Response
    description: Dữ liệu đầu vào không hợp lệ
    request:
      url: "{{baseUrl}}/dnse-order-service/v2/orders/:orderId"
      method: DELETE
      params:
        - name: orderId
          value: ""
          type: path
          description: Mã lệnh cần hủy
        - name: subAccount
          value: ""
          type: query
        - name: assetType
          value: stock
          type: query
          disabled: true
        - name: assetType
          value: derivative
          type: query
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": 0,
            "message": "",
            "details": ""
          }
  - name: 401 Response
    description: Chưa xác thực hoặc token không hợp lệ
    request:
      url: "{{baseUrl}}/dnse-order-service/v2/orders/:orderId"
      method: DELETE
      params:
        - name: orderId
          value: ""
          type: path
          description: Mã lệnh cần hủy
        - name: subAccount
          value: ""
          type: query
        - name: assetType
          value: stock
          type: query
          disabled: true
        - name: assetType
          value: derivative
          type: query
          disabled: true
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": 401,
            "message": "Unauthorized"
          }
  - name: 404 Response
    description: Không tìm thấy tài nguyên
    request:
      url: "{{baseUrl}}/dnse-order-service/v2/orders/:orderId"
      method: DELETE
      params:
        - name: orderId
          value: ""
          type: path
          description: Mã lệnh cần hủy
        - name: subAccount
          value: ""
          type: query
        - name: assetType
          value: stock
          type: query
          disabled: true
        - name: assetType
          value: derivative
          type: query
          disabled: true
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": 0,
            "message": "",
            "details": ""
          }

docs: |
  Hủy một lệnh đang ở trạng thái chờ khớp (pending).
  **Yêu cầu:** Trading Token.
