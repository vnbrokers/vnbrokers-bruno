info:
  name: Đăng nhập – lấy JWT Token
  type: http
  seq: 1
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/auth-service/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "{{password}}"
      }

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("token", res.getBody().token)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Đăng nhập bằng username/password để lấy JWT token.
  JWT token dùng cho các API đọc thông tin (xác thực cấp 1).
