info:
  name: 14. Đóng deal
  type: http
  seq: 15

http:
  method: POST
  url: "{{baseUrl}}/derivative/deals/{{dealId}}/_close_deal"
  headers:
    - name: x-api-key
      value: "{{apiKey}}"
      disabled: true
    - name: date
      value: "{{X-Aux-Date}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "orderType": "{{orderType}}",
        "triggeredBy": "close-deal"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

