info:
  name: 4. Lấy danh sách gói vay
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/investors/{{investorId}}/derivative_margin_portfolios"
  headers:
    - name: x-api-key
      value: "{{apiKey}}"
      disabled: true
    - name: Authorization
      value: Bearer {{token}}
    - name: date
      value: "{{X-Aux-Date}}"
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        res.status === 200 && bru.setEnvVar("loanPackageId", res.body.data[0].id)
        res.status === 200 && bru.setEnvVar("bankMarginPortfolioId", String(res.body.data[0].id))

    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "total": {
                "type": "number"
              },
              "data": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "id": {
                      "type": "number"
                    },
                    "bankId": {
                      "type": "number"
                    },
                    "bankAccountId": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    },
                    "interestRate": {
                      "type": "number"
                    },
                    "tradingFeeRate": {
                      "type": "number"
                    },
                    "overdueInterestRate": {
                      "type": "number"
                    },
                    "loanTerm": {
                      "type": "number"
                    },
                    "maxLoanPool": {
                      "type": "number"
                    },
                    "coInvestTaxRate": {
                      "type": "number"
                    },
                    "createdDate": {
                      "type": "string"
                    },
                    "modifiedDate": {
                      "type": "string"
                    },
                    "closedPositionFee": {
                      "type": "number"
                    },
                    "tradingTaxRate": {
                      "type": "number"
                    },
                    "portfolio": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "symbol": {
                            "type": "string"
                          },
                          "initialRate": {
                            "type": "number"
                          },
                          "maintenanceRate": {
                            "type": "number"
                          },
                          "liquidateRate": {
                            "type": "number"
                          },
                          "overnightRate": {
                            "type": "number"
                          },
                          "dailyStockBorrowFee": {
                            "type": "number"
                          },
                          "withdrawalRate": {
                            "type": "number"
                          },
                          "additionalRate": {
                            "type": "number"
                          },
                          "companySecureRate": {
                            "type": "number"
                          },
                          "vsdSecureRate": {
                            "type": "number"
                          },
                          "bankSecureRate": {
                            "type": "number"
                          }
                        }
                      }
                    },
                    "assetManagementOvernightFee": {
                      "type": "number"
                    },
                    "autoAdvanceRealizedProfit": {
                      "type": "boolean"
                    },
                    "displaySymbols": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

