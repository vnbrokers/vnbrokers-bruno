info:
  name: 12. Lấy cấu hình cắt lỗ
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/risk_configs?investorAccountId={{investorAccountId}}"
  headers:
  params:
    - name: investorAccountId
      value: "{{investorAccountId}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "total": {
                "type": "number"
              },
              "data": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "investorId": {
                      "type": "number"
                    },
                    "investorAccountId": {
                      "type": "number"
                    },
                    "cutLossRate": {
                      "type": "number"
                    },
                    "trailingEnabled": {
                      "type": "boolean"
                    },
                    "createdDate": {
                      "type": "string"
                    },
                    "modifiedDate": {
                      "type": "string"
                    },
                    "maxCutLossRate": {
                      "type": "number"
                    },
                    "autoIncreaseDealRate": {
                      "type": "boolean"
                    },
                    "enableAutoDealDepositNoti": {
                      "type": "boolean"
                    }
                  }
                }
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công - trả về cấu hình cắt lỗ
    request:
      url: "{{baseUrl}}/risk_configs"
      method: GET
      params:
        - name: investorAccountId
          value: "1000000036"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "total": 1,
            "data": [
              {
                "investorId": 1000000036,
                "investorAccountId": 1000000036,
                "cutLossRate": 0.2,
                "trailingEnabled": false,
                "createdDate": "2022-11-10T03:12:40.462Z",
                "modifiedDate": "2025-11-26T03:12:50.692Z",
                "maxCutLossRate": 0.4,
                "autoIncreaseDealRate": true,
                "enableAutoDealDepositNoti": true
              }
            ]
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/risk_configs"
      method: GET
      params:
        - name: investorAccountId
          value: ""
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/risk_configs"
      method: GET
      params:
        - name: investorAccountId
          value: ""
          type: query
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: Lấy cấu hình mặc định cắt lỗ (cut loss config).
