info:
  name: 12. Lấy cấu hình cắt lỗ
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/risk_configs?investorAccountId={{investorAccountId}}"
  headers:
    - name: x-api-key
      value: "{{apiKey}}"
      disabled: true
    - name: date
      value: "{{X-Aux-Date}}"
      disabled: true
  params:
    - name: investorAccountId
      value: "{{investorAccountId}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công - trả về cấu hình cắt lỗ
    request:
      url: "{{baseUrl}}/risk_configs"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
      params:
        - name: investorAccountId
          value: "1000000036"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "total": 1,
            "data": [
              {
                "investorId": 1000000036,
                "investorAccountId": 1000000036,
                "cutLossRate": 0.2,
                "trailingEnabled": false,
                "createdDate": "2022-11-10T03:12:40.462Z",
                "modifiedDate": "2025-11-26T03:12:50.692Z",
                "maxCutLossRate": 0.4,
                "autoIncreaseDealRate": true,
                "enableAutoDealDepositNoti": true
              }
            ]
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/risk_configs"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
      params:
        - name: investorAccountId
          value: ""
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/risk_configs"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
      params:
        - name: investorAccountId
          value: ""
          type: query
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

