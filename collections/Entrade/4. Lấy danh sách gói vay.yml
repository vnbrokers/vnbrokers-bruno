info:
  name: 4. Lấy danh sách gói vay
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/investors/{{investorId}}/derivative_margin_portfolios"
  headers:
    - name: x-api-key
      value: "{{apiKey}}"
      disabled: true
    - name: Authorization
      value: Bearer {{token}}
    - name: date
      value: "{{X-Aux-Date}}"
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getBody().data && res.getBody().data.length > 0) {
          bru.setEnvVar("loanPackageId", res.getBody().data[0].id)

          bru.setEnvVar("bankMarginPortfolioId", String(res.body.data[0].id))
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
