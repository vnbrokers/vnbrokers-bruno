    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/investors/{{investorId}}/derivative_margin_portfolios"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{token}}
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
