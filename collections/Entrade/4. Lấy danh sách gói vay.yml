    description: Thành công - trả về danh sách gói vay
    request:
      url: "{{baseUrl}}/investors/{{investorId}}/derivative_margin_portfolios"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{token}}
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "total": 1,
            "data": [
