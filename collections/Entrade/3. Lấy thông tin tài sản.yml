info:
  name: 3. Lấy thông tin tài sản
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/account_balances/{{investorId}}"
  headers:
    - name: x-api-key
      value: "{{apiKey}}"
      disabled: true
    - name: Authorization
      value: Bearer {{token}}
      disabled: true
    - name: date
      value: "{{X-Aux-Date}}"
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("assetId", res.getBody().id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công - trả về thông tin tài sản của tiểu khoản master
    request:
      url: "{{baseUrl}}/account_balances/{{investorId}}"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{token}}
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "",
            "bankId": 0,
            "bankAccountId": 0,
            "investorId": 1000000001,
            "investorAccountId": 1000000001,
            "totalAsset": 0.0,
            "investorCount": 0,
            "dealCount": 1.0,
            "totalDealValue": 0.0,
            "totalDebt": 0.0,
