  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/account_balances/{{investorId}}"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{token}}
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/account_balances/{{investorId}}"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{token}}
    response:
