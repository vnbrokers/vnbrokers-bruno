info:
  name: 8. Lấy sổ lệnh
  type: http
  seq: 4
  tags:
    - Authentication

http:
  method: GET
  url: "{{baseUrl}}/papertrade-entrade-api/derivative/orders?investorAccountId={{investorId}}"
  params:
    - name: investorAccountId
      value: "{{investorId}}"
      type: query
    - name: _start
      value: "1"
      type: query
      disabled: true
    - name: _end
      value: ""
      type: query
      disabled: true
    - name: _sort
      value: ""
      type: query
      disabled: true
    - name: _order
      value: ""
      type: query
      disabled: true
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Đăng nhập bằng username/password để lấy JWT token.
  JWT token dùng cho các API đọc thông tin (xác thực cấp 1).
