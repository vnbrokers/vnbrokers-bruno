info:
  name: 8. Lấy sổ lệnh
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/derivative/orders?investorAccountId={{investorAccountId}}&_start=0&_end=20"
  headers:
  params:
    - name: investorAccountId
      value: "{{investorAccountId}}"
      type: query
    - name: _start
      value: "0"
      type: query
    - name: _end
      value: "20"
      type: query
    - name: _sort
      value: createdDate
      type: query
      disabled: true
    - name: _order
      value: DESC
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công - trả về sổ lệnh
    request:
      url: "{{baseUrl}}/derivative/orders"
      method: GET
      params:
        - name: investorAccountId
          value: "1000000036"
          type: query
        - name: _start
          value: "0"
          type: query
        - name: _end
          value: "20"
          type: query
        - name: _sort
          value: ""
          type: query
        - name: _order
          value: ""
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
