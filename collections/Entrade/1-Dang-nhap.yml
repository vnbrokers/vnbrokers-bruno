info:
  name: 1. Đăng nhập
  type: http
  seq: 1

http:
  method: POST
  url: "{{authBaseUrl}}/v2/auth"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "{{password}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        res.status ===200 && bru.setEnvVar("token", res.body.token)
        res.status ===200 && bru.setEnvVar("investorId", JSON.parse(Buffer.from(res.body.token.split(".")[1], "base64").toString("utf8")).investorIdStr)

    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "token": {
                "type": "string"
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Đăng nhập thành công
    request:
      url: "{{baseUrl}}/v2/auth"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "token": "eyJh..."
          }
  - name: 400 Response
    description: Sai thông tin đăng nhập
    request:
      url: "{{baseUrl}}/v2/auth"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/v2/auth"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

