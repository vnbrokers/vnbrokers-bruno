info:
  name: 5. Lấy sức mua
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/derivative/investors/:investorId/ppse?bankMarginPortfolioId={{bankMarginPortfolioId}}&price=0&symbol=41I1G5000&side=NB"
  headers:
    - name: x-api-key
      value: "{{apiKey}}"
      disabled: true
    - name: date
      value: "{{X-Aux-Date}}"
      disabled: true
  params:
    - name: bankMarginPortfolioId
      value: "{{bankMarginPortfolioId}}"
      type: query
    - name: price
      value: "0"
      type: query
    - name: symbol
      value: 41I1G5000
      type: query
    - name: side
      value: NB
      type: query
    - name: investorId
      value: "{{investorId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("qmax", res.getBody().qmax)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công - trả về sức mua qmax
    request:
      url: "{{baseUrl}}/derivative/investors/{{investorId}}/ppse"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
      params:
        - name: bankMarginPortfolio
          value: "123"
          type: query
        - name: price
          value: "1922.8"
          type: query
        - name: symbol
          value: VN30F2512
          type: query
        - name: side
          value: NB
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 1000000001,
            "investorId": 1000000001,
            "investorAccountId": 1000000001,
            "bankMarginPortfolioId": 123,
            "symbol": "VN30F2512",
            "price": 1922.8,
            "ppse": 0.0,
            "qmax": 0,
            "side": "NB",
            "dealId": 0
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/derivative/investors/{{investorId}}/ppse"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
      params:
        - name: bankMarginPortfolio
          value: ""
          type: query
        - name: price
          value: ""
          type: query
        - name: symbol
          value: ""
          type: query
        - name: side
          value: ""
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/derivative/investors/{{investorId}}/ppse"
      method: GET
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
      params:
        - name: bankMarginPortfolio
          value: ""
          type: query
        - name: price
          value: ""
          type: query
        - name: symbol
          value: ""
          type: query
        - name: side
          value: ""
          type: query
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

