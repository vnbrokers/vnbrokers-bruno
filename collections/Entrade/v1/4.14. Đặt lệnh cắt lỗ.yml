info:
  name: 4.14 Đặt lệnh cắt lỗ
  type: http
  seq: 414

http:
  method: PATCH
  url: "{{baseUrl}}/risk_configs/:investorAccountId"
  params:
    - name: investorAccountId
      value: "{{investorAccountId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "cutLossRate": {{cutLossRate}},
        "investorId": "{{investorId}}",
        "investorAccountId": {{investorAccountId}},
        "trailingEnabled": {{trailingEnabled}}
      }
  auth: inherit

runtime:
  variables:
    - name: cutLossRate
      value: "0.05"
    - name: trailingEnabled
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – đặt lệnh cắt lỗ
    request:
      url: "{{baseUrl}}/risk_configs/1000000036"
      method: PATCH
      body:
        type: json
        data: ""
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "investorId": "1000000036",
            "investorAccountId": 1000000036,
            "cutLossRate": 0.14,
            "trailingEnabled": false,
            "createdDate": "2022-11-10T03:12:40.462Z",
            "modifiedDate": "2025-11-28T04:13:15.353Z",
            "maxCutLossRate": 0.4
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/risk_configs/1000000036"
      method: PATCH
      body:
        type: json
        data: ""
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/risk_configs/1000000036"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "cutLossRate": 0.14,
            "investorId": "1000000036",
            "investorAccountId": 1000000036,
            "trailingEnabled": false
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: Đặt lệnh cắt lỗ theo investorAccountId.
