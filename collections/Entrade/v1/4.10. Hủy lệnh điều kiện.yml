info:
  name: 4.10 Hủy lệnh điều kiện (Smart Order)
  type: http
  seq: 410

http:
  method: DELETE
  url: "{{smartOrderBaseUrl}}/orders/:orderId"
  params:
    - name: orderId
      value: "{{orderId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – hủy lệnh điều kiện
    request:
      url: "{{smartOrderBaseUrl}}/orders/SO123456789"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "SO123456789",
            "status": "Canceled",
            "investorId": "1000000036",
            "investorAccountId": 1000000036,
            "bankMarginPortfolioId": 34,
            "symbol": "VN30F2504",
            "condition": ">= 1369",
            "targetPrice": 1370,
            "targetSide": "NB",
            "targetQuantity": 1,
            "type": "STOP",
            "expiredTime": "2025-12-31T23:59:59Z",
            "createdDate": "2025-11-28T04:13:15.353Z",
            "modifiedDate": "2025-11-28T04:20:00.000Z"
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{smartOrderBaseUrl}}/orders/"
      method: DELETE
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{smartOrderBaseUrl}}/orders/SO123456789"
      method: DELETE
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: Hủy lệnh điều kiện (Smart Order) theo order_id.
