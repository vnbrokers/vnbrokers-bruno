info:
  name: 4.12. Lấy thông tin lệnh điều kiện (Smart Order)
  type: http
  seq: 412

http:
  method: GET
  url: "{{smartOrderBaseUrl}}/orders?investorId={{investorId}}"
  headers:
    - name: Authorization
      value: Bearer {{jwtToken}}
  params:
    - name: _start
      value: "{{start}}"
      type: query
      disabled: true
    - name: _end
      value: "{{end}}"
      type: query
      disabled: true
    - name: investorId
      value: "{{investorId}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – trả về danh sách lệnh điều kiện
    request:
      url: "{{smartOrderBaseUrl}}/orders"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{jwtToken}}
      params:
        - name: _start
          value: "0"
          type: query
        - name: _end
          value: "20"
          type: query
        - name: investorId
          value: "1000000036"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "total": 1,
            "data": [
              {
                "id": "SO123456789",
                "status": "PendingTrigger",
                "investorId": "1000000036",
                "investorAccountId": 1000000036,
                "bankMarginPortfolioId": 34,
                "symbol": "VN30F2504",
                "condition": ">= 1369",
                "targetPrice": 1370,
                "targetSide": "NB",
                "targetQuantity": 1,
                "type": "STOP",
                "expiredTime": "2025-12-31T23:59:59Z",
                "createdDate": "2025-11-28T04:13:15.353Z",
                "modifiedDate": "2025-11-28T04:13:15.353Z",
                "metadata": {}
              }
            ]
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{smartOrderBaseUrl}}/orders"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{jwtToken}}
      params:
        - name: _start
          value: ""
          type: query
        - name: _end
          value: ""
          type: query
        - name: investorId
          value: ""
          type: query
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{smartOrderBaseUrl}}/orders"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{jwtToken}}
      params:
        - name: _start
          value: "0"
          type: query
        - name: _end
          value: "20"
          type: query
        - name: investorId
          value: "1000000036"
          type: query
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

docs: Lấy danh sách lệnh điều kiện (Smart Order).
