info:
  name: 4.9. Đặt lệnh điều kiện (Smart Order)
  type: http
  seq: 49

http:
  method: POST
  url: "{{smartOrderBaseUrl}}/orders"
  body:
    type: json
    data: |-
      {
        "investorId": {{investorId}},
        "investorAccountId": {{investorAccountId}},
        "bankMarginPortfolioId": {{bankMarginPortfolioId}},
        "symbol": "{{symbol}}",
        "condition": "{{condition}}",
        "targetPrice": {{targetPrice}},
        "targetSide": "{{targetSide}}",
        "targetQuantity": {{targetQuantity}},
        "type": "STOP",
        "expiredTime": "{{expiredTime}}"
      }
  auth: inherit

runtime:
  variables:
    - name: symbol
      value: 41I1G5000
    - name: condition
      value: price >= 1876.7
    - name: expiredTime
      value: 2026-05-05T07:30:00.000Z
    - name: targetPrice
      value: "1876.7"
    - name: targetQuantity
      value: "1"
    - name: targetSide
      value: NB
    - name: type
      value: STOP

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công – đặt lệnh điều kiện
    request:
      url: "{{smartOrderBaseUrl}}/orders"
      method: POST
      body:
        type: json
        data: |-
          {
            "investorId": "1000000036",
            "investorAccountId": 1000000036,
            "bankMarginPortfolioId": 34,
            "symbol": "VN30F2504",
            "condition": ">= 1369",
            "targetPrice": 1370,
            "targetSide": "NB",
            "targetQuantity": 1,
            "type": "STOP",
            "expiredTime": "2025-12-31T23:59:59Z"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "SO123456789",
            "investorId": "1000000036",
            "investorAccountId": 1000000036,
            "bankMarginPortfolioId": 34,
            "symbol": "VN30F2504",
            "condition": ">= 1369",
            "targetPrice": 1370,
            "targetSide": "NB",
            "targetQuantity": 1,
            "type": "STOP",
            "expiredTime": "2025-12-31T23:59:59Z",
            "status": "PendingTrigger",
            "createdDate": "2025-11-28T04:13:15.353Z",
            "modifiedDate": "2025-11-28T04:13:15.353Z"
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{smartOrderBaseUrl}}/orders"
      method: POST
      body:
        type: json
        data: |-
          {
            "investorId": "",
            "investorAccountId": "",
            "bankMarginPortfolioId": "",
            "symbol": "",
            "condition": "",
            "targetPrice": "",
            "targetSide": "",
            "targetQuantity": "",
            "type": "",
            "expiredTime": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{smartOrderBaseUrl}}/orders"
      method: POST
      body:
        type: json
        data: |-
          {
            "investorId": "1000000036",
            "investorAccountId": 1000000036,
            "bankMarginPortfolioId": 34,
            "symbol": "VN30F2504",
            "condition": ">= 1369",
            "targetPrice": 1370,
            "targetSide": "NB",
            "targetQuantity": 1,
            "type": "STOP",
            "expiredTime": "2025-12-31T23:59:59Z"
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

