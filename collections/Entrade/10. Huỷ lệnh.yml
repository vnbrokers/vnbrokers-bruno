info:
  name: 10. Hủy lệnh
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{baseUrl}}/derivative/orders/:orderId"
  headers:
    - name: x-api-key
      value: "{{apiKey}}"
      disabled: true
    - name: date
      value: "{{X-Aux-Date}}"
      disabled: true
  params:
    - name: orderId
      value: "6858488"
      type: path
  auth: inherit

runtime:
  variables:
    - name: ""
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
