info:
  name: 3. Lấy thông tin tài sản
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/account_balances/{{investorId}}"
  headers:
    - name: x-api-key
      value: "{{apiKey}}"
      disabled: true
    - name: Authorization
      value: Bearer {{token}}
      disabled: true
    - name: date
      value: "{{X-Aux-Date}}"
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("assetId", res.getBody().id)


    - type: tests
      code: |-
        test("response matches the schema", function () {
          const schema = {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "type": "object",
            "properties": {
              "name": {
                "type": "string"
              },
              "bankId": {
                "type": "number"
              },
              "bankAccountId": {
                "type": "number"
              },
              "investorId": {
                "type": "number"
              },
              "investorAccountId": {
                "type": "number"
              },
              "totalAsset": {
                "type": "number"
              },
              "investorCount": {
                "type": "number"
              },
              "dealCount": {
                "type": "number"
              },
              "totalDealValue": {
                "type": "number"
              },
              "totalDebt": {
                "type": "number"
              },
              "totalSecure": {
                "type": "number"
              },
              "nav": {
                "type": "number"
              },
              "totalOpenQuantity": {
                "type": "number"
              },
              "totalOpenValue": {
                "type": "number"
              },
              "totalLoanCash": {
                "type": "number"
              },
              "totalLoanStock": {
                "type": "number"
              },
              "collateralLong": {
                "type": "number"
              },
              "collateralShort": {
                "type": "number"
              },
              "availableCash": {
                "type": "number"
              },
              "initCash": {
                "type": "number"
              },
              "taxCredit": {
                "type": "number"
              },
              "withdrawalCash": {
                "type": "number"
              },
              "holdOvernightSecure": {
                "type": "number"
              },
              "estimateHoldOvernightSecure": {
                "type": "number"
              },
              "withdrawFee": {
                "type": "number"
              },
              "withdrawThreshold": {
                "type": "number"
              },
              "withdrawGuaranteeAmount": {
                "type": "number"
              },
              "navExcludeEstimatedProfit": {
                "type": "number"
              },
              "depositionalCash": {
                "type": "number"
              },
              "vsdSecureDepositFee": {
                "type": "number"
              },
              "pendingVsdSecure": {
                "type": "number"
              },
              "receivable": {
                "type": "number"
              },
              "cashOnHand": {
                "type": "number"
              },
              "totalDerivativeDealSecure": {
