              },
              "holdCollateralFee": {
                "type": "number"
              },
              "maxWithdraw": {
                "type": "number"
              },
              "maxWithdrawPoint": {
                "type": "number"
              },
              "createdDate": {
                "type": "string"
              },
              "id": {
                "type": "number"
              }
            }
          }

          res.status === 200 && expect(res.body).to.have.jsonSchema(schema);
        });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

