info:
  name: 13. Sửa cấu hình cắt lỗ
  type: http
  seq: 14

http:
  method: PATCH
  url: "{{baseUrl}}/risk_configs/{{investorAccountId}}"
  headers:
    - name: x-api-key
      value: "{{apiKey}}"
      disabled: true
    - name: date
      value: "{{X-Aux-Date}}"
      disabled: true
  body:
    type: json
    data: |-
      {
        "cutLossRate": {{cutLossRate}},
        "investorAccountId": {{investorAccountId}},
        "trailingEnabled": {{trailingEnabled}},
        "investorId": {{investorId}},
        "autoIncreaseDealRate": {{autoIncreaseDealRate}},
        "enableAutoDealDepositNoti": {{enableAutoDealDepositNoti}}
      }
  auth: inherit

runtime:
  variables:
    - name: trailingEnabled
      value: "true"
    - name: cutLossRate
      value: "0.05"
    - name: autoIncreaseDealRate
      value: "false"
    - name: enableAutoDealDepositNoti
      value: "false"
    - name: maxCutLossRate
      value: "0.07"
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công - sửa cấu hình cắt lỗ
    request:
      url: "{{baseUrl}}/risk_configs/1000000036"
      method: PATCH
      headers:
        - name: X-API-Key
          value: "{{apiKey}}"
        - name: X-Aux-Date
          value: ""
        - name: X-Signature
          value: ""
      body:
        type: json
        data: |-
          {
            "cutLossRate": 0.24,
            "investorAccountId": 1000000036,
            "trailingEnabled": false,
            "investorId": 1000000036,
            "autoIncreaseDealRate": true,
            "enableAutoDealDepositNoti": true
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "investorId": 1000000036,
            "investorAccountId": 1000000036,
            "cutLossRate": 0.24,
            "trailingEnabled": false,
