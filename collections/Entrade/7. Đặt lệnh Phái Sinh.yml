info:
  name: 7. Đặt lệnh Phái Sinh
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/derivative/orders"
  body:
    type: json
    data: |-
      {
        "bankMarginPortfolioId": {{bankMarginPortfolioId}},
        "investorId": {{investorId}},
        "symbol": "{{symbol}}",
        "price": {{price}},
        "orderType": "{{orderType}}",
        "side": "{{side}}",
        "quantity": {{quantity}}
      }
  auth: inherit

runtime:
  variables:
    - name: symbol
      value: 41I1G5000
    - name: price
      value: "1876.7"
    - name: orderType
      value: LO
    - name: side
      value: NB
    - name: quantity
      value: "1"
  scripts:
    - type: after-response
      code: res.status === 200 && bru.setEnvVar("orderId", res.body.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Thành công - đặt lệnh thành công
    request:
      url: "{{baseUrl}}/derivative/orders"
      method: POST
      body:
        type: json
        data: |-
          {
            "bankMarginPortfolioId": 34,
            "investorId": 1000000036,
            "symbol": "VN30F2512",
            "price": 1920.9,
            "orderType": "LO",
            "side": "NB",
            "quantity": 1
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 1110910,
            "side": "NB",
            "investorId": 1000000036,
            "investorAccountId": 1000000036,
            "bankId": 10000,
            "bankAccountId": 1000040,
            "symbol": "VN30F2512",
            "price": 1920.9,
            "quantity": 1,
            "orderType": "LO",
            "orderStatus": "PendingNew",
            "fillQuantity": 0,
            "lastQuantity": 0,
            "lastPrice": 0.0,
            "averagePrice": 0.0,
            "createdDate": "2025-11-27T07:48:43.911Z",
            "modifiedDate": "2025-11-27T07:48:43.911Z",
            "bankMarginPortfolioId": 34,
            "dealId": 0,
            "tradingFee": 0.0,
            "tradingTax": 0.0,
            "orderSecure": 9604500.0,
            "priceSecure": 1920.9,
            "marginRate": 0.05,
            "quantitySecure": 1,
            "leavesQuantity": 0,
            "maker": "0013000000",
            "version": 1,
            "type": "DERIVATIVE",
            "fillValue": 0.0
          }
  - name: 400 Response
    description: Yêu cầu không hợp lệ
    request:
      url: "{{baseUrl}}/derivative/orders"
      method: POST
      body:
        type: json
        data: |-
          {
            "bankMarginPortfolioId": "",
            "investorId": "",
            "symbol": "",
            "price": "",
            "orderType": "",
            "side": "",
            "quantity": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }
  - name: 500 Response
    description: Lỗi máy chủ
    request:
      url: "{{baseUrl}}/derivative/orders"
      method: POST
      body:
        type: json
        data: |-
          {
            "bankMarginPortfolioId": "",
            "investorId": "",
            "symbol": "",
            "price": "",
            "orderType": "",
            "side": "",
            "quantity": ""
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0
          }

