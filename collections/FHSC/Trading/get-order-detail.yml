info:
  name: Chi tiết lệnh
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/trading/v1/accounts/{{subAccountOrder}}/order-book/{{orderId}}"
  auth: inherit

runtime:
  variables:
    - name: orderId
      value: ""
  scripts:
    - type: tests
      code: |-
        test("status 200", () => expect(res.status).to.equal(200));

settings:
  encodeUrl: true

docs: |-
  ### GET /trading/v1/accounts/{subAccountId}/order-book/{orderId}

  Chi tiết trạng thái của một lệnh cụ thể.

  **Path params:**
  | Param | Type | Description |
  |-------|------|-------------|
  | subAccountId | string | ID tiểu khoản order |
  | orderId | string | ID của lệnh |

  **Response key:** `data`
  - `allowamend`: cho phép sửa lệnh?
  - `allowcancel`: cho phép hủy lệnh?
