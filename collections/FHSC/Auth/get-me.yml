info:
  name: Lấy thông tin người dùng
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/users/v1/users/me"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: res.status === 200 && bru.setEnvVar("userId", String(res.body.data.user_id))
    - type: tests
      code: |-
        test("status 200", () => expect(res.status).to.equal(200));
        test("has user_id", () => expect(res.body.data).to.have.property("user_id"));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### GET /users/v1/users/me

  Lấy thông tin profile của người dùng hiện tại.

  **Output:**
  | Field | Type | Description |
  |-------|------|-------------|
  | data.user_id | string | ID người dùng |
