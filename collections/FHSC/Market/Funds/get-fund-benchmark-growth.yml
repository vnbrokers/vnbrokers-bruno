info:
  name: Mô phỏng tăng trưởng
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/fund-trading/public/fund-certificates/benchmark/growth?fund-names=DCDS&amount=10000000&period=1Y"
  params:
    - name: fund-names
      value: DCDS
      type: query
    - name: amount
      value: "10000000"
      type: query
    - name: period
      value: 1Y
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: test("status 200", () => expect(res.status).to.equal(200));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### GET /fund-trading/public/fund-certificates/benchmark/growth

  Mô phỏng lợi nhuận dự kiến cho khoản đầu tư VND.

  **Params:**
  | Param | Type | Required | Description |
  |-------|------|----------|-------------|
  | fund-names | string | Yes | Tên quỹ, CSV |
  | amount | number | Yes | Số tiền (VND) |
  | period | string | Yes | Kỳ đầu tư |

  **Response key:** `data`
