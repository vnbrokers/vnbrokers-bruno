docs: |-
  ### GET /fund-trading/public/fund-certificates/benchmark/nav

  So sánh NAV time series cho nhiều quỹ.

  **Params:**
  | Param | Type | Required | Description |
  |-------|------|----------|-------------|
  | fund-names | string | Yes | Tên quỹ, CSV |
  | period | string | No | Kỳ: `1Y`, `3Y`, `ALL_TIME` |
  | from-month | string | No | Tháng bắt đầu (yyyy-MM) |
  | to-month | string | No | Tháng kết thúc (yyyy-MM) |

  **Response key:** `data`
