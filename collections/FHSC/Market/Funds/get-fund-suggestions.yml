info:
  name: Gợi ý quỹ tương tự
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/fund-trading/public/fund-certificates/{{fundName}}/suggestions"
  auth: inherit

runtime:
  variables:
    - name: fundName
      value: DCDS
  scripts:
    - type: tests
      code: test("status 200", () => expect(res.status).to.equal(200));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### GET /fund-trading/public/fund-certificates/{fund}/suggestions

  Gợi ý các quỹ tương tự theo tiêu chí.

  **Path params:**
  | Param | Type | Description |
  |-------|------|-------------|
  | fund | string | Tên/mã quỹ |

  **Response key:** `data`
