info:
  name: Chi tiết tin tức toàn cầu (GET)
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/market/financial-data/global-news/{{newsId}}"
  auth: inherit

runtime:
  variables:
    - name: newsId
      value: ""
  scripts:
    - type: tests
      code: |-
        test("status 200", () => expect(res.status).to.equal(200));

settings:
  encodeUrl: true

docs: |-
  ### GET /market/financial-data/global-news/{id}

  Nội dung đầy đủ của bài viết tin tức.

  **Path params:**
  | Param | Type | Description |
  |-------|------|-------------|
  | id | string | ID của bài viết |

  **Response key:** `data`
