info:
  name: Tin tức tài chính toàn cầu (GET)
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/market/financial-data/global-news"
  params:
    - name: category
      value: stock-market
      type: query
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", () => expect(res.status).to.equal(200));

settings:
  encodeUrl: true

docs: |-
  ### GET /market/financial-data/global-news

  Tin tức tài chính toàn cầu phân trang, lọc theo danh mục.

  **Params:**
  | Param | Type | Description |
  |-------|------|-------------|
  | category | string | `forex`, `commodities`, `economic-indicators`, `stock-market`, `cryptocurrency` |
  | page | number | Trang |
  | page_size | number | Tối đa 50, mặc định 20 |

  **Response key:** `data`
