info:
  name: Chỉ số doanh nghiệp
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/market/company-financial/overview?symbol={{symbol}}"
  params:
    - name: symbol
      value: "{{symbol}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: test("status 200", () => expect(res.status).to.equal(200));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### GET /market/company-financial/overview

  Chỉ số tài chính doanh nghiệp: PE, PB, ROE, EPS.

  **Params:**
  | Param | Type | Required | Description |
  |-------|------|----------|-------------|
  | symbol | string | Yes | Mã cổ phiếu |

  **Response key:** `data`
