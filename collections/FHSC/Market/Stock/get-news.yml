info:
  name: Tin tức thị trường
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/market/news"
  params:
    - name: stock
      value: "{{symbol}}"
      type: query
    - name: from_date
      value: ""
      type: query
    - name: to_date
      value: ""
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", () => expect(res.status).to.equal(200));

settings:
  encodeUrl: true

docs: |-
  ### GET /market/news

  Tin tức thị trường: sự kiện doanh nghiệp, cổ tức, đại hội cổ đông.

  **Params (tất cả đều optional):**
  | Param | Type | Description |
  |-------|------|-------------|
  | stock | string | Mã cổ phiếu |
  | stocks | string | Nhiều mã, phân cách dấu phẩy |
  | from_date | string | Từ ngày (yyyy-MM-dd) |
  | to_date | string | Đến ngày (yyyy-MM-dd) |

  **Response key:** `result`
