info:
  name: Finhay OpenAPI (FHSC)
  type: folder
  seq: 0

request:
  headers:
    - name: X-FH-APIKEY
      value: "{{apiKey}}"
    - name: X-FH-USER-ID
      value: "{{userId}}"
    - name: X-FH-TIMESTAMP
      value: "{{timestamp}}"
    - name: X-FH-NONCE
      value: "{{nonce}}"
    - name: X-FH-SIGNATURE
      value: "{{signature}}"
    - name: X-FH-OPENAPI-AGENT
      value: "{{agentName}}"
    - name: X-FH-OPENAPI-SKILL-VERSION
      value: 2.0.0
    - name: User-Agent
      value: "finhay-skills-hub/bruno@2.0.0 ({{agentName}}; linux)"
  auth:
    type: none
  scripts:
    - type: before-request
      code: |- # pragma: allowlist secret
        const { sign } = require("./signer");

        const method = req.getMethod();
        const rawUrl = bru.interpolate(req.getUrl());
        const url = new URL(rawUrl);
        const path = url.pathname;
        const query = url.searchParams.toString();

        const apiSecret = bru.getEnvVar("apiSecret");
        const rawBody = req.getBody();
        const body = rawBody && rawBody !== "" ? rawBody : null;

        let bodyHash = "";
        let ts, sigStr;

        (async () => {
          if (body) {
            bodyHash = await sign.bodyHash(body);
            const r = await sign.signature(method, path, query, bodyHash, apiSecret);
            ts = r.ts;
            sigStr = r.sig;
            req.setHeader("X-FH-BODYHASH", bodyHash);
          } else {
            const r = await sign.signature(method, path, query, "", apiSecret);
            ts = r.ts;
            sigStr = r.sig;
          }

          const nonce = sign.nonce();

          bru.setVar("timestamp", String(ts));
          bru.setVar("nonce", nonce);
          bru.setVar("signature", sigStr);

          req.setHeader("X-FH-TIMESTAMP", String(ts));
          req.setHeader("X-FH-NONCE", nonce);
          req.setHeader("X-FH-SIGNATURE", sigStr);
          req.setHeader("X-FH-APIKEY", bru.getEnvVar("apiKey"));
          req.setHeader("X-FH-USER-ID", bru.getEnvVar("userId"));

          const twoFa = bru.getEnvVar("twoFaToken");
          if (twoFa) {
            req.setHeader("X-FH-2FA-TOKEN", twoFa);
          }
        })();
